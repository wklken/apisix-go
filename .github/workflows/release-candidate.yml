name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to validate
        required: false
        default: master
        type: string
  push:
    tags:
      - "v*-rc.*"

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  resolve-source:
    name: Resolve RC Source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Checkout selected source ref once
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Record immutable source commit
        id: source
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          printf 'checked-out commit=%s\n' "$commit"
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

  lint:
    name: RC Lint
    needs: resolve-source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout selected source ref
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.resolve-source.outputs.commit }}

      - name: Record checked-out commit
        run: echo "checked-out commit=$(git rev-parse HEAD)"

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        run: make init

      - name: Run lint
        run: make lint

  build-and-unit:
    name: RC Build And Unit Tests
    needs: resolve-source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout selected source ref
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.resolve-source.outputs.commit }}

      - name: Record checked-out commit
        run: echo "checked-out commit=$(git rev-parse HEAD)"

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: make build

      - name: Check generated plugin registry
        run: make check-plugin-registry

      - name: Run source unit tests
        run: make test

      - name: Run plugin integration harness tests
        run: make test-plugin-harness

  integration-smoke:
    name: RC Integration Smoke (${{ matrix.case.name }})
    needs: resolve-source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        case:
          - name: key-auth
            pattern: key-auth/valid-consumer-schema
          - name: proxy-rewrite
            pattern: proxy-rewrite/rewrite-host
          - name: proxy-control
            pattern: proxy-control/request-buffering-disabled
          - name: uri-blocker
            pattern: uri-blocker/one-rule-blocks-query
    steps:
      - name: Checkout selected source ref
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.resolve-source.outputs.commit }}

      - name: Record checked-out commit
        run: echo "checked-out commit=$(git rev-parse HEAD)"

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run focused standalone smoke case
        run: make test-plugin-smoke PLUGIN_SMOKE_CASE='${{ matrix.case.pattern }}'

  security-release-gates:
    name: RC HTTP Functional And Stability Verification
    needs:
      - resolve-source
      - lint
      - build-and-unit
      - integration-smoke
    uses: ./.github/workflows/security-release-gates.yml
    with:
      run-operational: true
      source-ref: ${{ inputs.ref || github.ref }}
      source-commit: ${{ needs.resolve-source.outputs.commit }}
    permissions:
      contents: read
