name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to validate
        required: false
        default: master
        type: string
  push:
    tags:
      - "v*-rc.*"

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: RC Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        run: make init

      - name: Run lint
        run: make lint

  build-and-unit:
    name: RC Build And Unit Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: make build

      - name: Run source unit tests and coverage gate
        run: make test-cover

  integration-smoke:
    name: RC Integration Smoke (${{ matrix.case.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        case:
          - name: key-auth
            pattern: TestPluginIntegration/key-auth/valid-consumer-schema
          - name: proxy-rewrite
            pattern: TestPluginIntegration/proxy-rewrite/rewrite-host
          - name: proxy-control
            pattern: TestPluginIntegration/proxy-control/request-buffering-disabled
          - name: uri-blocker
            pattern: TestPluginIntegration/uri-blocker/one-rule-blocks-query
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run focused standalone smoke case
        run: go test ./t/plugin -run '${{ matrix.case.pattern }}' -count=1 -v

  package-validation:
    name: RC Package Validation
    needs:
      - lint
      - build-and-unit
      - integration-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate GoReleaser packaging in snapshot mode
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish