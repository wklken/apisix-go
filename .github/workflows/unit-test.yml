name: CI

on:
  pull_request:
    paths:
      - '**'
      - '!**/*.md'
      - 'docs/architecture/**'
  push:
    branches:
      - master
    paths:
      - '**'
      - '!**/*.md'
      - 'docs/architecture/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12.2

  build-and-unit:
    name: Build And Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify CI and candidate workflow contracts
        run: bash scripts/release_gate_test.sh

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: make build

      - name: Run source unit tests
        run: make test

      - name: Run plugin harness unit tests
        run: make test-plugin-harness

      - name: Run full plugin integration tests
        run: make test-integration
