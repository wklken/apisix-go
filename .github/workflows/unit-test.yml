name: Unit Test

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run source unit tests and coverage gate
        run: make test-cover
