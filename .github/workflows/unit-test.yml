name: CI

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
  push:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        run: make init

      - name: Run lint
        run: make lint

  build-and-unit:
    name: Build And Unit Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify CI and release workflow contracts
        run: bash scripts/release_gate_test.sh

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: make build

      - name: Run source unit tests and coverage gate
        run: make test-cover

      - name: Run plugin harness unit tests
        run: make test-plugin-harness

  integration-smoke:
    name: Integration Smoke (${{ matrix.case.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        case:
          - name: key-auth
            selector: key-auth/valid-consumer-schema
          - name: proxy-rewrite
            selector: proxy-rewrite/rewrite-host
          - name: proxy-control
            selector: proxy-control/request-buffering-disabled
          - name: uri-blocker
            selector: uri-blocker/one-rule-blocks-query
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run focused standalone smoke case
        run: make test-plugin-smoke PLUGIN_SMOKE_CASE='${{ matrix.case.selector }}'
