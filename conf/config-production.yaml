# Production image override. Supply APISIXGO_DEPLOYMENT_ETCD_HOST explicitly.

compatibility_target: apisix-3.17
security_profile: strict
qualification_profile: http-data-plane-v1

debug: false

apisix:
  enable_admin: false
  proxy_mode: http
  ssl:
    enable: true
    listen:
      - port: 9443
        enable_http2: true
        enable_quic: false
        enable_http3: false
  stream_proxy:
    tcp: []
    udp: []
  trusted_addresses:
    - 127.0.0.1/32
    - "::1/128"

plugins:
  - basic-auth
  - cors
  - jwt-auth
  - key-auth
  - prometheus
  - request-id

stream_plugins: []

nginx_config:
  http:
    enable_access_log: false
    access_log: ""
    access_log_buffer: 0
    access_log_format: ""
    access_log_format_escape: ""
    client_body_timeout: 60s
    client_max_body_size: 10485760
  stream:
    enable_access_log: false
    access_log: ""
    access_log_format: ""
    access_log_format_escape: ""

deployment:
  role: data_plane
  role_data_plane:
    config_provider: etcd
  admin:
    admin_key: []
  etcd:
    host: []
    prefix: /apisix
    tls:
      verify: true
