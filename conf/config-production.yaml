# Production image override. Supply APISIX_DEPLOYMENT_ETCD_HOST as a JSON array.

debug: false

apisix:
  enable_admin: false
  proxy_mode: http
  ssl:
    enable: true
    listen:
      - port: 9443
        enable_http2: true
        enable_quic: false
        enable_http3: false
  stream_proxy:
    tcp: []
    udp: []
  trusted_addresses:
    - 127.0.0.1/32
    - "::1/128"
  status:
    ip: 0.0.0.0

apisix_go:
  runtime_paths:
    data_dir: /usr/local/apisix/data
    runtime_dir: /usr/local/apisix/run
    log_dir: /usr/local/apisix/logs
    temp_dir: /usr/local/apisix/tmp

plugins:
  - acl
  - ai-aliyun-content-moderation
  - ai-aws-content-moderation
  - ai-prompt-decorator
  - ai-prompt-guard
  - ai-prompt-template
  - ai-proxy
  - ai-proxy-multi
  - ai-rag
  - ai-rate-limiting
  - ai-request-rewrite
  - api-breaker
  - attach-consumer-label
  - authz-casbin
  - authz-casdoor
  - authz-keycloak
  - aws-lambda
  - azure-functions
  - basic-auth
  - batch-requests
  - body-transformer
  - brotli
  - cas-auth
  - chaitin-waf
  - clickhouse-logger
  - client-control
  - consumer-restriction
  - cors
  - csrf
  - data-mask
  - datadog
  - degraphql
  - dingtalk-auth
  - dubbo-proxy
  - echo
  - elasticsearch-logger
  - error-log-logger
  - error-page
  - example-plugin
  - exit-transformer
  - fault-injection
  - feishu-auth
  - file-logger
  - forward-auth
  - google-cloud-logging
  - graphql-limit-count
  - graphql-proxy-cache
  - grpc-transcode
  - grpc-web
  - gzip
  - hmac-auth
  - http-dubbo
  - http-logger
  - ip-restriction
  - jwe-decrypt
  - jwt-auth
  - kafka-logger
  - kafka-proxy
  - key-auth
  - lago
  - ldap-auth
  - limit-conn
  - limit-count
  - limit-req
  - log-rotate
  - loggly
  - loki-logger
  - mcp-bridge
  - mocking
  - multi-auth
  - node-status
  - oas-validator
  - opa
  - openfunction
  - openid-connect
  - opentelemetry
  - openwhisk
  - prometheus
  - proxy-buffering
  - proxy-cache
  - proxy-control
  - proxy-mirror
  - proxy-rewrite
  - public-api
  - real-ip
  - redirect
  - referer-restriction
  - request-id
  - request-validation
  - response-rewrite
  - rocketmq-logger
  - saml-auth
  - server-info
  - serverless-post-function
  - serverless-pre-function
  - skywalking
  - skywalking-logger
  - sls-logger
  - splunk-hec-logging
  - syslog
  - tcp-logger
  - tencent-cloud-cls
  - traffic-label
  - traffic-split
  - ua-restriction
  - udp-logger
  - uri-blocker
  - wolf-rbac
  - workflow
  - zipkin

stream_plugins: []

nginx_config:
  http:
    enable_access_log: false
    access_log: ""
    access_log_buffer: 0
    access_log_format: ""
    access_log_format_escape: ""
    client_body_timeout: 60s
    client_max_body_size: 10485760
  stream:
    enable_access_log: false
    access_log: ""
    access_log_format: ""
    access_log_format_escape: ""

deployment:
  role: data_plane
  role_data_plane:
    config_provider: etcd
  admin:
    admin_key: []
  etcd:
    host: []
    prefix: /apisix
    tls:
      verify: true
