sources:
  - repository: https://github.com/apache/apisix
    commit: 9ef2ecab67f652d38365049613610ef649bb4ad0
    file: t/plugin/ai-aws-content-moderation-secrets.t
    tests: 5
  - repository: https://github.com/apache/apisix
    commit: 9ef2ecab67f652d38365049613610ef649bb4ad0
    file: t/plugin/ai-aws-content-moderation.t
    tests: 12
  - repository: https://github.com/apache/apisix
    commit: 9ef2ecab67f652d38365049613610ef649bb4ad0
    file: t/plugin/ai-aws-content-moderation2.t
    tests: 2

cases:
  - name: vault-credentials-resolve-and-sign-raw-request
    source: {file: t/plugin/ai-aws-content-moderation-secrets.t, tests: [1, 2, 3]}
    config:
      secrets:
        - id: vault/test1
          uri: '{{FIXTURE.vault.URL}}'
          prefix: kv/apisix
          token: root
      routes:
        - id: aws-moderation-vault
          uri: /echo
          plugins:
            ai-aws-content-moderation:
              comprehend:
                access_key_id: '$secret://vault/test1/foo/access_key_id'
                secret_access_key: '$secret://vault/test1/foo/secret_access_key'
                region: us-east-1
                endpoint: '{{FIXTURE.comprehend.URL}}'
          upstream: {type: roundrobin, nodes: {'{{FIXTURE.upstream.ADDR}}': 1}}
    fixtures:
      - name: vault
        kind: http
        expect:
          - &vault_request
            method: GET
            path: {equals: /v1/kv/apisix/foo}
            headers: {X-Vault-Token: {equals: root}, X-Vault-Namespace: {absent: true}}
          - *vault_request
        respond:
          - &vault_response
            status: 200
            body: '{"data":{"access_key_id":"vault-access","secret_access_key":"vault-secret"}}'
          - *vault_response
      - name: comprehend
        kind: http
        expect:
          - method: POST
            path: {equals: /}
            headers:
              Content-Type: {equals: application/x-amz-json-1.1}
              X-Amz-Target: {equals: Comprehend_20171127.DetectToxicContent}
              Authorization:
                matches: '^AWS4-HMAC-SHA256 Credential=vault-access/[0-9]{8}/us-east-1/comprehend/aws4_request, SignedHeaders=content-type;host;x-amz-date;x-amz-target, Signature=[0-9a-f]{64}$'
            body: {equals: '{"LanguageCode":"en","TextSegments":[{"Text":"good_request"}]}'}
        respond: [{status: 200, body: &clean_response '{"ResultList":[{"Toxicity":0.02150000333786,"Labels":[{"Name":"PROFANITY","Score":0.00589999556541}]}]}'}]
      - &echo_upstream
        name: upstream
        kind: http
        respond: [{status: 200, echo_request_body: true}]
    steps:
      - name: vault-credentials-resolve-and-sign-raw-request
        input: &good_input {method: POST, path: /echo, body: good_request}
        output: {status: 200, body: {equals: good_request}, logs: {not_matches: 'vault-secret|vault-access'}}

  - name: environment-credentials-resolve-and-sign-raw-request
    source: {file: t/plugin/ai-aws-content-moderation-secrets.t, tests: [4, 5]}
    environment:
      AWS_MODERATION_ACCESS_KEY: environment-access
      AWS_MODERATION_SECRET_KEY: environment-secret
    config:
      routes:
        - id: aws-moderation-environment
          uri: /echo
          plugins:
            ai-aws-content-moderation:
              comprehend:
                access_key_id: '$ENV://AWS_MODERATION_ACCESS_KEY'
                secret_access_key: '$ENV://AWS_MODERATION_SECRET_KEY'
                region: us-east-1
                endpoint: '{{FIXTURE.comprehend.URL}}'
          upstream: {type: roundrobin, nodes: {'{{FIXTURE.upstream.ADDR}}': 1}}
    fixtures:
      - name: comprehend
        kind: http
        expect:
          - method: POST
            headers:
              X-Amz-Target: {equals: Comprehend_20171127.DetectToxicContent}
              Authorization:
                matches: '^AWS4-HMAC-SHA256 Credential=environment-access/[0-9]{8}/us-east-1/comprehend/aws4_request, SignedHeaders=content-type;host;x-amz-date;x-amz-target, Signature=[0-9a-f]{64}$'
            body: {equals: '{"LanguageCode":"en","TextSegments":[{"Text":"good_request"}]}'}
        respond: [{status: 200, body: *clean_response}]
      - *echo_upstream
    steps:
      - name: environment-credentials-resolve-and-sign-raw-request
        input: *good_input
        output: {status: 200, body: {equals: good_request}, logs: {not_matches: 'environment-secret|environment-access'}}

  - name: raw-body-default-moderation
    source: {file: t/plugin/ai-aws-content-moderation.t, tests: [1, 2, 3]}
    config:
      routes:
        - &default_route
          id: aws-moderation-default
          uri: /echo
          plugins:
            ai-aws-content-moderation:
              comprehend: &literal_comprehend
                access_key_id: access
                secret_access_key: ea+secret
                region: us-east-1
                endpoint: '{{FIXTURE.comprehend.URL}}'
          upstream: {type: roundrobin, nodes: {'{{FIXTURE.upstream.ADDR}}': 1}}
    fixtures:
      - name: comprehend
        kind: http
        expect:
          - {method: POST, body: {equals: '{"LanguageCode":"en","TextSegments":[{"Text":"toxic"}]}'}}
          - {method: POST, body: {equals: '{"LanguageCode":"en","TextSegments":[{"Text":"good_request"}]}'}}
        respond:
          - {status: 200, body: '{"ResultList":[{"Toxicity":0.72150000333786,"Labels":[{"Name":"PROFANITY","Score":0.25589999556541}]}]}'}
          - {status: 200, body: *clean_response}
      - *echo_upstream
    steps:
      - name: toxic-request-is-rejected
        input: {method: POST, path: /echo, body: toxic}
        output: {status: 400, body: {equals: request body exceeds toxicity threshold}}
      - name: clean-request-reaches-upstream
        input: *good_input
        output: {status: 200, body: {equals: good_request}}

  - name: raw-body-profanity-threshold-point-five
    source: {file: t/plugin/ai-aws-content-moderation.t, tests: [4, 5, 6, 7]}
    config:
      routes:
        - id: aws-moderation-profanity-half
          uri: /echo
          plugins:
            ai-aws-content-moderation:
              comprehend: *literal_comprehend
              moderation_categories: {PROFANITY: 0.5}
          upstream: {type: roundrobin, nodes: {'{{FIXTURE.upstream.ADDR}}': 1}}
    fixtures:
      - name: comprehend
        kind: http
        expect:
          - {method: POST, body: {equals: '{"LanguageCode":"en","TextSegments":[{"Text":"profane"}]}'}}
          - {method: POST, body: {equals: '{"LanguageCode":"en","TextSegments":[{"Text":"very_profane"}]}'}}
          - {method: POST, body: {equals: '{"LanguageCode":"en","TextSegments":[{"Text":"good_request"}]}'}}
        respond:
          - {status: 200, body: &profane_response '{"ResultList":[{"Toxicity":0.62150000333786,"Labels":[{"Name":"PROFANITY","Score":0.55589999556541}]}]}'}
          - {status: 200, body: &very_profane_response '{"ResultList":[{"Toxicity":0.72150000333786,"Labels":[{"Name":"PROFANITY","Score":0.85589999556541}]}]}'}
          - {status: 200, body: *clean_response}
      - *echo_upstream
    steps:
      - name: profane-request-is-rejected-by-category
        input: {method: POST, path: /echo, body: profane}
        output: {status: 400, body: {equals: request body exceeds PROFANITY threshold}}
      - name: very-profane-request-is-rejected-by-category
        input: {method: POST, path: /echo, body: very_profane}
        output: {status: 400, body: {equals: request body exceeds PROFANITY threshold}}
      - name: clean-request-passes-category-filter
        input: *good_input
        output: {status: 200, body: {equals: good_request}}

  - name: raw-body-profanity-threshold-point-seven
    source: {file: t/plugin/ai-aws-content-moderation.t, tests: [8, 9, 10, 11, 12]}
    config:
      routes:
        - id: aws-moderation-profanity-seven
          uri: /echo
          plugins:
            ai-aws-content-moderation:
              comprehend: *literal_comprehend
              moderation_categories: {PROFANITY: 0.7}
          upstream: {type: roundrobin, nodes: {'{{FIXTURE.upstream.ADDR}}': 1}}
    fixtures:
      - name: comprehend
        kind: http
        expect:
          - {method: POST, body: {equals: '{"LanguageCode":"en","TextSegments":[{"Text":"profane"}]}'}}
          - {method: POST, body: {equals: '{"LanguageCode":"en","TextSegments":[{"Text":"profane_but_not_toxic"}]}'}}
          - {method: POST, body: {equals: '{"LanguageCode":"en","TextSegments":[{"Text":"very_profane"}]}'}}
          - {method: POST, body: {equals: '{"LanguageCode":"en","TextSegments":[{"Text":"good_request"}]}'}}
        respond:
          - {status: 200, body: *profane_response}
          - {status: 200, body: '{"ResultList":[{"Toxicity":0.12150000333786,"Labels":[{"Name":"PROFANITY","Score":0.55589999556541}]}]}'}
          - {status: 200, body: *very_profane_response}
          - {status: 200, body: *clean_response}
      - *echo_upstream
    steps:
      - name: profane-request-fails-overall-toxicity
        input: {method: POST, path: /echo, body: profane}
        output: {status: 400, body: {equals: request body exceeds toxicity threshold}}
      - name: profane-but-not-toxic-request-passes
        input: {method: POST, path: /echo, body: profane_but_not_toxic}
        output: {status: 200, body: {equals: profane_but_not_toxic}}
      - name: very-profane-request-still-fails-category
        input: {method: POST, path: /echo, body: very_profane}
        output: {status: 400, body: {equals: request body exceeds PROFANITY threshold}}
      - name: clean-request-passes-raised-threshold
        input: *good_input
        output: {status: 200, body: {equals: good_request}}

  - name: unreachable-comprehend-fails-closed
    source: {file: t/plugin/ai-aws-content-moderation2.t, tests: [1, 2]}
    config:
      routes:
        - <<: *default_route
          id: aws-moderation-unreachable
          plugins:
            ai-aws-content-moderation:
              comprehend:
                access_key_id: access
                secret_access_key: ea+secret
                region: us-east-1
                endpoint: http://127.0.0.1:1
    fixtures:
      - name: upstream
        kind: http
        expect_requests: 0
        expect: []
        respond: [{status: 500, body: unexpected upstream request}]
    steps:
      - name: unreachable-comprehend-fails-closed
        input: {method: POST, path: /echo, body: toxic}
        output:
          status: 500
          body: {matches: '^failed to send request to http://127\.0\.0\.1:1: .*connection refused$'}
          logs: {matches: 'failed to send request to http://127\.0\.0\.1:1: .*connection refused'}
