    - name: llm-vars-streaming-cache-and-reasoning
      source: {file: t/plugin/ai-proxy3.t, tests: [17]}
      config:
        routes:
            - id: ai-proxy3-stream-cache
              uri: /log-vars
              plugins:
                ai-proxy:
                  provider: openai
                  auth:
                    header: {Authorization: Bearer test-key}
                  options: {model: gpt-4o}
                  override: {endpoint: '{{FIXTURE.openai.URL}}'}
                  ssl_verify: false
                response-rewrite:
                  headers:
                    set:
                      X-LLM-Cache-Read: $llm_cache_read_input_tokens
                      X-LLM-Cache-Creation: $llm_cache_creation_input_tokens
                      X-LLM-Reasoning: $llm_reasoning_tokens
      fixtures:
        - name: openai
          kind: http
          expect:
            - method: POST
              path: {equals: /v1/chat/completions}
          respond:
            - status: 200
              headers: {Content-Type: text/event-stream}
              chunks:
                - "data: {\"id\":\"1\",\"model\":\"gpt-4o\",\"choices\":[{\"delta\":{\"content\":\"ok\"},\"finish_reason\":null}]}\n\n"
                - "data: {\"choices\":[{\"delta\":{},\"finish_reason\":\"stop\"}]}\n\n"
                - "data: {\"choices\":[],\"usage\":{\"prompt_tokens\":30,\"completion_tokens\":15,\"prompt_tokens_details\":{\"cached_tokens\":10,\"cache_creation_input_tokens\":5},\"completion_tokens_details\":{\"reasoning_tokens\":7}}}\n\n"
                - "data: [DONE]\n\n"
      steps:
        - name: streaming-cache-and-reasoning-tokens-registered
          input:
            method: POST
            path: /log-vars
            headers: {Content-Type: application/json}
            body: '{"messages":[{"role":"user","content":"Solve this"}],"model":"gpt-4o","stream":true}'
          output:
            status: 200
            headers:
              X-LLM-Cache-Read: {equals: '10'}
              X-LLM-Cache-Creation: {equals: '5'}
              X-LLM-Reasoning: {equals: '7'}

    - name: llm-vars-responses-nonstreaming-cache
      source: {file: t/plugin/ai-proxy3.t, tests: [18]}
      config:
        routes:
            - id: ai-proxy3-responses-nonstream
              uri: /ai/v1/responses
              plugins:
                ai-proxy:
                  provider: openai
                  auth:
                    header: {Authorization: Bearer test-key}
                  options: {model: gpt-4o-mini}
                  override: {endpoint: '{{FIXTURE.openai.URL}}'}
                  ssl_verify: false
                response-rewrite:
                  headers:
                    set:
                      X-LLM-Cache-Read: $llm_cache_read_input_tokens
                      X-LLM-Reasoning: $llm_reasoning_tokens
      fixtures:
        - name: openai
          kind: http
          expect:
            - method: POST
              path: {equals: /v1/responses}
          respond:
            - {status: 200, headers: {Content-Type: application/json}, body: '{"id":"r1","object":"response","created":1723780938,"model":"gpt-4o-mini","output":[{"type":"message","role":"assistant","content":[{"type":"output_text","text":"ok"}]}],"usage":{"input_tokens":40,"output_tokens":20,"total_tokens":60,"input_tokens_details":{"cached_tokens":12},"output_tokens_details":{"reasoning_tokens":8}}}'}
      steps:
        - name: responses-nonstreaming-cache-tokens-registered
          input:
            method: POST
            path: /ai/v1/responses
            headers: {Content-Type: application/json}
            body: '{"input":"Solve this","model":"gpt-4o-mini"}'
          output:
            status: 200
            headers:
              X-LLM-Cache-Read: {equals: '12'}
              X-LLM-Reasoning: {equals: '8'}

    - name: llm-vars-nonstreaming-reasoning-tokens
      source: {file: t/plugin/ai-proxy3.t, tests: [9]}
      config:
        routes:
            - id: ai-proxy3-stream-reasoning
              uri: /log-vars
              plugins:
                ai-proxy:
                  provider: openai
                  auth:
                    header: {Authorization: Bearer test-key}
                  options: {model: gpt-4o}
                  override: {endpoint: '{{FIXTURE.openai.URL}}'}
                  ssl_verify: false
                response-rewrite:
                  headers:
                    set:
                      X-LLM-Has-Tool-Calls: $llm_has_tool_calls
      fixtures:
        - name: openai
          kind: http
          expect:
            - method: POST
              path: {equals: /v1/chat/completions}
          respond:
            - status: 200
              headers: {Content-Type: text/event-stream}
              chunks:
                - "data: {\"id\":\"1\",\"model\":\"gpt-4o\",\"choices\":[{\"delta\":{\"content\":\"Hello\"},\"finish_reason\":null}]}\n\n"
                - "data: {\"choices\":[{\"delta\":{},\"finish_reason\":\"stop\"}]}\n\n"
                - "data: {\"choices\":[],\"usage\":{\"prompt_tokens\":10,\"completion_tokens\":2}}\n\n"
                - "data: [DONE]\n\n"
      steps:
        - name: streaming-request-registers-has-tool-calls-false
          input:
            method: POST
            path: /log-vars
            headers: {Content-Type: application/json}
            body: '{"messages":[{"role":"user","content":"Hello"}],"model":"gpt-4o","stream":true}'
          output:
            status: 200
            headers:
              X-LLM-Has-Tool-Calls: {equals: 'false'}


    - name: kafka-log-summaries-and-payloads
      source: {file: t/plugin/ai-proxy-kafka-log.t, tests: [1, 2]}
      config:
        routes:
            - id: ai-proxy-kafka-summaries-payloads
              uri: /anything
              plugins:
                ai-proxy:
                  provider: openai
                  auth: {header: {Authorization: Bearer token}}
                  options: {model: gpt-35-turbo-instruct, max_tokens: 512, temperature: 1.0}
                  override: {endpoint: '{{FIXTURE.openai.URL}}'}
                  ssl_verify: false
                  logging: {summaries: true, payloads: true}
                kafka-logger:
                  broker_list: {'{{FIXTURE.sink.HOST}}': '{{FIXTURE.sink.PORT}}'}
                  kafka_topic: test2
                  key: key1
                  timeout: 1
                  producer_type: sync
                  batch_max_size: 1
                  log_format:
                    llm_summary: '$llm_summary'
                    llm_request: '$llm_request'
                    llm_response_text: '$llm_response_text'
                    llm_model: '$llm_model'
                    llm_tool_count: '$llm_tool_count'
                    llm_cache_read_input_tokens: '$llm_cache_read_input_tokens'
                    llm_cache_creation_input_tokens: '$llm_cache_creation_input_tokens'
                    llm_reasoning_tokens: '$llm_reasoning_tokens'
              upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
      fixtures:
        - name: primary
          kind: http
          respond:
            - {status: 200, body: upstream-ok}
        - name: openai
          kind: http
          expect:
            - method: POST
              path: {equals: /v1/chat/completions}
          respond:
            - status: 200
              headers: {Content-Type: application/json}
              body: '{"choices":[{"message":{"role":"assistant","content":"hello"},"finish_reason":"stop"}],"usage":{"prompt_tokens":10,"completion_tokens":5,"total_tokens":15}}'
        - name: sink
          kind: kafka
          kafka:
            topics: [test2]
          network_expect:
            - payload: {matches: '(?s).*llm_request.*llm_response_text.*llm_summary.*gpt-35-turbo-instruct.*'}
          network_respond:
            - {}
      steps:
        - name: request-with-summaries-and-payloads
          input:
            method: POST
            path: /anything
            headers:
              Content-Type: application/json
              Authorization: Bearer token
            body: '{"messages":[{"role":"system","content":"You are a mathematician"},{"role":"user","content":"What is 1+1?"}]}'
          output:
            status: 200

    - name: kafka-log-summaries-no-payload
      source: {file: t/plugin/ai-proxy-kafka-log.t, tests: [3, 4]}
      config:
        routes:
            - id: ai-proxy-kafka-summaries-only
              uri: /anything
              plugins:
                ai-proxy:
                  provider: openai
                  auth: {header: {Authorization: Bearer token}}
                  options: {model: gpt-35-turbo-instruct, max_tokens: 512, temperature: 1.0}
                  override: {endpoint: '{{FIXTURE.openai.URL}}'}
                  ssl_verify: false
                  logging: {summaries: true, payloads: false}
                kafka-logger:
                  broker_list: {'{{FIXTURE.sink.HOST}}': '{{FIXTURE.sink.PORT}}'}
                  kafka_topic: test2
                  key: key1
                  timeout: 1
                  producer_type: sync
                  batch_max_size: 1
                  log_format:
                    llm_summary: '$llm_summary'
                    llm_model: '$llm_model'
              upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
      fixtures:
        - name: primary
          kind: http
          respond:
            - {status: 200, body: upstream-ok}
        - name: openai
          kind: http
          respond:
            - status: 200
              headers: {Content-Type: application/json}
              body: '{"choices":[{"message":{"role":"assistant","content":"hello"},"finish_reason":"stop"}],"usage":{"prompt_tokens":10,"completion_tokens":5,"total_tokens":15}}'
        - name: sink
          kind: kafka
          kafka:
            topics: [test2]
          network_expect:
            - payload: {matches: '(?s).*llm_summary.*gpt-35-turbo-instruct.*'}
              forbidden_matches: ['llm_request', 'llm_response_text']
          network_respond:
            - {}
      steps:
        - name: request-summaries-only
          input:
            method: POST
            path: /anything
            headers:
              Content-Type: application/json
              Authorization: Bearer token
            body: '{"messages":[{"role":"system","content":"You are a mathematician"},{"role":"user","content":"What is 1+1?"}]}'
          output:
            status: 200

    - name: kafka-log-no-summary-no-payload
      source: {file: t/plugin/ai-proxy-kafka-log.t, tests: [5, 6]}
      config:
        routes:
            - id: ai-proxy-kafka-no-logging
              uri: /anything
              plugins:
                ai-proxy:
                  provider: openai
                  auth: {header: {Authorization: Bearer token}}
                  options: {model: gpt-35-turbo-instruct, max_tokens: 512, temperature: 1.0}
                  override: {endpoint: '{{FIXTURE.openai.URL}}'}
                  ssl_verify: false
                  logging: {summaries: false, payloads: false}
                kafka-logger:
                  broker_list: {'{{FIXTURE.sink.HOST}}': '{{FIXTURE.sink.PORT}}'}
                  kafka_topic: test2
                  key: key1
                  timeout: 1
                  producer_type: sync
                  batch_max_size: 1
                  log_format:
                    route_id: '$route_id'
              upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
      fixtures:
        - name: primary
          kind: http
          respond:
            - {status: 200, body: upstream-ok}
        - name: openai
          kind: http
          respond:
            - status: 200
              headers: {Content-Type: application/json}
              body: '{"choices":[{"message":{"role":"assistant","content":"hello"},"finish_reason":"stop"}],"usage":{"prompt_tokens":10,"completion_tokens":5,"total_tokens":15}}'
        - name: sink
          kind: kafka
          kafka:
            topics: [test2]
          network_expect:
            - payload: {matches: '.+'}
              forbidden_matches: ['llm_summary', 'llm_request', 'llm_response_text']
          network_respond:
            - {}
      steps:
        - name: request-no-logging
          input:
            method: POST
            path: /anything
            headers:
              Content-Type: application/json
              Authorization: Bearer token
            body: '{"messages":[{"role":"system","content":"You are a mathematician"},{"role":"user","content":"What is 1+1?"}]}'
          output:
            status: 200

