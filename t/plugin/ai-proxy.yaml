            - method: POST
              path: {equals: /v1/responses}
              headers: {Authorization: {equals: Bearer token}}
              body: {json_equals: '{"model":"gpt-4o","input":"What is 1+1?","instructions":"You are a math tutor","stream":false,"max_tokens":512,"temperature":1}'}
            - method: POST
              path: {equals: /v1/chat/completions}
              headers: {Authorization: {equals: Bearer token}}
              body: {json_equals: '{"messages":[{"role":"system","content":"You are a mathematician"},{"role":"user","content":"What is 1+1?"}],"model":"gpt-4o","max_tokens":512,"temperature":1}'}
          respond:
            - {status: 200, headers: {Content-Type: application/json}, body: '{"id":"resp_abc123","model":"gpt-4o","output":[{"content":[{"type":"output_text","text":"2"}]}],"usage":{"input_tokens":5,"output_tokens":1,"total_tokens":6}}'}
            - {status: 200, headers: {Content-Type: application/json}, body: '{"id":"resp_abc123","model":"gpt-4o","output":[],"usage":{"input_tokens":5,"output_tokens":1,"total_tokens":6}}'}
