            - method: POST
              path: {equals: /v1/chat/completions}
              body: {json_equals: '{"model":"gpt-4o","max_completion_tokens":1024,"messages":[{"role":"user","content":"What is the weather?"},{"role":"assistant","tool_calls":[{"id":"call_abc","type":"function","function":{"name":"get_weather","arguments":"{\"location\":\"SF\"}"}}]},{"role":"tool","tool_call_id":"call_abc","content":"Sunny, 72F"}]}'}
          respond:
            - {status: 200, headers: {Content-Type: application/json}, body: '{"choices":[{"message":{"role":"assistant","content":"ok","type":"message"}}]}'}
      steps:
        - name: anthropic-tool-use-history-converts-to-tool-calls
          input:
            method: POST
            path: /v1/messages
            headers: {Content-Type: application/json}
            body: '{"model":"claude-sonnet-4-20250514","max_tokens":1024,"messages":[{"role":"user","content":"What is the weather?"},{"role":"assistant","content":[{"type":"tool_use","id":"call_abc","name":"get_weather","input":{"location":"SF"}}]},{"role":"user","content":[{"type":"tool_result","tool_use_id":"call_abc","content":"Sunny, 72F"}]}]}'
          output:
            status: 200
            body: {matches: '"type":"message"'}

