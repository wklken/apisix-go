                json_equals: '{"messages":[{"role":"system","content":"some content"}],"max_tokens":512,"temperature":1,"stream":true,"stream_options":{"include_usage":true}}'
          respond:
            - status: 200
              headers: {Content-Type: text/event-stream}
              chunks:
                - "data: {\"id\":\"azure-1\",\"choices\":[{\"delta\":{\"role\":\"assistant\",\"content\":\"\"},\"index\":0,\"finish_reason\":null}]}\n\n"
                - "data: {\"id\":\"azure-1\",\"choices\":[{\"delta\":{\"content\":\"1\"},\"index\":0,\"finish_reason\":null}]}\n\n"
                - "data: {\"id\":\"azure-1\",\"choices\":[{\"delta\":{\"content\":\" +\"},\"index\":0,\"finish_reason\":null}]}\n\n"
                - "data: {\"id\":\"azure-1\",\"choices\":[{\"delta\":{\"content\":\" 1 = 2.\"},\"index\":0,\"finish_reason\":null}]}\n\n"
                - "data: {\"id\":\"azure-1\",\"choices\":[{\"delta\":{},\"index\":0,\"finish_reason\":\"stop\"}]}\n\n"
                - "data: [DONE]\n\n"
              chunk_delay: 20ms
      steps:
        - name: send-streaming-request
          input:
            method: POST
            path: /anything
            headers: {Content-Type: application/json}
            body: '{"messages":[{"role":"system","content":"some content"}],"stream":true}'
          output:
            status: 200
            headers:
              Content-Type: {matches: '^text/event-stream'}
            body:
              matches: '(?s)data: .*"content":"1".*"content":" \+".*"content":" 1 = 2\.".*data: \[DONE\]'
            chunks:
              - {matches: '^data: .*"role":"assistant".*\n\n$'}
              - {matches: '^data: .*"content":"1".*\n\n$'}
              - {matches: '^data: .*"content":" \+".*\n\n$'}
              - {matches: '^data: .*"content":" 1 = 2\.".*\n\n$'}
              - {matches: '^data: .*"finish_reason":"stop".*\n\n$'}
              - {equals: "data: [DONE]\n\n"}
