cases:
    - name: anthropic-converts-simple-text-message
      config:
        routes:
            - id: ai-proxy-anthropic-simple
              uri: /v1/messages
              plugins:
                ai-proxy-multi:
                  instances:
                    - name: openai-backend
                      provider: openai-compatible
                      weight: 1
                      auth:
                        header:
                          Authorization: Bearer test-token
                      options:
                        model: gpt-4o
                      override:
                        endpoint: '{{FIXTURE.openai.URL}}'
                  ssl_verify: false
      fixtures:
        - name: openai
          kind: http
          expect:
            - method: POST
              path: {equals: /v1/chat/completions}
              headers:
                Authorization: {equals: Bearer test-token}
              body: {json_equals: '{"model":"gpt-4o","max_completion_tokens":1024,"messages":[{"role":"user","content":"Hello"}]}'}
          respond:
            - {status: 200, headers: {Content-Type: application/json}, body: '{"choices":[{"message":{"role":"assistant","content":"1 + 1 = 2.","type":"message"},"type":"message","stop_reason":"end_turn"}]}'}
      steps:
        - name: anthropic-text-request-converts-to-openai
          input:
            method: POST
            path: /v1/messages
            headers: {Content-Type: application/json}
            body: '{"model":"claude-sonnet-4-20250514","max_tokens":1024,"messages":[{"role":"user","content":"Hello"}]}'
          output:
            status: 200
            body: {matches: '(?s)"type":"text".*"stop_reason":"end_turn".*"type":"message"'}

    - name: bedrock-single-stream-eventstream
      config:
        routes:
            - id: ai-proxy-bedrock-single-stream
              uri: /single-ai/stream/converse
              plugins:
                ai-proxy:
                  auth:
                    aws:
                      access_key_id: AKIAIOSFODNN7EXAMPLE
                      secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
                  options:
                    model: anthropic.claude-3-5-sonnet-20241022-v2:0
                  override:
                    endpoint: '{{FIXTURE.bedrock.URL}}'
                  provider: bedrock
                  provider_conf:
                    region: us-east-1
                  ssl_verify: false
      fixtures:
        - name: bedrock
          kind: http
          expect:
            - method: POST
              path: {equals: '/model/anthropic.claude-3-5-sonnet-20241022-v2%3A0/converse-stream'}
          respond:
            - status: 200
              headers: {Content-Type: application/vnd.amazon.eventstream}
              aws_event_stream:
                - headers: {":message-type": "event", ":event-type": "messageStart"}
                  payload: '{"role":"assistant"}'
                - headers: {":message-type": "event", ":event-type": "contentBlockDelta"}
                  payload: '{"delta":{"type":"text","text":"Hello"}}'
                - headers: {":message-type": "event", ":event-type": "messageStop"}
                  payload: '{}'
                - headers: {":message-type": "event", ":event-type": "metadata"}
                  payload: '{"usage":{"inputTokens":15,"outputTokens":20}}'
      steps:
        - name: bedrock-stream-forwards-eventstream-chunks
          input:
            method: POST
            path: /single-ai/stream/converse
            headers: {Content-Type: application/json}
            body: '{"stream":true,"messages":[{"role":"user","content":[{"text":"Say hi"}]}]}'
          output:
            status: 200
            headers: {Content-Type: {matches: '^application/vnd.amazon.eventstream'}}
            body: {matches: '(?s)messageStart.*contentBlockDelta.*Hello.*messageStop.*metadata'}

    - name: client-disconnect-aborts-upstream-read
      config:
        routes:
            - id: ai-proxy-client-disconnect
              uri: /anything
              plugins:
                ai-proxy:
                  auth:
                    header:
                      Authorization: Bearer token
                  options:
                    model: gpt-4
                    stream: true
                  override:
                    endpoint: '{{FIXTURE.provider.URL}}'
                  provider: openai
                  ssl_verify: false
      fixtures:
        - name: provider
          kind: http
          expect:
            - method: POST
              path: {equals: /v1/chat/completions}
              headers:
                Authorization: {equals: Bearer token}
              body: {json_equals: '{"model":"gpt-4","messages":[{"role":"user","content":"hi"}],"stream":true,"stream_options":{"include_usage":true}}'}
          respond:
            - status: 200
              headers: {Content-Type: text/event-stream}
              chunks: ["data: {\"id\":\"chatcmpl-1\",\"object\":\"chat.completion.chunk\",\"choices\":[{\"delta\":{\"content\":\"tok\"},\"index\":0,\"finish_reason\":null}],\"usage\":null}\n\n"]
              chunk_delay: 30ms
              chunk_repeat: 2000
      steps:
        - name: disconnected-client-logs-and-aborts-upstream
          input:
            method: POST
            path: /anything
            headers: {Content-Type: application/json}
            body: '{"messages":[{"role":"user","content":"hi"}]}'
            disconnect_after_bytes: 250
          output:
            status: 200
            logs: {matches: 'client disconnected during AI streaming'}

    - name: flush-zero-forwards-each-sse-frame-before-eof
      config:
        routes:
          - id: ai-proxy-flush-zero
            uri: /flush-default
            plugins:
              ai-proxy:
                provider: openai
                auth: {header: {Authorization: Bearer test-key}}
                options: {model: gpt-4, stream: true}
                override: {endpoint: '{{FIXTURE.flush_zero.URL}}/v1/chat/completions?delay=true'}
                streaming_flush_interval_ms: 0
                ssl_verify: false
      fixtures:
        - name: flush_zero
          kind: http
          expect:
            - method: POST
              path: {equals: '/v1/chat/completions?delay=true'}
              headers: {Authorization: {equals: Bearer test-key}}
              body: {json_equals: '{"messages":[{"role":"user","content":"hi"}],"model":"gpt-4","stream":true,"stream_options":{"include_usage":true}}'}
          respond:
            - status: 200
              headers: {Content-Type: text/event-stream}
              chunks:
                - "data: {\"id\":\"1\",\"choices\":[{\"delta\":{\"role\":\"assistant\",\"content\":\"\"},\"index\":0,\"finish_reason\":null}]}\n\n"
                - "data: {\"id\":\"1\",\"choices\":[{\"delta\":{\"content\":\"Hello\"},\"index\":0,\"finish_reason\":null}]}\n\n"
                - "data: {\"id\":\"1\",\"choices\":[{\"delta\":{\"content\":\" world\"},\"index\":0,\"finish_reason\":null}]}\n\n"
                - "data: {\"id\":\"1\",\"choices\":[{\"delta\":{},\"index\":0,\"finish_reason\":\"stop\"}]}\n\n"
                - "data: [DONE]\n\n"
              chunk_delay: 150ms
      steps:
        - name: observe-each-zero-flush-frame
          input:
            method: POST
            path: /flush-default
            headers: {Content-Type: application/json}
            body: '{"messages":[{"role":"user","content":"hi"}],"model":"gpt-4","stream":true}'
          output:
            status: 200
            headers: {Content-Type: {matches: '^text/event-stream'}}
            chunks:
              - {matches: '^data: .*"role":"assistant".*\n\n$'}
              - {matches: '^data: .*"content":"Hello".*\n\n$'}
              - {matches: '^data: .*"content":" world".*\n\n$'}
              - {matches: '^data: .*"finish_reason":"stop".*\n\n$'}
              - {equals: "data: [DONE]\n\n"}

    - name: protocol-conversion-converts-openai-sse-to-anthropic
      config:
        routes:
          - id: protocol-conversion-stream
            uri: /v1/messages
            plugins:
              ai-proxy:
                provider: openai
                auth: {header: {Authorization: Bearer token}}
                options: {model: claude-3-5-sonnet-20241022, stream: true}
                override: {endpoint: '{{FIXTURE.provider.URL}}'}
      fixtures:
        - name: provider
          kind: http
          expect:
            - method: POST
              path: {equals: /v1/chat/completions}
              body: {json_equals: '{"model":"claude-3-5-sonnet-20241022","messages":[{"role":"user","content":"Hi"}],"stream":true,"stream_options":{"include_usage":true}}'}
          respond:
            - {status: 200, headers: {Content-Type: text/event-stream}, body: "data: {\"id\":\"chatcmpl-123\",\"object\":\"chat.completion.chunk\",\"model\":\"gpt-4o\",\"choices\":[{\"index\":0,\"delta\":{\"role\":\"assistant\"},\"finish_reason\":null}]}\n\ndata: {\"id\":\"chatcmpl-123\",\"object\":\"chat.completion.chunk\",\"model\":\"gpt-4o\",\"choices\":[{\"index\":0,\"delta\":{\"content\":\"Hello\"},\"finish_reason\":null}]}\n\ndata: {\"id\":\"chatcmpl-123\",\"object\":\"chat.completion.chunk\",\"model\":\"gpt-4o\",\"choices\":[{\"index\":0,\"delta\":{\"content\":\" world\"},\"finish_reason\":\"stop\"}],\"usage\":{\"prompt_tokens\":5,\"completion_tokens\":5,\"total_tokens\":10}}\n\ndata: [DONE]\n\n"}
      steps:
        - name: converted-stream-has-complete-anthropic-event-sequence
          input: {method: POST, path: /v1/messages, headers: {Content-Type: application/json}, body: '{"model":"claude-3-5-sonnet-20241022","messages":[{"role":"user","content":"Hi"}],"stream":true}'}
          output:
            status: 200
            chunks:
              - {matches: '^event: message_start\n'}
              - {matches: '^event: content_block_start\n'}
              - {matches: '(?s)^event: content_block_delta\n.*"text":"Hello"'}
              - {matches: '(?s)^event: content_block_delta\n.*"text":" world"'}
              - {matches: '^event: content_block_stop\n'}
              - {matches: '(?s)^event: message_delta\n.*"input_tokens":5.*"output_tokens":5'}
              - {matches: '^event: message_stop\n'}

    - name: nonstream-request-populates-upstream-address-status-and-time
      config:
        routes:
          - id: ai-proxy-upstream-vars-nonstream
            uri: /upstream-vars-nonstream
            plugins:
              ai-proxy:
                provider: openai
                auth:
                  header: {Authorization: Bearer test-key}
                  query: {api_key: test-query}
                options: {model: gpt-4}
                override: {endpoint: '{{FIXTURE.upstream_vars_nonstream.URL}}?endpoint=test2'}
                ssl_verify: false
              response-rewrite:
                headers:
                  set:
                    X-Upstream-Addr: $upstream_addr
                    X-Upstream-Status: $upstream_status
                    X-Upstream-Response-Time: $upstream_response_time
      fixtures:
        - name: upstream_vars_nonstream
          kind: http
          expect:
            - method: POST
              host: {matches: '^127\.0\.0\.1:[0-9]+$'}
              path: {equals: '/v1/chat/completions?api_key=test-query&endpoint=test2'}
              headers:
                Authorization: {equals: Bearer test-key}
                X-AI-Fixture: {equals: openai/chat-basic.json}
              body: {json_equals: '{"model":"gpt-4","messages":[{"role":"user","content":"hello"}]}'}
          respond:
            - status: 200
              headers: {Content-Type: application/json}
              body: '{"id":"nonstream","choices":[{"message":{"role":"assistant","content":"hello"}}],"usage":{"prompt_tokens":4,"completion_tokens":1,"total_tokens":5}}'
      steps:
        - name: observe-nonstream-upstream-variables
          input:
            method: POST
            path: /upstream-vars-nonstream
            headers: {Content-Type: application/json, X-AI-Fixture: openai/chat-basic.json}
            body: '{"model":"gpt-4","messages":[{"role":"user","content":"hello"}]}'
          output:
            status: 200
            body: {matches: '"id":"nonstream"'}
            headers:
              X-Upstream-Addr: {matches: '^127\.0\.0\.1:[0-9]+$'}
              X-Upstream-Status: {equals: '200'}
              X-Upstream-Response-Time: {matches: '^[0-9]+(\.[0-9]+)?$'}

    - name: openai-compatible-chat-request
      config:
        routes:
          - id: ai-proxy-openai-compatible-chat
            uri: /anything
            plugins:
              ai-proxy:
                provider: openai-compatible
                auth:
                  header:
                    Authorization: Bearer token
                options:
                  model: custom
                  max_tokens: 512
                  temperature: 1.0
                override:
                  endpoint: '{{FIXTURE.compat.URL}}/v1/chat/completions'
                ssl_verify: false
      fixtures:
        - name: compat
          kind: http
          expect:
            - method: POST
              path: {equals: /v1/chat/completions}
              headers:
                Authorization: {equals: Bearer token}
                Content-Type: {matches: '^application/json'}
              body:
                json_equals: '{"messages":[{"role":"system","content":"You are a mathematician"},{"role":"user","content":"What is 1+1?"}],"model":"custom","max_tokens":512,"temperature":1}'
          respond:
            - status: 200
              headers: {Content-Type: application/json}
              body: '{"choices":[{"message":{"content":"1 + 1 = 2.","role":"assistant"}}]}'
      steps:
        - name: send-chat-request
          input:
            method: POST
            path: /anything
            headers:
              Content-Type: application/json
              Authorization: Bearer token
            body: '{"messages":[{"role":"system","content":"You are a mathematician"},{"role":"user","content":"What is 1+1?"}]}'
          output:
            status: 200
            body:
              json_equals: '{"choices":[{"message":{"content":"1 + 1 = 2.","role":"assistant"}}]}'

    - name: kafka-log-summaries-and-payloads
      config:
        routes:
            - id: ai-proxy-kafka-summaries-payloads
              uri: /anything
              plugins:
                ai-proxy:
                  provider: openai
                  auth: {header: {Authorization: Bearer token}}
                  options: {model: gpt-35-turbo-instruct, max_tokens: 512, temperature: 1.0}
                  override: {endpoint: '{{FIXTURE.openai.URL}}'}
                  ssl_verify: false
                  logging: {summaries: true, payloads: true}
                kafka-logger:
                  broker_list: {'{{FIXTURE.sink.HOST}}': '{{FIXTURE.sink.PORT}}'}
                  kafka_topic: test2
                  key: key1
                  timeout: 1
                  producer_type: sync
                  batch_max_size: 1
                  log_format:
                    llm_summary: '$llm_summary'
                    llm_request: '$llm_request'
                    llm_response_text: '$llm_response_text'
                    llm_model: '$llm_model'
                    llm_tool_count: '$llm_tool_count'
                    llm_cache_read_input_tokens: '$llm_cache_read_input_tokens'
                    llm_cache_creation_input_tokens: '$llm_cache_creation_input_tokens'
                    llm_reasoning_tokens: '$llm_reasoning_tokens'
              upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
      fixtures:
        - name: primary
          kind: http
          respond:
            - {status: 200, body: upstream-ok}
        - name: openai
          kind: http
          expect:
            - method: POST
              path: {equals: /v1/chat/completions}
          respond:
            - status: 200
              headers: {Content-Type: application/json}
              body: '{"choices":[{"message":{"role":"assistant","content":"hello"},"finish_reason":"stop"}],"usage":{"prompt_tokens":10,"completion_tokens":5,"total_tokens":15}}'
        - name: sink
          kind: kafka
          kafka:
            topics: [test2]
          network_expect:
            - payload: {matches: '(?s).*llm_request.*llm_response_text.*llm_summary.*gpt-35-turbo-instruct.*'}
          network_respond:
            - {}
      steps:
        - name: request-with-summaries-and-payloads
          input:
            method: POST
            path: /anything
            headers:
              Content-Type: application/json
              Authorization: Bearer token
            body: '{"messages":[{"role":"system","content":"You are a mathematician"},{"role":"user","content":"What is 1+1?"}]}'
          output:
            status: 200

    - name: ai-proxy-multi-retry-fast-failure
      config:
        routes:
            - id: ai-proxy-multi-retry-fast-failure
              uri: /anything
              plugins:
                ai-proxy-multi:
                  fallback_strategy: [http_5xx]
                  retry_on_failure_within_ms: 5000
                  instances:
                    - name: fast-err
                      provider: openai-compatible
                      weight: 1
                      priority: 10
                      auth: {header: {Authorization: Bearer token}}
                      options: {model: gpt-4}
                      override: {endpoint: '{{FIXTURE.fast_error.URL}}'}
                    - name: success
                      provider: openai-compatible
                      weight: 1
                      priority: 0
                      auth: {header: {Authorization: Bearer token}}
                      options: {model: gpt-4}
                      override: {endpoint: '{{FIXTURE.success.URL}}'}
                  ssl_verify: false
      fixtures:
        - name: fast_error
          kind: http
          expect:
            - method: POST
              path: {equals: /v1/chat/completions}
              body: {json_equals: '{"messages":[{"role":"user","content":"What is 1+1?"}],"model":"gpt-4"}'}
          respond:
            - {status: 500, headers: {Content-Type: application/json}, body: '{"error":{"message":"fast internal error"}}'}
        - name: success
          kind: http
          expect:
            - method: POST
              path: {equals: /v1/chat/completions}
              body: {json_equals: '{"messages":[{"role":"user","content":"What is 1+1?"}],"model":"gpt-4"}'}
          respond:
            - {status: 200, headers: {Content-Type: text/plain}, body: success}
      steps:
        - name: fast-500-falls-back-to-lower-priority-instance
          input:
            method: POST
            path: /anything
            headers: {Content-Type: application/json}
            body: '{"messages":[{"role":"user","content":"What is 1+1?"}]}'
          output: {status: 200, body: {equals: success}}

    - name: ai-proxy-multi-openai-compatible-stream
      config:
        routes:
            - id: ai-proxy-multi-openai-compatible-stream
              uri: /anything
              plugins:
                ai-proxy-multi:
                  instances:
                    - name: self-hosted
                      provider: openai-compatible
                      weight: 1
                      auth: {header: {Authorization: Bearer token}}
                      options: {model: custom-instruct, max_tokens: 512, temperature: 1.0, stream: true}
                      override: {endpoint: '{{FIXTURE.openai.URL}}'}
                  ssl_verify: false
      fixtures:
        - name: openai
          kind: http
          expect:
            - method: POST
              path: {equals: /v1/chat/completions}
              headers: {Authorization: {equals: Bearer token}}
              body: {json_equals: '{"messages":[{"role":"system","content":"some content"}],"model":"custom-instruct","max_tokens":512,"temperature":1,"stream":true,"stream_options":{"include_usage":true}}'}
          respond:
            - status: 200
              headers: {Content-Type: text/event-stream}
              chunks:
                - "data: {\"choices\":[{\"delta\":{\"role\":\"assistant\",\"content\":\"\"},\"finish_reason\":null}]}\n\n"
                - "data: {\"choices\":[{\"delta\":{\"content\":\"some\"},\"finish_reason\":null}]}\n\n"
                - "data: {\"choices\":[{\"delta\":{\"content\":\" \"},\"finish_reason\":null}]}\n\n"
                - "data: {\"choices\":[{\"delta\":{\"content\":\"content\"},\"finish_reason\":null}]}\n\n"
                - "data: {\"choices\":[{\"delta\":{},\"finish_reason\":\"stop\"}]}\n\n"
                - "data: [DONE]\n\n"
      steps:
        - name: six-sse-frames-end-with-done
          input:
            method: POST
            path: /anything
            headers: {Content-Type: application/json}
            body: '{"messages":[{"role":"system","content":"some content"}],"stream":true}'
          output:
            status: 200
            headers: {Content-Type: {matches: '^text/event-stream'}}
            chunks:
              - {matches: 'role.*assistant'}
              - {matches: 'content.*some'}
              - {matches: 'content.* '}
              - {matches: 'content.*content'}
              - {matches: 'finish_reason.*stop'}
              - {equals: "data: [DONE]\n\n"}
