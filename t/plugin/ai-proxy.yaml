    - name: azure-openai-chat-request
      source:
        file: t/plugin/ai-proxy-azure-openai.t
        tests: [1, 2]
      config:
        routes:
          - id: ai-proxy-azure-openai-chat
            uri: /anything
            plugins:
              ai-proxy-multi:
                instances:
                  - name: azure-openai
                    provider: azure-openai
                    weight: 1
                    auth:
                      header:
                        Authorization: Bearer token
                    options:
                      model: gpt-4o
                      max_tokens: 512
                      temperature: 1.0
                    override:
                      endpoint: '{{FIXTURE.azure.URL}}/v1/chat/completions'
                ssl_verify: false
      fixtures:
        - name: azure
          kind: http
          expect:
            - method: POST
              path: {equals: /v1/chat/completions}
              headers:
                Authorization: {equals: Bearer token}
                Content-Type: {matches: '^application/json'}
              body:
                json_equals: '{"messages":[{"role":"system","content":"You are a mathematician"},{"role":"user","content":"What is 1+1?"}],"max_tokens":512,"temperature":1}'
          respond:
            - status: 200
              headers: {Content-Type: application/json}
              body: '{"choices":[{"message":{"content":"1 + 1 = 2.","role":"assistant"}}]}'
      steps:
        - name: send-chat-request
          input:
            method: POST
            path: /anything
            headers:
              Content-Type: application/json
              Authorization: Bearer token
            body: '{"messages":[{"role":"system","content":"You are a mathematician"},{"role":"user","content":"What is 1+1?"}]}'
          output:
            status: 200
            body:
              json_equals: '{"choices":[{"message":{"content":"1 + 1 = 2.","role":"assistant"}}]}'

    - name: azure-openai-streaming-sse
      source:
        file: t/plugin/ai-proxy-azure-openai.t
        tests: [3, 4]
      config:
        routes:
          - id: ai-proxy-azure-openai-stream
            uri: /anything
            plugins:
              ai-proxy-multi:
                instances:
                  - name: azure-openai
                    provider: azure-openai
                    weight: 1
                    auth:
                      header:
                        Authorization: Bearer token
                    options:
                      model: gpt-4o
                      max_tokens: 512
                      temperature: 1.0
                      stream: true
                    override:
                      endpoint: '{{FIXTURE.azure.URL}}/v1/chat/completions'
                ssl_verify: false
      fixtures:
        - name: azure
          kind: http
          expect:
            - method: POST
              path: {equals: /v1/chat/completions}
              headers:
                Authorization: {equals: Bearer token}
              body:
                json_equals: '{"messages":[{"role":"system","content":"some content"}],"max_tokens":512,"temperature":1,"stream":true,"stream_options":{"include_usage":true}}'
          respond:
            - status: 200
              headers: {Content-Type: text/event-stream}
              chunks:
                - "data: {\"id\":\"azure-1\",\"choices\":[{\"delta\":{\"role\":\"assistant\",\"content\":\"\"},\"index\":0,\"finish_reason\":null}]}\n\n"
                - "data: {\"id\":\"azure-1\",\"choices\":[{\"delta\":{\"content\":\"1\"},\"index\":0,\"finish_reason\":null}]}\n\n"
                - "data: {\"id\":\"azure-1\",\"choices\":[{\"delta\":{\"content\":\" +\"},\"index\":0,\"finish_reason\":null}]}\n\n"
                - "data: {\"id\":\"azure-1\",\"choices\":[{\"delta\":{\"content\":\" 1 = 2.\"},\"index\":0,\"finish_reason\":null}]}\n\n"
                - "data: {\"id\":\"azure-1\",\"choices\":[{\"delta\":{},\"index\":0,\"finish_reason\":\"stop\"}]}\n\n"
                - "data: [DONE]\n\n"
              chunk_delay: 20ms
      steps:
        - name: send-streaming-request
          input:
            method: POST
            path: /anything
            headers: {Content-Type: application/json}
            body: '{"messages":[{"role":"system","content":"some content"}],"stream":true}'
          output:
            status: 200
            headers:
              Content-Type: {matches: '^text/event-stream'}
            body:
              matches: '(?s)data: .*"content":"1".*"content":" \+".*"content":" 1 = 2\.".*data: \[DONE\]'
            chunks:
              - {matches: '^data: .*"role":"assistant".*\n\n$'}
              - {matches: '^data: .*"content":"1".*\n\n$'}
              - {matches: '^data: .*"content":" \+".*\n\n$'}
              - {matches: '^data: .*"content":" 1 = 2\.".*\n\n$'}
              - {matches: '^data: .*"finish_reason":"stop".*\n\n$'}
              - {equals: "data: [DONE]\n\n"}
