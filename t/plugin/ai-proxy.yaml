cases:
    - name: anthropic-converts-simple-text-message
      source: {file: t/plugin/ai-proxy-anthropic.t, tests: [1, 2]}
      config:
        routes:
            - id: ai-proxy-anthropic-simple
              uri: /v1/messages
              plugins:
                ai-proxy-multi:
                  instances:
                    - name: openai-backend
                      provider: openai-compatible
                      weight: 1
                      auth:
                        header:
                          Authorization: Bearer test-token
                      options:
                        model: gpt-4o
                      override:
                        endpoint: '{{FIXTURE.openai.URL}}'
                  ssl_verify: false
      fixtures:
        - name: openai
          kind: http
          expect:
            - method: POST
              path: {equals: /v1/chat/completions}
              headers:
                Authorization: {equals: Bearer test-token}
              body: {json_equals: '{"model":"gpt-4o","max_completion_tokens":1024,"messages":[{"role":"user","content":"Hello"}]}'}
          respond:
            - {status: 200, headers: {Content-Type: application/json}, body: '{"choices":[{"message":{"role":"assistant","content":"1 + 1 = 2.","type":"message"},"type":"message","stop_reason":"end_turn"}]}'}
      steps:
        - name: anthropic-text-request-converts-to-openai
          input:
            method: POST
            path: /v1/messages
            headers: {Content-Type: application/json}
            body: '{"model":"claude-sonnet-4-20250514","max_tokens":1024,"messages":[{"role":"user","content":"Hello"}]}'
          output:
            status: 200
            body: {matches: '(?s)"type":"text".*"stop_reason":"end_turn".*"type":"message"'}

