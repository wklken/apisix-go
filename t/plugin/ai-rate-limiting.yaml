cases:
    - config:
        consumers:
            - plugins:
                key-auth:
                    key: jack1
              username: jack1
            - plugins:
                key-auth:
                    key: jack2
              username: jack2
        routes:
            - id: ai-rate-consumer-isolation
              plugins:
                ai-rate-limiting:
                    limit: 30
                    time_window: 60
                key-auth: {}
              upstream:
                nodes:
                    '{{FIXTURE.primary.ADDR}}': 1
                type: roundrobin
              uri: /ai
      fixtures:
        - count:
            at_least: 3
            at_most: 3
          expect:
            - method: POST
              path:
                equals: /ai
          kind: http
          name: primary
          respond:
            - body: '{"choices":[],"usage":{"prompt_tokens":6,"completion_tokens":4,"total_tokens":10}}'
              headers:
                Content-Type: application/json
              status: 200
      name: route-quota-is-shared-by-authenticated-consumers
      steps:
        - input:
            body: '{"messages":[{"role":"user","content":"hello"}]}'
            headers:
                Content-Type: application/json
                apikey: jack1
            method: POST
            path: /ai
          name: jack1-first
          output:
            status: 200
        - input:
            body: '{"messages":[{"role":"user","content":"hello"}]}'
            headers:
                Content-Type: application/json
                apikey: jack1
            method: POST
            path: /ai
          name: jack1-second
          output:
            status: 200
        - input:
            body: '{"messages":[{"role":"user","content":"hello"}]}'
            headers:
                Content-Type: application/json
                apikey: jack1
            method: POST
            path: /ai
          name: jack1-third
          output:
            status: 200
        - input:
            body: '{"messages":[{"role":"user","content":"hello"}]}'
            headers:
                Content-Type: application/json
                apikey: jack1
            method: POST
            path: /ai
          name: jack1-fourth-is-rejected
          output:
            body:
                matches: Service Unavailable
            status: 503
        - input:
            body: '{"messages":[{"role":"user","content":"hello"}]}'
            headers:
                Content-Type: application/json
                apikey: jack2
            method: POST
            path: /ai
          name: jack2-first-is-rejected-by-shared-route-quota
          output:
            body:
                matches: Service Unavailable
            status: 503
    - config:
        routes:
            - id: expression-anthropic-stream
              plugins:
                ai-proxy:
                    auth:
                        header:
                            anthropic-version: "2023-06-01"
                            x-api-key: test-key
                    options:
                        model: claude-sonnet-4-20250514
                    override:
                        endpoint: '{{FIXTURE.provider.URL}}'
                    provider: anthropic
                    ssl_verify: false
                ai-rate-limiting:
                    cost_expr: input_tokens + cache_creation_input_tokens + output_tokens
                    limit: 500
                    limit_strategy: expression
                    time_window: 60
              upstream:
                nodes:
                    127.0.0.1:1: 1
                type: roundrobin
              uri: /v1/messages
      fixtures:
        - count:
            at_least: 2
            at_most: 2
          expect:
            - body:
                matches: '"stream":true'
              method: POST
          kind: http
          name: provider
          respond:
            - body: |+
                event: message_start
                data: {"message":{"model":"claude-sonnet-4-20250514","usage":{"input_tokens":50,"cache_creation_input_tokens":100,"cache_read_input_tokens":200,"output_tokens":0}}}

                event: message_delta
                data: {"usage":{"output_tokens":30}}

                event: message_stop
                data: {}

              headers:
                Content-Type: text/event-stream
              status: 200
      name: expression-streaming-anthropic-pre-charge-values
      steps:
        - input:
            body: '{"model":"claude-sonnet-4-20250514","max_tokens":1024,"stream":true,"messages":[{"role":"user","content":"Hello"}]}'
            headers:
                Content-Type: application/json
            method: POST
            path: /v1/messages
          name: first-stream-is-forwarded
          output:
            body:
                matches: 'event: message_stop'
            headers:
                X-AI-RateLimit-Remaining-ai-proxy-anthropic:
                    equals: "500"
            status: 200
        - input:
            body: '{"model":"claude-sonnet-4-20250514","max_tokens":1024,"stream":true,"messages":[{"role":"user","content":"Hello"}]}'
            headers:
                Content-Type: application/json
            method: POST
            path: /v1/messages
          name: second-stream-sees-first-charge
          output:
            body:
                matches: 'event: message_stop'
            headers:
                X-AI-RateLimit-Remaining-ai-proxy-anthropic:
                    equals: "320"
            status: 200
    - config:
        routes:
            - id: core-custom-total-tokens
              plugins:
                ai-rate-limiting:
                    limit: 30
                    rejected_code: 403
                    rejected_msg: rate limit exceeded
                    time_window: 60
              upstream:
                nodes:
                    '{{FIXTURE.primary.ADDR}}': 1
                type: roundrobin
              uri: /ai
      fixtures:
        - count:
            at_least: 3
            at_most: 3
          expect:
            - method: POST
              path:
                equals: /ai
          kind: http
          name: primary
          respond:
            - body: '{"choices":[],"usage":{"prompt_tokens":6,"completion_tokens":4,"total_tokens":10}}'
              headers:
                Content-Type: application/json
              status: 200
      name: custom-total-token-code-and-message
      steps:
        - input:
            body: '{"messages":[]}'
            headers:
                Content-Type: application/json
            method: POST
            path: /ai
          name: total-first
          output:
            headers:
                X-AI-RateLimit-Limit-global:
                    equals: "30"
                X-AI-RateLimit-Remaining-global:
                    equals: "30"
                X-AI-RateLimit-Reset-global:
                    equals: "60"
            status: 200
        - input:
            body: '{"messages":[]}'
            headers:
                Content-Type: application/json
            method: POST
            path: /ai
          name: total-second
          output:
            headers:
                X-AI-RateLimit-Remaining-global:
                    equals: "20"
            status: 200
        - input:
            body: '{"messages":[]}'
            headers:
                Content-Type: application/json
            method: POST
            path: /ai
          name: total-third
          output:
            headers:
                X-AI-RateLimit-Remaining-global:
                    equals: "10"
            status: 200
        - input:
            body: '{"messages":[]}'
            headers:
                Content-Type: application/json
            method: POST
            path: /ai
          name: total-fourth-rejected
          output:
            body:
                matches: rate limit exceeded
            headers:
                X-AI-RateLimit-Remaining-global:
                    equals: "0"
            status: 403
    - config:
        routes:
            - id: core-total-independent
              plugins:
                ai-rate-limiting:
                    limit: 30
                    rejected_code: 403
                    rejected_msg: rate limit exceeded
                    time_window: 60
              upstream:
                nodes:
                    '{{FIXTURE.primary.ADDR}}': 1
                type: roundrobin
              uri: /ai
            - id: core-completion-independent
              plugins:
                ai-rate-limiting:
                    limit: 20
                    limit_strategy: completion_tokens
                    time_window: 45
              upstream:
                nodes:
                    '{{FIXTURE.primary.ADDR}}': 1
                type: roundrobin
              uri: /ai2
      fixtures:
        - count:
            at_least: 7
            at_most: 7
          expect:
            - method: POST
              path:
                matches: ^/ai2?$
          kind: http
          name: primary
          respond:
            - body: '{"choices":[],"usage":{"prompt_tokens":5,"completion_tokens":5,"total_tokens":10}}'
              headers:
                Content-Type: application/json
              status: 200
      name: total-and-completion-routes-have-independent-counters
      steps:
        - input:
            method: POST
            path: /ai
          name: total-independent-first
          output:
            status: 200
        - input:
            method: POST
            path: /ai
          name: total-independent-second
          output:
            status: 200
        - input:
            method: POST
            path: /ai
          name: total-independent-third
          output:
            status: 200
        - input:
            method: POST
            path: /ai
          name: total-independent-fourth-rejected
          output:
            status: 403
        - input:
            method: POST
            path: /ai2
          name: completion-independent-first
          output:
            status: 200
        - input:
            method: POST
            path: /ai2
          name: completion-independent-second
          output:
            status: 200
        - input:
            method: POST
            path: /ai2
          name: completion-independent-third
          output:
            status: 200
        - input:
            method: POST
            path: /ai2
          name: completion-independent-fourth
          output:
            status: 200
        - input:
            method: POST
            path: /ai2
          name: completion-independent-fifth-rejected
          output:
            status: 503
    - config:
        routes:
            - id: core-global-fallback
              plugins:
                ai-proxy-multi:
                    fallback_strategy: instance_health_and_rate_limiting
                    instances:
                        - auth:
                            header:
                                Authorization: Bearer token
                          name: openai-gpt4
                          options:
                            model: gpt-4
                          override:
                            endpoint: '{{FIXTURE.gpt4.URL}}'
                          priority: 1
                          provider: openai-compatible
                          weight: 1
                        - auth:
                            header:
                                Authorization: Bearer token
                          name: openai-gpt3
                          options:
                            model: gpt-3
                          override:
                            endpoint: '{{FIXTURE.gpt3.URL}}'
                          priority: 0
                          provider: openai-compatible
                          weight: 1
                    ssl_verify: false
                ai-rate-limiting:
                    limit: 10
                    time_window: 60
              upstream:
                nodes:
                    127.0.0.1:1: 1
                type: roundrobin
              uri: /ai
      fixtures:
        - expect:
            - method: POST
          kind: http
          name: gpt4
          respond:
            - body: '{"model":"gpt-4","choices":[],"usage":{"total_tokens":10}}'
              status: 200
        - expect:
            - method: POST
          kind: http
          name: gpt3
          respond:
            - body: '{"model":"gpt-3","choices":[],"usage":{"total_tokens":10}}'
              status: 200
      name: global-limits-drive-multi-instance-fallback
      steps:
        - input:
            body: '{"messages":[]}'
            headers:
                Content-Type: application/json
            method: POST
            path: /ai
          name: higher-priority-instance-first
          output:
            body:
                matches: gpt-4
            status: 200
        - input:
            body: '{"messages":[]}'
            headers:
                Content-Type: application/json
            method: POST
            path: /ai
          name: rate-limited-instance-falls-back
          output:
            body:
                matches: gpt-3
            status: 200
        - input:
            body: '{"messages":[]}'
            headers:
                Content-Type: application/json
            method: POST
            path: /ai
          name: all-instances-rate-limited
          output:
            status: 503
    - config:
        routes:
            - id: core-rules-custom-prefix
              plugins:
                ai-rate-limiting:
                    rejected_code: 429
                    rules:
                        - count: 20
                          header_prefix: user
                          key: ${http_user}
                          time_window: 10
                        - count: ${http_count ?? 30}
                          header_prefix: project
                          key: ${http_project}
                          time_window: ${http_window ?? 10}
              upstream:
                nodes:
                    '{{FIXTURE.primary.ADDR}}': 1
                type: roundrobin
              uri: /ai
      fixtures:
        - count:
            at_least: 2
            at_most: 2
          expect:
            - method: POST
              path:
                equals: /ai
          kind: http
          name: primary
          respond:
            - body: '{"choices":[],"usage":{"prompt_tokens":6,"completion_tokens":4,"total_tokens":10}}'
              headers:
                Content-Type: application/json
              status: 200
      name: custom-rule-prefix-route-is-available
      steps:
        - input:
            headers:
                user: jack
            method: POST
            path: /ai
          name: custom-user-prefix
          output:
            headers:
                X-AI-User-RateLimit-Limit:
                    equals: "20"
                X-AI-User-RateLimit-Remaining:
                    equals: "20"
                X-AI-User-RateLimit-Reset:
                    equals: "10"
            status: 200
        - input:
            headers:
                project: apisix
            method: POST
            path: /ai
          name: custom-project-prefix
          output:
            headers:
                X-AI-Project-RateLimit-Limit:
                    equals: "30"
                X-AI-Project-RateLimit-Remaining:
                    equals: "30"
                X-AI-Project-RateLimit-Reset:
                    equals: "10"
            status: 200
    - config:
        routes:
            - id: core-dotted-instance
              plugins:
                ai-proxy-multi:
                    fallback_strategy: instance_health_and_rate_limiting
                    instances:
                        - auth:
                            header: {}
                          name: Qwen3.5-397B-10.249.238.157
                          override:
                            endpoint: '{{FIXTURE.provider.URL}}'
                          priority: 1
                          provider: openai-compatible
                          weight: 1
                ai-rate-limiting:
                    instances:
                        - limit: 100
                          name: Qwen3.5-397B-10.249.238.157
                          time_window: 60
              upstream:
                nodes:
                    127.0.0.1:1: 1
                type: roundrobin
              uri: /ai
      fixtures:
        - expect:
            - method: POST
          kind: http
          name: provider
          respond:
            - body: '{"choices":[],"usage":{"total_tokens":10}}'
              status: 200
      name: dotted-instance-name-is-literal
      steps:
        - input:
            body: '{"messages":[]}'
            headers:
                Content-Type: application/json
            method: POST
            path: /ai
          name: dotted-name-request
          output:
            headers:
                X-AI-RateLimit-Limit-Qwen3.5-397B-10.249.238.157:
                    equals: "100"
            status: 200
