sources:
  - repository: https://github.com/apache/apisix
    commit: c3d7d5ec69774121f53d2e20d29d09c816795dd7
    file: t/plugin/ai-rate-limiting-consumer-isolation.t
    tests: 5
  - repository: https://github.com/apache/apisix
    commit: c3d7d5ec69774121f53d2e20d29d09c816795dd7
    file: t/plugin/ai-rate-limiting-expression.t
    tests: 13
  - repository: https://github.com/apache/apisix
    commit: c3d7d5ec69774121f53d2e20d29d09c816795dd7
    file: t/plugin/ai-rate-limiting.t
    tests: 40

cases:
  - name: consumer-quotas-are-isolated
    source: {file: t/plugin/ai-rate-limiting-consumer-isolation.t, tests: [1, 2, 3, 4, 5]}
    config:
      consumers:
        - username: jack1
          plugins:
            key-auth: {key: jack1}
            ai-rate-limiting: {limit: 30, time_window: 60}
        - username: jack2
          plugins:
            key-auth: {key: jack2}
            ai-rate-limiting: {limit: 30, time_window: 60}
      routes:
        - id: ai-rate-consumer-isolation
          uri: /ai
          plugins: {key-auth: {}}
          upstream: &primary_upstream {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
    fixtures:
      - name: primary
        kind: http
        expect:
          - &post_ai {method: POST, path: {equals: /ai}}
        count: {at_least: 6, at_most: 6}
        respond:
          - &ten_tokens {status: 200, headers: {Content-Type: application/json}, body: '{"choices":[],"usage":{"prompt_tokens":6,"completion_tokens":4,"total_tokens":10}}'}
    steps:
      - &jack1_first {name: jack1-first, input: {method: POST, path: /ai, headers: {apikey: jack1, Content-Type: application/json}, body: '{"messages":[{"role":"user","content":"hello"}]}'}, output: {status: 200}}
      - <<: *jack1_first
        name: jack1-second
      - <<: *jack1_first
        name: jack1-third
      - <<: *jack1_first
        name: jack1-fourth-is-rejected
        output: {status: 503, body: {matches: 'Service Unavailable'}}
      - &jack2_first {name: jack2-first, input: {method: POST, path: /ai, headers: {apikey: jack2, Content-Type: application/json}, body: '{"messages":[{"role":"user","content":"hello"}]}'}, output: {status: 200}}
      - <<: *jack2_first
        name: jack2-second
      - <<: *jack2_first
        name: jack2-third
      - <<: *jack2_first
        name: jack2-fourth-is-rejected
        output: {status: 503, body: {matches: 'Service Unavailable'}}

  - name: expression-schema-is-enforced-by-child
    source: {file: t/plugin/ai-rate-limiting-expression.t, tests: [1]}
    variants:
      - name: missing-expression-is-rejected
        config:
          routes:
            - {id: expression-missing, uri: /missing, plugins: {ai-rate-limiting: {limit: 100, time_window: 60, limit_strategy: expression}}, upstream: {type: roundrobin, nodes: {'127.0.0.1:1': 1}}}
        input: {method: POST, path: /missing}
        output: {status: 404, logs: {matches: 'expression-missing.*cost_expr'}}
      - name: empty-expression-is-rejected
        config:
          routes:
            - {id: expression-empty, uri: /empty, plugins: {ai-rate-limiting: {limit: 100, time_window: 60, limit_strategy: expression, cost_expr: ''}}, upstream: {type: roundrobin, nodes: {'127.0.0.1:1': 1}}}
        input: {method: POST, path: /empty}
        output: {status: 404, logs: {matches: 'expression-empty.*cost_expr'}}
      - name: invalid-expression-is-rejected
        config:
          routes:
            - {id: expression-invalid, uri: /invalid, plugins: {ai-rate-limiting: {limit: 100, time_window: 60, limit_strategy: expression, cost_expr: 'invalid $$$ syntax %%%'}}, upstream: {type: roundrobin, nodes: {'127.0.0.1:1': 1}}}
        input: {method: POST, path: /invalid}
        output: {status: 404, logs: {matches: 'expression-invalid.*invalid cost_expr'}}
      - name: simple-expression-is-accepted
        config:
          routes:
            - {id: expression-valid, uri: /valid, plugins: {ai-rate-limiting: {limit: 100, time_window: 60, limit_strategy: expression, cost_expr: 'input_tokens + output_tokens'}}, upstream: {type: roundrobin, nodes: {'{{UPSTREAM_ADDR}}': 1}}}
        input: {method: POST, path: /valid}
        upstream: {expect: {method: POST, path: {equals: /valid}}, respond: *ten_tokens}
        output: {status: 200}
      - name: complex-expression-is-accepted
        config:
          routes:
            - {id: expression-complex, uri: /complex, plugins: {ai-rate-limiting: {limit: 1000, time_window: 60, limit_strategy: expression, cost_expr: '(input_tokens - cache_read_input_tokens) + cache_creation_input_tokens * 1.25 + output_tokens'}}, upstream: {type: roundrobin, nodes: {'{{UPSTREAM_ADDR}}': 1}}}
        input: {method: POST, path: /complex}
        upstream: {expect: {method: POST, path: {equals: /complex}}, respond: *ten_tokens}
        output: {status: 200}

  - name: expression-charges-native-anthropic-usage
    source: {file: t/plugin/ai-rate-limiting-expression.t, tests: [2, 3]}
    config:
      routes:
        - id: expression-anthropic
          uri: /v1/messages
          plugins:
            ai-proxy:
              provider: anthropic
              auth: {header: {x-api-key: test-key, anthropic-version: '2023-06-01'}}
              options: {model: claude-sonnet-4-20250514}
              override: {endpoint: '{{FIXTURE.provider.URL}}'}
              ssl_verify: false
            ai-rate-limiting: {limit: 500, time_window: 60, limit_strategy: expression, cost_expr: 'input_tokens + cache_creation_input_tokens + output_tokens'}
          upstream: {type: roundrobin, nodes: {'127.0.0.1:1': 1}}
    fixtures:
      - &anthropic_provider
        name: provider
        kind: http
        expect:
          - method: POST
            headers: {x-api-key: {equals: test-key}}
            body: {matches: claude-sonnet-4-20250514}
        count: {at_least: 2, at_most: 2}
        respond:
          - &anthropic_usage {status: 200, headers: {Content-Type: application/json}, body: '{"id":"msg_1","type":"message","role":"assistant","model":"claude-sonnet-4-20250514","content":[],"usage":{"input_tokens":50,"cache_creation_input_tokens":100,"cache_read_input_tokens":200,"output_tokens":30}}'}
    steps:
      - &anthropic_input
        name: first-anthropic-response
        input: {method: POST, path: /v1/messages, headers: {Content-Type: application/json}, body: '{"model":"claude-sonnet-4-20250514","max_tokens":1024,"messages":[{"role":"user","content":"Hello"}]}'}
        output:
          status: 200
          headers: {X-AI-RateLimit-Remaining-ai-proxy-anthropic: {equals: '320'}}
      - <<: *anthropic_input
        name: second-anthropic-response
        output:
          status: 200
          headers: {X-AI-RateLimit-Remaining-ai-proxy-anthropic: {equals: '140'}}

  - name: expression-charges-streaming-anthropic-usage
    source: {file: t/plugin/ai-rate-limiting-expression.t, tests: [4, 5]}
    config:
      routes:
        - id: expression-anthropic-stream
          uri: /v1/messages
          plugins:
            ai-proxy:
              provider: anthropic
              auth: {header: {x-api-key: test-key, anthropic-version: '2023-06-01'}}
              options: {model: claude-sonnet-4-20250514}
              override: {endpoint: '{{FIXTURE.provider.URL}}'}
              ssl_verify: false
            ai-rate-limiting: {limit: 500, time_window: 60, limit_strategy: expression, cost_expr: 'input_tokens + cache_creation_input_tokens + output_tokens'}
          upstream: {type: roundrobin, nodes: {'127.0.0.1:1': 1}}
    fixtures:
      - name: provider
        kind: http
        expect:
          - method: POST
            body: {matches: '"stream":true'}
        count: {at_least: 2, at_most: 2}
        respond:
          - status: 200
            headers: {Content-Type: text/event-stream}
            body: "event: message_start\ndata: {\"message\":{\"model\":\"claude-sonnet-4-20250514\",\"usage\":{\"input_tokens\":50,\"cache_creation_input_tokens\":100,\"cache_read_input_tokens\":200,\"output_tokens\":0}}}\n\nevent: message_delta\ndata: {\"usage\":{\"output_tokens\":30}}\n\nevent: message_stop\ndata: {}\n\n"
    steps:
      - &anthropic_stream_input
        name: first-stream-is-forwarded
        input: {method: POST, path: /v1/messages, headers: {Content-Type: application/json}, body: '{"model":"claude-sonnet-4-20250514","max_tokens":1024,"stream":true,"messages":[{"role":"user","content":"Hello"}]}'}
        output: {status: 200, body: {matches: 'event: message_stop'}}
      - <<: *anthropic_stream_input
        name: second-stream-sees-first-charge
        output:
          status: 200
          headers: {X-AI-RateLimit-Remaining-ai-proxy-anthropic: {equals: '320'}}
          body: {matches: 'event: message_stop'}

  - name: cache-aware-expression-rejects-after-first-charge
    source: {file: t/plugin/ai-rate-limiting-expression.t, tests: [6, 7]}
    config:
      routes:
        - id: expression-cache-aware
          uri: /v1/messages
          plugins: {ai-rate-limiting: {limit: 100, time_window: 60, limit_strategy: expression, cost_expr: 'input_tokens + cache_creation_input_tokens'}}
          upstream: *primary_upstream
    fixtures:
      - name: primary
        kind: http
        expect: [{method: POST, path: {equals: /v1/messages}}]
        count: {at_least: 1, at_most: 1}
        respond: [*anthropic_usage]
    steps:
      - {name: over-limit-cost-is-recorded, input: {method: POST, path: /v1/messages}, output: {status: 200, headers: {X-AI-RateLimit-Remaining-global: {equals: '0'}}}}
      - {name: following-request-is-rejected, input: {method: POST, path: /v1/messages}, output: {status: 503}}

  - name: weighted-expression-is-evaluated
    source: {file: t/plugin/ai-rate-limiting-expression.t, tests: [8, 9]}
    config:
      routes:
        - id: expression-weighted
          uri: /v1/messages
          plugins: {ai-rate-limiting: {limit: 1000, time_window: 60, limit_strategy: expression, cost_expr: 'input_tokens + cache_read_input_tokens * 0.1 + cache_creation_input_tokens * 1.25 + output_tokens'}}
          upstream: *primary_upstream
    fixtures:
      - name: primary
        kind: http
        expect: [{method: POST, path: {equals: /v1/messages}}]
        count: {at_least: 2, at_most: 2}
        respond: [*anthropic_usage]
    steps:
      - &weighted_first {name: first-weighted-charge, input: {method: POST, path: /v1/messages}, output: {status: 200, headers: {X-AI-RateLimit-Remaining-global: {equals: '775'}}}}
      - <<: *weighted_first
        name: second-weighted-charge
        output: {status: 200, headers: {X-AI-RateLimit-Remaining-global: {equals: '550'}}}

  - name: missing-expression-variables-default-to-zero
    source: {file: t/plugin/ai-rate-limiting-expression.t, tests: [10, 11]}
    config:
      routes:
        - id: expression-missing-variable
          uri: /v1/messages
          plugins: {ai-rate-limiting: {limit: 500, time_window: 60, limit_strategy: expression, cost_expr: 'input_tokens + nonexistent_field + output_tokens'}}
          upstream: *primary_upstream
    fixtures:
      - name: primary
        kind: http
        expect: [{method: POST, path: {equals: /v1/messages}}]
        count: {at_least: 2, at_most: 2}
        respond: [*anthropic_usage]
    steps:
      - &missing_first {name: first-missing-variable-charge, input: {method: POST, path: /v1/messages}, output: {status: 200, headers: {X-AI-RateLimit-Remaining-global: {equals: '420'}}}}
      - <<: *missing_first
        name: second-missing-variable-charge
        output: {status: 200, headers: {X-AI-RateLimit-Remaining-global: {equals: '340'}}}

  - name: negative-expression-cost-is-clamped-to-zero
    source: {file: t/plugin/ai-rate-limiting-expression.t, tests: [12, 13]}
    config:
      routes:
        - id: expression-negative
          uri: /v1/messages
          plugins: {ai-rate-limiting: {limit: 100, time_window: 60, limit_strategy: expression, cost_expr: 'input_tokens - cache_read_input_tokens'}}
          upstream: *primary_upstream
    fixtures:
      - name: primary
        kind: http
        expect: [{method: POST, path: {equals: /v1/messages}}]
        count: {at_least: 2, at_most: 2}
        respond: [*anthropic_usage]
    steps:
      - &negative_first {name: first-negative-cost, input: {method: POST, path: /v1/messages}, output: {status: 200, headers: {X-AI-RateLimit-Remaining-global: {equals: '100'}}}}
      - <<: *negative_first
        name: second-negative-cost

  - name: core-schema-validates-quota-shapes
    source: {file: t/plugin/ai-rate-limiting.t, tests: [1]}
    variants:
      - name: missing-limit
        config: {routes: [{id: core-missing-limit, uri: /missing-limit, plugins: {ai-rate-limiting: {time_window: 60}}, upstream: {type: roundrobin, nodes: {'127.0.0.1:1': 1}}}]}
        input: {path: /missing-limit}
        output: {status: 404, logs: {matches: 'core-missing-limit.*limit'}}
      - name: missing-window
        config: {routes: [{id: core-missing-window, uri: /missing-window, plugins: {ai-rate-limiting: {limit: 30}}, upstream: {type: roundrobin, nodes: {'127.0.0.1:1': 1}}}]}
        input: {path: /missing-window}
        output: {status: 404, logs: {matches: 'core-missing-window.*time_window'}}
      - name: rejected-code-minimum
        config: {routes: [{id: core-invalid-status, uri: /invalid-status, plugins: {ai-rate-limiting: {limit: 30, time_window: 60, rejected_code: 199}}, upstream: {type: roundrobin, nodes: {'127.0.0.1:1': 1}}}]}
        input: {path: /invalid-status}
        output: {status: 404, logs: {matches: 'core-invalid-status.*rejected_code'}}
      - name: strategy-enum
        config: {routes: [{id: core-invalid-strategy, uri: /invalid-strategy, plugins: {ai-rate-limiting: {limit: 30, time_window: 60, limit_strategy: invalid}}, upstream: {type: roundrobin, nodes: {'127.0.0.1:1': 1}}}]}
        input: {path: /invalid-strategy}
        output: {status: 404, logs: {matches: 'core-invalid-strategy.*limit_strategy'}}
      - name: instance-name-required
        config: {routes: [{id: core-invalid-instance, uri: /invalid-instance, plugins: {ai-rate-limiting: {instances: [{name: instance1, limit: 30, time_window: 60}, {limit: 30, time_window: 60}]}}, upstream: {type: roundrobin, nodes: {'127.0.0.1:1': 1}}}]}
        input: {path: /invalid-instance}
        output: {status: 404, logs: {matches: 'core-invalid-instance.*name'}}
      - name: global-limit-required-with-window-and-instances
        config: {routes: [{id: core-instance-missing-limit, uri: /instance-missing-limit, plugins: {ai-rate-limiting: {time_window: 60, instances: [{name: instance1, limit: 30, time_window: 60}]}}, upstream: {type: roundrobin, nodes: {'127.0.0.1:1': 1}}}]}
        input: {path: /instance-missing-limit}
        output: {status: 404, logs: {matches: 'core-instance-missing-limit.*limit'}}
      - name: global-window-required-with-limit-and-instances
        config: {routes: [{id: core-instance-missing-window, uri: /instance-missing-window, plugins: {ai-rate-limiting: {limit: 30, instances: [{name: instance1, limit: 30, time_window: 60}]}}, upstream: {type: roundrobin, nodes: {'127.0.0.1:1': 1}}}]}
        input: {path: /instance-missing-window}
        output: {status: 404, logs: {matches: 'core-instance-missing-window.*time_window'}}
      - name: instances-only-is-valid
        config: {routes: [{id: core-instance-valid, uri: /instance-valid, plugins: {ai-rate-limiting: {instances: [{name: instance1, limit: 30, time_window: 60}]}}, upstream: {type: roundrobin, nodes: {'{{UPSTREAM_ADDR}}': 1}}}]}
        input: {method: POST, path: /instance-valid}
        upstream: {expect: {method: POST, path: {equals: /instance-valid}}, respond: *ten_tokens}
        output: {status: 200}
      - name: global-only-is-valid
        config: {routes: [{id: core-global-valid, uri: /global-valid, plugins: {ai-rate-limiting: {limit: 30, time_window: 60, rejected_code: 403, rejected_msg: rate-limit, limit_strategy: completion_tokens}}, upstream: {type: roundrobin, nodes: {'{{UPSTREAM_ADDR}}': 1}}}]}
        input: {method: POST, path: /global-valid}
        upstream: {expect: {method: POST, path: {equals: /global-valid}}, respond: *ten_tokens}
        output: {status: 200}
      - name: global-and-instances-is-valid
        config: {routes: [{id: core-global-instance-valid, uri: /global-instance-valid, plugins: {ai-rate-limiting: {limit: 30, time_window: 60, instances: [{name: instance1, limit: 30, time_window: 60}]}}, upstream: {type: roundrobin, nodes: {'{{UPSTREAM_ADDR}}': 1}}}]}
        input: {method: POST, path: /global-instance-valid}
        upstream: {expect: {method: POST, path: {equals: /global-instance-valid}}, respond: *ten_tokens}
        output: {status: 200}

  - name: total-token-limit-rejection-message-and-headers
    source: {file: t/plugin/ai-rate-limiting.t, tests: [2, 3, 4, 5, 6, 7]}
    config:
      routes:
        - id: core-total-tokens
          uri: /ai
          plugins: {ai-rate-limiting: {limit: 30, time_window: 60, rejected_code: 403, rejected_msg: rate limit exceeded}}
          upstream: *primary_upstream
    fixtures:
      - name: primary
        kind: http
        expect: [*post_ai]
        count: {at_least: 3, at_most: 3}
        respond: [*ten_tokens]
    steps:
      - &total_first
        name: total-first
        input: {method: POST, path: /ai, headers: {Content-Type: application/json}, body: '{"messages":[]}'}
        output: {status: 200, headers: {X-AI-RateLimit-Limit-global: {equals: '30'}, X-AI-RateLimit-Remaining-global: {equals: '20'}, X-AI-RateLimit-Reset-global: {matches: '^[0-9]+$'}}}
      - <<: *total_first
        name: total-second
        output: {status: 200, headers: {X-AI-RateLimit-Remaining-global: {equals: '10'}}}
      - <<: *total_first
        name: total-third
        output: {status: 200, headers: {X-AI-RateLimit-Remaining-global: {equals: '0'}}}
      - <<: *total_first
        name: total-fourth-rejected
        output: {status: 403, body: {matches: 'rate limit exceeded'}, headers: {X-AI-RateLimit-Remaining-global: {equals: '0'}}}

  - name: completion-token-strategy-is-independent
    source: {file: t/plugin/ai-rate-limiting.t, tests: [8, 9, 10, 11, 12]}
    config:
      routes:
        - {id: core-total-independent, uri: /ai, plugins: {ai-rate-limiting: {limit: 30, time_window: 60}}, upstream: *primary_upstream}
        - {id: core-completion, uri: /ai2, plugins: {ai-rate-limiting: {limit: 20, time_window: 45, limit_strategy: completion_tokens}}, upstream: *primary_upstream}
    fixtures:
      - name: primary
        kind: http
        expect: [{method: POST, path: {matches: '^/ai2?$'}}]
        count: {at_least: 6, at_most: 6}
        respond: [*ten_tokens]
    steps:
      - &completion_request {name: completion-first, input: {method: POST, path: /ai2}, output: {status: 200, headers: {X-AI-RateLimit-Limit-global: {equals: '20'}, X-AI-RateLimit-Remaining-global: {equals: '16'}}}}
      - <<: *completion_request
        name: completion-second
        output: {status: 200, headers: {X-AI-RateLimit-Remaining-global: {equals: '12'}}}
      - <<: *completion_request
        name: completion-third
        output: {status: 200, headers: {X-AI-RateLimit-Remaining-global: {equals: '8'}}}
      - <<: *completion_request
        name: completion-fourth
        output: {status: 200, headers: {X-AI-RateLimit-Remaining-global: {equals: '4'}}}
      - <<: *completion_request
        name: completion-fifth
        output: {status: 200, headers: {X-AI-RateLimit-Remaining-global: {equals: '0'}}}
      - <<: *completion_request
        name: completion-sixth-rejected
        output: {status: 503}
      - {name: other-route-has-independent-counter, input: {method: POST, path: /ai}, output: {status: 200, headers: {X-AI-RateLimit-Remaining-global: {equals: '20'}}}}

  - name: global-limits-drive-multi-instance-fallback
    source: {file: t/plugin/ai-rate-limiting.t, tests: [13, 14]}
    config:
      routes:
        - id: core-global-fallback
          uri: /ai
          plugins:
            ai-proxy-multi:
              fallback_strategy: instance_health_and_rate_limiting
              instances:
                - {name: openai-gpt4, provider: openai-compatible, weight: 1, priority: 1, auth: {header: {Authorization: Bearer token}}, options: {model: gpt-4}, override: {endpoint: '{{FIXTURE.gpt4.URL}}'}}
                - {name: openai-gpt3, provider: openai-compatible, weight: 1, priority: 0, auth: {header: {Authorization: Bearer token}}, options: {model: gpt-3}, override: {endpoint: '{{FIXTURE.gpt3.URL}}'}}
              ssl_verify: false
            ai-rate-limiting: {limit: 10, time_window: 60}
          upstream: &terminal_upstream {type: roundrobin, nodes: {'127.0.0.1:1': 1}}
    fixtures:
      - {name: gpt4, kind: http, expect: [{method: POST}], respond: [{status: 200, body: '{"model":"gpt-4","choices":[],"usage":{"total_tokens":10}}'}]}
      - {name: gpt3, kind: http, expect: [{method: POST}], respond: [{status: 200, body: '{"model":"gpt-3","choices":[],"usage":{"total_tokens":10}}'}]}
    steps:
      - &multi_input {name: higher-priority-instance-first, input: {method: POST, path: /ai, headers: {Content-Type: application/json}, body: '{"messages":[]}'}, output: {status: 200, body: {matches: 'gpt-4'}}}
      - <<: *multi_input
        name: rate-limited-instance-falls-back
        output: {status: 200, body: {matches: 'gpt-3'}}
      - <<: *multi_input
        name: all-instances-rate-limited
        output: {status: 503}

  - name: only-configured-instance-is-limited
    source: {file: t/plugin/ai-rate-limiting.t, tests: [15, 16]}
    config:
      routes:
        - id: core-selective-instance
          uri: /ai
          plugins:
            ai-proxy-multi:
              fallback_strategy: instance_health_and_rate_limiting
              instances:
                - {name: openai-gpt4, provider: openai-compatible, weight: 1, priority: 1, auth: {header: {Authorization: Bearer token}}, override: {endpoint: '{{FIXTURE.gpt4.URL}}'}}
                - {name: openai-gpt3, provider: openai-compatible, weight: 1, priority: 0, auth: {header: {Authorization: Bearer token}}, override: {endpoint: '{{FIXTURE.gpt3.URL}}'}}
            ai-rate-limiting: {instances: [{name: openai-gpt4, limit: 20, time_window: 60}]}
          upstream: *terminal_upstream
    fixtures:
      - {name: gpt4, kind: http, expect: [{method: POST}], count: {at_least: 2, at_most: 2}, respond: [{status: 200, body: '{"model":"gpt-4","choices":[],"usage":{"total_tokens":10}}'}]}
      - {name: gpt3, kind: http, expect: [{method: POST}], count: {at_least: 8, at_most: 8}, respond: [{status: 200, body: '{"model":"gpt-3","choices":[],"usage":{"total_tokens":10}}'}]}
    steps:
      - {name: weighted-traffic-moves-after-limited-instance, repeat: 10, input: {method: POST, path: /ai, headers: {Content-Type: application/json}, body: '{"messages":[]}'}, output: {status: 200}}

  - name: each-instance-has-a-distinct-limit
    source: {file: t/plugin/ai-rate-limiting.t, tests: [17, 18]}
    config:
      routes:
        - id: core-distinct-instances
          uri: /ai
          plugins:
            ai-proxy-multi:
              fallback_strategy: instance_health_and_rate_limiting
              instances:
                - {name: openai-gpt4, provider: openai-compatible, weight: 1, priority: 1, auth: {header: {}}, override: {endpoint: '{{FIXTURE.gpt4.URL}}'}}
                - {name: openai-gpt3, provider: openai-compatible, weight: 1, priority: 0, auth: {header: {}}, override: {endpoint: '{{FIXTURE.gpt3.URL}}'}}
            ai-rate-limiting:
              instances:
                - {name: openai-gpt4, limit: 20, time_window: 60}
                - {name: openai-gpt3, limit: 50, time_window: 60}
          upstream: *terminal_upstream
    fixtures:
      - {name: gpt4, kind: http, expect: [{method: POST}], count: {at_least: 2, at_most: 2}, respond: [{status: 200, body: '{"model":"gpt-4","choices":[],"usage":{"total_tokens":10}}'}]}
      - {name: gpt3, kind: http, expect: [{method: POST}], count: {at_least: 5, at_most: 5}, respond: [{status: 200, body: '{"model":"gpt-3","choices":[],"usage":{"total_tokens":10}}'}]}
    steps:
      - {name: both-instance-budgets-are-exhausted, repeat: 7, input: {method: POST, path: /ai, headers: {Content-Type: application/json}, body: '{"messages":[]}'}, output: {status: 200}}
      - {name: exhausted-instances-reject, input: {method: POST, path: /ai, headers: {Content-Type: application/json}, body: '{"messages":[]}'}, output: {status: 503}}

  - name: instance-override-falls-back-to-global-limit
    source: {file: t/plugin/ai-rate-limiting.t, tests: [19, 20]}
    config:
      routes:
        - id: core-global-with-instance-override
          uri: /ai
          plugins:
            ai-proxy-multi:
              fallback_strategy: instance_health_and_rate_limiting
              instances:
                - {name: openai-gpt4, provider: openai-compatible, weight: 1, priority: 1, auth: {header: {}}, override: {endpoint: '{{FIXTURE.gpt4.URL}}'}}
                - {name: openai-gpt3, provider: openai-compatible, weight: 1, priority: 0, auth: {header: {}}, override: {endpoint: '{{FIXTURE.gpt3.URL}}'}}
            ai-rate-limiting:
              limit: 20
              time_window: 60
              instances:
                - {name: openai-gpt3, limit: 50, time_window: 60}
          upstream: *terminal_upstream
    fixtures:
      - {name: gpt4, kind: http, expect: [{method: POST}], count: {at_least: 2, at_most: 2}, respond: [{status: 200, body: '{"model":"gpt-4","choices":[],"usage":{"total_tokens":10}}'}]}
      - {name: gpt3, kind: http, expect: [{method: POST}], count: {at_least: 5, at_most: 5}, respond: [{status: 200, body: '{"model":"gpt-3","choices":[],"usage":{"total_tokens":10}}'}]}
    steps:
      - {name: global-and-override-budgets-are-used, repeat: 7, input: {method: POST, path: /ai, headers: {Content-Type: application/json}, body: '{"messages":[]}'}, output: {status: 200}}
      - {name: eighth-request-is-rejected, input: {method: POST, path: /ai, headers: {Content-Type: application/json}, body: '{"messages":[]}'}, output: {status: 503}}
      - {name: ninth-request-remains-rejected, input: {method: POST, path: /ai, headers: {Content-Type: application/json}, body: '{"messages":[]}'}, output: {status: 503}}

  - name: request-variables-control-instance-quotas
    source: {file: t/plugin/ai-rate-limiting.t, tests: [21, 22, 23]}
    config:
      routes:
        - id: core-variable-instance
          uri: /ai
          plugins:
            ai-proxy-multi:
              fallback_strategy: instance_health_and_rate_limiting
              instances:
                - {name: deepseek, provider: openai-compatible, weight: 1, priority: 1, auth: {header: {}}, override: {endpoint: '{{FIXTURE.provider.URL}}'}}
                - {name: openai, provider: openai-compatible, weight: 1, priority: 0, auth: {header: {}}, override: {endpoint: '{{FIXTURE.provider.URL}}'}}
            ai-rate-limiting:
              limit: '${http_count ?? 10}'
              time_window: '${http_time_window ?? 60}'
              instances:
                - {name: openai, limit: '${http_openai_count ?? 20}', time_window: '${http_time_window ?? 60}'}
          upstream: *terminal_upstream
        - id: core-variable-instance-custom
          uri: /ai-custom
          plugins:
            ai-proxy-multi:
              fallback_strategy: instance_health_and_rate_limiting
              instances:
                - {name: deepseek, provider: openai-compatible, weight: 1, priority: 1, auth: {header: {}}, override: {endpoint: '{{FIXTURE.provider.URL}}'}}
                - {name: openai, provider: openai-compatible, weight: 1, priority: 0, auth: {header: {}}, override: {endpoint: '{{FIXTURE.provider.URL}}'}}
            ai-rate-limiting:
              limit: '${http_count ?? 10}'
              time_window: '${http_time_window ?? 60}'
              instances:
                - {name: openai, limit: '${http_openai_count ?? 20}', time_window: '${http_time_window ?? 60}'}
          upstream: *terminal_upstream
    fixtures:
      - {name: provider, kind: http, expect: [{method: POST}], count: {at_least: 8, at_most: 8}, respond: [{status: 200, body: '{"choices":[],"usage":{"total_tokens":10}}'}]}
    steps:
      - &variable_default {name: default-limit-first, input: {method: POST, path: /ai, headers: {Content-Type: application/json}, body: '{"messages":[]}'}, output: {status: 200, headers: {X-AI-RateLimit-Limit-deepseek: {equals: '10'}}}}
      - <<: *variable_default
        name: default-limit-second
        output: {status: 200, headers: {X-AI-RateLimit-Limit-openai: {equals: '20'}}}
      - <<: *variable_default
        name: default-limit-third
        output: {status: 200, headers: {X-AI-RateLimit-Remaining-openai: {equals: '0'}}}
      - <<: *variable_default
        name: default-limit-fourth-rejected
        output: {status: 503}
      - &variable_custom {name: custom-limit-first, input: {method: POST, path: /ai-custom, headers: {Content-Type: application/json, count: '20', openai-count: '30', time-window: '10'}, body: '{"messages":[]}'}, output: {status: 200, headers: {X-AI-RateLimit-Limit-deepseek: {equals: '20'}}}}
      - <<: *variable_custom
        name: custom-limit-second
      - <<: *variable_custom
        name: custom-limit-third
        output: {status: 200, headers: {X-AI-RateLimit-Limit-openai: {equals: '30'}}}
      - <<: *variable_custom
        name: custom-limit-fourth
        output: {status: 200, headers: {X-AI-RateLimit-Remaining-openai: {equals: '10'}}}
      - <<: *variable_custom
        name: custom-limit-fifth
        output: {status: 200, headers: {X-AI-RateLimit-Remaining-openai: {equals: '0'}}}
      - <<: *variable_custom
        name: custom-limit-sixth-rejected
        output: {status: 503}

  - name: instances-and-rules-are-mutually-exclusive
    source: {file: t/plugin/ai-rate-limiting.t, tests: [24]}
    config:
      routes:
        - id: core-conflicting-modes
          uri: /ai
          plugins:
            ai-rate-limiting:
              instances: [{name: openai, limit: 20, time_window: 60}]
              rules: [{count: 1, time_window: 10, key: '${http_company}'}]
          upstream: *terminal_upstream
    input: {path: /ai}
    output: {status: 404, logs: {matches: 'core-conflicting-modes.*rules cannot be configured'}}

  - name: rule-keys-variables-counters-and-headers
    source: {file: t/plugin/ai-rate-limiting.t, tests: [25, 26, 27, 28, 29, 30, 31, 32]}
    config:
      routes:
        - id: core-rules
          uri: /ai
          plugins:
            ai-rate-limiting:
              rejected_code: 429
              rules:
                - {count: 20, time_window: 10, key: '${http_user}', header_prefix: user}
                - {count: '${http_count ?? 30}', time_window: '${http_window ?? 10}', key: '${http_project}', header_prefix: project}
          upstream: *primary_upstream
    fixtures:
      - name: primary
        kind: http
        expect: [*post_ai]
        count: {at_least: 9, at_most: 9}
        respond: [*ten_tokens]
    steps:
      - &user_jack {name: user-jack-first, input: {method: POST, path: /ai, headers: {user: jack}}, output: {status: 200, headers: {X-AI-User-RateLimit-Limit: {equals: '20'}, X-AI-User-RateLimit-Remaining: {equals: '10'}, X-AI-User-RateLimit-Reset: {matches: '^[0-9]+$'}}}}
      - <<: *user_jack
        name: user-jack-second
        output: {status: 200, headers: {X-AI-User-RateLimit-Remaining: {equals: '0'}}}
      - <<: *user_jack
        name: user-jack-third-rejected
        output: {status: 429}
      - &user_rose {name: user-rose-first, input: {method: POST, path: /ai, headers: {user: rose}}, output: {status: 200}}
      - <<: *user_rose
        name: user-rose-second
      - <<: *user_rose
        name: user-rose-third-rejected
        output: {status: 429}
      - &project_default {name: project-default-first, input: {method: POST, path: /ai, headers: {project: apisix}}, output: {status: 200, headers: {X-AI-Project-RateLimit-Limit: {equals: '30'}, X-AI-Project-RateLimit-Remaining: {equals: '20'}}}}
      - <<: *project_default
        name: project-default-second
        output: {status: 200, headers: {X-AI-Project-RateLimit-Remaining: {equals: '10'}}}
      - <<: *project_default
        name: project-default-third
        output: {status: 200, headers: {X-AI-Project-RateLimit-Remaining: {equals: '0'}}}
      - <<: *project_default
        name: project-default-fourth-rejected
        output: {status: 429}
      - &project_custom {name: project-custom-first, input: {method: POST, path: /ai, headers: {project: linux, count: '20', window: '2'}}, output: {status: 200, headers: {X-AI-Project-RateLimit-Limit: {equals: '20'}}}}
      - <<: *project_custom
        name: project-custom-second
      - <<: *project_custom
        name: project-custom-third-rejected
        output: {status: 429}
      - {name: no-rule-key-is-an-error, input: {method: POST, path: /ai}, output: {status: 500, body: {matches: 'failed to get rate limit rules'}}}

