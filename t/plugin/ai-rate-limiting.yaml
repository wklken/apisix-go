  - name: redis-policy-shares-and-persists-counter
    source: {file: t/plugin/ai-rate-limiting.t, tests: [36, 37, 38]}
    config:
      routes:
        - id: core-redis-counter
          uri: /ai
          plugins:
            ai-rate-limiting:
              limit: 30
              time_window: 60
              policy: redis
              redis_host: '{{FIXTURE.redis.HOST}}'
              redis_port: '{{FIXTURE.redis.PORT}}'
              redis_database: 1
          upstream: *primary_upstream
    fixtures:
      - name: primary
        kind: http
        expect: [*post_ai]
        count: {at_least: 3, at_most: 3}
        respond: [*ten_tokens]
      - name: redis
        kind: redis
        redis:
          ignore_negotiation: true
          allow_unasserted_commands: true
          values: {'apisix-go:ai-rate-limiting:global': '30'}
    steps:
      - &redis_request {name: redis-first, input: {method: POST, path: /ai}, output: {status: 200}}
      - <<: *redis_request
        name: redis-second
      - <<: *redis_request
        name: redis-third
      - <<: *redis_request
        name: redis-fourth-is-rejected
        output: {status: 503}

