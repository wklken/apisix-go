sources:
  - repository: https://github.com/apache/apisix
    commit: c3d7d5ec69774121f53d2e20d29d09c816795dd7
    file: t/plugin/ai-rate-limiting-consumer-isolation.t
    tests: 5
  - repository: https://github.com/apache/apisix
    commit: c3d7d5ec69774121f53d2e20d29d09c816795dd7
    file: t/plugin/ai-rate-limiting-expression.t
    tests: 13
  - repository: https://github.com/apache/apisix
    commit: c3d7d5ec69774121f53d2e20d29d09c816795dd7
    file: t/plugin/ai-rate-limiting.t
    tests: 40

cases:
  - &consumer_isolation_case
    name: consumer-route-resource-is-available
    source: {file: t/plugin/ai-rate-limiting-consumer-isolation.t, tests: [1]}
    config:
      consumers:
        - username: jack1
          plugins:
            key-auth: {key: jack1}
            ai-rate-limiting: {limit: 30, time_window: 60}
        - username: jack2
          plugins:
            key-auth: {key: jack2}
            ai-rate-limiting: {limit: 30, time_window: 60}
      routes:
        - id: ai-rate-consumer-isolation
          uri: /ai
          plugins: {key-auth: {}}
          upstream: &primary_upstream {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
    fixtures:
      - name: primary
        kind: http
        expect:
          - &post_ai {method: POST, path: {equals: /ai}}
        count: {at_least: 6, at_most: 6}
        respond:
          - &ten_tokens {status: 200, headers: {Content-Type: application/json}, body: '{"choices":[],"usage":{"prompt_tokens":6,"completion_tokens":4,"total_tokens":10}}'}
    steps:
      - &jack1_first {name: jack1-first, input: {method: POST, path: /ai, headers: {apikey: jack1, Content-Type: application/json}, body: '{"messages":[{"role":"user","content":"hello"}]}'}, output: {status: 200}}
      - <<: *jack1_first
        name: jack1-second
      - <<: *jack1_first
        name: jack1-third
      - <<: *jack1_first
        name: jack1-fourth-is-rejected
        output: {status: 503, body: {matches: 'Service Unavailable'}}
      - &jack2_first {name: jack2-first, input: {method: POST, path: /ai, headers: {apikey: jack2, Content-Type: application/json}, body: '{"messages":[{"role":"user","content":"hello"}]}'}, output: {status: 200}}
      - <<: *jack2_first
        name: jack2-second
      - <<: *jack2_first
        name: jack2-third
      - <<: *jack2_first
        name: jack2-fourth-is-rejected
        output: {status: 503, body: {matches: 'Service Unavailable'}}

  - <<: *consumer_isolation_case
    name: consumer-jack1-resource-is-available
    source: {file: t/plugin/ai-rate-limiting-consumer-isolation.t, tests: [2]}

  - <<: *consumer_isolation_case
    name: consumer-jack2-resource-is-available
    source: {file: t/plugin/ai-rate-limiting-consumer-isolation.t, tests: [3]}

  - <<: *consumer_isolation_case
    name: consumer-jack1-quota-is-isolated
    source: {file: t/plugin/ai-rate-limiting-consumer-isolation.t, tests: [4]}

  - <<: *consumer_isolation_case
    name: consumer-jack2-quota-is-isolated
    source: {file: t/plugin/ai-rate-limiting-consumer-isolation.t, tests: [5]}

  - name: expression-schema-is-enforced-by-child
    source: {file: t/plugin/ai-rate-limiting-expression.t, tests: [1]}
    variants:
      - name: missing-expression-is-rejected
        config:
          routes:
            - {id: expression-missing, uri: /missing, plugins: {ai-rate-limiting: {limit: 100, time_window: 60, limit_strategy: expression}}, upstream: {type: roundrobin, nodes: {'127.0.0.1:1': 1}}}
        input: {method: POST, path: /missing}
        output: {status: 404, logs: {matches: 'expression-missing.*cost_expr'}}
      - name: empty-expression-is-rejected
        config:
          routes:
            - {id: expression-empty, uri: /empty, plugins: {ai-rate-limiting: {limit: 100, time_window: 60, limit_strategy: expression, cost_expr: ''}}, upstream: {type: roundrobin, nodes: {'127.0.0.1:1': 1}}}
        input: {method: POST, path: /empty}
        output: {status: 404, logs: {matches: 'expression-empty.*cost_expr'}}
      - name: invalid-expression-is-rejected
        config:
          routes:
            - {id: expression-invalid, uri: /invalid, plugins: {ai-rate-limiting: {limit: 100, time_window: 60, limit_strategy: expression, cost_expr: 'invalid $$$ syntax %%%'}}, upstream: {type: roundrobin, nodes: {'127.0.0.1:1': 1}}}
        input: {method: POST, path: /invalid}
        output: {status: 404, logs: {matches: 'expression-invalid.*invalid cost_expr'}}
      - name: simple-expression-is-accepted
        config:
          routes:
            - {id: expression-valid, uri: /valid, plugins: {ai-rate-limiting: {limit: 100, time_window: 60, limit_strategy: expression, cost_expr: 'input_tokens + output_tokens'}}, upstream: {type: roundrobin, nodes: {'{{UPSTREAM_ADDR}}': 1}}}
        input: {method: POST, path: /valid}
        upstream: {expect: {method: POST, path: {equals: /valid}}, respond: *ten_tokens}
        output: {status: 200}
      - name: complex-expression-is-accepted
        config:
          routes:
            - {id: expression-complex, uri: /complex, plugins: {ai-rate-limiting: {limit: 1000, time_window: 60, limit_strategy: expression, cost_expr: '(input_tokens - cache_read_input_tokens) + cache_creation_input_tokens * 1.25 + output_tokens'}}, upstream: {type: roundrobin, nodes: {'{{UPSTREAM_ADDR}}': 1}}}
        input: {method: POST, path: /complex}
        upstream: {expect: {method: POST, path: {equals: /complex}}, respond: *ten_tokens}
        output: {status: 200}

  - &expression_native_case
    name: expression-native-anthropic-route-is-available
    source: {file: t/plugin/ai-rate-limiting-expression.t, tests: [2]}
    config:
      routes:
        - id: expression-anthropic
          uri: /v1/messages
          plugins:
            ai-proxy:
              provider: anthropic
              auth: {header: {x-api-key: test-key, anthropic-version: '2023-06-01'}}
              options: {model: claude-sonnet-4-20250514}
              override: {endpoint: '{{FIXTURE.provider.URL}}'}
              ssl_verify: false
            ai-rate-limiting: {limit: 500, time_window: 60, limit_strategy: expression, cost_expr: 'input_tokens + cache_creation_input_tokens + output_tokens'}
          upstream: {type: roundrobin, nodes: {'127.0.0.1:1': 1}}
    fixtures:
      - &anthropic_provider
        name: provider
        kind: http
        expect:
          - method: POST
            headers: {x-api-key: {equals: test-key}}
            body: {matches: claude-sonnet-4-20250514}
        count: {at_least: 2, at_most: 2}
        respond:
          - &anthropic_usage {status: 200, headers: {Content-Type: application/json}, body: '{"id":"msg_1","type":"message","role":"assistant","model":"claude-sonnet-4-20250514","content":[],"usage":{"input_tokens":50,"cache_creation_input_tokens":100,"cache_read_input_tokens":200,"output_tokens":30}}'}
    steps:
      - &anthropic_input
        name: first-anthropic-response
        input: {method: POST, path: /v1/messages, headers: {Content-Type: application/json}, body: '{"model":"claude-sonnet-4-20250514","max_tokens":1024,"messages":[{"role":"user","content":"Hello"}]}'}
        output:
          status: 200
          headers: {X-AI-RateLimit-Remaining-ai-proxy-anthropic: {equals: '500'}}
      - <<: *anthropic_input
        name: second-anthropic-response
        output:
          status: 200
          headers: {X-AI-RateLimit-Remaining-ai-proxy-anthropic: {equals: '320'}}

  - <<: *expression_native_case
    name: expression-native-anthropic-pre-charge-values
    source: {file: t/plugin/ai-rate-limiting-expression.t, tests: [3]}

  - &expression_stream_case
    name: expression-streaming-anthropic-route-is-available
    source: {file: t/plugin/ai-rate-limiting-expression.t, tests: [4]}
    config:
      routes:
        - id: expression-anthropic-stream
          uri: /v1/messages
          plugins:
            ai-proxy:
              provider: anthropic
              auth: {header: {x-api-key: test-key, anthropic-version: '2023-06-01'}}
              options: {model: claude-sonnet-4-20250514}
              override: {endpoint: '{{FIXTURE.provider.URL}}'}
              ssl_verify: false
            ai-rate-limiting: {limit: 500, time_window: 60, limit_strategy: expression, cost_expr: 'input_tokens + cache_creation_input_tokens + output_tokens'}
          upstream: {type: roundrobin, nodes: {'127.0.0.1:1': 1}}
    fixtures:
      - name: provider
        kind: http
        expect:
          - method: POST
            body: {matches: '"stream":true'}
        count: {at_least: 2, at_most: 2}
        respond:
          - status: 200
            headers: {Content-Type: text/event-stream}
            body: "event: message_start\ndata: {\"message\":{\"model\":\"claude-sonnet-4-20250514\",\"usage\":{\"input_tokens\":50,\"cache_creation_input_tokens\":100,\"cache_read_input_tokens\":200,\"output_tokens\":0}}}\n\nevent: message_delta\ndata: {\"usage\":{\"output_tokens\":30}}\n\nevent: message_stop\ndata: {}\n\n"
    steps:
      - &anthropic_stream_input
        name: first-stream-is-forwarded
        input: {method: POST, path: /v1/messages, headers: {Content-Type: application/json}, body: '{"model":"claude-sonnet-4-20250514","max_tokens":1024,"stream":true,"messages":[{"role":"user","content":"Hello"}]}'}
        output: {status: 200, headers: {X-AI-RateLimit-Remaining-ai-proxy-anthropic: {equals: '500'}}, body: {matches: 'event: message_stop'}}
      - <<: *anthropic_stream_input
        name: second-stream-sees-first-charge
        output:
          status: 200
          headers: {X-AI-RateLimit-Remaining-ai-proxy-anthropic: {equals: '320'}}
          body: {matches: 'event: message_stop'}

  - <<: *expression_stream_case
    name: expression-streaming-anthropic-pre-charge-values
    source: {file: t/plugin/ai-rate-limiting-expression.t, tests: [5]}

  - &expression_cache_case
    name: cache-aware-expression-route-is-available
    source: {file: t/plugin/ai-rate-limiting-expression.t, tests: [6]}
    config:
      routes:
        - id: expression-cache-aware
          uri: /v1/messages
          plugins: {ai-rate-limiting: {limit: 100, time_window: 60, limit_strategy: expression, cost_expr: 'input_tokens + cache_creation_input_tokens'}}
          upstream: *primary_upstream
    fixtures:
      - name: primary
        kind: http
        expect: [{method: POST, path: {equals: /v1/messages}}]
        count: {at_least: 1, at_most: 1}
        respond: [*anthropic_usage]
    steps:
      - {name: over-limit-cost-is-recorded, input: {method: POST, path: /v1/messages}, output: {status: 200, headers: {X-AI-RateLimit-Remaining-global: {equals: '100'}}}}
      - {name: following-request-is-rejected, input: {method: POST, path: /v1/messages}, output: {status: 503}}

  - <<: *expression_cache_case
    name: cache-aware-expression-rejects-after-first-charge
    source: {file: t/plugin/ai-rate-limiting-expression.t, tests: [7]}

  - &expression_weighted_case
    name: weighted-expression-route-is-available
    source: {file: t/plugin/ai-rate-limiting-expression.t, tests: [8]}
    config:
      routes:
        - id: expression-weighted
          uri: /v1/messages
          plugins: {ai-rate-limiting: {limit: 1000, time_window: 60, limit_strategy: expression, cost_expr: 'input_tokens + cache_read_input_tokens * 0.1 + cache_creation_input_tokens * 1.25 + output_tokens'}}
          upstream: *primary_upstream
    fixtures:
      - name: primary
        kind: http
        expect: [{method: POST, path: {equals: /v1/messages}}]
        count: {at_least: 2, at_most: 2}
        respond: [*anthropic_usage]
    steps:
      - &weighted_first {name: first-weighted-charge, input: {method: POST, path: /v1/messages}, output: {status: 200, headers: {X-AI-RateLimit-Remaining-global: {equals: '1000'}}}}
      - <<: *weighted_first
        name: second-weighted-charge
        output: {status: 200, headers: {X-AI-RateLimit-Remaining-global: {equals: '775'}}}

  - <<: *expression_weighted_case
    name: weighted-expression-pre-charge-values
    source: {file: t/plugin/ai-rate-limiting-expression.t, tests: [9]}

  - &expression_missing_case
    name: missing-expression-variable-route-is-available
    source: {file: t/plugin/ai-rate-limiting-expression.t, tests: [10]}
    config:
      routes:
        - id: expression-missing-variable
          uri: /v1/messages
          plugins: {ai-rate-limiting: {limit: 500, time_window: 60, limit_strategy: expression, cost_expr: 'input_tokens + nonexistent_field + output_tokens'}}
          upstream: *primary_upstream
    fixtures:
      - name: primary
        kind: http
        expect: [{method: POST, path: {equals: /v1/messages}}]
        count: {at_least: 2, at_most: 2}
        respond: [*anthropic_usage]
    steps:
      - &missing_first {name: first-missing-variable-charge, input: {method: POST, path: /v1/messages}, output: {status: 200, headers: {X-AI-RateLimit-Remaining-global: {equals: '500'}}}}
      - <<: *missing_first
        name: second-missing-variable-charge
        output: {status: 200, headers: {X-AI-RateLimit-Remaining-global: {equals: '420'}}}

  - <<: *expression_missing_case
    name: missing-expression-variable-pre-charge-values
    source: {file: t/plugin/ai-rate-limiting-expression.t, tests: [11]}

  - &expression_negative_case
    name: negative-expression-route-is-available
    source: {file: t/plugin/ai-rate-limiting-expression.t, tests: [12]}
    config:
      routes:
        - id: expression-negative
          uri: /v1/messages
          plugins: {ai-rate-limiting: {limit: 100, time_window: 60, limit_strategy: expression, cost_expr: 'input_tokens - cache_read_input_tokens'}}
          upstream: *primary_upstream
    fixtures:
      - name: primary
        kind: http
        expect: [{method: POST, path: {equals: /v1/messages}}]
        count: {at_least: 2, at_most: 2}
        respond: [*anthropic_usage]
    steps:
      - &negative_first {name: first-negative-cost, input: {method: POST, path: /v1/messages}, output: {status: 200, headers: {X-AI-RateLimit-Remaining-global: {equals: '100'}}}}
      - <<: *negative_first
        name: second-negative-cost

  - <<: *expression_negative_case
    name: negative-expression-cost-is-clamped-to-zero
    source: {file: t/plugin/ai-rate-limiting-expression.t, tests: [13]}

  - name: core-schema-validates-quota-shapes
    source: {file: t/plugin/ai-rate-limiting.t, tests: [1]}
    variants:
      - name: missing-limit
        config: {routes: [{id: core-missing-limit, uri: /missing-limit, plugins: {ai-rate-limiting: {time_window: 60}}, upstream: {type: roundrobin, nodes: {'127.0.0.1:1': 1}}}]}
        input: {path: /missing-limit}
        output: {status: 404, logs: {matches: 'core-missing-limit.*limit'}}
      - name: missing-window
        config: {routes: [{id: core-missing-window, uri: /missing-window, plugins: {ai-rate-limiting: {limit: 30}}, upstream: {type: roundrobin, nodes: {'127.0.0.1:1': 1}}}]}
        input: {path: /missing-window}
        output: {status: 404, logs: {matches: 'core-missing-window.*time_window'}}
      - name: rejected-code-minimum
        config: {routes: [{id: core-invalid-status, uri: /invalid-status, plugins: {ai-rate-limiting: {limit: 30, time_window: 60, rejected_code: 199}}, upstream: {type: roundrobin, nodes: {'127.0.0.1:1': 1}}}]}
        input: {path: /invalid-status}
        output: {status: 404, logs: {matches: 'core-invalid-status.*rejected_code'}}
      - name: strategy-enum
        config: {routes: [{id: core-invalid-strategy, uri: /invalid-strategy, plugins: {ai-rate-limiting: {limit: 30, time_window: 60, limit_strategy: invalid}}, upstream: {type: roundrobin, nodes: {'127.0.0.1:1': 1}}}]}
        input: {path: /invalid-strategy}
        output: {status: 404, logs: {matches: 'core-invalid-strategy.*limit_strategy'}}
      - name: instance-name-required
        config: {routes: [{id: core-invalid-instance, uri: /invalid-instance, plugins: {ai-rate-limiting: {instances: [{name: instance1, limit: 30, time_window: 60}, {limit: 30, time_window: 60}]}}, upstream: {type: roundrobin, nodes: {'127.0.0.1:1': 1}}}]}
        input: {path: /invalid-instance}
        output: {status: 404, logs: {matches: 'core-invalid-instance.*name'}}
      - name: global-limit-required-with-window-and-instances
        config: {routes: [{id: core-instance-missing-limit, uri: /instance-missing-limit, plugins: {ai-rate-limiting: {time_window: 60, instances: [{name: instance1, limit: 30, time_window: 60}]}}, upstream: {type: roundrobin, nodes: {'127.0.0.1:1': 1}}}]}
        input: {path: /instance-missing-limit}
        output: {status: 404, logs: {matches: 'core-instance-missing-limit.*limit'}}
      - name: global-window-required-with-limit-and-instances
        config: {routes: [{id: core-instance-missing-window, uri: /instance-missing-window, plugins: {ai-rate-limiting: {limit: 30, instances: [{name: instance1, limit: 30, time_window: 60}]}}, upstream: {type: roundrobin, nodes: {'127.0.0.1:1': 1}}}]}
        input: {path: /instance-missing-window}
        output: {status: 404, logs: {matches: 'core-instance-missing-window.*time_window'}}
      - name: instances-only-is-valid
        config: {routes: [{id: core-instance-valid, uri: /instance-valid, plugins: {ai-rate-limiting: {instances: [{name: instance1, limit: 30, time_window: 60}]}}, upstream: {type: roundrobin, nodes: {'{{UPSTREAM_ADDR}}': 1}}}]}
        input: {method: POST, path: /instance-valid}
        upstream: {expect: {method: POST, path: {equals: /instance-valid}}, respond: *ten_tokens}
        output: {status: 200}
      - name: global-only-is-valid
        config: {routes: [{id: core-global-valid, uri: /global-valid, plugins: {ai-rate-limiting: {limit: 30, time_window: 60, rejected_code: 403, rejected_msg: rate-limit, limit_strategy: completion_tokens}}, upstream: {type: roundrobin, nodes: {'{{UPSTREAM_ADDR}}': 1}}}]}
        input: {method: POST, path: /global-valid}
        upstream: {expect: {method: POST, path: {equals: /global-valid}}, respond: *ten_tokens}
        output: {status: 200}
      - name: global-and-instances-is-valid
        config: {routes: [{id: core-global-instance-valid, uri: /global-instance-valid, plugins: {ai-rate-limiting: {limit: 30, time_window: 60, instances: [{name: instance1, limit: 30, time_window: 60}]}}, upstream: {type: roundrobin, nodes: {'{{UPSTREAM_ADDR}}': 1}}}]}
        input: {method: POST, path: /global-instance-valid}
        upstream: {expect: {method: POST, path: {equals: /global-instance-valid}}, respond: *ten_tokens}
        output: {status: 200}

  - &core_default_total_case
    name: default-total-token-route-is-available
    source: {file: t/plugin/ai-rate-limiting.t, tests: [2]}
    config:
      routes:
        - id: core-default-total-tokens
          uri: /ai
          plugins: {ai-rate-limiting: {limit: 30, time_window: 60}}
          upstream: *primary_upstream
    fixtures:
      - name: primary
        kind: http
        expect: [*post_ai]
        count: {at_least: 3, at_most: 3}
        respond: [*ten_tokens]
    steps:
      - &total_first
        name: total-first
        input: {method: POST, path: /ai, headers: {Content-Type: application/json}, body: '{"messages":[]}'}
        output: {status: 200, headers: {X-AI-RateLimit-Limit-global: {equals: '30'}, X-AI-RateLimit-Remaining-global: {equals: '30'}, X-AI-RateLimit-Reset-global: {equals: '60'}}}
      - <<: *total_first
        name: total-second
        output: {status: 200, headers: {X-AI-RateLimit-Remaining-global: {equals: '20'}}}
      - <<: *total_first
        name: total-third
        output: {status: 200, headers: {X-AI-RateLimit-Remaining-global: {equals: '10'}}}
      - <<: *total_first
        name: total-fourth-rejected
        output: {status: 503, body: {matches: 'Service Unavailable'}, headers: {X-AI-RateLimit-Remaining-global: {equals: '0'}}}

  - <<: *core_default_total_case
    name: default-total-token-third-request-is-rejected
    source: {file: t/plugin/ai-rate-limiting.t, tests: [3]}

  - &core_custom_total_case
    <<: *core_default_total_case
    name: custom-total-token-route-is-available
    source: {file: t/plugin/ai-rate-limiting.t, tests: [4]}
    config:
      routes:
        - id: core-custom-total-tokens
          uri: /ai
          plugins: {ai-rate-limiting: {limit: 30, time_window: 60, rejected_code: 403, rejected_msg: rate limit exceeded}}
          upstream: *primary_upstream
    steps:
      - *total_first
      - <<: *total_first
        name: total-second
        output: {status: 200, headers: {X-AI-RateLimit-Remaining-global: {equals: '20'}}}
      - <<: *total_first
        name: total-third
        output: {status: 200, headers: {X-AI-RateLimit-Remaining-global: {equals: '10'}}}
      - <<: *total_first
        name: total-fourth-rejected
        output: {status: 403, body: {matches: 'rate limit exceeded'}, headers: {X-AI-RateLimit-Remaining-global: {equals: '0'}}}

  - <<: *core_custom_total_case
    name: custom-total-token-code-and-message
    source: {file: t/plugin/ai-rate-limiting.t, tests: [5]}

  - <<: *core_custom_total_case
    name: custom-total-token-initial-headers
    source: {file: t/plugin/ai-rate-limiting.t, tests: [6]}

  - <<: *core_custom_total_case
    name: custom-total-token-pre-charge-sequence
    source: {file: t/plugin/ai-rate-limiting.t, tests: [7]}

  - &core_completion_case
    name: completion-token-route-is-available
    source: {file: t/plugin/ai-rate-limiting.t, tests: [8]}
    config:
      routes:
        - {id: core-total-independent, uri: /ai, plugins: {ai-rate-limiting: {limit: 30, time_window: 60}}, upstream: *primary_upstream}
        - {id: core-completion, uri: /ai2, plugins: {ai-rate-limiting: {limit: 20, time_window: 45, limit_strategy: completion_tokens}}, upstream: *primary_upstream}
    fixtures:
      - name: primary
        kind: http
        expect: [{method: POST, path: {matches: '^/ai2?$'}}]
        count: {at_least: 4, at_most: 4}
        respond: [{status: 200, headers: {Content-Type: application/json}, body: '{"choices":[],"usage":{"prompt_tokens":5,"completion_tokens":5,"total_tokens":10}}'}]
    steps:
      - &completion_request {name: completion-first, input: {method: POST, path: /ai2}, output: {status: 200, headers: {X-AI-RateLimit-Limit-global: {equals: '20'}, X-AI-RateLimit-Remaining-global: {equals: '20'}, X-AI-RateLimit-Reset-global: {equals: '45'}}}}
      - <<: *completion_request
        name: completion-second
        output: {status: 200, headers: {X-AI-RateLimit-Remaining-global: {equals: '15'}}}
      - <<: *completion_request
        name: completion-third
        output: {status: 200, headers: {X-AI-RateLimit-Remaining-global: {equals: '10'}}}
      - <<: *completion_request
        name: completion-fourth
        output: {status: 200, headers: {X-AI-RateLimit-Remaining-global: {equals: '5'}}}
      - <<: *completion_request
        name: completion-fifth-rejected
        output: {status: 503, headers: {X-AI-RateLimit-Remaining-global: {equals: '0'}}}

  - <<: *core_completion_case
    name: completion-token-fifth-request-is-rejected
    source: {file: t/plugin/ai-rate-limiting.t, tests: [9]}

  - <<: *core_completion_case
    name: completion-token-initial-headers
    source: {file: t/plugin/ai-rate-limiting.t, tests: [10]}

  - <<: *core_completion_case
    name: completion-token-pre-charge-sequence
    source: {file: t/plugin/ai-rate-limiting.t, tests: [11]}

  - name: total-and-completion-routes-have-independent-counters
    source: {file: t/plugin/ai-rate-limiting.t, tests: [12]}
    config:
      routes:
