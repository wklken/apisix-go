            body:
              equals: audience=course_management&grant_type=urn%3Aietf%3Aparams%3Aoauth%3Agrant-type%3Auma-ticket&permission=course_resource%23GET&response_mode=decision
          - *repeat_get_uma
        respond:
          - *allow_response
          - *allow_response
      - name: primary
        kind: http
        expect:
          - {method: GET, path: {equals: /course}}
          - {method: GET, path: {equals: /course}}
        respond:
          - {status: 200, body: UPSTREAM-REACHED}
          - {status: 200, body: UPSTREAM-REACHED}
    steps:
      - name: first-identical-get
        input: {method: GET, path: /course, headers: {Authorization: Bearer dummy-user-token}}
        output: {status: 200, body: {equals: UPSTREAM-REACHED}}
      - name: second-identical-get
        input: {method: GET, path: /course, headers: {Authorization: Bearer dummy-user-token}}
        output: {status: 200, body: {equals: UPSTREAM-REACHED}}
