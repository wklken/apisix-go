              client_id: course_management
              client_secret: '$secret://vault/test1/foo/client_secret'
              token_endpoint: '{{FIXTURE.keycloak.URL}}/token'
              password_grant_token_generation_incoming_uri: /api/token
          upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
    fixtures:
      - name: vault
        kind: http
        expect:
          - method: GET
            path: {equals: /v1/kv/apisix/foo}
            headers:
              X-Vault-Token: {equals: root}
              X-Vault-Namespace: {absent: true}
        respond:
          - {status: 200, body: '{"data":{"client_secret":"vault-keycloak-secret"}}'}
      - name: keycloak
        kind: http
        expect:
          - method: POST
            path: {equals: /token}
            body:
              equals: client_id=course_management&client_secret=vault-keycloak-secret&grant_type=password&password=123456&username=teacher%40gmail.com
        respond: [{status: 200, body: '{"access_token":"vault-access","refresh_token":"vault-refresh"}'}]
      - {name: primary, kind: http, expect_requests: 0, respond: [{status: 200}]}
    steps:
      - name: resolve-vault-secret-for-provider-only
        input: *password_grant_input
        output:
          status: 200
          body: {equals: '{"access_token":"vault-access","refresh_token":"vault-refresh"}'}
          logs: {not_matches: 'vault-keycloak-secret|vault-access|vault-refresh'}

