cases:
  - name: metadata-rejects-empty-nodes
    config:
      routes:
        - id: chaitin-waf-empty-nodes
          uri: /hello
          plugins:
            chaitin-waf: {}
      plugin_metadata:
        - id: chaitin-waf
          nodes: []
    input:
      path: /hello
    output:
      status: 500
      logs:
        matches: 'validate plugin chaitin-waf metadata: /nodes: minimum 1 items required'

  - name: metadata-requires-node-host
    config:
      routes:
        - id: chaitin-waf-missing-host
          uri: /hello
          plugins:
            chaitin-waf: {}
      plugin_metadata:
        - id: chaitin-waf
          nodes:
            - port: 8000
    input:
      path: /hello
    output:
      status: 500
      logs:
        matches: "validate plugin chaitin-waf metadata: /nodes/0: missing properties: 'host'"

  - name: default-pass
    config: &pass_config
      routes:
        - id: chaitin-waf-pass
          uri: /hello
          plugins:
            chaitin-waf:
              upstream:
                servers: [httpbun.org]
          upstream: &primary_upstream
            type: roundrobin
            nodes:
              "{{FIXTURE.primary.ADDR}}": 1
      plugin_metadata: &waf_metadata
        - id: chaitin-waf
          nodes:
            - host: "{{FIXTURE.waf.HOST}}"
              port: "{{FIXTURE.waf.PORT}}"
    fixtures:
      - &primary_fixture
        name: primary
        kind: http
        respond:
          - &hello_response
            status: 200
            body: hello world
      - &waf_fixture
        name: waf
        kind: t1k
        expect:
          - path:
              equals: /hello
        respond:
          - &pass_response
            status: 200
            body: '{"status":200}'
    steps:
      - name: pass
        input:
          path: /hello
        output: &pass_output
          status: 200
          headers:
            X-APISIX-CHAITIN-WAF:
              equals: 'yes'
            X-APISIX-CHAITIN-WAF-STATUS:
              equals: '200'
            X-APISIX-CHAITIN-WAF-ACTION:
              equals: pass
            X-APISIX-CHAITIN-WAF-TIME:
              matches: '^[0-9]+$'
          body:
            equals: hello world

  - name: conditional-match
    config:
      routes:
        - id: chaitin-waf-match
          uri: /hello
          plugins:
            chaitin-waf:
              upstream:
                servers: [httpbun.org]
              match:
                - vars:
                    - [http_waf, '==', 'true']
          upstream: *primary_upstream
      plugin_metadata: *waf_metadata
    fixtures:
      - name: primary
        kind: http
        respond:
          - *hello_response
          - *hello_response
      - *waf_fixture
    steps:
      - name: no-match
        input:
          path: /hello
        output:
          status: 200
          headers:
            X-APISIX-CHAITIN-WAF:
              equals: 'no'
          body:
            equals: hello world
      - name: matched
        input:
          path: /hello
          headers:
            Waf: 'true'
        output: *pass_output

  - name: mode-off
    config:
      routes:
        - id: chaitin-waf-off
          uri: /hello
          plugins:
            chaitin-waf:
              mode: off
              upstream:
                servers: [httpbun.org]
              match:
                - vars:
                    - [http_waf, '==', 'true']
          upstream: *primary_upstream
      plugin_metadata: *waf_metadata
    fixtures:
      - *primary_fixture
      - name: waf
        kind: t1k
        respond:
          - *pass_response
    steps:
      - name: off
        input:
          path: /hello
          headers:
            Trigger: 'true'
        output:
          status: 200
          headers:
            X-APISIX-CHAITIN-WAF:
              equals: 'off'
          body:
            equals: hello world

  - name: real-client-ip-disabled
    config:
      routes:
        - id: chaitin-waf-real-client-ip-disabled
          uri: /hello
          plugins:
            chaitin-waf:
              match:
                - vars:
                    - [http_trigger, '==', 'true']
              config:
                real_client_ip: false
          upstream: *primary_upstream
      plugin_metadata: *waf_metadata
    fixtures:
      - name: primary
        kind: http
        respond:
          - *hello_response
          - *hello_response
      - name: waf
        kind: t1k
        expect:
          - &loopback_waf_request
            t1k_extra:
              RemoteAddr:
                equals: 127.0.0.1
          - *loopback_waf_request
        respond:
          - *pass_response
    steps:
      - name: ignores-forwarded-for
        input:
          path: /hello
          headers:
            X-Forwarded-For: 1.2.3.4
            Trigger: 'true'
        output: *pass_output
      - name: ignores-trusted-forwarded-for
        input:
          path: /hello
          headers:
            X-Forwarded-For: 192.0.2.10
            Trigger: 'true'
        output: *pass_output

  - name: real-client-ip-from-trusted-forwarded-for
    config:
      routes:
        - id: chaitin-waf-real-client-ip-enabled
          uri: /hello
          plugins:
            real-ip:
              source: http_x_forwarded_for
              trusted_addresses: [127.0.0.0/8]
            chaitin-waf:
              match:
                - vars:
                    - [http_trigger, '==', 'true']
              config:
                real_client_ip: true
          upstream: *primary_upstream
      plugin_metadata: *waf_metadata
    fixtures:
      - *primary_fixture
      - name: waf
        kind: t1k
        expect:
          - t1k_extra:
              RemoteAddr:
                equals: 192.0.2.10
        respond:
          - *pass_response
    steps:
      - name: trusted-forwarded-for
        input:
          path: /hello
          headers:
            X-Forwarded-For: 192.0.2.10
            Trigger: 'true'
        output: *pass_output

  - name: spoofed-forwarded-for-from-untrusted-peer
    config:
      routes:
        - id: chaitin-waf-untrusted-forwarded-for
          uri: /hello
          plugins:
            real-ip:
              source: http_x_forwarded_for
              trusted_addresses: [192.0.2.1/32]
            chaitin-waf:
              match:
                - vars:
                    - [http_trigger, '==', 'true']
              config:
                real_client_ip: true
          upstream: *primary_upstream
      plugin_metadata: *waf_metadata
    fixtures:
      - *primary_fixture
      - name: waf
        kind: t1k
        expect:
          - *loopback_waf_request
        respond:
          - *pass_response
    steps:
      - name: untrusted-forwarded-for
        input:
          path: /hello
          headers:
            X-Forwarded-For: 192.0.2.10
            Trigger: 'true'
        output: *pass_output

  - name: block-mode-reject
    config:
      routes:
        - id: chaitin-waf-reject
          uri: /hello
          plugins:
            chaitin-waf:
              mode: block
              upstream:
                servers: [httpbun.org]
          upstream: *primary_upstream
      plugin_metadata:
        - id: chaitin-waf
          mode: block
          nodes:
            - host: "{{FIXTURE.waf.HOST}}"
              port: "{{FIXTURE.waf.PORT}}"
    fixtures:
      - *primary_fixture
      - name: waf
        kind: t1k
        expect:
          - path:
              equals: /hello
        respond:
          - status: 403
            body: '{"status":403,"event_id":"b3c6ce574dc24f09a01f634a39dca83b"}'
    steps:
      - name: reject
        input:
          path: /hello
        output:
          status: 403
          headers:
            X-APISIX-CHAITIN-WAF:
              equals: 'yes'
            X-APISIX-CHAITIN-WAF-STATUS:
              equals: '403'
            X-APISIX-CHAITIN-WAF-ACTION:
              equals: reject
            X-APISIX-CHAITIN-WAF-TIME:
              matches: '^[0-9]+$'
          body:
            matches: '^\{.*"event_id":\s*"b3c6ce574dc24f09a01f634a39dca83b".*\}\s*$'

  - name: monitor-mode-reject-passes-through
    config:
      routes:
        - id: chaitin-waf-monitor
          uri: /hello
          plugins:
            chaitin-waf:
              mode: monitor
              match:
                - vars:
                    - [http_waf, '==', 'true']
          upstream: *primary_upstream
      plugin_metadata:
        - id: chaitin-waf
          nodes:
            - host: "{{FIXTURE.waf.HOST}}"
              port: "{{FIXTURE.waf.PORT}}"
    fixtures:
      - *primary_fixture
      - name: waf
        kind: t1k
        expect:
          - path:
              equals: /hello
        respond:
          - status: 403
            body: '{"status":403,"event_id":"b3c6ce574dc24f09a01f634a39dca83b"}'
    steps:
      - name: monitor-reject-passes-through
        input:
          path: /hello
          headers:
            Waf: 'true'
        output:
          status: 200
          headers:
            X-APISIX-CHAITIN-WAF:
              equals: 'yes'
            X-APISIX-CHAITIN-WAF-STATUS:
              equals: '403'
            X-APISIX-CHAITIN-WAF-ACTION:
              equals: reject
            X-APISIX-CHAITIN-WAF-TIME:
              matches: '^[0-9]+$'
          body:
            equals: hello world

  - name: read-timeout-falls-back
    config:
      routes:
        - id: chaitin-waf-timeout
          uri: /hello
          plugins:
            chaitin-waf:
              upstream:
                servers: [httpbun.org]
              config:
                read_timeout: 200
          upstream: *primary_upstream
      plugin_metadata:
        - id: chaitin-waf
          nodes:
            - host: "{{FIXTURE.waf.HOST}}"
              port: "{{FIXTURE.waf.PORT}}"
    fixtures:
      - *primary_fixture
      - name: waf
        kind: t1k
        respond:
          - status: 200
            body: '{"status":200}'
            delay: 2s
    steps:
      - name: timeout
        input:
          path: /hello
        output:
          status: 200
          headers:
            X-APISIX-CHAITIN-WAF:
              equals: timeout
            X-APISIX-CHAITIN-WAF-TIME:
              matches: '^[0-9]+$'
          body:
            equals: hello world
