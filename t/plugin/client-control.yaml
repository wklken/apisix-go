source:
  repository: https://github.com/apache/apisix
  commit: 9ef2ecab67f652d38365049613610ef649bb4ad0
  file: t/plugin/client-control.t
  tests: 6
  test_numbers: [1, 2, 3, 4, 6, 7]

cases:
  - name: route-body-limit
    source:
      tests: [1, 2, 3, 4]
    config:
      routes:
        - id: client-control-five-bytes
          uri: /hello
          plugins:
            client-control:
              max_body_size: 5
          upstream: &named_upstream
            type: roundrobin
            nodes:
              "{{FIXTURE.primary.ADDR}}": 1
    fixtures:
      - name: primary
        kind: http
        expect:
          - method: POST
            body:
              equals: '12345'
        respond:
          - &done_response
            status: 200
            body: done
    steps:
      - name: content-length-too-large
        input:
          method: POST
          path: /hello
          body: '123456'
        output: &too_large
          status: 413
      - name: chunked-body-too-large
        input:
          method: POST
          path: /hello
          body: 'Hello '
          chunked: true
        output:
          status: 413
          logs:
            matches: 'client intended to send too large chunked body'
      - name: exact-limit
        input:
          method: POST
          path: /hello
          body: '12345'
        output: &done_output
          status: 200
          body:
            equals: done

  - name: zero-disables-limit
    source:
      tests: [6, 7]
    config:
      routes:
        - id: client-control-unlimited
          uri: /hello
          plugins:
            client-control:
              max_body_size: 0
          upstream: &single_upstream
            type: roundrobin
            nodes:
              "{{UPSTREAM_ADDR}}": 1
    input:
      method: POST
      path: /hello
      body: '1'
    upstream: &single_fixture
      expect:
        body:
          equals: '1'
      respond: *done_response
    output: *done_output
