          plugins: {datadog: {batch_max_size: 1, retry_delay: 0}}
          upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
    fixtures:
      - name: primary
        kind: http
        expect:
          - {path: {equals: /opentracing}}
          - {path: {equals: /opentracing}}
        respond:
          - {status: 200, body: opentracing}
          - {status: 200, body: opentracing}
      - name: sink
        kind: udp
        network_expect:
          - payload: &two_request_metrics_1
              matches: '^apisix\.request\.counter:1\|c\|#source:apisix,route_name:datadog,balancer_ip:127\.0\.0\.1,response_status:200,response_status_class:2xx,scheme:http$'
