  - name: two-requests-produce-two-complete-independent-metric-sets
    config:
      plugin_metadata:
        - {id: datadog, host: '{{FIXTURE.sink.HOST}}', port: '{{FIXTURE.sink.PORT}}'}
      routes:
        - id: datadog-two-requests
