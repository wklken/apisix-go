              matches: '^apisix\.request\.latency:[0-9]+\|h\|#source:apisix,route_name:datadog,balancer_ip:127\.0\.0\.1,response_status:200,response_status_class:2xx,scheme:http$'
          - payload: &two_request_metrics_3
              matches: '^apisix\.upstream\.latency:[0-9]+\|h\|#source:apisix,route_name:datadog,balancer_ip:127\.0\.0\.1,response_status:200,response_status_class:2xx,scheme:http$'
          - payload: &two_request_metrics_4
              matches: '^apisix\.apisix\.latency:[0-9]+\|h\|#source:apisix,route_name:datadog,balancer_ip:127\.0\.0\.1,response_status:200,response_status_class:2xx,scheme:http$'
          - payload: &two_request_metrics_5
              matches: '^apisix\.ingress\.size:[1-9][0-9]*\|ms\|#source:apisix,route_name:datadog,balancer_ip:127\.0\.0\.1,response_status:200,response_status_class:2xx,scheme:http$'
          - payload: &two_request_metrics_6
              matches: '^apisix\.egress\.size:[1-9][0-9]*\|ms\|#source:apisix,route_name:datadog,balancer_ip:127\.0\.0\.1,response_status:200,response_status_class:2xx,scheme:http$'
          - payload: *two_request_metrics_1
          - payload: *two_request_metrics_2
          - payload: *two_request_metrics_3
          - payload: *two_request_metrics_4
          - payload: *two_request_metrics_5
          - payload: *two_request_metrics_6
        network_respond: [{payload: ''}, {payload: ''}, {payload: ''}, {payload: ''}, {payload: ''}, {payload: ''}, {payload: ''}, {payload: ''}, {payload: ''}, {payload: ''}, {payload: ''}, {payload: ''}]
    steps:
      - name: first-request
        input: {method: GET, path: /opentracing}
        output: {status: 200, body: {equals: opentracing}}
      - name: second-request
        input: {method: GET, path: /opentracing}
        output: {status: 200, body: {equals: opentracing}}

