cases:
  - name: metadata-schema-endpoint-is-accepted-and-used
    config:
      plugin_metadata:
        - id: datadog
          host: '{{FIXTURE.sink.HOST}}'
          port: '{{FIXTURE.sink.PORT}}'
      routes:
        - id: datadog-metadata-defaults
          name: metadata-defaults
          uri: /opentracing
          plugins:
            datadog:
              batch_max_size: 1
              retry_delay: 0
          upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
    fixtures:
      - name: primary
        kind: http
        expect: [{path: {equals: /opentracing}}]
        respond: [{status: 200, body: opentracing}]
      - name: sink
        kind: udp
        network_expect:
          - payload:
              matches: '^apisix\.request\.counter:1\|c\|#source:apisix,route_name:metadata-defaults,balancer_ip:127\.0\.0\.1,response_status:200,response_status_class:2xx,scheme:http$'
          - payload:
              matches: '^apisix\.request\.latency:[0-9]+\|h\|#source:apisix,route_name:metadata-defaults,balancer_ip:127\.0\.0\.1,response_status:200,response_status_class:2xx,scheme:http$'
          - payload:
              matches: '^apisix\.upstream\.latency:[0-9]+\|h\|#source:apisix,route_name:metadata-defaults,balancer_ip:127\.0\.0\.1,response_status:200,response_status_class:2xx,scheme:http$'
          - payload:
              matches: '^apisix\.apisix\.latency:[0-9]+\|h\|#source:apisix,route_name:metadata-defaults,balancer_ip:127\.0\.0\.1,response_status:200,response_status_class:2xx,scheme:http$'
          - payload:
              matches: '^apisix\.ingress\.size:[1-9][0-9]*\|ms\|#source:apisix,route_name:metadata-defaults,balancer_ip:127\.0\.0\.1,response_status:200,response_status_class:2xx,scheme:http$'
          - payload:
              matches: '^apisix\.egress\.size:[1-9][0-9]*\|ms\|#source:apisix,route_name:metadata-defaults,balancer_ip:127\.0\.0\.1,response_status:200,response_status_class:2xx,scheme:http$'
        network_respond: [{payload: ''}, {payload: ''}, {payload: ''}, {payload: ''}, {payload: ''}, {payload: ''}]
    steps:
      - name: metadata-endpoint-drives-real-delivery
        input: {method: GET, path: /opentracing}
        output: {status: 200, body: {equals: opentracing}}
