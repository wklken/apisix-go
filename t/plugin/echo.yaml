source:
  repository: https://github.com/apache/apisix
  commit: 9ef2ecab67f652d38365049613610ef649bb4ad0
  file: t/plugin/echo.t
  tests: 9
  test_numbers: [1, 3, 4, 5, 6, 8, 9, 10, 11]

cases:
  - name: schema-sanity
    source:
      tests: [1]
    config:
      routes:
        - id: echo-schema-sanity
          uri: /echo-schema
          plugins:
            echo:
              before_body: body before
              body: body to attach
              after_body: body after
          upstream: &fixture_route
            type: roundrobin
            nodes:
              "{{UPSTREAM_ADDR}}": 1
    input:
      path: /echo-schema
    upstream: &hello_fixture
      respond:
        status: 200
        body: hello world
    output:
      status: 200
      body:
        equals: body beforebody to attachbody after

  - name: replace-body-and-add-headers
    source:
      tests: [3, 4]
    config:
      routes:
        - id: echo-replace-body-and-headers
          uri: /hello
          plugins:
            echo:
              before_body: "before the body modification "
              body: hello upstream
              after_body: " after the body modification."
              headers:
                Location: https://www.iresty.com
                Authorization: userpass
          upstream: *fixture_route
    input:
      path: /hello
    upstream: *hello_fixture
    output:
      status: 200
      headers:
        Location:
          equals: https://www.iresty.com
        Authorization:
          equals: userpass
      body:
        equals: before the body modification hello upstream after the body modification.

  - name: prepend-body-without-replacement
    source:
      tests: [5, 6]
    config:
      routes:
        - id: echo-prepend-body
          uri: /hello
          plugins:
            echo:
              before_body: "before the body modification "
              headers:
                Location: https://www.iresty.com
          upstream: *fixture_route
    input:
      path: /hello
    upstream: *hello_fixture
    output:
      status: 200
      headers:
        Location:
          equals: https://www.iresty.com
      body:
        equals: before the body modification hello world

  - name: replace-chunked-body
    source:
      tests: [8, 9]
    config:
      routes:
        - id: echo-replace-chunked-body
          uri: /hello_chunked
          plugins:
            echo:
              body: hello upstream
          upstream: *fixture_route
    input:
      path: /hello_chunked
    upstream:
      respond:
        status: 200
        chunks: ["hello ", "world"]
    output:
      status: 200
      body:
        equals: hello upstream

  - name: wrap-chunked-body
    source:
      tests: [10, 11]
    config:
      routes:
        - id: echo-wrap-chunked-body
          uri: /hello_chunked
          plugins:
            echo:
              before_body: "before the body modification "
              after_body: " after the body modification."
          upstream: *fixture_route
    input:
      path: /hello_chunked
    upstream:
      respond:
        status: 200
        chunks: ["hello ", "world\n"]
    output:
      status: 200
      body:
        equals: "before the body modification hello world\n after the body modification."
