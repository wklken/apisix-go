          - {method: POST, path: {matches: '^/_bulk$'}, headers: {Authorization: {absent: true}, Content-Type: {equals: application/x-ndjson}}, body: {matches: '^\{"index":\{"_index":"services"\}\}\n\{"route_id":"unauthenticated-success","test":"test"\}\n$'}}
        respond: [{status: 200, headers: {X-Elastic-Product: Elasticsearch}, body: '{"version":{"number":"8.10.2"}}'}]
    steps:
      - {name: proxy-response-and-bulk-write-succeed, input: {path: /hello}, output: {status: 200, body: {equals: hello world}}, wait: 1s}

