cases:
  - name: unauthenticated-route-setup
    config:
      routes:
        - id: unauthenticated-setup
          uri: /hello
          plugins:
            elasticsearch-logger: {endpoint_addr: '{{FIXTURE.sink.URL}}', field: {index: services}, batch_max_size: 1, inactive_timeout: 1, log_format: {test: test}}
          upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
    fixtures:
      - {name: primary, kind: http, expect: [{method: GET, path: {equals: /hello}}], respond: [{status: 200, body: hello world}]}
      - name: sink
        kind: http
        expect:
          - {method: GET, path: {equals: /}, headers: {Authorization: {absent: true}}}
          - {method: POST, path: {matches: '^/_bulk$'}, headers: {Authorization: {absent: true}, Content-Type: {equals: application/x-ndjson}}, body: {matches: '^\{"index":\{"_index":"services"\}\}\n\{"route_id":"unauthenticated-setup","test":"test"\}\n$'}}
        respond: [{status: 200, headers: {X-Elastic-Product: Elasticsearch}, body: '{"version":{"number":"8.10.2"}}'}]
    steps:
      - {name: configured-route-writes-real-bulk-log, input: {path: /hello}, output: {status: 200, body: {equals: hello world}}, wait: 1s}

  - name: unauthenticated-successful-write
    config:
      routes:
        - id: unauthenticated-success
