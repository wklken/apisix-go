source:
  repository: https://github.com/apache/apisix
  commit: c3d7d5ec69774121f53d2e20d29d09c816795dd7
  file: t/plugin/elasticsearch-logger.t
  tests: 27
cases:
  - name: schema-variants
    source: {file: t/plugin/elasticsearch-logger.t, tests: [1]}
    config:
      routes:
        - id: schema-full
          uri: /schema-full
          plugins:
            elasticsearch-logger:
              endpoint_addr: '{{FIXTURE.sink.URL}}'
              field: {index: services}
              auth: {username: elastic, password: '123456'}
              ssl_verify: false
              timeout: 60
              max_retry_count: 0
              retry_delay: 1
              buffer_duration: 60
              inactive_timeout: 2
              batch_max_size: 1
              log_format: {test: full}
          upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
        - id: schema-minimal
          uri: /schema-minimal
          plugins:
            elasticsearch-logger:
              endpoint_addr: '{{FIXTURE.sink.URL}}'
              field: {index: services}
              batch_max_size: 1
              log_format: {test: minimal}
          upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
    fixtures:
      - name: primary
        kind: http
        expect:
          - {method: GET, path: {matches: '^/schema-(full|minimal)$'}}
        count: {at_least: 10, at_most: 10, timeout: 2s}
        respond: [{status: 200, body: schema-ok}]
      - name: sink
        kind: http
        expect:
          - {method: GET, path: {equals: /}, headers: {Authorization: {equals: 'Basic ZWxhc3RpYzoxMjM0NTY='}}}
          - {method: POST, path: {matches: '^/_bulk\?timeout=60000ms$'}, headers: {Authorization: {equals: 'Basic ZWxhc3RpYzoxMjM0NTY='}}, body: {matches: '^\{"index":\{"_index":"services"\}\}\n\{"test":"full"\}\n$'}}
          - {method: GET, path: {equals: /}, headers: {Authorization: {absent: true}}}
          - {method: POST, path: {matches: '^/_bulk\?timeout=10000ms$'}, headers: {Authorization: {absent: true}}, body: {matches: '^\{"index":\{"_index":"services"\}\}\n\{"test":"minimal"\}\n$'}}
          - {method: POST, path: {matches: '^/_bulk\?timeout=60000ms$'}, body: {matches: '^\{"index":\{"_index":"services"\}\}\n\{"test":"full"\}\n$'}}
          - {method: POST, path: {matches: '^/_bulk\?timeout=60000ms$'}, body: {matches: '^\{"index":\{"_index":"services"\}\}\n\{"test":"full"\}\n$'}}
          - {method: POST, path: {matches: '^/_bulk\?timeout=60000ms$'}, body: {matches: '^\{"index":\{"_index":"services"\}\}\n\{"test":"full"\}\n$'}}
          - {method: POST, path: {matches: '^/_bulk\?timeout=60000ms$'}, body: {matches: '^\{"index":\{"_index":"services"\}\}\n\{"test":"full"\}\n$'}}
          - {method: POST, path: {matches: '^/_bulk\?timeout=60000ms$'}, body: {matches: '^\{"index":\{"_index":"services"\}\}\n\{"test":"full"\}\n$'}}
          - {method: POST, path: {matches: '^/_bulk\?timeout=60000ms$'}, body: {matches: '^\{"index":\{"_index":"services"\}\}\n\{"test":"full"\}\n$'}}
          - {method: POST, path: {matches: '^/_bulk\?timeout=60000ms$'}, body: {matches: '^\{"index":\{"_index":"services"\}\}\n\{"test":"full"\}\n$'}}
          - {method: POST, path: {matches: '^/_bulk\?timeout=60000ms$'}, body: {matches: '^\{"index":\{"_index":"services"\}\}\n\{"test":"full"\}\n$'}}
        respond: [{status: 200, headers: {X-Elastic-Product: Elasticsearch}, body: '{"version":{"number":"8.10.2"}}'}]
    steps:
      - {name: full-schema-delivers, input: {path: /schema-full}, output: {status: 200, body: {equals: schema-ok}}, wait: 1s}
      - {name: minimal-schema-delivers, input: {path: /schema-minimal}, output: {status: 200, body: {equals: schema-ok}}, wait: 1s}
      - name: missing-endpoint-reload-is-rejected
        config:
          routes:
            - id: schema-missing-endpoint
              uri: /schema-invalid
              plugins: {elasticsearch-logger: {field: {index: services}}}
              upstream: {type: roundrobin, nodes: {'127.0.0.1:1': 1}}
        config_probe: {input: {path: /schema-full}, output: {status: 200, body: {equals: schema-ok}}}
        config_timeout: 2s
        input: {path: /schema-full}
        output: {status: 200, body: {equals: schema-ok}, logs: {matches: 'build route schema-missing-endpoint fail:.*missing properties: ''endpoint_addr'''}}
        wait: 300ms
      - name: missing-field-reload-is-rejected
        config:
          routes:
            - id: schema-missing-field
              uri: /schema-invalid
              plugins: {elasticsearch-logger: {endpoint_addr: 'http://127.0.0.1:9200'}}
              upstream: {type: roundrobin, nodes: {'127.0.0.1:1': 1}}
        config_probe: {input: {path: /schema-full}, output: {status: 200, body: {equals: schema-ok}}}
        config_timeout: 2s
        input: {path: /schema-full}
        output: {status: 200, body: {equals: schema-ok}, logs: {matches: 'build route schema-missing-field fail:.*missing properties: ''field'''}}
        wait: 300ms
      - name: missing-index-reload-is-rejected
        config:
          routes:
            - id: schema-missing-index
              uri: /schema-invalid
              plugins: {elasticsearch-logger: {endpoint_addr: 'http://127.0.0.1:9200', field: {}}}
              upstream: {type: roundrobin, nodes: {'127.0.0.1:1': 1}}
        config_probe: {input: {path: /schema-full}, output: {status: 200, body: {equals: schema-ok}}}
        config_timeout: 2s
        input: {path: /schema-full}
        output: {status: 200, body: {equals: schema-ok}, logs: {matches: 'build route schema-missing-index fail:.*missing properties: ''index'''}}
        wait: 300ms
      - name: trailing-slash-reload-is-rejected
        config:
          routes:
            - id: schema-trailing-slash
              uri: /schema-invalid
              plugins: {elasticsearch-logger: {endpoint_addr: 'http://127.0.0.1:9200/', field: {index: services}}}
              upstream: {type: roundrobin, nodes: {'127.0.0.1:1': 1}}
        config_probe: {input: {path: /schema-full}, output: {status: 200, body: {equals: schema-ok}}}
        config_timeout: 2s
        input: {path: /schema-full}
        output: {status: 200, body: {equals: schema-ok}, logs: {matches: 'build route schema-trailing-slash fail:.*endpoint_addr.*does not match pattern'}}
        wait: 300ms

  - name: unauthenticated-route-setup
    source: {file: t/plugin/elasticsearch-logger.t, tests: [2]}
    config:
      routes:
        - id: unauthenticated-setup
          uri: /hello
          plugins:
            elasticsearch-logger: {endpoint_addr: '{{FIXTURE.sink.URL}}', field: {index: services}, batch_max_size: 1, inactive_timeout: 1, log_format: {test: test}}
          upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
    fixtures:
      - {name: primary, kind: http, expect: [{method: GET, path: {equals: /hello}}], respond: [{status: 200, body: hello world}]}
      - name: sink
        kind: http
        expect:
          - {method: GET, path: {equals: /}, headers: {Authorization: {absent: true}}}
          - {method: POST, path: {matches: '^/_bulk\?timeout=10000ms$'}, headers: {Authorization: {absent: true}, Content-Type: {equals: application/x-ndjson}}, body: {matches: '^\{"index":\{"_index":"services"\}\}\n\{"test":"test"\}\n$'}}
        respond: [{status: 200, headers: {X-Elastic-Product: Elasticsearch}, body: '{"version":{"number":"8.10.2"}}'}]
    steps:
      - {name: configured-route-writes-real-bulk-log, input: {path: /hello}, output: {status: 200, body: {equals: hello world}}, wait: 1s}

