        wait: 1s

  - name: plugin-metadata-log-format-setup
    source: {file: t/plugin/elasticsearch-logger.t, tests: [10]}
    config:
      plugin_metadata:
        - id: elasticsearch-logger
          log_format: {custom_host: '$host', custom_timestamp: '$time_iso8601', custom_client_ip: '$remote_addr'}
      routes:
        - id: metadata-setup
          uri: /hello
          plugins:
            elasticsearch-logger: {endpoint_addr: '{{FIXTURE.sink.URL}}', field: {index: services}, batch_max_size: 1, inactive_timeout: 1}
          upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
    fixtures:
      - {name: primary, kind: http, expect: [{method: GET, path: {equals: /hello}}], respond: [{status: 200, body: hello world}]}
      - name: sink
        kind: http
        expect:
          - {method: GET, path: {equals: /}}
          - {method: POST, path: {matches: '^/_bulk\?timeout=10000ms$'}, body: {matches: '^\{"index":\{"_index":"services"\}\}\n\{"custom_client_ip":"127\.0\.0\.1","custom_host":"metadata\.example","custom_timestamp":"[^"]+"\}\n$'}}
        respond: [{status: 200, headers: {X-Elastic-Product: Elasticsearch}, body: '{"version":{"number":"8.10.2"}}'}]
    steps:
      - {name: metadata-format-is-live, input: {path: /hello, headers: {Host: metadata.example}}, output: {status: 200, body: {equals: hello world}}, wait: 1s}

  - name: plugin-metadata-log-format
