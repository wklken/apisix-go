          - {method: POST, path: {matches: '^/_bulk\?timeout=10000ms$'}, body: {matches: '^\{"index":\{"_index":"services"\}\}\n\{"test":"multi-setup"\}\n$'}}
        respond: [{status: 200, headers: {X-Elastic-Product: Elasticsearch}, body: '{"version":{"number":"8.10.2"}}'}]
    steps:
      - {name: one-configured-endpoint-receives-real-write, input: {path: /hello}, output: {status: 200, body: {equals: hello world}}, wait: 1s}

  - name: multi-endpoint-random-selection
    source: {file: t/plugin/elasticsearch-logger.t, tests: [14]}
    environment: {GODEBUG: randautoseed=0}
    config:
      routes:
        - id: multi-endpoint-selection
          uri: /hello
          plugins:
            elasticsearch-logger:
              endpoint_addrs: ['{{FIXTURE.firstSink.URL}}', '{{FIXTURE.secondSink.URL}}']
              field: {index: services}
              batch_max_size: 1
              inactive_timeout: 1
              log_format: {test: multi-selection}
          upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
    fixtures:
      - name: primary
        kind: http
        expect:
          - {method: GET, path: {equals: /hello}}
        count: {at_least: 12, at_most: 12, timeout: 2s}
        respond: [{status: 200, body: hello world}]
      - name: firstSink
        kind: http
        expect:
