  - name: auth-password-encrypted-at-rest
    source: {file: t/plugin/elasticsearch-logger.t, tests: [12]}
    runtime:
      apisix:
        data_encryption:
          enable_encrypt_fields: true
          keyring: [edd1c9f0985e76a2]
    config:
      routes:
        - id: '1'
          uri: /hello
          plugins:
            elasticsearch-logger:
              endpoint_addr: '{{FIXTURE.sink.URL}}'
              field: {index: services}
              auth: {username: elastic, password: '123456'}
              batch_max_size: 1
              inactive_timeout: 1
              log_format: {test: encrypted-password}
          upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
    fixtures:
      - {name: primary, kind: http, expect: [{method: GET, path: {equals: /hello}}], respond: [{status: 200, body: hello world}]}
      - name: sink
        kind: http
        expect:
          - {method: GET, path: {equals: /}, headers: {Authorization: {equals: 'Basic ZWxhc3RpYzoxMjM0NTY='}}}
          - {method: POST, path: {matches: '^/_bulk\?timeout=10000ms$'}, headers: {Authorization: {equals: 'Basic ZWxhc3RpYzoxMjM0NTY='}}, body: {matches: '^\{"index":\{"_index":"services"\}\}\n\{"test":"encrypted-password"\}\n$'}}
        respond: [{status: 200, headers: {X-Elastic-Product: Elasticsearch}, body: '{"version":{"number":"8.10.2"}}'}]
    steps:
      - {name: runtime-uses-decrypted-password, input: {path: /hello}, output: {status: 200, body: {equals: hello world}}, wait: 1s}
    after_shutdown:
      - path: {equals: '{{WORK_DIR}}/apisix-go-store.db'}
        bbolt_json:
          bucket: routes
          key: '1'
          fields:
            /plugins/elasticsearch-logger/auth/password: PTQvJEaPcNOXcOHeErC0XQ==
          forbidden_matches: ['123456']

  - name: multi-endpoint-route-setup
    source: {file: t/plugin/elasticsearch-logger.t, tests: [13]}
    config:
      routes:
        - id: multi-endpoint-setup
          uri: /hello
          plugins:
            elasticsearch-logger:
              endpoint_addrs: ['{{FIXTURE.sink.URL}}', 'http://localhost:{{FIXTURE.sink.PORT}}']
