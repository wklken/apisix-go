cases:
  - name: valid-schema
    config:
      routes:
        - id: example-valid-schema
          uri: /example
          plugins:
            example-plugin:
              i: 1
              s: value
              t: [1]
          upstream: &fixture_route
            type: roundrobin
            nodes:
              "{{UPSTREAM_ADDR}}": 1
    input:
      path: /example
    upstream: &fixture
      respond:
        status: 200
        body: done
    output: &success
      status: 200
      body:
        equals: done

  - name: missing-required-property
    config:
      routes:
        - id: example-missing-i
          uri: /example
          plugins:
            example-plugin:
              s: value
              t: [1]
          upstream: *fixture_route
    input:
      path: /example
    upstream: *fixture
    output:
      status: 404
      logs:
        matches: "build route example-missing-i fail:.*missing properties: 'i'"

  - name: reject-number-below-minimum
    config:
      routes:
        - id: example-negative-i
          uri: /example
          plugins:
            example-plugin:
              i: -1
              s: value
              t: [1, 2]
          upstream: *fixture_route
    input:
      path: /example
    upstream: *fixture
    output:
      status: 404
      logs:
        matches: 'build route example-negative-i fail:.*must be >= 0 but found -1'

  - name: reject-wrong-string-type
    config:
      routes:
        - id: example-wrong-string
          uri: /example
          plugins:
            example-plugin:
              i: 1
              s: 123
              t: [1]
          upstream: *fixture_route
    input:
      path: /example
    upstream: *fixture
    output:
      status: 404
      logs:
        matches: 'build route example-wrong-string fail:.*expected string'

  - name: reject-empty-array
    config:
      routes:
        - id: example-empty-array
          uri: /example
          plugins:
            example-plugin:
              i: 1
              s: value
              t: []
          upstream: *fixture_route
    input:
      path: /example
    upstream: *fixture
    output:
      status: 404
      logs:
        matches: 'build route example-empty-array fail:.*minimum 1 items required'

  - name: load-and-filter-configured-plugin
    runtime:
      plugins: [example-plugin]
    config:
      routes:
        - id: example-loaded
          uri: /example
          plugins:
            example-plugin:
              i: 1
              s: value
              t: [1, 2]
          upstream: *fixture_route
    input:
      path: /example
    upstream: *fixture
    output: *success

  - name: route-and-body-filter-phases
    runtime:
      plugins: [example-plugin]
    config:
      routes:
        - id: example-route
          uri: /server_port
          plugins:
            example-plugin:
              i: 11
              ip: '{{FIXTURE.override.HOST}}'
              port: '{{FIXTURE.override.PORT}}'
          upstream:
            type: roundrobin
            nodes:
              '{{FIXTURE.primary.ADDR}}': 1
    fixtures:
      - name: primary
        kind: http
        expect_requests: 0
        respond:
          - status: 200
            body: default-upstream
      - name: override
        kind: http
        expect:
          - path:
              equals: /server_port
        respond:
          - status: 200
            body: configured-example-override
    steps:
      - name: configured-override-fixture-is-reached
        input:
          path: /server_port
        output:
          status: 200
          body:
            equals: configured-example-override
