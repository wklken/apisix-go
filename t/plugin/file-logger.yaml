cases:
  - name: cached-file-stays-unlinked
    config:
      plugin_metadata:
        - id: file-logger
          log_format: {host: $host, client_ip: $remote_addr}
      routes:
        - id: file-reopen
          uri: /hello
          plugins:
            file-logger: {path: '{{WORK_DIR}}/reopen.log'}
          upstream: &primary_upstream
            type: roundrobin
            nodes: {'{{FIXTURE.primary.ADDR}}': 1}
    fixtures:
      - name: primary
        kind: http
        expect: [{path: {matches: "^/"}}]
        count: {at_least: 2, at_most: 2}
        respond: [{status: 200, body: "hello world\n"}]
    steps:
      - name: first-request-creates-and-caches-file
        input: {path: /hello}
        output: {status: 200, body: {equals: "hello world\n"}}
        wait: 1100ms
        file_assertions:
          - path: {equals: '{{WORK_DIR}}/reopen.log'}
            body: {matches: '"client_ip":"127\.0\.0\.1"'}
          - path: {equals: '{{WORK_DIR}}/reopen.log'}
            body: {matches: '"route_id":"file-reopen"'}
          - path: {equals: '{{WORK_DIR}}/reopen.log'}
            body: {matches: '"host":"127\.0\.0\.1"'}
      - name: unlinked-cached-file-is-not-recreated
        actions:
          - remove: '{{WORK_DIR}}/reopen.log'
        input: {path: /hello}
        output: {status: 200, body: {equals: "hello world\n"}}
        wait: 1100ms
        file_assertions:
          - path: {equals: '{{WORK_DIR}}/reopen.log'}
            absent: true

  - name: sigusr1-reopens-cached-file
    config:
      plugin_metadata:
        - id: file-logger
          log_format: {host: $host, client_ip: $remote_addr}
      routes:
        - id: file-reopen
          uri: /hello
          plugins:
            file-logger: {path: '{{WORK_DIR}}/reopen.log'}
          upstream: *primary_upstream
    fixtures:
      - name: primary
        kind: http
        expect: [{path: {matches: "^/"}}]
        count: {at_least: 3, at_most: 3}
        respond: [{status: 200, body: "hello world\n"}]
    steps:
      - name: pre-signal-request-creates-and-opens-file
        input: {path: /hello}
        output: {status: 200, body: {equals: "hello world\n"}}
        wait: 1100ms
        file_assertions:
          - path: {equals: '{{WORK_DIR}}/reopen.log'}
            body: {matches: '"client_ip":"127\.0\.0\.1"'}
          - path: {equals: '{{WORK_DIR}}/reopen.log'}
            body: {matches: '"route_id":"file-reopen"'}
          - path: {equals: '{{WORK_DIR}}/reopen.log'}
            body: {matches: '"host":"127\.0\.0\.1"'}
      - name: sigusr1-reopens-the-file
        actions:
          - remove: '{{WORK_DIR}}/reopen.log'
          - signal: SIGUSR1
          - wait: 50ms
        input: {path: /hello}
        output:
          status: 200
          body: {equals: "hello world\n"}
          logs: {matches: 'reopen cached log file: .*reopen\.log'}
        wait: 1100ms
        file_assertions:
          - path: {equals: '{{WORK_DIR}}/reopen.log'}
            body: {matches: '"client_ip":"127\.0\.0\.1"'}
          - path: {equals: '{{WORK_DIR}}/reopen.log'}
            body: {matches: '"route_id":"file-reopen"'}
          - path: {equals: '{{WORK_DIR}}/reopen.log'}
            body: {matches: '"host":"127\.0\.0\.1"'}
      - name: reopened-file-is-cached-again
        actions:
          - remove: '{{WORK_DIR}}/reopen.log'
        input: {path: /hello}
        output: {status: 200, body: {equals: "hello world\n"}}
        wait: 1100ms
        file_assertions:
          - path: {equals: '{{WORK_DIR}}/reopen.log'}
            absent: true

  - name: metadata-format-and-cached-file-write
    config:
      plugin_metadata:
        - id: file-logger
          log_format: {host: $host, client_ip: $remote_addr}
      routes:
        - id: file-metadata-format
          uri: /hello
          plugins:
            file-logger: {path: '{{WORK_DIR}}/metadata-format.log'}
          upstream: *primary_upstream
    fixtures:
      - name: primary
        kind: http
        expect: [{path: {matches: "^/"}}]
        count: {at_least: 2, at_most: 2}
        respond: [{status: 200, body: "hello world\n"}]
    steps:
      - name: first-request-writes-metadata-format
        input: {path: /hello}
        output: {status: 200, body: {equals: "hello world\n"}}
      - name: second-request-writes-through-cached-file
        input: {path: /hello}
        output: {status: 200, body: {equals: "hello world\n"}}
    after_shutdown:
      - path: {equals: '{{WORK_DIR}}/metadata-format.log'}
        body:
          matches: '(?s)^(?:\{[^\n]*"host":"127\.0\.0\.1"[^\n]*\}\n){2}$'
      - path: {equals: '{{WORK_DIR}}/metadata-format.log'}
        body:
          matches: '(?s)^(?:\{[^\n]*"client_ip":"127\.0\.0\.1"[^\n]*\}\n){2}$'
      - path: {equals: '{{WORK_DIR}}/metadata-format.log'}
        body:
          matches: '(?s)^(?:\{[^\n]*"route_id":"file-metadata-format"[^\n]*\}\n){2}$'

  - name: missing-parent-open-error
    config:
      routes:
        - id: file-open-error
          uri: /hello
          plugins:
            file-logger: {path: '{{WORK_DIR}}/missing/file.log'}
          upstream: *primary_upstream
    fixtures:
      - name: primary
        kind: http
        expect: [{path: {matches: "^/"}}]
        count: {at_least: 1, at_most: 1}
        respond: [{status: 200, body: "hello world\n"}]
    steps:
      - name: proxy-response-survives-log-open-error
        input: {path: /hello}
        output:
          status: 200
          body: {equals: "hello world\n"}
          logs:
            matches: 'failed to open file: .*/missing/file\.log, error info: .*no such file or directory'
    after_shutdown:
      - path: {equals: '{{WORK_DIR}}/missing/file.log'}
        absent: true

  - name: route-log-format-without-metadata
    config:
      routes:
        - id: file-route-format-no-metadata
          uri: /hello
          plugins:
            file-logger:
              path: '{{WORK_DIR}}/route-format-no-metadata.log'
              log_format: {host: $host, client_ip: $remote_addr}
          upstream: *primary_upstream
    fixtures:
      - name: primary
        kind: http
        expect: [{path: {matches: "^/"}}]
        count: {at_least: 1, at_most: 1}
        respond: [{status: 200, body: "hello world\n"}]
    steps:
      - name: block-seven-route-format-includes-client-ip
        input: {path: /hello}
        output: {status: 200, body: {equals: "hello world\n"}}
    after_shutdown:
      - path: {equals: '{{WORK_DIR}}/route-format-no-metadata.log'}
        body: {matches: '^\{[^\n]*"host":"127\.0\.0\.1"[^\n]*\}\n$'}
      - path: {equals: '{{WORK_DIR}}/route-format-no-metadata.log'}
        body: {matches: '^\{[^\n]*"client_ip":"127\.0\.0\.1"[^\n]*\}\n$'}
      - path: {equals: '{{WORK_DIR}}/route-format-no-metadata.log'}
        body: {matches: '^\{[^\n]*"route_id":"file-route-format-no-metadata"[^\n]*\}\n$'}

  - name: route-log-format-wins-over-metadata
    config:
      plugin_metadata:
        - id: file-logger
          log_format: {host: $host}
      routes:
        - id: file-route-format-with-metadata
          uri: /hello
          plugins:
            file-logger:
              path: '{{WORK_DIR}}/route-format-with-metadata.log'
              log_format: {host: $host, client_ip: $remote_addr}
          upstream: *primary_upstream
    fixtures:
      - name: primary
        kind: http
        expect: [{path: {matches: "^/"}}]
        count: {at_least: 1, at_most: 1}
        respond: [{status: 200, body: "hello world\n"}]
    steps:
      - name: block-nine-route-format-still-wins-over-metadata
        input: {path: /hello}
        output: {status: 200, body: {equals: "hello world\n"}}
    after_shutdown:
      - path: {equals: '{{WORK_DIR}}/route-format-with-metadata.log'}
        body: {matches: '^\{[^\n]*"host":"127\.0\.0\.1"[^\n]*\}\n$'}
      - path: {equals: '{{WORK_DIR}}/route-format-with-metadata.log'}
        body: {matches: '^\{[^\n]*"client_ip":"127\.0\.0\.1"[^\n]*\}\n$'}
      - path: {equals: '{{WORK_DIR}}/route-format-with-metadata.log'}
        body: {matches: '^\{[^\n]*"route_id":"file-route-format-with-metadata"[^\n]*\}\n$'}

  - name: nested-format-and-depth-limit
    config:
      routes:
        - id: file-nested-format
          uri: /hello
          plugins:
            file-logger:
              path: '{{WORK_DIR}}/nested.log'
              log_format:
                host: $host
                client_ip: $remote_addr
                request:
                  method: $request_method
                  uri: $request_uri
                  headers: {user_agent: $http_user_agent}
                response: {status: $status}
          upstream: *primary_upstream
        - id: file-depth-limit
          uri: /depth
          plugins:
            file-logger:
              path: '{{WORK_DIR}}/depth.log'
              log_format:
                a: {b: {c: {d: {e: {f: {g: $host}}}}}}
          upstream: *primary_upstream
    fixtures:
      - name: primary
        kind: http
        expect: [{path: {matches: "^/"}}]
        count: {at_least: 2, at_most: 2}
        respond: [{status: 200, body: "hello world\n"}]
    steps:
      - name: nested-objects-resolve-nginx-variables
        input:
          path: /hello
          headers: {User-Agent: pinned-agent}
        output: {status: 200, body: {equals: "hello world\n"}}
      - name: depth-after-five-is-truncated-and-warned
        input: {path: /depth}
        output:
          status: 200
          body: {equals: "hello world\n"}
          logs: {matches: 'log_format nesting exceeds max depth 5, truncating'}
    after_shutdown:
      - path: {equals: '{{WORK_DIR}}/nested.log'}
        body: {matches: '"method":"GET"'}
      - path: {equals: '{{WORK_DIR}}/nested.log'}
        body: {matches: '"uri":"/hello"'}
      - path: {equals: '{{WORK_DIR}}/nested.log'}
        body: {matches: '"headers":\{"user_agent":"pinned-agent"\}'}
      - path: {equals: '{{WORK_DIR}}/nested.log'}
        body: {matches: '"response":\{"status":200\}'}
      - path: {equals: '{{WORK_DIR}}/nested.log'}
        body: {matches: '"host":"127\.0\.0\.1"'}
      - path: {equals: '{{WORK_DIR}}/nested.log'}
        body: {matches: '"client_ip":"127\.0\.0\.1"'}
      - path: {equals: '{{WORK_DIR}}/nested.log'}
        body: {matches: '"route_id":"file-nested-format"'}
      - path: {equals: '{{WORK_DIR}}/depth.log'}
        body:
          matches: '"a":\{"b":\{"c":\{"d":\{"e":\{\}\}\}\}\}'

  - name: metadata-path-is-used
    config:
      plugin_metadata:
        - id: file-logger
          path: '{{WORK_DIR}}/metadata-path.log'
      routes:
        - id: file-metadata-path
          uri: /hello
          plugins:
            file-logger: {}
          upstream: *primary_upstream
    fixtures:
      - name: primary
        kind: http
        expect: [{path: {matches: "^/"}}]
        count: {at_least: 1, at_most: 1}
        respond: [{status: 200, body: "hello world\n"}]
    steps:
      - name: request-logs-to-metadata-path
        input: {path: /hello}
        output: {status: 200, body: {equals: "hello world\n"}}
    after_shutdown:
      - path: {equals: '{{WORK_DIR}}/metadata-path.log'}
        body: {matches: '"route_id":"file-metadata-path"'}

  - name: response-body-capture
    config:
      routes:
        - id: file-response-body
          uri: /hello
          plugins:
            file-logger:
              path: '{{WORK_DIR}}/response-body.log'
              include_resp_body: true
          upstream: *primary_upstream
    fixtures:
      - name: primary
        kind: http
        expect: [{path: {matches: "^/"}}]
        count: {at_least: 1, at_most: 1}
        respond: [{status: 200, body: "hello world\n"}]
    steps:
      - name: response-body-is-logged
        input: {path: /hello}
        output: {status: 200, body: {equals: "hello world\n"}}
    after_shutdown:
      - path: {equals: '{{WORK_DIR}}/response-body.log'}
        body: {matches: '"body":"hello world\\n"'}

  - name: response-body-expression
    config:
      routes:
        - id: file-response-expression
          uri: /hello
          plugins:
            file-logger:
              path: '{{WORK_DIR}}/response-expression.log'
              include_resp_body: true
              include_resp_body_expr: [[arg_foo, ==, bar]]
          upstream: *primary_upstream
        - id: file-response-expression-private
          uri: /privacy
          plugins:
            file-logger:
              path: '{{WORK_DIR}}/response-expression-private.log'
              log_format: {resp_body: $resp_body}
              include_resp_body: true
              include_resp_body_expr: [[arg_foo, ==, bar]]
          upstream: *primary_upstream
    fixtures:
      - name: primary
        kind: http
        expect: [{path: {matches: "^/"}}]
        count: {at_least: 3, at_most: 3}
        respond: [{status: 200, body: "hello world\n"}]
    steps:
      - name: matching-query-captures-response
        input: {path: '/hello?foo=bar'}
        output: {status: 200, body: {equals: "hello world\n"}}
      - name: nonmatching-query-omits-response-body
        input: {path: '/hello?name=pix'}
        output: {status: 200, body: {equals: "hello world\n"}}
      - name: custom-response-variable-keeps-nonmatching-body-private
        input: {path: '/privacy?name=pix'}
        output: {status: 200, body: {equals: "hello world\n"}}
    after_shutdown:
      - path: {equals: '{{WORK_DIR}}/response-expression.log'}
        body: {matches: '"uri":"/hello\?foo=bar"'}
      - path: {equals: '{{WORK_DIR}}/response-expression.log'}
        body: {matches: '"uri":"/hello\?name=pix"'}
      - path: {equals: '{{WORK_DIR}}/response-expression.log'}
        body: {matches: '^[^\n]*"body":"hello world\\n"[^\n]*\n[^\n]*\n$'}
      - path: {equals: '{{WORK_DIR}}/response-expression.log'}
        body: {not_matches: '\n[^\n]*"body":'}
      - path: {equals: '{{WORK_DIR}}/response-expression-private.log'}
        body: {matches: '"resp_body":""'}
      - path: {equals: '{{WORK_DIR}}/response-expression-private.log'}
        body: {not_matches: 'hello world'}

  - name: metadata-resp-body-variable
    config:
      plugin_metadata:
        - id: file-logger
          log_format: {host: $host, client_ip: $remote_addr, resp_body: $resp_body}
      routes:
        - id: file-metadata-resp-body
          uri: /hello
          plugins:
            file-logger:
              path: '{{WORK_DIR}}/metadata-response-body.log'
              include_resp_body: true
          upstream: *primary_upstream
    fixtures:
      - name: primary
        kind: http
        expect: [{path: {matches: "^/"}}]
        count: {at_least: 1, at_most: 1}
        respond: [{status: 200, body: "hello world\n"}]
    steps:
      - name: metadata-variable-sees-captured-response
        input: {path: /hello}
        output: {status: 200, body: {equals: "hello world\n"}}
    after_shutdown:
      - path: {equals: '{{WORK_DIR}}/metadata-response-body.log'}
        body: {matches: '"resp_body":"hello world\\n"'}
      - path: {equals: '{{WORK_DIR}}/metadata-response-body.log'}
        body: {matches: '"host":"127\.0\.0\.1"'}
      - path: {equals: '{{WORK_DIR}}/metadata-response-body.log'}
        body: {matches: '"client_ip":"127\.0\.0\.1"'}
      - path: {equals: '{{WORK_DIR}}/metadata-response-body.log'}
        body: {matches: '"route_id":"file-metadata-resp-body"'}

  - name: request-match-controls-file-write
    config:
      routes:
        - id: file-request-match
          uri: /hello
          plugins:
            file-logger:
              path: '{{WORK_DIR}}/match.log'
              match: [[[arg_name, ==, jack]]]
              log_format: {request: $request}
          upstream: *primary_upstream
    fixtures:
      - name: primary
        kind: http
        expect: [{path: {matches: "^/"}}]
        count: {at_least: 2, at_most: 2}
        respond: [{status: 200, body: "hello world\n"}]
    steps:
      - name: matching-request-is-written
        input: {path: '/hello?name=jack'}
        output: {status: 200, body: {equals: "hello world\n"}}
        wait: 1100ms
        file_assertions:
          - path: {equals: '{{WORK_DIR}}/match.log'}
            body: {matches: '"request":"GET /hello\?name=jack HTTP/1\.1"'}
          - path: {equals: '{{WORK_DIR}}/match.log'}
            body: {matches: '"route_id":"file-request-match"'}
      - name: nonmatching-request-does-not-recreate-unlinked-file
        actions:
          - remove: '{{WORK_DIR}}/match.log'
        input: {path: '/hello?name=tony'}
        output: {status: 200, body: {equals: "hello world\n"}}
        wait: 1100ms
        file_assertions:
          - path: {equals: '{{WORK_DIR}}/match.log'}
            absent: true

  - name: request-body-capture
    config:
      routes:
        - id: file-request-body
          uri: /hello
          plugins:
            file-logger:
              path: '{{WORK_DIR}}/request-body.log'
              include_req_body: true
          upstream: *primary_upstream
    fixtures:
      - name: primary
        kind: http
        expect:
          - method: POST
            path: {equals: /hello}
            body: {equals: body-data}
        respond: [{status: 200, body: "hello world\n"}]
    steps:
      - name: request-body-is-restored-upstream-and-logged
        input: {method: POST, path: /hello, body: body-data}
        output: {status: 200, body: {equals: "hello world\n"}}
    after_shutdown:
      - path: {equals: '{{WORK_DIR}}/request-body.log'}
        body: {matches: '"body":"body-data"'}

  - name: request-body-expression
    config:
      routes:
        - id: file-request-expression
          uri: /hello
          plugins:
            file-logger:
              path: '{{WORK_DIR}}/request-expression.log'
              include_req_body: true
              include_req_body_expr: [[arg_log_body, ==, 'yes']]
          upstream: *primary_upstream
    fixtures:
      - name: primary
        kind: http
        expect: [{path: {matches: "^/"}}]
        count: {at_least: 2, at_most: 2}
        respond: [{status: 200, body: "hello world\n"}]
    steps:
      - name: matching-query-captures-request-body
        input: {method: POST, path: '/hello?log_body=yes', body: '{"foo":"bar"}'}
        output: {status: 200, body: {equals: "hello world\n"}}
      - name: nonmatching-query-omits-request-body
        input: {method: POST, path: '/hello?log_body=no', body: '{"foo":"b"}'}
        output: {status: 200, body: {equals: "hello world\n"}}
    after_shutdown:
      - path: {equals: '{{WORK_DIR}}/request-expression.log'}
        body: {matches: '"uri":"/hello\?log_body=yes"'}
      - path: {equals: '{{WORK_DIR}}/request-expression.log'}
        body: {matches: '"body":"\{\\"foo\\":\\"bar\\"\}"'}
      - path: {equals: '{{WORK_DIR}}/request-expression.log'}
        body: {matches: '"uri":"/hello\?log_body=no"'}
      - path: {equals: '{{WORK_DIR}}/request-expression.log'}
        body: {matches: '^[^\n]*"body":"\{\\"foo\\":\\"bar\\"\}"[^\n]*\n[^\n]*\n$'}
      - path: {equals: '{{WORK_DIR}}/request-expression.log'}
        body: {not_matches: '\n[^\n]*"body":'}

  - name: gzip-response-logs-uncompressed-body
    config:
      routes:
        - id: file-gzip-response
          uri: /hello
          plugins:
            file-logger:
              path: '{{WORK_DIR}}/gzip-response.log'
              include_resp_body: true
            gzip:
              min_length: 10
          upstream: *primary_upstream
    fixtures:
      - name: primary
        kind: http
        expect: [{path: {matches: "^/"}}]
        count: {at_least: 1, at_most: 1}
        respond:
          - status: 200
            headers: {Content-Type: text/html}
            body: "hello world\n"
    steps:
      - name: client-receives-gzip-and-log-keeps-plain-body
        input:
          path: /hello
          headers: {Accept-Encoding: gzip}
        output:
          status: 200
          headers:
            Content-Encoding: {equals: gzip}
          gzip_body: {equals: "hello world\n"}
          logs:
            not_matches: 'try decode compressed data err: inflate gzip err'
    after_shutdown:
      - path: {equals: '{{WORK_DIR}}/gzip-response.log'}
        body: {matches: '"body":"hello world\\n"'}
