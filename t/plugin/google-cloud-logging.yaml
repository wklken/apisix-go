          plugins:
            google-cloud-logging:
              log_id: syslog
              batch_max_size: 1
              inactive_timeout: 1
          upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
    fixtures:
      - {name: primary, kind: http, expect_requests: 0, respond: [{status: 200, body: hello world}]}
    steps:
      - name: rejected-route-is-not-installed
        input: {path: /hello}
        output:
          status: 404
          logs: {matches: 'build route gcl-missing-auth fail:.*google-cloud-logging.*(auth_config|auth_file|matches none|one schema)'}

