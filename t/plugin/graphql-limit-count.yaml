sources:
  - repository: https://github.com/apache/apisix
    commit: 9ef2ecab67f652d38365049613610ef649bb4ad0
    file: t/plugin/graphql-limit-count.t
    tests: 26
cases:
  - name: graphql-limit-count-local-route-count-four-test-1
    source: {file: t/plugin/graphql-limit-count.t, tests: [1]}
    config:
      routes:
        - id: graphql-limit-count-test-1
          uri: /hello
          plugins:
            graphql-limit-count: {count: 4, time_window: 60, rejected_code: 503, key: remote_addr}
          upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
    fixtures:
      - {name: primary, kind: http, expect_requests: 1, expect: [{method: POST, path: {equals: /hello}}], respond: [{status: 200, body: graphql upstream}]}
    steps:
      - name: configured-local-route-is-runnable
        input: {method: POST, path: /hello, headers: {Content-Type: application/json}, body: '{"query":"{ hello }"}'}
        output: {status: 200, body: {equals: graphql upstream}, headers: {X-RateLimit-Limit: {equals: "4"}, X-RateLimit-Remaining: {equals: "3"}}}

  - name: graphql-limit-count-depth-four-exhausts-local-quota-test-2
    source: {file: t/plugin/graphql-limit-count.t, tests: [2]}
    config:
      routes:
        - id: graphql-limit-count-test-2
          uri: /hello
          plugins:
            graphql-limit-count: {count: 4, time_window: 60, rejected_code: 503, key: remote_addr}
          upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
    fixtures:
      - {name: primary, kind: http, expect_requests: 1, expect: [{method: POST, path: {equals: /hello}}], respond: [{status: 200, body: graphql upstream}]}
    steps:
      - name: depth-four-query-consumes-the-quota
        input: {method: POST, path: /hello, headers: {Content-Type: application/json}, body: '{"query":"query awesomeGraphqlQuery { foo { bar, baz { boo, bee, baa { bar_id, lol } } } }"}'}
        output: {status: 200, body: {equals: graphql upstream}, headers: {X-RateLimit-Remaining: {equals: "0"}}}
      - name: subsequent-depth-four-query-is-rejected
        input: {method: POST, path: /hello, headers: {Content-Type: application/json}, body: '{"query":"query awesomeGraphqlQuery { foo { bar, baz { boo, bee, baa { bar_id, lol } } } }"}'}
        output: {status: 503, body: {matches: Limit exceeded}, headers: {X-RateLimit-Remaining: {equals: "0"}}}

  - name: graphql-limit-count-head-method-is-rejected-test-3
    source: {file: t/plugin/graphql-limit-count.t, tests: [3]}
    config:
      routes:
        - id: graphql-limit-count-test-3
          uri: /hello
          plugins:
            graphql-limit-count: {count: 10, time_window: 60, key: remote_addr}
          upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
    fixtures:
      - {name: primary, kind: http, expect_requests: 0, respond: [{status: 200, body: graphql upstream}]}
    steps:
      - name: head-never-reaches-upstream
        input: {method: HEAD, path: /hello}
        output: {status: 405}

  - name: graphql-limit-count-empty-post-body-is-rejected-test-4
    source: {file: t/plugin/graphql-limit-count.t, tests: [4]}
    config:
      routes:
        - id: graphql-limit-count-test-4
          uri: /hello
          plugins:
            graphql-limit-count: {count: 10, time_window: 60, key: remote_addr}
          upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
    fixtures:
      - {name: primary, kind: http, expect_requests: 0, respond: [{status: 200, body: graphql upstream}]}
    steps:
      - name: empty-body-never-reaches-upstream
        input: {method: POST, path: /hello, headers: {Content-Type: application/json}}
        output: {status: 400, body: {matches: "can't get graphql request body"}}

