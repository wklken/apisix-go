      - {name: primary, kind: http, expect_requests: 1, expect: [{method: POST, path: {equals: /hello}}], respond: [{status: 200, body: graphql upstream}]}
    steps:
      - name: cyclic-fragment-terminates-and-reaches-upstream
        input: {method: POST, path: /hello, headers: {Content-Type: application/json}, body: '{"query":"query { user { ...CycleA } } fragment CycleA on User { id { ...CycleA } }"}'}
        output: {status: 200, body: {equals: graphql upstream}, headers: {X-RateLimit-Remaining: {matches: '^[0-9]+$'}}}

  - name: graphql-limit-count-max-size-route-test-23
