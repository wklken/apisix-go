  - name: graphql-limit-count-fragment-cycle-is-bounded-test-22
    source: {file: t/plugin/graphql-limit-count.t, tests: [22]}
    config:
      routes:
        - id: graphql-limit-count-test-22
          uri: /hello
          plugins:
            graphql-limit-count: {count: 20, time_window: 60, rejected_code: 503, key: remote_addr, show_limit_quota_header: true}
