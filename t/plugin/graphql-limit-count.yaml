  - name: graphql-limit-count-redis-route-test-14
    source: {file: t/plugin/graphql-limit-count.t, tests: [14]}
    config:
      routes:
        - id: graphql-limit-count-test-14
          uri: /hello
          plugins:
            graphql-limit-count: {allow_degradation: false, count: 5, time_window: 60, rejected_code: 503, key: remote_addr, key_type: var, policy: redis, redis_host: '{{FIXTURE.redis.HOST}}', redis_port: '{{FIXTURE.redis.PORT}}', redis_database: 0, redis_timeout: 1000, show_limit_quota_header: true}
          upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
    fixtures:
      - {name: primary, kind: http, expect_requests: 1, expect: [{method: POST, path: {equals: /hello}}], respond: [{status: 200, body: graphql upstream}]}
      - {name: redis, kind: redis, redis: {ignore_negotiation: true, allow_unasserted_commands: true, value_matches: {'^plugin-graphql-limit-count:route:graphql-limit-count-test-14:127\.0\.0\.1$': "1"}}}
    steps:
      - name: configured-redis-route-is-runnable
        input: {method: POST, path: /hello, headers: {Content-Type: application/json}, body: '{"query":"{ hello }"}'}
        output: {status: 200, body: {equals: graphql upstream}, headers: {X-RateLimit-Remaining: {equals: "4"}}}

