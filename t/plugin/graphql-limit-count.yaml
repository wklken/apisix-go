      - {name: primary, kind: http, expect_requests: 0, respond: [{status: 200, body: graphql upstream}]}
    steps:
      - name: oversized-query-never-reaches-upstream
        input: {method: POST, path: /hello, headers: {Content-Type: application/json}, body: '{"query":"query awesomeGraphqlQuery { foo { bar, baz { boo, bee, baa { bar_id, lol, extra_field_1, extra_field_2, extra_field_3 } } } }"}'}
