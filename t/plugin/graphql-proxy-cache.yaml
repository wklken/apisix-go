    steps:
      - name: prime-get-query-without-variables
        input: {method: GET, path: '/graphql?query=query%20Q%28%24id%3AID%21%29%7Bnode%28id%3A%24id%29%7Bid%7D%7D'}
        output: {status: 200, headers: {Apisix-Cache-Status: {equals: MISS}}}
      - name: different-get-variables-create-miss
        input: {method: GET, path: '/graphql?query=query%20Q%28%24id%3AID%21%29%7Bnode%28id%3A%24id%29%7Bid%7D%7D&variables=%7B%22id%22%3A%222%22%7D'}
        output: {status: 200, body: {equals: '{"data":{"kind":"variables"}}'}, headers: {Apisix-Cache-Status: {equals: MISS}}}

  - name: disk-get-variables-hit-test-7
