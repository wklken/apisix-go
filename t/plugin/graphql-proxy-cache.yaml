        input: {method: POST, path: /graphql, headers: {Content-Type: application/graphql}, body: 'query Read { hello } mutation Write { update }'}
        output: {status: 200, body: {equals: '{"data":{"mutated":true}}'}, headers: {Apisix-Cache-Status: {equals: BYPASS}}}

  - name: graphql-memory-purge-removes-entry-test-16
    runtime: {plugins: [graphql-proxy-cache, prometheus], apisix: {proxy_cache: {zones: [{name: gql-purge-memory, memory_size: 10m}]}}}
    config:
      routes:
        - {id: gql-purge-memory-route, uri: /graphql, plugins: {graphql-proxy-cache: {cache_strategy: memory, cache_zone: gql-purge-memory, cache_ttl: 60}}, upstream: {type: roundrobin, nodes: {'{{FIXTURE.origin.ADDR}}': 1}}}
    fixtures:
      - {name: origin, kind: http, expect_requests: 2, expect: [{path: {equals: /graphql}}, {path: {equals: /graphql}}], respond: [{status: 200, body: '{"data":{"version":1}}'}, {status: 200, body: '{"data":{"version":2}}'}]}
    steps:
      - name: prime-memory-entry-and-capture-key
        input: {method: POST, path: /graphql, headers: {Content-Type: application/json}, body: '{"query":"{ hello }"}'}
