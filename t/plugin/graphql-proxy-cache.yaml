        output: {status: 200, headers: {Apisix-Cache-Status: {equals: MISS}}}
      - name: reuse-get-variables-disk-entry
        input: {method: GET, path: '/graphql?query=query%20Q%28%24id%3AID%21%29%7Bnode%28id%3A%24id%29%7Bid%7D%7D&variables=%7B%22id%22%3A%222%22%7D'}
        output: {status: 200, body: {equals: '{"data":{"kind":"get-vars-hit"}}'}, headers: {Apisix-Cache-Status: {equals: HIT}}}

