cases:
  - name: disk-default-zone-accepts-route-test-1
    runtime: {apisix: {proxy_cache: {zones: [{name: disk_cache_one, disk_path: '{{WORK_DIR}}/cache/disk-one', disk_size: 10m}]}}}
    config:
      routes:
        - {id: gql-disk-1, uri: /graphql, plugins: {graphql-proxy-cache: {}}, upstream: {type: roundrobin, nodes: {'{{FIXTURE.origin.ADDR}}': 1}}}
    fixtures:
      - {name: origin, kind: http, expect_requests: 1, expect: [{path: {equals: /graphql}}], respond: [{status: 200, body: '{"data":{"kind":"default-disk"}}'}]}
    steps:
      - name: default-disk-route-serves-query
        input: {method: POST, path: /graphql, headers: {Content-Type: application/json}, body: '{"query":"{ hello }"}'}
        output: {status: 200, body: {equals: '{"data":{"kind":"default-disk"}}'}, headers: {Apisix-Cache-Status: {equals: MISS}}}

  - name: disk-post-json-query-misses-test-2
