    steps:
      - name: post-json-query-enters-disk-cache
        input: {method: POST, path: /graphql, headers: {Content-Type: application/json}, body: '{"query":"query { hello }"}'}
        output: {status: 200, body: {equals: '{"data":{"kind":"post-json"}}'}, headers: {Apisix-Cache-Status: {equals: MISS}}}

