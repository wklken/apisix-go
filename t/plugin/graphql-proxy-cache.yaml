        - {id: gql-get-large, uri: /graphql, plugins: {graphql-proxy-cache: {cache_strategy: memory, cache_zone: gql-memory-6}}, upstream: {type: roundrobin, nodes: {'{{FIXTURE.origin.ADDR}}': 1}}}
