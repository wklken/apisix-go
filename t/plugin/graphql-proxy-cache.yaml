        output: {status: 200, headers: {Apisix-Cache-Status: {equals: MISS}}}
      - name: reuse-post-json-disk-entry
        input: {method: POST, path: /graphql, headers: {Content-Type: application/json}, body: '{"query":"query { hello }"}'}
        output: {status: 200, body: {equals: '{"data":{"kind":"post-json-hit"}}'}, headers: {Apisix-Cache-Status: {equals: HIT}}}

