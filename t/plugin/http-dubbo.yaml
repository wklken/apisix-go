sources:
  - repository: https://github.com/apache/apisix
    commit: 9ef2ecab67f652d38365049613610ef649bb4ad0
    file: t/plugin/http-dubbo.t
    tests: 5

cases:
  - name: pojo-serialized-request-and-response
    source: {file: t/plugin/http-dubbo.t, tests: [1]}
    config:
      routes:
        - id: http-dubbo-pojo
          uri: /t
          plugins:
            http-dubbo:
              service_name: org.apache.dubbo.backend.DubboSerializationTestService
              params_type_desc: Lorg/apache/dubbo/backend/PoJo;
              serialized: true
              method: testPoJo
              service_version: 1.0.0
          upstream:
            type: roundrobin
            nodes: {'{{FIXTURE.backend.ADDR}}': 1}
    fixtures:
      - name: backend
        kind: dubbo
        network_expect:
          - payload_base64: {equals: }
        network_respond:
          - payload_base64: 2rsGFAAAAAAAAAABAAAAqTEKeyJhQm9vbGVhbiI6dHJ1ZSwiYUJ5dGUiOjEsImFEb3VibGUiOjEuMSwiYUZsb2F0IjoxLjIsImFJbnQiOjIsImFMb25nIjozLCJhU2hvcnQiOjQsImFTdHJpbmciOiJhYSIsImFjaGFyYWN0ZXIiOiJhIiwic3RyaW5nTWFwIjp7ImtleSI6InZhbHVlIn0sInN0cmluZ3MiOlsiYWEiLCJiYiJdfQo=
    steps:
      - name: pojo-is-serialized-to-dubbo-and-returned
        input:
          method: POST
          path: /t
          body: '{"aBoolean":true,"aByte":1,"aDouble":1.1,"aFloat":1.2,"aInt":2,"aLong":3,"aShort":4,"aString":"aa","acharacter":"a","stringMap":{"key":"value"},"strings":["aa","bb"]}'
        output:
          status: 200
          body: {equals: '{"aBoolean":true,"aByte":1,"aDouble":1.1,"aFloat":1.2,"aInt":2,"aLong":3,"aShort":4,"aString":"aa","acharacter":"a","stringMap":{"key":"value"},"strings":["aa","bb"]}'}

  - name: pojo-array-serialized-request-and-response
    source: {file: t/plugin/http-dubbo.t, tests: [2]}
    config:
      routes:
        - id: http-dubbo-pojos
          uri: /t
          plugins:
            http-dubbo:
              service_name: org.apache.dubbo.backend.DubboSerializationTestService
              params_type_desc: '[Lorg/apache/dubbo/backend/PoJo;'
              serialized: true
              method: testPoJos
              service_version: 1.0.0
          upstream:
            type: roundrobin
            nodes: {'{{FIXTURE.backend.ADDR}}': 1}
    fixtures:
      - name: backend
        kind: dubbo
        network_expect:
          - payload_base64: {equals: }
        network_respond:
          - payload_base64: 2rsGFAAAAAAAAAABAAAAqzEKW3siYUJvb2xlYW4iOnRydWUsImFCeXRlIjoxLCJhRG91YmxlIjoxLjEsImFGbG9hdCI6MS4yLCJhSW50IjoyLCJhTG9uZyI6MywiYVNob3J0Ijo0LCJhU3RyaW5nIjoiYWEiLCJhY2hhcmFjdGVyIjoiYSIsInN0cmluZ01hcCI6eyJrZXkiOiJ2YWx1ZSJ9LCJzdHJpbmdzIjpbImFhIiwiYmIiXX1dCg==
    steps:
      - name: pojo-array-is-serialized-to-dubbo-and-returned
        input:
          method: POST
          path: /t
          body: '[{"aBoolean":true,"aByte":1,"aDouble":1.1,"aFloat":1.2,"aInt":2,"aLong":3,"aShort":4,"aString":"aa","acharacter":"a","stringMap":{"key":"value"},"strings":["aa","bb"]}]'
        output:
          status: 200
          body: {equals: '[{"aBoolean":true,"aByte":1,"aDouble":1.1,"aFloat":1.2,"aInt":2,"aLong":3,"aShort":4,"aString":"aa","acharacter":"a","stringMap":{"key":"value"},"strings":["aa","bb"]}]'}

  - name: connect-timeout-returns-bad-gateway
    source: {file: t/plugin/http-dubbo.t, tests: [3]}
    config:
      routes:
        - id: http-dubbo-timeout
          uri: /t
          plugins:
            http-dubbo:
              service_name: org.apache.dubbo.backend.DubboSerializationTestService
              params_type_desc: '[Lorg/apache/dubbo/backend/PoJo;'
              serialized: true
              method: testPoJos
              service_version: 1.0.0
              connect_timeout: 100
              read_timeout: 100
              send_timeout: 100
          upstream:
            type: roundrobin
            nodes: {'127.0.0.1:30881': 1}
    input: {method: GET, path: /t}
    output:
      status: 502
      logs: {matches: failed to connect to upstream}

  - name: void-response
    source: {file: t/plugin/http-dubbo.t, tests: [4]}
    config:
      routes:
        - id: http-dubbo-void
          uri: /t
          plugins:
            http-dubbo:
              service_name: org.apache.dubbo.backend.DubboSerializationTestService
              serialized: true
              method: testVoid
              service_version: 1.0.0
          upstream:
            type: roundrobin
            nodes: {'{{FIXTURE.backend.ADDR}}': 1}
    fixtures:
      - name: backend
        kind: dubbo
        network_expect:
          - payload_base64: {equals: 2rvGAAAAAAAAAAABAAAAWiIyLjAuMiIKIm9yZy5hcGFjaGUuZHViYm8uYmFja2VuZC5EdWJib1NlcmlhbGl6YXRpb25UZXN0U2VydmljZSIKIjEuMC4wIgoidGVzdFZvaWQiCiIiCnt9Cg==}
        network_respond:
          - payload_base64: 2rsGFAAAAAAAAAABAAAAAjIK
    steps:
      - name: void-response-is-returned-without-body
        input: {method: GET, path: /t}
        output: {status: 200, body: {equals: ''}}

  - name: upstream-failure-returns-internal-server-error
    source: {file: t/plugin/http-dubbo.t, tests: [5]}
    config:
      routes:
        - id: http-dubbo-failure
          uri: /t
          plugins:
            http-dubbo:
              service_name: org.apache.dubbo.backend.DubboSerializationTestService
              serialized: true
              method: testFailure
              service_version: 1.0.0
          upstream:
            type: roundrobin
            nodes: {'{{FIXTURE.backend.ADDR}}': 1}
    fixtures:
      - name: backend
        kind: dubbo
        network_expect:
          - payload_base64: {equals: 2rvGAAAAAAAAAAABAAAAXSIyLjAuMiIKIm9yZy5hcGFjaGUuZHViYm8uYmFja2VuZC5EdWJib1NlcmlhbGl6YXRpb25UZXN0U2VydmljZSIKIjEuMC4wIgoidGVzdEZhaWx1cmUiCiIiCnt9Cg==}
        network_respond:
          - payload_base64: 2rsGFAAAAAAAAAABAAAAQTAKeyJAdHlwZSI6ImphdmEubGFuZy5SdW50aW1lRXhjZXB0aW9uIiwibWVzc2FnZSI6InRlc3RGYWlsdXJlIn0K
    steps:
      - name: upstream-failure-is-internal-server-error
        input: {method: GET, path: /t}
        output: {status: 500}
