  - name: max-pending-overflow-and-capacity-recovery
    source: {file: t/plugin/http-logger3.t, tests: [1, 2]}
    config:
      plugin_metadata:
        - {id: http-logger, max_pending_entries: 1, log_format: {generation: first}}
      routes:
        - id: pending-overflow
          uri: /pending-overflow
          plugins:
            http-logger: {uri: '{{FIXTURE.firstSink.URL}}/logs', batch_max_size: 1, timeout: 3, max_retry_count: 0}
          upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
    fixtures:
      - {name: primary, kind: http, respond: [{status: 200, body: ok}]}
      - name: firstSink
        kind: http
        expect:
          - {body: {json_equals: '{"generation":"first"}'}}
          - {body: {json_equals: '{"generation":"first"}'}}
          - {body: {json_equals: '{"generation":"first"}'}}
          - {body: {json_equals: '{"generation":"first"}'}}
        respond:
          - {status: 200, delay: 1s}
          - {status: 200, delay: 1s}
          - {status: 200}
          - {status: 200}
    steps:
      - {name: third-entry-is-dropped-while-two-are-pending, repeat: 3, concurrency: 3, input: {path: /pending-overflow}, output: {status: 200, body: {equals: ok}, logs: {matches: 'max pending entries limit exceeded'}}}
      - name: same-processor-recovers-capacity-after-completed-deliveries
        actions: [{wait: 2500ms}]
        repeat: 2
        input: {path: /pending-overflow}
        output: {status: 200, body: {equals: ok}}
