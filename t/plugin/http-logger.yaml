  - name: expression-custom-override-and-nested-log-format
    source: {file: t/plugin/http-logger-log-format.t, tests: [14, 15, 16, 17, 18, 19, 20]}
    config:
      plugin_metadata:
        - {id: http-logger, log_format: {host: $host, labels: $a6_route_labels, client_ip: $remote_addr}}
      routes:
        - id: route-label-variable
          uri: /route-label-variable
          labels: {key: testvalue}
          plugins:
            http-logger:
              uri: '{{FIXTURE.sink.URL}}/logs'
              batch_max_size: 1
          upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
        - id: nested-expression
          uri: /nested-expression
          plugins:
            http-logger:
              uri: '{{FIXTURE.sink.URL}}/logs'
              batch_max_size: 1
              include_resp_body: true
              include_resp_body_expr:
                - [http_content_length, '<', 1024]
                - [http_content_type, in, [application/xml, application/json, text/plain, text/xml]]
              log_format: {source: nested-expression}
          upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
        - id: plugin-log-format
          uri: /plugin-log-format
          plugins:
            http-logger:
              uri: '{{FIXTURE.sink.URL}}/logs'
              batch_max_size: 1
              concat_method: new_line
              log_format: {x_ip: $remote_addr}
          upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
        - id: nested-log-format
          uri: /nested-log-format
          plugins:
            http-logger:
              uri: '{{FIXTURE.sink.URL}}/logs'
              batch_max_size: 1
              concat_method: json
              log_format:
                host: $host
                client_ip: $remote_addr
                request:
                  method: $request_method
                  uri: $request_uri
                  headers: {user_agent: $http_user_agent}
                response: {status: $status}
          upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
    fixtures:
      - {name: primary, kind: http, respond: [{status: 200, body: ok}]}
      - name: sink
        kind: http
        expect:
          - {body: {json_equals: '{"source":"nested-expression","response":{"body":"ok"}}'}}
          - {body: {matches: '^\{"client_ip":"[^"]+","host":"example.com","labels":\{"key":"testvalue"\}\}$'}}
          - {body: {matches: '^\{"x_ip":"[^"]+"\}$'}}
          - {body: {matches: '^\{"client_ip":"[^"]+","host":"nested.example.com","request":\{"headers":\{"user_agent":"http-logger-nested"\},"method":"GET","uri":"/nested-log-format\?ab=cd"\},"response":\{"status":200\}\}$'}}
        respond: [{status: 200}]
    steps:
      - {name: official-nested-in-expression-captures-response, input: {method: POST, path: /nested-expression, headers: {Content-Length: '4', Content-Type: text/plain}, body: tiny}, output: {status: 200, body: {equals: ok}}}
      - {name: custom-route-label-variable-resolves-object, input: {path: /route-label-variable, headers: {Host: example.com}}, output: {status: 200, body: {equals: ok}}}
      - {name: plugin-log-format-resolves-remote-address, input: {path: /plugin-log-format}, output: {status: 200, body: {equals: ok}}}
      - {name: nested-log-format-resolves-final-status, input: {path: '/nested-log-format?ab=cd', headers: {Host: nested.example.com, User-Agent: http-logger-nested}}, output: {status: 200, body: {equals: ok}}}

