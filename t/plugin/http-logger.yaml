          - {name: sink, kind: http, expect: [{body: {json_equals: '[{"generation":"buffered"},{"generation":"buffered"}]'}}], respond: [{status: 200}]}
        steps:
          - {name: first-entry-keeps-processor-in-use-past-one-and-a-half-seconds, wait: 1500ms, input: {path: /buffered-processor-lifecycle}, output: {status: 200, body: {equals: ok}}}
          - {name: second-entry-flushes-the-preserved-buffer, input: {path: /buffered-processor-lifecycle}, output: {status: 200, body: {equals: ok}}}

