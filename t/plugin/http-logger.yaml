              uri: /buffered-processor-lifecycle
              plugins:
                http-logger: {uri: '{{FIXTURE.sink.URL}}/logs', batch_max_size: 2, inactive_timeout: 5, log_format: {generation: buffered}}
              upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
        fixtures:
