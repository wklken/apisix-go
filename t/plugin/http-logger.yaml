              upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
        fixtures:
          - {name: primary, kind: http, respond: [{status: 200, body: ok}]}
          - name: sink
            kind: http
            expect:
              - {body: {json_equals: '{"generation":"current"}'}}
              - {body: {json_equals: '{"generation":"current"}'}}
              - {body: {json_equals: '{"generation":"current"}'}}
            respond: [{status: 200}, {status: 200}, {status: 200}]
        steps:
          - {name: create-and-use-current-processor, input: {path: /processor-lifecycle}, output: {status: 200, body: {equals: ok}}}
          - {name: current-processor-survives-half-second, actions: [{wait: 500ms}], input: {path: /processor-lifecycle}, output: {status: 200, body: {equals: ok}}}
          - {name: idle-delivery-worker-is-cleaned-and-current-processor-remains-usable, actions: [{wait: 1500ms}], input: {path: /processor-lifecycle}, output: {status: 200, body: {equals: ok}}}
      - name: buffered-in-use-processor-survives-stale-window
