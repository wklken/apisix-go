  - name: response-body-and-file-logger-interaction
    source: {file: t/plugin/http-logger.t, tests: [24, 25, 26, 27, 28, 29]}
    variants:
      - name: route-http-includes-response
        config:
          routes:
            - id: http-response-body
              uri: /http-response-body
              plugins:
                http-logger: {uri: '{{FIXTURE.sink.URL}}/logs', batch_max_size: 1, include_resp_body: true, log_format: {source: http-body}}
              upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
        fixtures:
          - {name: primary, kind: http, respond: [{status: 200, body: hello response}]}
          - {name: sink, kind: http, expect: [{body: {json_equals: '{"source":"http-body","response":{"body":"hello response"}}'}}], respond: [{status: 200}]}
        steps:
          - {name: route-http-includes-response, input: {path: /http-response-body}, output: {status: 200, body: {equals: hello response}}}
      - name: route-http-excludes-response-file-includes-response
        files:
          - {path: '{{WORK_DIR}}/route-access.log', body: ''}
        config:
          routes:
            - id: logger-interaction
              uri: /logger-interaction
              plugins:
                http-logger: {uri: '{{FIXTURE.sink.URL}}/logs', batch_max_size: 1, include_resp_body: false, log_format: {source: http}}
                file-logger: {path: '{{WORK_DIR}}/route-access.log', include_resp_body: true, log_format: {source: file}}
              upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
        fixtures:
          - {name: primary, kind: http, respond: [{status: 200, body: hello response}]}
          - {name: sink, kind: http, expect: [{body: {json_equals: '{"source":"http"}'}}], respond: [{status: 200}]}
        steps:
          - name: route-http-excludes-response-while-file-includes-it
            input: {path: /logger-interaction}
            output: {status: 200, body: {equals: hello response}}
            file_assertions:
              - {path: {equals: '{{WORK_DIR}}/route-access.log'}, body: {matches: '"source":"file".*"response":\{"body":"hello response"\}|"response":\{"body":"hello response"\}.*"source":"file"'}}
      - name: global-http-retains-response-with-global-and-route-file-loggers
        files:
          - {path: '{{WORK_DIR}}/global-access.log', body: ''}
          - {path: '{{WORK_DIR}}/route-access.log', body: ''}
        config:
          global_rules:
            - id: global-http-and-file
              plugins:
                http-logger: {uri: '{{FIXTURE.sink.URL}}/logs', batch_max_size: 1, include_resp_body: true, log_format: {source: global-http}}
                file-logger: {path: '{{WORK_DIR}}/global-access.log', include_resp_body: true, log_format: {source: global-file}}
          routes:
            - id: global-and-route-file
              uri: /global-and-route-file
              plugins:
                file-logger: {path: '{{WORK_DIR}}/route-access.log', include_resp_body: true, log_format: {source: route-file}}
              upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
        fixtures:
          - {name: primary, kind: http, respond: [{status: 200, body: hello response}]}
          - {name: sink, kind: http, expect: [{body: {json_equals: '{"source":"global-http","response":{"body":"hello response"}}'}}], respond: [{status: 200}]}
        steps:
          - name: global-http-keeps-response-with-both-file-loggers
            input: {path: /global-and-route-file}
            output: {status: 200, body: {equals: hello response}}
            file_assertions:
              - {path: {equals: '{{WORK_DIR}}/global-access.log'}, body: {matches: '"source":"global-file".*"response":\{"body":"hello response"\}|"response":\{"body":"hello response"\}.*"source":"global-file"'}}
              - {path: {equals: '{{WORK_DIR}}/route-access.log'}, body: {matches: '"source":"route-file".*"response":\{"body":"hello response"\}|"response":\{"body":"hello response"\}.*"source":"route-file"'}}

  - name: current-stale-and-buffered-processor-lifecycle
    source: {file: t/plugin/http-logger2.t, tests: [1, 2, 3, 4, 5]}
    variants:
