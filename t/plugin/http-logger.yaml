        - id: live-update
          uri: /live-update
          plugins:
            http-logger: {uri: '{{FIXTURE.old.URL}}/logs', batch_max_size: 2, inactive_timeout: 5, log_format: {sink: old}}
          upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
    fixtures:
      - {name: primary, kind: http, respond: [{status: 200, body: ok}]}
      - {name: old, kind: http, expect: [{body: {matches: '^\[?\{"sink":"old"\}\]?$'}}], respond: [{status: 200}]}
      - {name: new, kind: http, expect: [{body: {json_equals: '{"sink":"new"}'}}], respond: [{status: 200}]}
    steps:
      - {name: old-config-buffers-one-entry, input: {path: /live-update}, output: {status: 200, body: {equals: ok}}}
      - name: replacement-flushes-old-and-delivers-to-new
        config:
          routes:
            - id: live-update
              uri: /live-update
              plugins:
                http-logger: {uri: '{{FIXTURE.new.URL}}/logs', batch_max_size: 1, log_format: {sink: new}}
              upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
            - id: live-update-ready
              uri: /live-update-ready
              upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
        config_probe: {input: {path: /live-update-ready}, output: {status: 200, body: {equals: ok}}}
        input: {path: /live-update}
        output: {status: 200, body: {equals: ok}}

  - name: invalid-body-expression-is-rejected
