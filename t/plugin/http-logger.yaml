    steps:
      - {name: request-and-response-are-present-in-default-log, input: {method: POST, path: /full-bodies, body: test-http-logger-request}, output: {status: 200, body: {equals: test-http-logger-response}}}

  - name: gzip-and-brotli-response-body-decoding
