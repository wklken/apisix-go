  - name: jwt-auth-anonymous-consumer-request-without-jwt-auth-header-will-be-from-anonymous-consumer-and-different-rate-limit-will-apply-test-5
    runtime: {plugins: [jwt-auth, limit-count]}
    config:
      consumers:
        - username: anonymous
          plugins:
            limit-count: {count: 1, time_window: 60, rejected_code: 503}
        - username: jack
          plugins:
            jwt-auth: {key: user-key, secret: my-secret-key}
            limit-count: {count: 4, time_window: 60, rejected_code: 503}
      routes:
        - id: jwt-auth-anonymous-consumer-5
          uri: /jwt-auth-anonymous-consumer-5
          plugins:
            jwt-auth: {anonymous_consumer: anonymous}
          upstream:
            type: roundrobin
            nodes: {'{{FIXTURE.primary.ADDR}}': 1}
    fixtures:
      - name: primary
        kind: http
        count: {at_least: 1, at_most: 1}
        expect:
          - path: {equals: /jwt-auth-anonymous-consumer-5}
        respond: [{status: 200, body: jwt-ok}]
    steps:
      - name: exercise-request-without-jwt-auth-header-will-be-from-anonymous-consumer-and-different-rate-limit-will-apply-test-5
        repeat: 4
        concurrency: 4
        input: {path: /jwt-auth-anonymous-consumer-5}
        output: {status_counts: {200: 1, 503: 3}}
