  - name: jwt-auth-anonymous-consumer-normal-consumer-test-3
    runtime: {plugins: [jwt-auth, limit-count]}
    config:
      consumers:
        - username: anonymous
          plugins: {}
        - username: jack
          plugins:
            jwt-auth: {key: user-key, secret: my-secret-key}
            limit-count: {count: 4, time_window: 60, rejected_code: 503}
      routes:
        - id: jwt-auth-anonymous-consumer-3
          uri: /jwt-auth-anonymous-consumer-3
          plugins:
            jwt-auth: {anonymous_consumer: anonymous}
          upstream:
            type: roundrobin
            nodes: {'{{FIXTURE.primary.ADDR}}': 1}
    fixtures:
      - name: primary
        kind: http
        count: {at_least: 4, at_most: 4}
        expect:
          - path: {equals: /jwt-auth-anonymous-consumer-3}
            headers: {X-Consumer-Username: {equals: jack}}
        respond: [{status: 200, body: jwt-ok}]
    steps:
      - name: exercise-normal-consumer-test-3
        repeat: 5
        concurrency: 5
        input:
          path: /jwt-auth-anonymous-consumer-3
          headers:
            Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXkiOiJ1c2VyLWtleSIsImV4cCI6MTg3OTMxODU0MX0.fNtFJnNmJgzbiYmGB0Yjvm-l6A6M4jRV1l4mnVFSYjs
        output: {status_counts: {200: 4, 503: 1}}
  - name: jwt-auth-anonymous-consumer-request-without-jwt-auth-header-will-be-from-anonymous-consumer-and-it-will-pass-test-4
