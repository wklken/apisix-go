    fixtures: [{"name":"primary","kind":"http","expect":[{"path":{"equals":"/jwt-auth-anonymous-consumer-1"},"headers":{"X-Consumer-Username":{"equals":"anonymous"}}}],"respond":[{"status":200,"body":"jwt-ok"}]}]
    steps: [{"name":"exercise-add-consumer-jack-and-anonymous-test-1","input":{"path":"/jwt-auth-anonymous-consumer-1"},"output":{"status":200,"body":{"equals":"jwt-ok"}}}]
  - name: jwt-auth-anonymous-consumer-add-jwt-auth-plugin-using-admin-api-test-2
    config: {"consumers":[{"username":"anonymous","plugins":{}},{"username":"jack","plugins":{"jwt-auth":{"key":"user-key","secret":"my-secret-key"}}}],"routes":[{"id":"jwt-auth-anonymous-consumer-2","uri":"/jwt-auth-anonymous-consumer-2","plugins":{"jwt-auth":{"anonymous_consumer":"anonymous"}},"upstream":{"type":"roundrobin","nodes":{"{{FIXTURE.primary.ADDR}}":1}}}]}
    fixtures: [{"name":"primary","kind":"http","expect":[{"path":{"equals":"/jwt-auth-anonymous-consumer-2"},"headers":{"X-Consumer-Username":{"equals":"anonymous"}}}],"respond":[{"status":200,"body":"jwt-ok"}]}]
