sources:
  - repository: https://github.com/apache/apisix
    commit: c3d7d5ec69774121f53d2e20d29d09c816795dd7
    file: t/plugin/key-auth.t
    tests: 34
  - repository: https://github.com/apache/apisix
    commit: c3d7d5ec69774121f53d2e20d29d09c816795dd7
    file: t/plugin/key-auth-anonymous-consumer.t
    tests: 11
  - repository: https://github.com/apache/apisix
    commit: c3d7d5ec69774121f53d2e20d29d09c816795dd7
    file: t/plugin/key-auth-upstream-domain-node.t
    tests: 7
  - repository: https://github.com/apache/apisix
    commit: c3d7d5ec69774121f53d2e20d29d09c816795dd7
    file: t/plugin/key-auth-realm.t
    tests: 6

cases:
  - name: valid-consumer-schema
    source: {file: t/plugin/key-auth.t, tests: [1]}
    config:
      consumers:
        - username: schema-user
          plugins: {key-auth: {key: test-key}}
      routes:
        - id: key-auth-valid-consumer-schema
          uri: /hello
          plugins: {key-auth: {}}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - name: primary
        kind: http
        expect:
          - path: {equals: /hello}
            headers: {X-Consumer-Username: {equals: schema-user}}
        respond: [{status: 200, body: hello world}]
    steps:
      - name: valid-string-key-authenticates
        input: {path: /hello, headers: {apikey: test-key}}
        output:
          status: 200
          body: {equals: hello world}
          logs: {not_matches: '\btest-key\b'}

  - name: consumer-key-type-diagnostic
    source: {file: t/plugin/key-auth.t, tests: [2]}
    config:
      consumers:
        - username: invalid-type
          plugins: {key-auth: {key: 123}}
    input: {path: /hello}
    output:
      status: 404
      logs: {matches: 'key-auth consumer configuration:.*key.*expected string'}

  - name: consumer-and-route-created
    source: {file: t/plugin/key-auth.t, tests: [3, 4, 5]}
    config:
      consumers:
        - username: jack
          plugins: {key-auth: {key: auth-one}}
      routes:
        - id: key-auth-created
          uri: /hello
          plugins: {key-auth: {}}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - name: primary
        kind: http
        expect:
          - path: {equals: /hello}
            headers: {X-Consumer-Username: {equals: jack}}
        respond: [{status: 200, body: hello world}]
    steps:
      - name: created-resources-protect-the-route
        input: {path: /hello, headers: {apikey: auth-one}}
        output:
          status: 200
          body: {equals: hello world}
          logs: {not_matches: '\bauth-one\b'}

  - name: credential-rejections-do-not-reach-upstream
    source: {file: t/plugin/key-auth.t, tests: [6, 7]}
    config:
      consumers:
        - username: jack
          plugins: {key-auth: {key: auth-one}}
      routes:
        - id: key-auth-rejections
          uri: /hello
          plugins: {key-auth: {}}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - name: primary
        kind: http
        expect_requests: 0
        respond: [{status: 200, body: hello world}]
    steps:
      - name: invalid-key
        input: {path: /hello, headers: {apikey: 123}}
        output:
          status: 401
          body: {equals: '{"message":"Invalid API key in request"}'}
          logs: {matches: 'failed to find consumer: invalid api key'}
      - name: missing-key
        input: {path: /hello}
        output:
          status: 401
          body: {equals: '{"message":"Missing API key in request"}'}

  - name: twenty-consumer-lookup
    source: {file: t/plugin/key-auth.t, tests: [8]}
    config:
      consumers:
        - {username: user_1, plugins: {key-auth: {key: auth-1}}}
        - {username: user_2, plugins: {key-auth: {key: auth-2}}}
        - {username: user_3, plugins: {key-auth: {key: auth-3}}}
        - {username: user_4, plugins: {key-auth: {key: auth-4}}}
        - {username: user_5, plugins: {key-auth: {key: auth-5}}}
        - {username: user_6, plugins: {key-auth: {key: auth-6}}}
        - {username: user_7, plugins: {key-auth: {key: auth-7}}}
        - {username: user_8, plugins: {key-auth: {key: auth-8}}}
        - {username: user_9, plugins: {key-auth: {key: auth-9}}}
        - {username: user_10, plugins: {key-auth: {key: auth-10}}}
        - {username: user_11, plugins: {key-auth: {key: auth-11}}}
        - {username: user_12, plugins: {key-auth: {key: auth-12}}}
        - {username: user_13, plugins: {key-auth: {key: auth-13}}}
        - {username: user_14, plugins: {key-auth: {key: auth-14}}}
        - {username: user_15, plugins: {key-auth: {key: auth-15}}}
        - {username: user_16, plugins: {key-auth: {key: auth-16}}}
        - {username: user_17, plugins: {key-auth: {key: auth-17}}}
        - {username: user_18, plugins: {key-auth: {key: auth-18}}}
        - {username: user_19, plugins: {key-auth: {key: auth-19}}}
        - {username: user_20, plugins: {key-auth: {key: auth-20}}}
      routes:
        - id: key-auth-twenty-consumers
          uri: /hello
          plugins: {key-auth: {}}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - name: primary
        kind: http
        expect:
          - path: {equals: /hello}
            headers: {X-Consumer-Username: {equals: user_13}}
        respond: [{status: 200, body: hello world}]
    steps:
      - name: thirteenth-consumer-is-indexed
        input: {path: /hello, headers: {apikey: auth-13}}
        output: {status: 200, body: {equals: hello world}}

  - name: missing-consumer-key-is-rejected
    source: {file: t/plugin/key-auth.t, tests: [9]}
    config:
      consumers:
        - username: invalid
          plugins: {key-auth: {}}
    input: {path: /hello}
    output:
      status: 404
      logs: {matches: "key-auth consumer configuration:.*missing properties: 'key'"}

  - name: custom-header-credential
    source: {file: t/plugin/key-auth.t, tests: [10, 11]}
    config:
      consumers:
        - username: jack
          plugins: {key-auth: {key: auth-one}}
      routes:
        - id: key-auth-custom-header
          uri: /hello
          plugins: {key-auth: {header: Authorization}}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - name: primary
        kind: http
        expect:
          - path: {equals: /hello}
            headers: {Authorization: {equals: auth-one}}
        respond: [{status: 200, body: hello world}]
    steps:
      - name: custom-header-authenticates
        input: {path: /hello, headers: {Authorization: auth-one}}
        output: {status: 200, body: {equals: hello world}}

  - name: custom-query-credential
    source: {file: t/plugin/key-auth.t, tests: [12, 13]}
    config:
      consumers:
        - username: jack
          plugins: {key-auth: {key: auth-one}}
      routes:
        - id: key-auth-custom-query
          uri: /hello
          plugins: {key-auth: {query: auth}}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - name: primary
        kind: http
        expect: [{path: {equals: "/hello?auth=auth-one"}}]
        respond: [{status: 200, body: hello world}]
    steps:
      - name: custom-query-authenticates
        input: {path: "/hello?auth=auth-one"}
        output: {status: 200, body: {equals: hello world}}

  - name: header-credential-preserved
    source: {file: t/plugin/key-auth.t, tests: [14, 15]}
    config:
      consumers:
        - username: jack
          plugins: {key-auth: {key: auth-one}}
      routes:
        - id: key-auth-header-preserved
          uri: /echo
          plugins: {key-auth: {hide_credentials: false}}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - name: primary
        kind: http
        expect:
          - path: {equals: /echo}
            headers: {apikey: {equals: auth-one}}
        respond: [{status: 200, body: hello world}]
    steps:
      - name: header-is-forwarded
        input: {path: /echo, headers: {apikey: auth-one}}
        output: {status: 200, body: {equals: hello world}}

  - name: header-credential-hidden
    source: {file: t/plugin/key-auth.t, tests: [16, 17, 18, 19]}
    config:
      consumers:
        - username: jack
          plugins: {key-auth: {key: auth-one}}
      routes:
        - id: key-auth-header-hidden
          uri: /echo
          plugins: {key-auth: {hide_credentials: true}}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - name: primary
        kind: http
        expect:
          - path: {equals: /echo}
            headers: {apikey: {absent: true}}
          - path: {equals: /echo}
            headers: {apikey: {absent: true}, test: {equals: auth-two}}
          - path: {equals: "/echo?apikey=auth-one"}
            headers: {apikey: {absent: true}}
        respond: [{status: 200, body: hello world}]
    steps:
      - name: credential-header-is-hidden
        input: {path: /echo, headers: {apikey: auth-one}}
        output: {status: 200, body: {equals: hello world}}
      - name: unrelated-header-is-preserved
        input: {path: /echo, headers: {apikey: auth-one, test: auth-two}}
        output: {status: 200, body: {equals: hello world}}
      - name: header-wins-and-query-is-preserved
        input: {path: "/echo?apikey=auth-one", headers: {apikey: auth-one}}
        output: {status: 200, body: {equals: hello world}}

  - name: query-credential-hidden
    source: {file: t/plugin/key-auth.t, tests: [20, 21, 22, 23]}
    config:
      consumers:
        - username: jack
          plugins: {key-auth: {key: auth-one}}
      routes:
        - id: key-auth-query-hidden
          uri: /echo
          plugins: {key-auth: {query: auth, hide_credentials: true}}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - name: primary
        kind: http
        expect:
          - path: {equals: /echo}
            headers: {auth: {absent: true}}
          - path: {equals: "/echo?test=auth-two"}
            headers: {auth: {absent: true}}
          - path: {equals: /echo}
            headers: {auth: {equals: auth-one}}
        respond: [{status: 200, body: hello world}]
    steps:
      - name: credential-query-is-hidden
        input: {path: "/echo?auth=auth-one"}
        output: {status: 200, body: {equals: hello world}}
      - name: unrelated-query-is-preserved
        input: {path: "/echo?auth=auth-one&test=auth-two"}
        output: {status: 200, body: {equals: hello world}}
      - name: query-auth-does-not-remove-same-named-header
        input: {path: "/echo?auth=auth-one", headers: {auth: auth-one}}
        output: {status: 200, body: {equals: hello world}}

  - name: query-credential-preserved
    source: {file: t/plugin/key-auth.t, tests: [24, 25]}
    config:
      consumers:
        - username: jack
          plugins: {key-auth: {key: auth-one}}
      routes:
        - id: key-auth-query-preserved
          uri: /hello
          plugins: {key-auth: {query: auth, hide_credentials: false}}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - name: primary
        kind: http
        expect: [{path: {equals: "/hello?auth=auth-one"}}]
        respond: [{status: 200, body: hello world}]
    steps:
      - name: query-is-forwarded
        input: {path: "/hello?auth=auth-one"}
        output: {status: 200, body: {equals: hello world}}

  - name: environment-secret-reference
    source: {file: t/plugin/key-auth.t, tests: [26, 27]}
    environment: {test_auth: authone}
    config:
      consumers:
        - username: jack
          plugins: {key-auth: {key: '$env://test_auth'}}
      routes:
        - id: key-auth-env-secret
          uri: /hello
          plugins: {key-auth: {query: auth}}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - name: primary
        kind: http
        expect: [{path: {equals: "/hello?auth=authone"}}]
        respond: [{status: 200, body: hello world}]
    steps:
      - name: resolved-environment-key-authenticates
        input: {path: "/hello?auth=authone"}
        output:
          status: 200
          body: {equals: hello world}
          logs: {not_matches: '\bauthone\b'}

  - name: vault-secret-reference-lazy-retry
    source: {file: t/plugin/key-auth.t, tests: [28, 29, 30]}
    config:
      secrets:
        - id: vault/test1
          uri: "{{FIXTURE.vault.URL}}"
          prefix: kv/apisix
          token: root
      consumers:
        - username: jack
          plugins: {key-auth: {key: '$secret://vault/test1/jack/key'}}
      routes:
        - id: key-auth-vault-secret
          uri: /hello
          plugins: {key-auth: {query: auth}}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - name: vault
        kind: http
        expect:
          - method: GET
            path: {equals: /v1/kv/apisix/jack}
            headers: {X-Vault-Token: {equals: root}, X-Vault-Namespace: {absent: true}}
          - method: GET
            path: {equals: /v1/kv/apisix/jack}
            headers: {X-Vault-Token: {equals: root}, X-Vault-Namespace: {absent: true}}
        respond:
          - {status: 404, body: not provisioned}
          - {status: 200, body: '{"data":{"key":"authtwo"}}'}
      - name: primary
        kind: http
        expect: [{path: {equals: "/hello?auth=authtwo"}}]
        respond: [{status: 200, body: hello world}]
    steps:
      - name: unresolved-vault-key-fails-closed
        input: {path: "/hello?auth=authtwo"}
        output:
          status: 401
          body: {equals: '{"message":"Invalid API key in request"}'}
      - name: provisioned-vault-key-authenticates-without-reload
        input: {path: "/hello?auth=authtwo"}
        output:
          status: 200
          body: {equals: hello world}
          logs: {not_matches: '\bauthtwo\b'}

  - name: vault-token-environment-reference
    source: {file: t/plugin/key-auth.t, tests: [31, 32]}
    environment: {VAULT_TOKEN: root}
    config:
      secrets:
        - id: vault/test1
          uri: "{{FIXTURE.vault.URL}}"
          prefix: kv/apisix
          token: '$ENV://VAULT_TOKEN'
      consumers:
        - username: jack
          plugins: {key-auth: {key: '$secret://vault/test1/jack/key'}}
      routes:
        - id: key-auth-vault-env-token
          uri: /hello
          plugins: {key-auth: {query: auth}}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - name: vault
        kind: http
        expect:
          - method: GET
            path: {equals: /v1/kv/apisix/jack}
            headers: {X-Vault-Token: {equals: root}, X-Vault-Namespace: {absent: true}}
        respond: [{status: 200, body: '{"data":{"key":"authtwo"}}'}]
      - name: primary
        kind: http
        expect: [{path: {equals: "/hello?auth=authtwo"}}]
        respond: [{status: 200, body: hello world}]
    steps:
      - name: environment-token-fetches-vault-key
        input: {path: "/hello?auth=authtwo"}
        output:
          status: 200
          body: {equals: hello world}
          logs: {not_matches: '\bauthtwo\b'}

  - name: unresolved-environment-reference-fails-closed
    source: {file: t/plugin/key-auth.t, tests: [33, 34]}
    config:
      consumers:
        - username: jack
          plugins: {key-auth: {key: '$env://KEYAUTH_UNRESOLVED_SECRET'}}
      routes:
        - id: key-auth-unresolved
          uri: /hello
          plugins: {key-auth: {}}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - name: primary
        kind: http
        expect_requests: 0
        respond: [{status: 200, body: hello world}]
    steps:
      - name: literal-reference-is-not-a-credential
        input:
          path: /hello
          headers: {apikey: '$env://KEYAUTH_UNRESOLVED_SECRET'}
        output:
          status: 401
          body: {equals: '{"message":"Invalid API key in request"}'}
          logs: {matches: 'failed to find consumer: invalid api key'}

  - name: authenticated-consumer-limit-chain
    source: {file: t/plugin/key-auth-anonymous-consumer.t, tests: [1, 2, 3]}
    config:
      consumers:
        - username: jack
          plugins:
            key-auth: {key: auth-one}
            limit-count: {count: 4, time_window: 60}
        - username: anonymous
          plugins:
            limit-count: {count: 1, time_window: 60}
      routes:
        - id: key-auth-authenticated-limit
          uri: /hello
          plugins: {key-auth: {anonymous_consumer: anonymous}}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - name: primary
        kind: http
        expect:
          - path: {equals: /hello}
            headers: {X-Consumer-Username: {equals: jack}}
        count: {at_least: 4, at_most: 4}
        respond: [{status: 200, body: hello world}]
    steps:
      - name: first-four-authenticated-requests-pass
        repeat: 4
        input: {path: /hello, headers: {apikey: auth-one}}
        output: {status: 200, body: {equals: hello world}}
      - name: fifth-authenticated-request-is-limited
        input: {path: /hello, headers: {apikey: auth-one}}
        output: {status: 503}

  - name: missing-key-uses-anonymous-consumer
    source: {file: t/plugin/key-auth-anonymous-consumer.t, tests: [4]}
    config:
      consumers:
        - username: anonymous
          plugins: {}
      routes:
        - id: key-auth-anonymous-pass
          uri: /hello
          plugins: {key-auth: {anonymous_consumer: anonymous}}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - name: primary
        kind: http
        expect:
          - path: {equals: /hello}
            headers: {X-Consumer-Username: {equals: anonymous}}
        respond: [{status: 200, body: hello world}]
    steps:
      - name: anonymous-request-passes
        input: {path: /hello}
        output: {status: 200, body: {equals: hello world}}

  - name: anonymous-consumer-limit-chain
    source: {file: t/plugin/key-auth-anonymous-consumer.t, tests: [5]}
    config:
      consumers:
        - username: anonymous
          plugins:
            limit-count: {count: 1, time_window: 60}
      routes:
        - id: key-auth-anonymous-limit
          uri: /hello
          plugins: {key-auth: {anonymous_consumer: anonymous}}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - name: primary
        kind: http
        expect:
          - path: {equals: /hello}
            headers: {X-Consumer-Username: {equals: anonymous}}
        respond: [{status: 200, body: hello world}]
    steps:
      - name: first-anonymous-request-passes
        input: {path: /hello}
        output: {status: 200, body: {equals: hello world}}
      - name: later-anonymous-requests-are-limited
        repeat: 3
        input: {path: /hello}
        output: {status: 503}

  - name: missing-anonymous-consumer
    source: {file: t/plugin/key-auth-anonymous-consumer.t, tests: [6, 7]}
    config:
      routes:
        - id: key-auth-missing-anonymous
          uri: /hello
          plugins: {key-auth: {anonymous_consumer: not-found-anonymous}}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - name: primary
        kind: http
        expect_requests: 0
        respond: [{status: 200, body: hello world}]
    steps:
      - name: missing-anonymous-consumer-fails-closed
        input: {path: /hello}
        output:
          status: 401
          headers: {WWW-Authenticate: {equals: 'apikey realm="key"'}}
          body: {equals: '{"message":"Invalid user authorization"}'}
          logs: {matches: 'failed to get anonymous consumer not-found-anonymous'}

  - name: anonymous-invalid-credentials-are-hidden
    source: {file: t/plugin/key-auth-anonymous-consumer.t, tests: [8, 9, 10, 11]}
    config:
      consumers:
        - username: anonymous
          plugins: {}
      routes:
        - id: key-auth-anonymous-hidden
          uri: /print_request_received
          plugins: {key-auth: {query: auth, anonymous_consumer: anonymous, hide_credentials: true}}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - name: primary
        kind: http
        expect:
          - path: {equals: /print_request_received}
            headers:
              apikey: {absent: true}
              X-Consumer-Username: {equals: anonymous}
          - path: {equals: /print_request_received}
            headers:
              apikey: {absent: true}
              X-Consumer-Username: {equals: anonymous}
          - path: {equals: /print_request_received}
            headers:
              apikey: {absent: true}
              X-Consumer-Username: {equals: anonymous}
        respond: [{status: 200, body: hello world}]
    steps:
      - name: invalid-header-is-not-forwarded
        input: {path: /print_request_received, headers: {apikey: invalid-key}}
        output: {status: 200, body: {equals: hello world}}
      - name: invalid-query-is-not-forwarded
        input: {path: "/print_request_received?auth=invalid-key"}
        output: {status: 200, body: {equals: hello world}}
      - name: invalid-header-and-query-are-not-forwarded
        input:
          path: "/print_request_received?auth=invalid-key"
          headers: {apikey: invalid-key}
        output: {status: 200, body: {equals: hello world}}

  - name: service-key-auth-with-direct-domain-node
    source: {file: t/plugin/key-auth-upstream-domain-node.t, tests: [1, 2, 3, 4]}
    config:
      consumers:
        - username: jack
          plugins: {key-auth: {key: auth-one}}
      services:
        - id: "1"
          plugins: {key-auth: {}}
      routes:
        - id: key-auth-domain-node
          uri: /index.html
          service_id: "1"
          plugins:
            limit-count: {count: 1, time_window: 5, rejected_code: 503, key: remote_addr}
          upstream:
            type: roundrobin
            pass_host: node
            nodes: {'localhost:{{FIXTURE.primary.PORT}}': 1}
    fixtures:
      - name: primary
        kind: http
        expect:
          - path: {equals: /index.html}
            host: {matches: '^localhost:[0-9]+$'}
            headers: {X-Consumer-Username: {equals: jack}}
        respond: [{status: 404, body: not found}]
    steps:
      - name: first-domain-node-request-reaches-upstream
        input: {path: /index.html, headers: {apikey: auth-one}}
        output: {status: 404, body: {equals: not found}}
      - name: second-domain-node-request-is-limited
        input: {path: /index.html, headers: {apikey: auth-one}}
        output: {status: 503}
      - name: third-domain-node-request-is-limited
        input: {path: /index.html, headers: {apikey: auth-one}}
        output: {status: 503}

  - name: service-key-auth-with-upstream-resource
    source: {file: t/plugin/key-auth-upstream-domain-node.t, tests: [5, 6, 7]}
    config:
      consumers:
        - username: jack
          plugins: {key-auth: {key: auth-one}}
      services:
        - id: "1"
          plugins: {key-auth: {}}
      upstreams:
        - id: "1"
          type: roundrobin
          pass_host: node
          nodes: {'localhost:{{FIXTURE.primary.PORT}}': 1}
      routes:
