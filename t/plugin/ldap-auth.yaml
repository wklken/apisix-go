cases:
  - name: valid-consumer-schema
    config:
      consumers:
        - username: user01
          plugins:
            ldap-auth: {user_dn: 'cn=user01,ou=users,dc=example,dc=org'}
      routes:
        - id: ldap-auth-valid-consumer
          uri: /hello
          plugins:
            ldap-auth:
              base_dn: 'ou=users,dc=example,dc=org'
              ldap_uri: '{{FIXTURE.ldap.URL}}'
              uid: cn
          upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
    fixtures:
      - name: ldap
        kind: ldap
        network_expect:
          - payload_base64: {equals: 'MDkCAQFgNAIBAwQkY249dXNlcjAxLG91PXVzZXJzLGRjPWV4YW1wbGUsZGM9b3JngAlwYXNzd29yZDE='}
        network_respond:
          - payload_base64: 'MAwCAQFhBwoBAAQABAA='
      - name: primary
        kind: http
        expect: [{path: {equals: /hello}}]
        respond: [{status: 200, body: hello world}]
    steps:
      - name: valid-consumer-schema-authenticates
        input: {path: /hello, headers: {Authorization: 'Basic dXNlcjAxOnBhc3N3b3JkMQ=='}}
        output: {status: 200, body: {equals: hello world}, logs: {matches: 'find consumer user01'}}

  - name: route-base-dn-type-rejection
    config:
      routes:
        - id: ldap-auth-invalid-base-dn
          uri: /hello
          plugins:
            ldap-auth: {base_dn: 123, ldap_uri: '127.0.0.1:1389'}
          upstream: {type: roundrobin, nodes: {'127.0.0.1:1': 1}}
    input: {path: /hello}
    output:
      status: 404
      logs: {matches: 'validate plugin ldap-auth config:.*base_dn.*expected string'}

  - name: consumer-and-route-created
    config:
      consumers:
        - username: user01
          plugins:
            ldap-auth: {user_dn: 'cn=user01,ou=users,dc=example,dc=org'}
      routes:
        - id: ldap-auth-created
          uri: /hello
          plugins:
            ldap-auth:
              base_dn: 'ou=users,dc=example,dc=org'
              ldap_uri: '{{FIXTURE.ldap.URL}}'
              uid: cn
          upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
    fixtures:
      - name: ldap
        kind: ldap
        network_expect:
          - payload_base64: {equals: 'MDkCAQFgNAIBAwQkY249dXNlcjAxLG91PXVzZXJzLGRjPWV4YW1wbGUsZGM9b3JngAlwYXNzd29yZDE='}
        network_respond:
          - payload_base64: 'MAwCAQFhBwoBAAQABAA='
      - name: primary
        kind: http
        expect: [{path: {equals: /hello}}]
        respond: [{status: 200, body: hello world}]
    steps:
      - name: created-resources-protect-route
        input: {path: /hello, headers: {Authorization: 'Basic dXNlcjAxOnBhc3N3b3JkMQ=='}}
        output: {status: 200, body: {equals: hello world}, logs: {matches: 'find consumer user01'}}

  - name: credential-validation
    config:
      consumers:
        - username: user01
          plugins:
            ldap-auth: {user_dn: 'cn=user01,ou=users,dc=example,dc=org'}
      routes:
        - id: ldap-auth-credentials
          uri: /hello
          plugins:
            ldap-auth:
              base_dn: 'ou=users,dc=example,dc=org'
              ldap_uri: '{{FIXTURE.ldap.URL}}'
              uid: cn
          upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
    fixtures:
      - name: ldap
        kind: ldap
        network_expect:
          - payload_base64: {equals: 'MDACAQFgKwIBAwQhY249Zm9vLG91PXVzZXJzLGRjPWV4YW1wbGUsZGM9b3JngANmb28='}
          - payload_base64: {equals: 'MDkCAQFgNAIBAwQkY249dXNlcjAxLG91PXVzZXJzLGRjPWV4YW1wbGUsZGM9b3JngAlwYXNzd29yZDE='}
        network_respond:
          - payload_base64: 'MC4CAQFhKQoBMQQABCJUaGUgc3VwcGxpZWQgY3JlZGVudGlhbCBpcyBpbnZhbGlk'
          - payload_base64: 'MAwCAQFhBwoBAAQABAA='
      - name: primary
        kind: http
        expect: [{path: {equals: /hello}}]
        respond: [{status: 200, body: hello world}]
    steps:
      - name: missing-authorization
        input: {path: /hello}
        output:
          status: 401
          headers: {WWW-Authenticate: {equals: 'Basic realm="ldap"'}}
          body: {equals: '{"message":"Missing authorization in request"}'}
      - name: malformed-scheme
        input: {path: /hello, headers: {Authorization: 'Bad_header Zm9vOmZvbwo='}}
        output:
          status: 401
          body: {equals: '{"message":"Invalid authorization in request"}'}
          logs: {matches: 'Invalid authorization header format'}
      - name: invalid-base64
        input: {path: /hello, headers: {Authorization: 'Basic aca_a'}}
        output:
          status: 401
          body: {equals: '{"message":"Invalid authorization in request"}'}
          logs: {matches: 'Failed to decode authentication header'}
      - name: missing-password
        input: {path: /hello, headers: {Authorization: 'Basic Zm9v'}}
        output:
          status: 401
          body: {equals: '{"message":"Invalid authorization in request"}'}
          logs: {matches: 'Split authorization err: invalid decoded data'}
      - name: wrong-password
        input: {path: /hello, headers: {Authorization: 'Basic Zm9vOmZvbwo='}}
        output:
          status: 401
          headers: {WWW-Authenticate: {equals: 'Basic realm="ldap"'}}
          body: {equals: '{"message":"Invalid user authorization"}'}
          logs: {matches: 'The supplied credential is invalid'}
      - name: valid-credentials
        input: {path: /hello, headers: {Authorization: 'Basic dXNlcjAxOnBhc3N3b3JkMQ=='}}
        output: {status: 200, body: {equals: hello world}, logs: {matches: 'find consumer user01'}}
      - name: authorization-payloads-are-not-logged
        input: {path: /hello}
        output:
          status: 401
          logs: {not_matches: 'aca_a|Zm9v|\bfoo\b'}

  - name: capitalization-scheme
    config:
      consumers:
        - username: user01
          plugins:
            ldap-auth: {user_dn: 'cn=user01,ou=users,dc=example,dc=org'}
      routes:
        - id: ldap-auth-capitalization
          uri: /hello
          plugins:
            ldap-auth:
              base_dn: 'ou=users,dc=example,dc=org'
              ldap_uri: '{{FIXTURE.ldap.URL}}'
              uid: cn
          upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
    fixtures:
      - name: ldap
        kind: ldap
        network_expect:
          - payload_base64: {equals: 'MDkCAQFgNAIBAwQkY249dXNlcjAxLG91PXVzZXJzLGRjPWV4YW1wbGUsZGM9b3JngAlwYXNzd29yZDE='}
        network_respond:
          - payload_base64: 'MAwCAQFhBwoBAAQABAA='
      - name: primary
        kind: http
        expect: [{path: {equals: /hello}}]
        respond: [{status: 200, body: hello world}]
    steps:
      - name: canonical-basic-scheme-authenticates
        input: {path: /hello, headers: {Authorization: 'Basic dXNlcjAxOnBhc3N3b3JkMQ=='}}
        output: {status: 200, body: {equals: hello world}, logs: {matches: 'find consumer user01'}}

  - name: invalid-consumer-schema
    variants:
      - name: missing-user-dn
        config:
          consumers:
            - username: user01
              plugins: {ldap-auth: {}}
          routes:
            - id: ldap-auth-missing-user-dn
              uri: /hello
              plugins:
                ldap-auth: {base_dn: 'ou=users,dc=example,dc=org', ldap_uri: '127.0.0.1:1'}
              upstream: {type: roundrobin, nodes: {'127.0.0.1:1': 1}}
        input: {path: /hello}
        output:
          status: 401
          body: {equals: '{"message":"Missing authorization in request"}'}
          logs: {matches: "ldap-auth consumer configuration:.*missing properties: 'user_dn'"}
      - name: non-object-consumer-config
        config:
          consumers:
            - username: user01
              plugins: {ldap-auth: blah}
          routes:
            - id: ldap-auth-non-object-consumer
              uri: /hello
              plugins:
                ldap-auth: {base_dn: 'ou=users,dc=example,dc=org', ldap_uri: '127.0.0.1:1'}
              upstream: {type: roundrobin, nodes: {'127.0.0.1:1': 1}}
        input: {path: /hello}
        output:
          status: 401
          body: {equals: '{"message":"Missing authorization in request"}'}
          logs: {matches: 'ldap-auth consumer configuration:.*expected object'}

  - name: schema-surfaces
    variants:
      - name: route-schema-defaults
        config:
          consumers:
            - username: user01
              plugins:
                ldap-auth: {user_dn: 'cn=user01,ou=users,dc=example,dc=org'}
          routes:
            - id: ldap-auth-route-schema
              uri: /hello
              plugins:
                ldap-auth:
                  base_dn: 'ou=users,dc=example,dc=org'
                  ldap_uri: '{{FIXTURE.ldap.URL}}'
              upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
        fixtures:
          - name: ldap
            kind: ldap
            network_expect:
              - payload_base64: {equals: 'MDkCAQFgNAIBAwQkY249dXNlcjAxLG91PXVzZXJzLGRjPWV4YW1wbGUsZGM9b3JngAlwYXNzd29yZDE='}
            network_respond:
              - payload_base64: 'MAwCAQFhBwoBAAQABAA='
          - name: primary
            kind: http
            respond: [{status: 200, body: hello world}]
        steps:
          - name: defaults-build-working-route
            input: {path: /hello, headers: {Authorization: 'Basic dXNlcjAxOnBhc3N3b3JkMQ=='}}
            output: {status: 200, body: {equals: hello world}}
      - name: consumer-schema-selects-user-dn
        config:
          consumers:
            - username: user01
              plugins:
                ldap-auth: {user_dn: 'cn=user01,ou=users,dc=example,dc=org'}
          routes:
            - id: ldap-auth-consumer-schema
              uri: /hello
              plugins:
                ldap-auth:
                  base_dn: 'ou=users,dc=example,dc=org'
                  ldap_uri: '{{FIXTURE.ldap.URL}}'
                  uid: cn
              upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
        fixtures:
          - name: ldap
            kind: ldap
            network_expect:
              - payload_base64: {equals: 'MDkCAQFgNAIBAwQkY249dXNlcjAxLG91PXVzZXJzLGRjPWV4YW1wbGUsZGM9b3JngAlwYXNzd29yZDE='}
            network_respond:
              - payload_base64: 'MAwCAQFhBwoBAAQABAA='
          - name: primary
            kind: http
            respond: [{status: 200, body: hello world}]
        steps:
          - name: consumer-schema-attaches-user
            input: {path: /hello, headers: {Authorization: 'Basic dXNlcjAxOnBhc3N3b3JkMQ=='}}
            output: {status: 200, body: {equals: hello world}, logs: {matches: 'find consumer user01'}}
      - name: unknown-schema-type-falls-back-to-route-schema
        config:
          routes:
            - id: ldap-auth-fallback-route-schema
              uri: /hello
              plugins:
                ldap-auth: {ldap_uri: '127.0.0.1:1389'}
              upstream: {type: roundrobin, nodes: {'127.0.0.1:1': 1}}
        input: {path: /hello}
        output:
          status: 404
          logs: {matches: "validate plugin ldap-auth config:.*missing properties: 'base_dn'"}

  - name: ldaps-without-certificate-verification
    config:
      consumers:
        - username: user01
          plugins:
            ldap-auth: {user_dn: 'cn=user01,ou=users,dc=example,dc=org'}
      routes:
        - id: ldap-auth-ldaps-insecure
          uri: /hello
          plugins:
            ldap-auth:
              base_dn: 'ou=users,dc=example,dc=org'
              ldap_uri: 'localhost:{{FIXTURE.ldap.PORT}}'
              uid: cn
              use_tls: true
              tls_verify: false
          upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
    fixtures:
      - name: ldap
        kind: tls-tcp
        network_expect:
          - payload_base64: {equals: 'MDkCAQFgNAIBAwQkY249dXNlcjAxLG91PXVzZXJzLGRjPWV4YW1wbGUsZGM9b3JngAlwYXNzd29yZDE='}
        network_respond:
          - payload_base64: 'MAwCAQFhBwoBAAQABAA='
      - name: primary
        kind: http
        respond: [{status: 200, body: hello world}]
    steps:
      - name: ldaps-bind-succeeds-with-verification-disabled
        input: {path: /hello, headers: {Authorization: 'Basic dXNlcjAxOnBhc3N3b3JkMQ=='}}
        output: {status: 200, body: {equals: hello world}, logs: {matches: 'find consumer user01'}}

  - name: trusted-ldaps-certificate-verification
    variants:
      - name: verification-enabled-without-ca-rejects-before-bind
        environment_unset: [SSL_CERT_FILE]
        config:
          consumers:
            - username: user01
              plugins:
                ldap-auth: {user_dn: 'cn=user01,ou=users,dc=example,dc=org'}
          routes:
            - id: ldap-auth-ldaps-untrusted
              uri: /hello
              plugins:
                ldap-auth:
                  base_dn: 'ou=users,dc=example,dc=org'
                  ldap_uri: 'localhost:{{FIXTURE.ldap.PORT}}'
                  uid: cn
                  use_tls: true
                  tls_verify: true
              upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
        fixtures:
          - name: ldap
            kind: https
            expect_requests: 0
            respond: [{status: 200}]
          - name: primary
            kind: http
            expect_requests: 0
            respond: [{status: 200, body: hello world}]
        steps:
          - name: untrusted-certificate-rejects-before-ldap-bind
            input: {path: /hello, headers: {Authorization: 'Basic dXNlcjAxOnBhc3N3b3JkMQ=='}}
            output:
              status: 401
              body: {equals: '{"message":"Invalid user authorization"}'}
              logs: {matches: 'ldap-auth failed:.*(x509|certificate)'}
      - name: trusted-certificate-authenticates
        environment:
          SSL_CERT_FILE: '{{FIXTURE.ldap.CA_FILE}}'
        config:
          consumers:
            - username: user01
              plugins:
                ldap-auth: {user_dn: 'cn=user01,ou=users,dc=example,dc=org'}
          routes:
            - id: ldap-auth-ldaps-trusted
              uri: /hello
              plugins:
                ldap-auth:
                  base_dn: 'ou=users,dc=example,dc=org'
                  ldap_uri: 'localhost:{{FIXTURE.ldap.PORT}}'
                  uid: cn
                  use_tls: true
                  tls_verify: true
              upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
        fixtures:
          - name: ldap
            kind: tls-tcp
            network_expect:
              - payload_base64: {equals: 'MDkCAQFgNAIBAwQkY249dXNlcjAxLG91PXVzZXJzLGRjPWV4YW1wbGUsZGM9b3JngAlwYXNzd29yZDE='}
            network_respond:
              - payload_base64: 'MAwCAQFhBwoBAAQABAA='
          - name: primary
            kind: http
            respond: [{status: 200, body: hello world}]
        steps:
          - name: trusted-ldaps-bind-verifies-fixture-certificate
            input: {path: /hello, headers: {Authorization: 'Basic dXNlcjAxOnBhc3N3b3JkMQ=='}}
            output: {status: 200, body: {equals: hello world}, logs: {matches: 'find consumer user01'}}

  - name: vault-user-dn-reference
    config:
      secrets:
        - id: vault/test1
          uri: '{{FIXTURE.vault.URL}}'
          prefix: kv/apisix
          token: root
      consumers:
        - username: user01
          plugins:
            ldap-auth: {user_dn: '$secret://vault/test1/user01/user_dn'}
      routes:
        - id: ldap-auth-vault
          uri: /hello
          plugins:
            ldap-auth:
              base_dn: 'ou=users,dc=example,dc=org'
              ldap_uri: '{{FIXTURE.ldap.URL}}'
              uid: cn
          upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
    fixtures:
      - name: vault
        kind: http
        expect:
          - method: GET
            path: {equals: /v1/kv/apisix/user01}
            headers:
              X-Vault-Token: {equals: root}
              X-Vault-Namespace: {absent: true}
        respond:
          - status: 200
            body: '{"data":{"user_dn":"cn=user01,ou=users,dc=example,dc=org"}}'
      - name: ldap
        kind: ldap
        network_expect:
          - payload_base64: {equals: 'MDkCAQFgNAIBAwQkY249dXNlcjAxLG91PXVzZXJzLGRjPWV4YW1wbGUsZGM9b3JngAlwYXNzd29yZDE='}
        network_respond:
          - payload_base64: 'MAwCAQFhBwoBAAQABAA='
      - name: primary
        kind: http
        respond: [{status: 200, body: hello world}]
    steps:
      - name: vault-reference-resolves-at-consumer-lookup
        input: {path: /hello, headers: {Authorization: 'Basic dXNlcjAxOnBhc3N3b3JkMQ=='}}
        output: {status: 200, body: {equals: hello world}, logs: {matches: 'find consumer user01'}}

  - name: vault-token-environment-reference
    environment: {VAULT_TOKEN: root}
    config:
      secrets:
        - id: vault/test1
          uri: '{{FIXTURE.vault.URL}}'
          prefix: kv/apisix
          token: '$ENV://VAULT_TOKEN'
      consumers:
        - username: user01
          plugins:
            ldap-auth: {user_dn: '$secret://vault/test1/user01/user_dn'}
      routes:
        - id: ldap-auth-vault-env
          uri: /hello
          plugins:
            ldap-auth:
              base_dn: 'ou=users,dc=example,dc=org'
              ldap_uri: '{{FIXTURE.ldap.URL}}'
              uid: cn
          upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
    fixtures:
      - name: vault
        kind: http
        expect:
          - method: GET
            path: {equals: /v1/kv/apisix/user01}
            headers:
              X-Vault-Token: {equals: root}
              X-Vault-Namespace: {absent: true}
        respond:
          - status: 200
            body: '{"data":{"user_dn":"cn=user01,ou=users,dc=example,dc=org"}}'
      - name: ldap
        kind: ldap
        network_expect:
          - payload_base64: {equals: 'MDkCAQFgNAIBAwQkY249dXNlcjAxLG91PXVzZXJzLGRjPWV4YW1wbGUsZGM9b3JngAlwYXNzd29yZDE='}
        network_respond:
          - payload_base64: 'MAwCAQFhBwoBAAQABAA='
      - name: primary
        kind: http
        respond: [{status: 200, body: hello world}]
    steps:
      - name: environment-token-fetches-vault-user-dn
        input: {path: /hello, headers: {Authorization: 'Basic dXNlcjAxOnBhc3N3b3JkMQ=='}}
        output: {status: 200, body: {equals: hello world}, logs: {matches: 'find consumer user01'}}

  - name: basic-scheme-case-folding
    config:
      consumers:
        - username: user01
          plugins:
            ldap-auth: {user_dn: 'cn=user01,ou=users,dc=example,dc=org'}
      routes:
        - id: ldap-auth-scheme-case
          uri: /hello
          plugins:
            ldap-auth:
              base_dn: 'ou=users,dc=example,dc=org'
              ldap_uri: '{{FIXTURE.ldap.URL}}'
              uid: cn
          upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
    fixtures:
      - name: ldap
        kind: ldap
        network_expect:
          - payload_base64: {equals: 'MDkCAQFgNAIBAwQkY249dXNlcjAxLG91PXVzZXJzLGRjPWV4YW1wbGUsZGM9b3JngAlwYXNzd29yZDE='}
          - payload_base64: {equals: 'MDkCAQFgNAIBAwQkY249dXNlcjAxLG91PXVzZXJzLGRjPWV4YW1wbGUsZGM9b3JngAlwYXNzd29yZDE='}
          - payload_base64: {equals: 'MDkCAQFgNAIBAwQkY249dXNlcjAxLG91PXVzZXJzLGRjPWV4YW1wbGUsZGM9b3JngAlwYXNzd29yZDE='}
        network_respond:
          - payload_base64: 'MAwCAQFhBwoBAAQABAA='
          - payload_base64: 'MAwCAQFhBwoBAAQABAA='
          - payload_base64: 'MAwCAQFhBwoBAAQABAA='
      - name: primary
        kind: http
        respond:
          - {status: 200, body: hello world}
          - {status: 200, body: hello world}
          - {status: 200, body: hello world}
    steps:
      - name: lowercase-basic
        input: {path: /hello, headers: {Authorization: 'basic dXNlcjAxOnBhc3N3b3JkMQ=='}}
        output: {status: 200, body: {equals: hello world}}
      - name: uppercase-basic
        input: {path: /hello, headers: {Authorization: 'BASIC dXNlcjAxOnBhc3N3b3JkMQ=='}}
        output: {status: 200, body: {equals: hello world}}
      - name: mixed-case-basic
        input: {path: /hello, headers: {Authorization: 'bASiC dXNlcjAxOnBhc3N3b3JkMQ=='}}
        output: {status: 200, body: {equals: hello world}}

  - name: default-realm
    config:
      routes:
        - id: ldap-auth-default-realm
          uri: /hello
          plugins:
            ldap-auth: {base_dn: 'dc=example,dc=com', ldap_uri: 'ldap://127.0.0.1:1389'}
          upstream: {type: roundrobin, nodes: {'127.0.0.1:1': 1}}
    input: {path: /hello}
    output:
      status: 401
      headers: {WWW-Authenticate: {equals: 'Basic realm="ldap"'}}
      body: {equals: '{"message":"Missing authorization in request"}'}

  - name: custom-realm
    config:
      routes:
        - id: ldap-auth-custom-realm
          uri: /hello
          plugins:
            ldap-auth:
              base_dn: 'dc=example,dc=com'
              ldap_uri: 'ldap://127.0.0.1:1389'
              realm: my-ldap-realm
          upstream: {type: roundrobin, nodes: {'127.0.0.1:1': 1}}
    steps:
      - name: custom-realm-missing-authorization
        input: {path: /hello}
        output:
          status: 401
          headers: {WWW-Authenticate: {equals: 'Basic realm="my-ldap-realm"'}}
          body: {equals: '{"message":"Missing authorization in request"}'}
      - name: custom-realm-repeats-on-auth-failure
        input: {path: /hello}
        output:
          status: 401
          headers: {WWW-Authenticate: {equals: 'Basic realm="my-ldap-realm"'}}
          body: {equals: '{"message":"Missing authorization in request"}'}

  - name: custom-realm-invalid-credentials
    config:
      routes:
        - id: ldap-auth-custom-realm-invalid
          uri: /hello
          plugins:
            ldap-auth:
              base_dn: 'dc=example,dc=com'
              ldap_uri: '{{FIXTURE.ldap.URL}}'
              realm: my-ldap-realm
          upstream: {type: roundrobin, nodes: {'127.0.0.1:1': 1}}
    fixtures:
      - name: ldap
        kind: ldap
        network_expect:
          - payload_base64: {equals: 'MCoCAQFgJQIBAwQZY249dXNlcixkYz1leGFtcGxlLGRjPWNvbYAFd3Jvbmc='}
        network_respond:
          - payload_base64: 'MC4CAQFhKQoBMQQABCJUaGUgc3VwcGxpZWQgY3JlZGVudGlhbCBpcyBpbnZhbGlk'
    steps:
      - name: invalid-credentials-return-custom-realm
        input: {path: /hello, headers: {Authorization: 'Basic dXNlcjp3cm9uZw=='}}
        output:
          status: 401
          headers: {WWW-Authenticate: {equals: 'Basic realm="my-ldap-realm"'}}
