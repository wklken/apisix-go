  - name: limit-conn-redis-10-wrong-password-config
    source: {file: t/plugin/limit-conn-redis.t, tests: [10]}
    runtime: *redis_limit_runtime
    config:
      routes:
        - id: limit-conn-redis-10
          uri: /limit_conn
          plugins:
            limit-conn: &redis_wrong_password
              conn: 5
              burst: 1
              default_conn_delay: 0.1
              rejected_code: 503
              key: remote_addr
              policy: redis
              redis_host: '{{FIXTURE.redis.HOST}}'
              redis_port: '{{FIXTURE.redis.PORT}}'
              redis_username: alice
              redis_password: someerrorpassword
          upstream: *redis_origin_upstream
    fixtures:
      - {name: origin, kind: http, expect_requests: 0, respond: [*redis_passed_response]}
      - &redis_wrongpass_fixture
        name: redis
        kind: redis
        network_respond: [{payload: "-WRONGPASS invalid username-password pair or user is disabled.\r\n"}]
        redis: {ignore_negotiation: true, allow_unasserted_commands: true, auth: [{username: alice, password: someerrorpassword}]}
    steps:
      - name: wrong-password-config-is-runtime-checked
        input: {method: GET, path: /limit_conn}
        output: {status: 500, logs: {matches: 'failed to limit conn: .*WRONGPASS invalid username-password pair or user is disabled'}}

