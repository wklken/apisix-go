      routes:
        - id: limit-conn-redis-12
          uri: /limit_conn
          plugins:
            limit-conn: {conn: 1, burst: 1, default_conn_delay: 0.1, rejected_code: 503, key: remote_addr, policy: redis}
    input: {method: GET, path: /limit_conn}
    output: {status: 404, logs: {matches: 'build route limit-conn-redis-12 fail:.*limit-conn.*(then|redis_host)'}}

