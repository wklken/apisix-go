    fixtures:
      - {name: origin, kind: http, expect: *redis_cluster_origin_expect, count: {at_least: 10, at_most: 10}, respond: [{status: 200, body: passed, delay: 100ms}]}
      - *redis_cluster_fixture
    steps:
      - {name: all-ten-accepted, repeat: 10, concurrency: 10, input: {method: GET, path: /limit_conn}, output: {status_counts: {200: 10}}}

