      routes:
        - id: limit-conn-redis-cluster-02
          uri: /limit_conn
          plugins:
            limit-conn: &redis_cluster_high_capacity
              conn: 100
              burst: 50
              default_conn_delay: 0.1
              rejected_code: 503
              key: remote_addr
              policy: redis-cluster
              redis_cluster_nodes:
                - '{{FIXTURE.redis.ADDR}}'
                - '{{FIXTURE.redis.ADDR}}'
                - '{{FIXTURE.redis.ADDR}}'
              redis_cluster_name: test
          upstream: *redis_cluster_origin_upstream
    fixtures:
      - {name: origin, kind: http, expect: *redis_cluster_origin_expect, count: {at_least: 1, at_most: 1}, respond: [*redis_cluster_passed_response]}
      - *redis_cluster_fixture
    steps:
      - {name: configured-cluster-route-proxies, input: {method: GET, path: /limit_conn}, output: {status: 200, body: {equals: passed}}}

  - name: limit-conn-redis-cluster-03-ten-within-capacity
