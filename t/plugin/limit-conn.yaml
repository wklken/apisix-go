              redis_host: '{{FIXTURE.redis.HOST}}'
              redis_port: '{{FIXTURE.redis.PORT}}'
          upstream: &redis_origin_upstream {type: roundrobin, nodes: {"{{FIXTURE.origin.ADDR}}": 1}}
    fixtures:
