      - &redis_fixture
        name: redis
        kind: redis
        redis: {ignore_negotiation: true, allow_unasserted_commands: true}
    steps:
      - {name: valid-redis-schema-proxies, input: {method: GET, path: /limit_conn}, output: {status: 200, body: {equals: passed}}}

