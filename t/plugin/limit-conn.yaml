cases:
- name: limit-conn-redis-cluster-09-tls-six-accepted-four-rejected
  runtime:
    plugins:
    - limit-conn
  config:
    routes:
    - id: limit-conn-redis-cluster-09
      uri: "/limit_conn"
      plugins:
        limit-conn:
          conn: 5
          burst: 1
          default_conn_delay: 0.1
          rejected_code: 503
          key: remote_addr
          policy: redis-cluster
          redis_cluster_nodes:
          - "{{FIXTURE.redis.ADDR}}"
          - "{{FIXTURE.redis.ADDR}}"
          - "{{FIXTURE.redis.ADDR}}"
          redis_cluster_name: redis-cluster-2
          redis_cluster_ssl: true
          redis_cluster_ssl_verify: false
      upstream:
        type: roundrobin
        nodes:
          "{{FIXTURE.origin.ADDR}}": 1
  fixtures:
  - name: origin
    kind: http
    expect:
    - path:
        equals: "/limit_conn"
    count:
      at_least: 6
      at_most: 6
    respond:
    - status: 200
      body: passed
      delay: 500ms
  - name: redis
    kind: redis-cluster
    redis:
      tls: true
      allow_unasserted_commands: true
  steps:
  - name: tls-cluster-capacity-is-six
    repeat: 10
    concurrency: 10
    input:
      method: GET
      path: "/limit_conn"
    output:
      status_counts:
        200: 6
        503: 4
- name: limit-conn-redis-09-authenticated-six-accepted-four-rejected
  runtime:
    plugins:
    - limit-conn
  config:
    routes:
    - id: limit-conn-redis-09
      uri: "/limit_conn"
      plugins:
        limit-conn:
          conn: 5
          burst: 1
          default_conn_delay: 0.1
          rejected_code: 503
          key: remote_addr
          policy: redis
          redis_host: "{{FIXTURE.redis.HOST}}"
          redis_port: "{{FIXTURE.redis.PORT}}"
          redis_username: alice
          redis_password: somepassword
      upstream:
        type: roundrobin
        nodes:
          "{{FIXTURE.origin.ADDR}}": 1
  fixtures:
  - name: origin
    kind: http
    expect:
    - path:
        equals: "/limit_conn"
    count:
      at_least: 6
      at_most: 6
    respond:
    - status: 200
      body: passed
      delay: 500ms
  - name: redis
    kind: redis
    redis:
      ignore_negotiation: true
      allow_unasserted_commands: true
      auth:
      - username: alice
        password: somepassword
  steps:
  - name: authenticated-capacity-is-six
    repeat: 10
    concurrency: 10
    input:
      method: GET
      path: "/limit_conn"
    output:
      status_counts:
        200: 6
        503: 4
- name: limit-conn-redis-10-wrong-password-config
  runtime:
    plugins:
    - limit-conn
  config:
    routes:
    - id: limit-conn-redis-10
      uri: "/limit_conn"
      plugins:
        limit-conn:
          conn: 5
          burst: 1
          default_conn_delay: 0.1
          rejected_code: 503
          key: remote_addr
          policy: redis
          redis_host: "{{FIXTURE.redis.HOST}}"
          redis_port: "{{FIXTURE.redis.PORT}}"
          redis_username: alice
          redis_password: someerrorpassword
      upstream:
        type: roundrobin
        nodes:
          "{{FIXTURE.origin.ADDR}}": 1
  fixtures:
  - name: origin
    kind: http
    expect_requests: 0
    respond:
    - status: 200
      body: passed
  - name: redis
    kind: redis
    network_respond:
    - payload: "-WRONGPASS invalid username-password pair or user is disabled.\r\n"
    redis:
      ignore_negotiation: true
      allow_unasserted_commands: true
      auth:
      - username: alice
        password: someerrorpassword
  steps:
  - name: wrong-password-config-is-runtime-checked
    input:
      method: GET
      path: "/limit_conn"
    output:
      status: 500
      logs:
        matches: 'failed to limit conn: .*WRONGPASS invalid username-password pair
          or user is disabled'
- name: limit-conn-variable-09-project-rule-overrides
  runtime:
    plugins:
    - limit-conn
  config:
    routes:
    - id: limit-conn-variable-09
      uri: "/limit_conn"
      plugins:
        limit-conn:
          default_conn_delay: 0.01
          rejected_code: 503
          rules:
          - conn: 4
            burst: 3
            key: "${http_user}"
          - conn: "${http_project_conn ?? 3}"
            burst: "${http_project_burst ?? 2}"
            key: "${http_project}"
      upstream:
        type: roundrobin
        nodes:
          "{{FIXTURE.origin.ADDR}}": 1
  fixtures:
  - name: origin
    kind: http
    expect:
    - path:
        equals: "/limit_conn"
    count:
      at_least: 3
      at_most: 3
    respond:
    - status: 200
      body: passed
  steps:
  - name: three-accepted-seven-rejected
    repeat: 3
    concurrency: 3
    hold_upstream:
      fixture: origin
      requests: 3
      probes:
      - input:
          method: GET
          path: "/limit_conn"
          headers:
            project: apisix
            project-conn: '2'
            project-burst: '1'
        output:
          status: 503
      - input:
          method: GET
          path: "/limit_conn"
          headers:
            project: apisix
            project-conn: '2'
            project-burst: '1'
        output:
          status: 503
      - input:
          method: GET
          path: "/limit_conn"
          headers:
            project: apisix
            project-conn: '2'
            project-burst: '1'
        output:
          status: 503
      - input:
          method: GET
          path: "/limit_conn"
          headers:
            project: apisix
            project-conn: '2'
            project-burst: '1'
        output:
          status: 503
      - input:
          method: GET
          path: "/limit_conn"
          headers:
            project: apisix
            project-conn: '2'
            project-burst: '1'
        output:
          status: 503
      - input:
          method: GET
          path: "/limit_conn"
          headers:
            project: apisix
            project-conn: '2'
            project-burst: '1'
        output:
          status: 503
      - input:
          method: GET
          path: "/limit_conn"
          headers:
            project: apisix
            project-conn: '2'
            project-burst: '1'
        output:
          status: 503
    input:
      method: GET
      path: "/limit_conn"
      headers:
        project: apisix
        project-conn: '2'
        project-burst: '1'
    output:
      status: 200
      body:
        equals: passed
- name: limit-conn-30-consumer-three-accepted-seven-rejected
  runtime:
    plugins:
    - key-auth
    - limit-conn
  config:
    consumers:
    - username: consumer_jack
      plugins:
        key-auth:
          key: auth-jack
    routes:
    - id: limit-conn-30
      uri: "/limit_conn"
      plugins:
        key-auth: {}
        limit-conn:
          conn: 2
          burst: 1
          default_conn_delay: 0.1
          rejected_code: 503
          key: consumer_name
      upstream:
        type: roundrobin
        nodes:
          "{{FIXTURE.origin.ADDR}}": 1
  fixtures:
  - name: origin
    kind: http
    expect:
    - path:
        equals: "/limit_conn"
      headers:
        X-Consumer-Username:
          equals: consumer_jack
    count:
      at_least: 3
      at_most: 3
    respond:
    - status: 200
      body: passed
      delay: 500ms
  steps:
  - name: authenticated-consumer-capacity-is-three
    repeat: 10
    concurrency: 10
    input:
      method: GET
      path: "/limit_conn"
      headers:
        apikey: auth-jack
    output:
      status_counts:
        200: 3
        503: 7
- name: limit-conn2-01-route-uses-retrying-upstream-resource
  runtime:
    plugins:
    - limit-conn
  config:
    upstreams:
    - id: limit-conn2-retry-01
      type: roundrobin
      retries: 2
      nodes:
        127.0.0.1:1: 1
        "{{FIXTURE.origin.ADDR}}": 1
    routes:
    - id: limit-conn2-01
      uri: "/mysleep"
      plugins:
        limit-conn:
          conn: 1
          burst: 0
          default_conn_delay: 0.3
          rejected_code: 503
          key: remote_addr
      upstream_id: limit-conn2-retry-01
  fixtures:
  - name: origin
    kind: http
    expect:
    - path:
        matches: "^/mysleep\\?seconds=0\\.1$"
    count:
      at_least: 2
      at_most: 2
    respond:
    - status: 200
      body: retry passed
  steps:
  - name: retrying-upstream-route-serves-first-request
    input:
      method: GET
      path: "/mysleep?seconds=0.1"
    output:
      status: 200
      body:
        equals: retry passed
  - name: retrying-upstream-route-serves-second-request
    input:
      method: GET
      path: "/mysleep?seconds=0.1"
    output:
      status: 200
      body:
        equals: retry passed
- name: limit-conn2-02-request-latency-is-recorded
  runtime:
    plugins:
    - limit-conn
    nginx_config:
      error_log_level: debug
  config:
    upstreams:
    - id: limit-conn2-retry-02
      type: roundrobin
      retries: 2
      nodes:
        127.0.0.1:1: 1
        "{{FIXTURE.origin.ADDR}}": 1
    routes:
    - id: limit-conn2-02
      uri: "/mysleep"
      plugins:
        limit-conn:
          conn: 1
          burst: 0
          default_conn_delay: 0.3
          rejected_code: 503
          key: remote_addr
      upstream_id: limit-conn2-retry-02
  fixtures:
  - name: origin
    kind: http
    expect:
    - path:
        matches: "^/mysleep\\?seconds=0\\.1$"
    count:
      at_least: 1
      at_most: 1
    respond:
    - status: 200
      body: '0.1'
      delay: 100ms
  steps:
  - name: delayed-upstream-latency-is-measured
    input:
      method: GET
      path: "/mysleep?seconds=0.1"
    output:
      status: 200
      body:
        equals: '0.1'
      elapsed_at_least: 90ms
      logs:
        matches: request latency is 0\.1
- name: limit-conn2-04-global-and-route-record-latency
  runtime:
    plugins:
    - limit-conn
    nginx_config:
      error_log_level: debug
  config:
    global_rules:
    - id: limit-conn2-global-04
      plugins:
        limit-conn:
          conn: 1
          burst: 0
          default_conn_delay: 0.3
          rejected_code: 503
          key: remote_addr
    routes:
    - id: limit-conn2-04
      uri: "/hello"
      plugins:
        limit-conn:
          conn: 1
          burst: 0
          default_conn_delay: 0.3
          rejected_code: 503
          key: remote_addr
      upstream:
        type: roundrobin
        nodes:
          "{{FIXTURE.origin.ADDR}}": 1
  fixtures:
  - name: origin
    kind: http
    expect:
    - path:
        equals: "/hello"
    count:
      at_least: 1
      at_most: 1
    respond:
    - status: 200
      body: hello world
  steps:
  - name: both-plugin-instances-record-request-latency
    input:
      method: GET
      path: "/hello"
    output:
      status: 200
      body:
        equals: hello world
      logs:
        matches: "(?s)request latency is .*request latency is "
- name: limit-conn3-03-http2-parallel-streams-share-connection-limit
  frontend_tls:
    sni: www.test.com
  config:
    routes:
    - id: limit-conn3-http2-route
      uri: "/limit_conn"
      host: www.test.com
      plugins:
        limit-conn:
          conn: 1
          burst: 0
          default_conn_delay: 0.1
          rejected_code: 503
          key: "$remote_addr"
          key_type: var_combination
      upstream:
        type: roundrobin
        nodes:
          "{{FIXTURE.primary.ADDR}}": 1
  fixtures:
  - name: primary
    kind: http
    expect_requests: 1
    expect:
    - method: GET
      path:
        equals: "/limit_conn"
      host:
        equals: www.test.com
    respond:
    - status: 200
      body: hello world
      delay: 500ms
  steps:
  - name: two-http2-streams-share-the-client-connection-limit
    concurrency: 2
    repeat: 2
    input:
      method: GET
      scheme: https
      version: '2'
      path: "/limit_conn"
      headers:
        Host: www.test.com
    output:
      status_counts:
        200: 1
        503: 1
