              key: remote_addr
              policy: redis
              redis_host: '{{FIXTURE.redis.HOST}}'
              redis_port: '{{FIXTURE.redis.PORT}}'
              redis_username: alice
              redis_password: somepassword
          upstream: *redis_origin_upstream
    fixtures:
      - {name: origin, kind: http, expect: *redis_origin_expect, count: {at_least: 1, at_most: 1}, respond: [*redis_passed_response]}
      - name: redis
        kind: redis
        redis: {ignore_negotiation: true, allow_unasserted_commands: true, auth: [{username: alice, password: somepassword}]}
    steps:
      - {name: authenticated-redis-route-proxies, input: {method: GET, path: /limit_conn}, output: {status: 200, body: {equals: passed}}}

