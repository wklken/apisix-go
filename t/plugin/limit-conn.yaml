  - name: limit-conn-redis-cluster-10-keepalive-diagnostic
    source: {file: t/plugin/limit-conn-redis-cluster.t, tests: [10]}
    runtime: *redis_cluster_runtime
    config:
      routes:
        - id: limit-conn-redis-cluster-10
          uri: /limit_conn
          plugins:
            limit-conn:
              conn: 5
              burst: 1
              default_conn_delay: 0.1
              rejected_code: 503
              key: remote_addr
              policy: redis-cluster
              redis_cluster_nodes:
                - '{{FIXTURE.redis.ADDR}}'
                - '{{FIXTURE.redis.ADDR}}'
                - '{{FIXTURE.redis.ADDR}}'
              redis_keepalive_timeout: 10000
              redis_keepalive_pool: 100
              redis_cluster_name: redis-cluster-2
              redis_cluster_ssl: true
              redis_cluster_ssl_verify: false
          upstream: *redis_cluster_origin_upstream
    fixtures:
      - {name: origin, kind: http, expect: *redis_cluster_origin_expect, count: {at_least: 2, at_most: 2}, respond: [*redis_cluster_passed_response]}
      - *redis_cluster_tls_fixture
    steps:
      - {name: first-request-opens-cluster-connection, input: {method: GET, path: /limit_conn}, output: {status: 200, body: {equals: passed}}}
      - name: second-request-reuses-cluster-connection
        input: {method: GET, path: /limit_conn}
        output:
          status: 200
          body: {equals: passed}
          logs: {matches: '(?s)redis connection reused times: 0.*redis connection reused times: 1'}
  - name: limit-conn-redis-01-valid-schema
    source: {file: t/plugin/limit-conn-redis.t, tests: [1]}
    runtime: &redis_limit_runtime {plugins: [limit-conn]}
    config:
      routes:
        - id: limit-conn-redis-01
          uri: /limit_conn
