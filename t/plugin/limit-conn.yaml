cases:
  - name: limit-conn-redis-cluster-01-valid-schema
    source: {file: t/plugin/limit-conn-redis-cluster.t, tests: [1]}
    runtime: &redis_cluster_runtime {plugins: [limit-conn]}
    config:
      routes:
        - id: limit-conn-redis-cluster-01
          uri: /limit_conn
          plugins:
            limit-conn:
              conn: 1
              burst: 0
              default_conn_delay: 0.1
              rejected_code: 503
              key: remote_addr
              policy: redis-cluster
              redis_cluster_nodes:
                - '{{FIXTURE.redis.ADDR}}'
                - '{{FIXTURE.redis.ADDR}}'
                - '{{FIXTURE.redis.ADDR}}'
              redis_cluster_name: test
          upstream: &redis_cluster_origin_upstream {type: roundrobin, nodes: {"{{FIXTURE.origin.ADDR}}": 1}}
    fixtures:
      - name: origin
        kind: http
        expect: &redis_cluster_origin_expect [{path: {equals: /limit_conn}}]
        count: {at_least: 1, at_most: 1}
        respond: [&redis_cluster_passed_response {status: 200, body: passed}]
      - &redis_cluster_fixture
        name: redis
        kind: redis-cluster
        redis: {allow_unasserted_commands: true}
    steps:
      - {name: valid-redis-cluster-schema-proxies, input: {method: GET, path: /limit_conn}, output: {status: 200, body: {equals: passed}}}

  - name: limit-conn-redis-cluster-02-add-high-capacity-route
    source: {file: t/plugin/limit-conn-redis-cluster.t, tests: [2]}
    runtime: *redis_cluster_runtime
