    - name: limit-count-consumer-isolation-set-route-with-key-auth-test-1
      config:
        consumers:
            - plugins:
                key-auth:
                    key: jack1
                limit-count:
                    count: 2
                    key: remote_addr
                    policy: redis
                    redis_host: '{{FIXTURE.redis.HOST}}'
                    redis_port: '{{FIXTURE.redis.PORT}}'
                    redis_timeout: 1001
                    rejected_code: 503
                    show_limit_quota_header: true
                    time_window: 60
              username: jack1
        routes:
            - id: consumer-isolation-route-setup-test-1
              plugins:
                key-auth: {}
              upstream:
                nodes:
                    '{{FIXTURE.primary.ADDR}}': 1
                type: roundrobin
              uri: /consumer-isolation-route-setup
      fixtures:
        - count:
            at_least: 1
            at_most: 1
          expect:
            - method: GET
              path:
                equals: /consumer-isolation-route-setup
          kind: http
          name: primary
          respond:
            - body: limit-count upstream
              status: 200
        - kind: redis
          name: redis
          redis:
            allow_unasserted_commands: true
            ignore_negotiation: true
            value_matches:
                '^limit-count:route:consumer-isolation-route-setup-test-1:consumer:jack1:127\.0\.0\.1$': "1"
      steps:
        - input:
            headers:
                apikey: jack1
            method: GET
            path: /consumer-isolation-route-setup
          name: key-auth-route-runs-the-consumer-limit
          output:
            body:
                equals: limit-count upstream
            headers:
                X-RateLimit-Limit:
                    equals: "2"
                X-RateLimit-Remaining:
                    equals: "1"
            status: 200
