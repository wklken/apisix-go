cases:
    - name: consumer-group-enforces-key-auth-quota
      config:
        consumer_groups:
            - id: standard
              plugins:
                limit-count:
                    count: 2
                    key: remote_addr
                    rejected_code: 429
                    show_limit_quota_header: true
                    time_window: 60
        consumers:
            - group_id: standard
              plugins:
                key-auth:
                    key: standard-key
              username: standard-consumer
        routes:
            - id: consumer-group-limit-count
              plugins:
                key-auth: {}
              upstream:
                nodes:
                    '{{FIXTURE.primary.ADDR}}': 1
                type: roundrobin
              uri: /limit-count
      fixtures:
        - count:
            at_least: 2
            at_most: 2
          expect:
            - method: GET
              path:
                matches: ^/limit-count(?:-b)?$
          kind: http
          name: primary
          respond:
            - body: limit-count upstream
              status: 200
      steps:
        - input:
            headers:
                apikey: standard-key
            method: GET
            path: /limit-count
          name: group-quota-allows-1
          output:
            status: 200
        - input:
            headers:
                apikey: standard-key
            method: GET
            path: /limit-count
          name: group-quota-allows-2
          output:
            status: 200
        - input:
            headers:
                apikey: standard-key
            method: GET
            path: /limit-count
          name: group-quota-rejects-next
          output:
            status: 429
    - name: redis-isolates-consumer-quotas
      config:
        consumers:
            - plugins:
                key-auth:
                    key: jack1
                limit-count:
                    count: 2
                    key: remote_addr
                    policy: redis
                    redis_host: '{{FIXTURE.redis.HOST}}'
                    redis_port: '{{FIXTURE.redis.PORT}}'
                    redis_timeout: 1001
                    rejected_code: 503
                    show_limit_quota_header: true
                    time_window: 60
              username: jack1
            - plugins:
                key-auth:
                    key: jack2
                limit-count:
                    count: 2
                    key: remote_addr
                    policy: redis
                    redis_host: '{{FIXTURE.redis.HOST}}'
                    redis_port: '{{FIXTURE.redis.PORT}}'
                    redis_timeout: 1001
                    rejected_code: 503
                    show_limit_quota_header: true
                    time_window: 60
              username: jack2
        routes:
            - id: consumer-isolation-jack2-fresh-test-5
              plugins:
                key-auth: {}
              upstream:
                nodes:
                    '{{FIXTURE.primary.ADDR}}': 1
                type: roundrobin
              uri: /consumer-isolation-jack2-fresh
      fixtures:
        - count:
            at_least: 4
            at_most: 4
          expect:
            - method: GET
              path:
                equals: /consumer-isolation-jack2-fresh
          kind: http
          name: primary
          respond:
            - body: limit-count upstream
              status: 200
        - kind: redis
          name: redis
          redis:
            allow_unasserted_commands: true
            ignore_negotiation: true
            value_matches:
                '^plugin-limit-count/consumers/jack1:[0-9]+:127\.0\.0\.1$': "-2"
                '^plugin-limit-count/consumers/jack2:[0-9]+:127\.0\.0\.1$': "-2"
      steps:
        - input:
            headers:
                apikey: jack1
            method: GET
            path: /consumer-isolation-jack2-fresh
          name: prerequisite-jack1-first-request-is-allowed
          output:
            status: 200
        - input:
            headers:
                apikey: jack1
            method: GET
            path: /consumer-isolation-jack2-fresh
          name: prerequisite-jack1-second-request-is-allowed
          output:
            status: 200
        - input:
            headers:
                apikey: jack1
            method: GET
            path: /consumer-isolation-jack2-fresh
          name: prerequisite-jack1-third-request-is-rejected
          output:
            status: 503
        - input:
            headers:
                apikey: jack1
            method: GET
            path: /consumer-isolation-jack2-fresh
          name: prerequisite-jack1-fourth-request-is-rejected
          output:
            status: 503
        - input:
            headers:
                apikey: jack2
            method: GET
            path: /consumer-isolation-jack2-fresh
          name: isolated-jack2-first-request-starts-fresh
          output:
            headers:
                X-RateLimit-Limit:
                    equals: "2"
                X-RateLimit-Remaining:
                    equals: "1"
            status: 200
        - input:
            headers:
                apikey: jack2
            method: GET
            path: /consumer-isolation-jack2-fresh
          name: isolated-jack2-second-request-exhausts-its-own-quota
          output:
            headers:
                X-RateLimit-Remaining:
                    equals: "0"
            status: 200
        - input:
            headers:
                apikey: jack2
            method: GET
            path: /consumer-isolation-jack2-fresh
          name: isolated-jack2-third-request-is-rejected
          output:
            headers:
                X-RateLimit-Remaining:
                    equals: "0"
            status: 503
        - input:
            headers:
                apikey: jack2
            method: GET
            path: /consumer-isolation-jack2-fresh
          name: isolated-jack2-fourth-request-remains-rejected
          output:
            headers:
                X-RateLimit-Remaining:
                    equals: "0"
            status: 503
    - name: redis-cluster-rejection-preserves-reset-header
      config:
        routes:
            - id: redis-cluster2-positive-reset-test-2
              plugins:
                limit-count:
                    count: 2
                    key: remote_addr
                    policy: redis-cluster
                    redis_cluster_name: redis-cluster-1
                    redis_cluster_nodes:
                        - '{{FIXTURE.redis.ADDR}}'
                        - '{{FIXTURE.redis.ADDR}}'
                    time_window: 60
              upstream:
                nodes:
                    '{{FIXTURE.primary.ADDR}}': 1
                type: roundrobin
              uri: /redis-cluster2-positive-reset
      fixtures:
        - count:
            at_least: 2
            at_most: 2
          expect:
            - method: GET
              path:
                equals: /redis-cluster2-positive-reset
          kind: http
          name: primary
          respond:
            - body: limit-count upstream
              status: 200
        - kind: redis-cluster
          name: redis
          redis:
            allow_unasserted_commands: true
            ignore_negotiation: true
            value_matches:
                '^plugin-limit-count/routes/redis-cluster2-positive-reset-test-2:[0-9]+:127\.0\.0\.1$': "-1"
      steps:
        - input:
            method: GET
            path: /redis-cluster2-positive-reset
          name: first-accepted-request-has-positive-reset
          output:
            headers:
                X-RateLimit-Remaining:
                    equals: "1"
                X-RateLimit-Reset:
                    matches: ^[1-9][0-9]*$
            status: 200
          wait: 1s
        - input:
            method: GET
            path: /redis-cluster2-positive-reset
          name: second-accepted-request-keeps-positive-reset
          output:
            headers:
                X-RateLimit-Remaining:
                    equals: "0"
                X-RateLimit-Reset:
                    matches: ^[1-9][0-9]*$
            status: 200
          wait: 1s
        - input:
            method: GET
            path: /redis-cluster2-positive-reset
          name: rejected-request-keeps-positive-reset
          output:
            headers:
                X-RateLimit-Remaining:
                    equals: "0"
                X-RateLimit-Reset:
                    matches: ^[1-9][0-9]*$
            status: 503
    - name: redis-noscript-recovers-with-eval
      config:
        routes:
            - id: limit-count-route
              plugins:
                limit-count:
                    count: 2
                    key: remote_addr
                    policy: redis
                    redis_host: '{{FIXTURE.redis.HOST}}'
                    redis_port: '{{FIXTURE.redis.PORT}}'
                    rejected_code: 503
                    show_limit_quota_header: true
                    time_window: 60
              upstream:
                nodes:
                    '{{FIXTURE.primary.ADDR}}': 1
                type: roundrobin
              uri: /limit-count
      fixtures:
        - count:
            at_least: 2
            at_most: 2
          expect:
            - method: GET
              path:
                matches: ^/limit-count(?:-b)?$
          kind: http
          name: primary
          respond:
            - body: limit-count upstream
              status: 200
        - kind: redis
          name: redis
          redis:
            allow_unasserted_commands: true
            ignore_negotiation: true
      steps:
        - input:
            method: GET
            path: /limit-count
          name: allowed-request-1
          output:
            headers:
                X-RateLimit-Remaining:
                    equals: "1"
            status: 200
        - input:
            method: GET
            path: /limit-count
          name: allowed-request-2
          output:
            headers:
                X-RateLimit-Remaining:
                    equals: "0"
            status: 200
        - input:
            method: GET
            path: /limit-count
          name: request-over-limit-is-rejected
          output:
            headers:
                X-RateLimit-Remaining:
                    equals: "0"
            status: 503
    - name: redis-tls-failure-degrades-to-proxy
      config:
        routes:
            - id: redis3-tls-degradation-test-9
              plugins:
                limit-count:
                    allow_degradation: true
                    count: 2
                    key: remote_addr
                    policy: redis
                    redis_host: '{{FIXTURE.redis.HOST}}'
                    redis_port: '{{FIXTURE.redis.PORT}}'
                    redis_ssl: true
                    redis_ssl_verify: true
                    redis_timeout: 1001
                    rejected_code: 503
                    show_limit_quota_header: true
                    time_window: 60
              upstream:
                nodes:
                    '{{FIXTURE.primary.ADDR}}': 1
                type: roundrobin
              uri: /redis3-tls-degradation
      fixtures:
        - count:
            at_least: 3
            at_most: 3
          expect:
            - method: GET
              path:
                equals: /redis3-tls-degradation
          kind: http
          name: primary
          respond:
            - body: limit-count upstream
              status: 200
        - expect_requests: 0
          kind: https
          name: redis
          respond:
            - status: 200
      steps:
        - input:
            method: GET
            path: /redis3-tls-degradation
          repeat: 3
          name: every-tls-backend-failure-degrades-to-the-upstream
          output:
            body:
                equals: limit-count upstream
            headers:
                X-RateLimit-Remaining:
                    absent: true
            logs:
                matches: '(?i)(certificate|tls|handshake)'
            status: 200
    - name: service-inheritance-allows-route-override
      config:
        services:
            - id: '1'
              plugins:
                limit-count:
                    count: 2
                    key: service_id
                    rejected_code: 503
                    time_window: 60
              upstream:
                nodes:
                    '{{FIXTURE.primary.ADDR}}': 1
                type: roundrobin
        routes:
            - id: '1'
              service_id: '1'
              uri: /limit-count
      fixtures:
        - count:
            at_least: 4
            at_most: 4
          expect:
            - method: GET
              path:
                matches: ^/limit-count(?:-b)?$
          kind: http
          name: primary
          respond:
            - body: limit-count upstream
              status: 200
      steps:
        - input: {method: GET, path: /limit-count}
          name: inherited-limit-request-1-is-allowed
          output: {status: 200, body: {equals: limit-count upstream}}
        - input: {method: GET, path: /limit-count}
          name: inherited-limit-request-2-is-allowed
          output: {status: 200, body: {equals: limit-count upstream}}
        - input: {method: GET, path: /limit-count}
          name: inherited-limit-request-3-is-rejected
          output: {status: 503}
        - input: {method: GET, path: /limit-count}
          name: inherited-limit-request-4-remains-rejected
          output: {status: 503}
        - name: remove-service-limit-count-plugin
          config:
            services:
                - id: '1'
                  upstream:
                    nodes:
                        '{{FIXTURE.primary.ADDR}}': 1
                    type: roundrobin
            routes:
                - id: '1'
                  service_id: '1'
                  uri: /limit-count
                - id: limit-count-ready-30
                  plugins:
                    mocking:
                        content_type: text/plain
                        response_example: ready
                        response_status: 200
                  uri: /limit-count-ready-30
          config_probe:
            input: {method: GET, path: /limit-count-ready-30}
            output: {status: 200, body: {equals: ready}}
          input: {method: GET, path: /limit-count-ready-30}
          output: {status: 200, body: {equals: ready}}
        - name: bind-route-limit-count-plugin
          config:
            services:
                - id: '1'
                  upstream:
                    nodes:
                        '{{FIXTURE.primary.ADDR}}': 1
                    type: roundrobin
            routes:
                - id: '1'
                  plugins:
                    limit-count:
                        count: 2
                        key: service_id
                        rejected_code: 503
                        time_window: 91
                  service_id: '1'
                  uri: /limit-count
                - id: limit-count-ready-31
                  plugins:
                    mocking:
                        content_type: text/plain
                        response_example: ready
                        response_status: 200
                  uri: /limit-count-ready-31
          config_probe:
            input: {method: GET, path: /limit-count-ready-31}
            output: {status: 200, body: {equals: ready}}
          input: {method: GET, path: /limit-count-ready-31}
          output: {status: 200, body: {equals: ready}}
        - input: {method: GET, path: /limit-count}
          name: overridden-limit-request-1-is-allowed
          output: {status: 200, body: {equals: limit-count upstream}}
        - input: {method: GET, path: /limit-count}
          name: overridden-limit-request-2-is-allowed
          output: {status: 200, body: {equals: limit-count upstream}}
        - input: {method: GET, path: /limit-count}
          name: overridden-limit-request-3-is-rejected
          output: {status: 503}
        - input: {method: GET, path: /limit-count}
          name: overridden-limit-request-4-remains-rejected
          output: {status: 503}
    - name: metadata-renames-rate-limit-headers
      config:
        plugin_metadata:
            - id: limit-count
              limit_header: APISIX-RATELIMIT-QUOTA
              remaining_header: APISIX-RATELIMIT-REMAINING
              reset_header: APISIX-RATELIMIT-RESET
        routes:
            - id: limit-count5-metadata-check-test-5
              plugins:
                limit-count:
                    count: 10
                    key: remote_addr
                    rejected_code: 503
                    show_limit_quota_header: true
                    time_window: 60
              upstream:
                nodes:
                    '{{FIXTURE.primary.ADDR}}': 1
                type: roundrobin
              uri: /metadata-header-check
      fixtures:
        - count:
            at_least: 1
            at_most: 1
          expect:
            - method: GET
              path:
                equals: /metadata-header-check
          kind: http
          name: primary
          respond:
            - body: limit-count upstream
              status: 200
      steps:
        - input:
            method: GET
            path: /metadata-header-check
          name: request-uses-custom-rate-limit-header-names
          output:
            headers:
                APISIX-RATELIMIT-QUOTA:
                    equals: "10"
                APISIX-RATELIMIT-REMAINING:
                    equals: "9"
                APISIX-RATELIMIT-RESET:
                    matches: ^[1-9][0-9]+$
                X-RateLimit-Limit:
                    absent: true
            status: 200
