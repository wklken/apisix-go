    - name: limit-count-redis-cluster-set-route-with-redis-cluster-nodes-and-redis-cluster-name-test-2
      config:
        routes:
            - id: limit-count-route
              plugins:
                limit-count:
                    count: 2
                    key: remote_addr
                    policy: redis-cluster
                    redis_cluster_name: fixture-cluster
                    redis_cluster_nodes:
                        - '{{FIXTURE.redis.ADDR}}'
                    rejected_code: 503
                    show_limit_quota_header: true
                    time_window: 60
              upstream:
                nodes:
                    '{{FIXTURE.primary.ADDR}}': 1
                type: roundrobin
              uri: /limit-count
      fixtures:
        - count:
            at_least: 1
            at_most: 1
          expect:
            - method: GET
              path:
                matches: ^/limit-count(?:-b)?$
          kind: http
          name: primary
          respond:
            - body: limit-count upstream
              status: 200
        - kind: redis-cluster
          name: redis
          network_expect:
            - payload:
                matches: .*
          network_respond:
            - payload: ignored
      steps:
        - input:
            method: GET
            path: /limit-count
          name: configured-limit-allows-request
          output:
