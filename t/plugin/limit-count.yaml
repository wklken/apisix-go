cases:
    - name: limit-count-consumer-group-credentials-setup-consumer-group-with-limit-count-plugin-test-1
      source:
        file: t/plugin/limit-count-consumer-group-credentials.t
        tests:
            - 1
      config:
        consumer_groups:
            - id: standard
              plugins:
                limit-count:
                    count: 2
                    key: remote_addr
                    rejected_code: 429
                    show_limit_quota_header: true
                    time_window: 60
        consumers:
            - group_id: standard
              plugins:
                key-auth:
                    key: standard-key
              username: standard-consumer
        routes:
            - id: consumer-group-limit-count
              plugins:
                key-auth: {}
              upstream:
                nodes:
                    '{{FIXTURE.primary.ADDR}}': 1
                type: roundrobin
              uri: /limit-count
      fixtures:
        - count:
            at_least: 1
            at_most: 1
          expect:
            - method: GET
              path:
                matches: ^/limit-count(?:-b)?$
          kind: http
          name: primary
          respond:
            - body: limit-count upstream
              status: 200
      steps:
        - input:
            headers:
                apikey: standard-key
            method: GET
            path: /limit-count
          name: group-credential-activates-group-limit
          output:
            status: 200
