cases:
  - name: local-state-survives-reload-and-config-changes-reset-delay-policy
    config:
      routes:
        - id: limit-req-local-lifecycle
          uri: /hello
          plugins:
            limit-req: {rate: 0.1, burst: 1, key: remote_addr, nodelay: true}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
        - id: limit-req-local-ready
          uri: /ready-initial
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.ready.ADDR}}": 1}}
    fixtures:
      - name: primary
        kind: http
        count: {at_least: 6, at_most: 6}
        expect: [{method: GET, path: {equals: /hello}}]
        respond: [{status: 200, body: hello world}]
      - {name: ready, kind: http, count: {at_least: 3, at_most: 3}, expect: [{method: GET, path: {matches: '^/ready-(unrelated|delay|nodelay)$'}}], respond: [{status: 204}]}
    steps:
      - name: first-request-is-immediate
        input: {method: GET, path: /hello}
        output: {status: 200, body: {equals: hello world}, elapsed_less_than: 500ms}
      - name: burst-request-is-admitted-with-nodelay
        input: {method: GET, path: /hello}
        output: {status: 200, body: {equals: hello world}, elapsed_less_than: 500ms}
      - name: quota-rejects-third-request-with-default-503
        input: {method: GET, path: /hello}
        output: {status: 503}
      - name: unrelated-reload-keeps-the-existing-bucket
        config:
          routes:
            - id: limit-req-local-lifecycle
              uri: /hello
              plugins:
                limit-req: {rate: 0.1, burst: 1, key: remote_addr, nodelay: true}
              upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
            - id: limit-req-local-ready
              uri: /ready-unrelated
              upstream: {type: roundrobin, nodes: {"{{FIXTURE.ready.ADDR}}": 1}}
            - id: unrelated-route
              uri: /unrelated
              upstream: {type: roundrobin, nodes: {"{{FIXTURE.ready.ADDR}}": 1}}
        config_probe: {input: {path: /ready-unrelated}, output: {status: 204}}
        input: {method: GET, path: /hello}
        output: {status: 503}
      - name: changed-config-starts-a-new-bucket
        config:
          routes:
            - id: limit-req-local-lifecycle
              uri: /hello
              plugins:
                limit-req: {rate: 2, burst: 1, key: remote_addr}
              upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
            - id: limit-req-local-ready
              uri: /ready-delay
              upstream: {type: roundrobin, nodes: {"{{FIXTURE.ready.ADDR}}": 1}}
        config_probe: {input: {path: /ready-delay}, output: {status: 204}}
        input: {method: GET, path: /hello}
        output: {status: 200, body: {equals: hello world}, elapsed_less_than: 500ms}
      - name: second-request-observes-the-default-delay
        input: {method: GET, path: /hello}
        output: {status: 200, body: {equals: hello world}, elapsed_at_least: 450ms, elapsed_less_than: 2s}
      - name: nodelay-update-starts-a-new-immediate-bucket
        config:
          routes:
            - id: limit-req-local-lifecycle
              uri: /hello
              plugins:
                limit-req: {rate: 2, burst: 1, key: remote_addr, nodelay: true}
              upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
            - id: limit-req-local-ready
              uri: /ready-nodelay
              upstream: {type: roundrobin, nodes: {"{{FIXTURE.ready.ADDR}}": 1}}
        config_probe: {input: {path: /ready-nodelay}, output: {status: 204}}
        input: {method: GET, path: /hello}
        output: {status: 200, body: {equals: hello world}, elapsed_less_than: 500ms}
      - name: nodelay-skips-the-second-request-delay
        input: {method: GET, path: /hello}
        output: {status: 200, body: {equals: hello world}, elapsed_less_than: 500ms}

  - name: var-combination-default-distinct-and-client-ip-fallback
    config:
      routes:
        - id: limit-req-var-combination
          uri: /vars
          plugins:
            limit-req: {rate: 0.1, burst: 0, key: "${http_a ?? anonymous}:${http_b}", key_type: var_combination, nodelay: true}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
        - id: limit-req-client-ip-fallback
          uri: /fallback
          plugins:
            limit-req: {rate: 0.1, burst: 0, key: "${missing}", key_type: var_combination, nodelay: true}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - name: primary
        kind: http
        count: {at_least: 4, at_most: 4}
        expect: [{method: GET, path: {matches: '^/(vars|fallback)$'}}]
        respond: [{status: 200, body: hello world}]
    steps:
      - {name: first-explicit-combination-is-admitted, input: {method: GET, path: /vars, headers: {A: one, B: x}}, output: {status: 200, body: {equals: hello world}}}
      - {name: identical-combination-is-rejected, input: {method: GET, path: /vars, headers: {A: one, B: x}}, output: {status: 503}}
      - {name: distinct-combination-has-an-independent-bucket, input: {method: GET, path: /vars, headers: {A: two, B: x}}, output: {status: 200, body: {equals: hello world}}}
      - {name: missing-variable-uses-inline-default, input: {method: GET, path: /vars, headers: {B: x}}, output: {status: 200, body: {equals: hello world}}}
      - {name: identical-defaulted-combination-is-rejected, input: {method: GET, path: /vars, headers: {B: x}}, output: {status: 503}}
      - name: unresolved-expression-falls-back-to-client-ip
        input: {method: GET, path: /fallback}
        output: {status: 200, body: {equals: hello world}, logs: {matches: 'The value of the configured key is empty, use client IP instead'}}
      - name: client-ip-fallback-shares-the-bucket
        input: {method: GET, path: /fallback}
        output: {status: 503, logs: {matches: 'The value of the configured key is empty, use client IP instead'}}

  - name: consumer-quota-spans-routes-and-update-starts-new-bucket
    config:
      consumers:
        - username: jack
          plugins:
            key-auth: {key: jack-key}
            limit-req: {rate: 0.1, burst: 1, key: remote_addr, rejected_code: 429, nodelay: true}
      routes:
        - {id: limit-req-consumer-one, uri: /one, plugins: {key-auth: {}}, upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}}
        - {id: limit-req-consumer-two, uri: /two, plugins: {key-auth: {}}, upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}}
        - {id: limit-req-consumer-ready, uri: /ready-initial, upstream: {type: roundrobin, nodes: {"{{FIXTURE.ready.ADDR}}": 1}}}
    fixtures:
      - name: primary
        kind: http
        count: {at_least: 3, at_most: 3}
        expect: [{method: GET, path: {matches: '^/(one|two)$'}, headers: {X-Consumer-Username: {equals: jack}}}]
        respond: [{status: 200, body: hello world}]
      - {name: ready, kind: http, expect_requests: 1, expect: [{method: GET, path: {equals: /ready-updated}}], respond: [{status: 204}]}
    steps:
      - {name: first-route-consumes-base-capacity, input: {method: GET, path: /one, headers: {apikey: jack-key}}, output: {status: 200, body: {equals: hello world}}}
      - {name: second-route-consumes-shared-burst-capacity, input: {method: GET, path: /two, headers: {apikey: jack-key}}, output: {status: 200, body: {equals: hello world}}}
      - {name: shared-consumer-quota-rejects-third-request, input: {method: GET, path: /one, headers: {apikey: jack-key}}, output: {status: 429}}
      - name: updated-consumer-config-starts-a-new-bucket
        config:
          consumers:
            - username: jack
              plugins:
                key-auth: {key: jack-key}
                limit-req: {rate: 0.1, burst: 0, key: remote_addr, rejected_code: 429, nodelay: true}
          routes:
            - {id: limit-req-consumer-one, uri: /one, plugins: {key-auth: {}}, upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}}
            - {id: limit-req-consumer-two, uri: /two, plugins: {key-auth: {}}, upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}}
            - {id: limit-req-consumer-ready, uri: /ready-updated, upstream: {type: roundrobin, nodes: {"{{FIXTURE.ready.ADDR}}": 1}}}
        config_probe: {input: {path: /ready-updated}, output: {status: 204}}
        input: {method: GET, path: /two, headers: {apikey: jack-key}}
        output: {status: 200, body: {equals: hello world}}
      - {name: updated-consumer-quota-rejects-next-request, input: {method: GET, path: /one, headers: {apikey: jack-key}}, output: {status: 429}}

  - name: workflow-unrelated-update-keeps-bucket-and-action-update-resets-it
    target_plugin_exempt_reason: limit-req is activated as a nested workflow action
    config:
      routes:
        - id: limit-req-workflow-update
          uri: /hello
          plugins:
            workflow:
              rules:
                - {case: [[uri, '==', /hello]], actions: [[limit-req, {rate: 0.1, burst: 0, key: remote_addr, nodelay: true}]]}
                - {case: [[uri, '==', /unrelated]], actions: [[return, {code: 418}]]}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
        - {id: limit-req-workflow-ready, uri: /ready-initial, upstream: {type: roundrobin, nodes: {"{{FIXTURE.ready.ADDR}}": 1}}}
    fixtures:
      - {name: primary, kind: http, count: {at_least: 2, at_most: 2}, expect: [{method: GET, path: {equals: /hello}}], respond: [{status: 200, body: hello world}]}
      - {name: ready, kind: http, count: {at_least: 2, at_most: 2}, expect: [{method: GET, path: {matches: '^/ready-(unrelated|action)$'}}], respond: [{status: 204}]}
    steps:
      - {name: workflow-action-first-request-is-admitted, input: {method: GET, path: /hello}, output: {status: 200, body: {equals: hello world}}}
      - {name: workflow-action-second-request-is-rejected, input: {method: GET, path: /hello}, output: {status: 503}}
      - name: unrelated-rule-update-keeps-the-limit-request-bucket
        config:
          routes:
            - id: limit-req-workflow-update
              uri: /hello
              plugins:
                workflow:
                  rules:
                    - {case: [[uri, '==', /hello]], actions: [[limit-req, {rate: 0.1, burst: 0, key: remote_addr, nodelay: true}]]}
                    - {case: [[uri, '==', /unrelated]], actions: [[return, {code: 419}]]}
              upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
            - {id: limit-req-workflow-ready, uri: /ready-unrelated, upstream: {type: roundrobin, nodes: {"{{FIXTURE.ready.ADDR}}": 1}}}
        config_probe: {input: {path: /ready-unrelated}, output: {status: 204}}
        input: {method: GET, path: /hello}
        output: {status: 503}
      - name: action-config-update-starts-a-new-limit-request-bucket
        config:
          routes:
            - id: limit-req-workflow-update
              uri: /hello
              plugins:
                workflow:
                  rules:
                    - {case: [[uri, '==', /hello]], actions: [[limit-req, {rate: 0.1, burst: 0, key: remote_addr, rejected_code: 429, nodelay: true}]]}
                    - {case: [[uri, '==', /unrelated]], actions: [[return, {code: 419}]]}
              upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
            - {id: limit-req-workflow-ready, uri: /ready-action, upstream: {type: roundrobin, nodes: {"{{FIXTURE.ready.ADDR}}": 1}}}
        config_probe: {input: {path: /ready-action}, output: {status: 204}}
        input: {method: GET, path: /hello}
        output: {status: 200, body: {equals: hello world}}
      - {name: updated-workflow-action-enforces-its-own-bucket, input: {method: GET, path: /hello}, output: {status: 429}}

  - name: redis-auth-rate-limit-and-real-connection-reuse
    runtime: {nginx_config: {error_log_level: debug}}
    config:
      routes:
        - id: limit-req-redis-auth
          uri: /hello
          plugins:
            limit-req: {rate: 0.1, burst: 1, key: remote_addr, policy: redis, redis_host: '{{FIXTURE.redis.HOST}}', redis_port: '{{FIXTURE.redis.PORT}}', redis_username: alice, redis_password: somepassword, nodelay: true}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - {name: primary, kind: http, count: {at_least: 2, at_most: 2}, expect: [{method: GET, path: {equals: /hello}}], respond: [{status: 200, body: hello world}]}
      - {name: redis, kind: redis, redis: {ignore_negotiation: true, allow_unasserted_commands: true, auth: [{username: alice, password: somepassword}]}}
    steps:
      - {name: authenticated-first-request-opens-a-connection, input: {method: GET, path: /hello}, output: {status: 200, body: {equals: hello world}}}
      - name: authenticated-second-request-reuses-the-connection
        input: {method: GET, path: /hello}
        output: {status: 200, body: {equals: hello world}, logs: {matches: '(?s)redis connection reused times: 0.*redis connection reused times: 1'}}
      - {name: authenticated-quota-rejects-third-request, input: {method: GET, path: /hello}, output: {status: 503}}

  - name: redis-wrong-password-returns-empty-500-and-logs-cause
    config:
      routes:
        - id: limit-req-redis-wrong-password
          uri: /hello
          plugins:
            limit-req: {rate: 1, burst: 0, key: remote_addr, policy: redis, redis_host: '{{FIXTURE.redis.HOST}}', redis_port: '{{FIXTURE.redis.PORT}}', redis_username: alice, redis_password: wrong}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - {name: primary, kind: http, expect_requests: 0, respond: [{status: 200, body: unexpected}]}
      - name: redis
        kind: redis
        network_respond: [{payload: "-WRONGPASS invalid username-password pair or user is disabled.\r\n"}]
        redis: {ignore_negotiation: true, allow_unasserted_commands: true, auth: [{username: alice, password: wrong}]}
    steps:
      - name: wrong-password-fails-before-upstream
        input: {method: GET, path: /hello}
        output: {status: 500, body: {equals: ''}, logs: {matches: 'failed to limit req: WRONGPASS invalid username-password pair or user is disabled'}}

  - name: redis-route-config-update-uses-new-versioned-bucket
    config:
      routes:
        - id: limit-req-redis-update
          uri: /hello
          plugins:
            limit-req: {rate: 1, burst: 0, key: remote_addr, policy: redis, redis_host: '{{FIXTURE.redis.HOST}}', redis_port: '{{FIXTURE.redis.PORT}}', nodelay: true}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
        - {id: limit-req-redis-ready, uri: /ready-initial, upstream: {type: roundrobin, nodes: {"{{FIXTURE.ready.ADDR}}": 1}}}
    fixtures:
      - {name: primary, kind: http, count: {at_least: 2, at_most: 2}, expect: [{method: GET, path: {equals: /hello}}], respond: [{status: 200, body: hello world}]}
      - {name: redis, kind: redis, redis: {ignore_negotiation: true, allow_unasserted_commands: true}}
      - {name: ready, kind: http, expect_requests: 1, expect: [{method: GET, path: {equals: /ready-updated}}], respond: [{status: 204}]}
    steps:
      - {name: initial-version-first-request-is-admitted, input: {method: GET, path: /hello}, output: {status: 200, body: {equals: hello world}}}
      - {name: initial-version-second-request-is-rejected, input: {method: GET, path: /hello}, output: {status: 503}}
      - name: changed-rejected-code-starts-a-new-bucket
        config:
          routes:
            - id: limit-req-redis-update
              uri: /hello
              plugins:
                limit-req: {rate: 1, burst: 0, key: remote_addr, policy: redis, redis_host: '{{FIXTURE.redis.HOST}}', redis_port: '{{FIXTURE.redis.PORT}}', rejected_code: 429, nodelay: true}
              upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
            - {id: limit-req-redis-ready, uri: /ready-updated, upstream: {type: roundrobin, nodes: {"{{FIXTURE.ready.ADDR}}": 1}}}
        config_probe: {input: {path: /ready-updated}, output: {status: 204}}
        input: {method: GET, path: /hello}
        output: {status: 200, body: {equals: hello world}}
      - {name: updated-version-enforces-its-own-rejected-code, input: {method: GET, path: /hello}, output: {status: 429}}

  - name: redis-atomic-script-admits-only-one-concurrent-first-request
    config:
      routes:
        - id: limit-req-redis-atomic
          uri: /hello
          plugins:
            limit-req: {rate: 1, burst: 0, key: remote_addr, policy: redis, redis_host: '{{FIXTURE.redis.HOST}}', redis_port: '{{FIXTURE.redis.PORT}}', nodelay: true}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - {name: primary, kind: http, expect_requests: 1, expect: [{method: GET, path: {equals: /hello}}], respond: [{status: 200, body: hello world}]}
      - {name: redis, kind: redis, redis: {ignore_negotiation: true, allow_unasserted_commands: true}}
    steps:
      - name: five-concurrent-requests-share-one-atomic-bucket
        repeat: 5
        concurrency: 5
        input: {method: GET, path: /hello}
        output: {status_counts: {200: 1, 503: 4}}

  - name: redis-cluster-tls-enforces-the-shared-bucket
    config:
      routes:
        - id: limit-req-cluster-tls
          uri: /hello
          plugins:
            limit-req: {rate: 1, burst: 0, key: remote_addr, policy: redis-cluster, redis_cluster_name: test, redis_cluster_nodes: ['{{FIXTURE.redis.ADDR}}'], redis_cluster_ssl: true, redis_cluster_ssl_verify: false, nodelay: true}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - {name: primary, kind: http, expect_requests: 1, expect: [{method: GET, path: {equals: /hello}}], respond: [{status: 200, body: hello world}]}
      - {name: redis, kind: redis-cluster, redis: {tls: true, ignore_negotiation: true, allow_unasserted_commands: true}}
    steps:
      - {name: tls-cluster-first-request-is-admitted, input: {method: GET, path: /hello}, output: {status: 200, body: {equals: hello world}}}
      - {name: tls-cluster-second-request-is-rejected, input: {method: GET, path: /hello}, output: {status: 503}}

  - name: http2-parallel-streams-share-the-client-bucket
    frontend_tls: {sni: www.test.com}
    config:
      routes:
        - id: limit-req-http2
          uri: /hello
          host: www.test.com
          plugins:
            limit-req: {rate: 0.1, burst: 0, key: $remote_addr, key_type: var_combination, nodelay: true}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - name: primary
        kind: http
        expect_requests: 1
        expect: [{method: GET, path: {equals: /hello}, host: {equals: www.test.com}}]
        respond: [{status: 200, body: hello world}]
    steps:
      - name: two-http2-streams-contend-for-one-admission
        repeat: 2
        concurrency: 2
        input: {method: GET, scheme: https, version: "2", path: /hello, headers: {Host: www.test.com}}
        output: {status_counts: {200: 1, 503: 1}}
