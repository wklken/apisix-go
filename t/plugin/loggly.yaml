          plugins: {loggly: {customer_token: tok, batch_max_size: 1, severity_map: {'503': ERR, '410': ALERT}}}
          upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
    fixtures:
      - {name: primary, kind: http, expect: [{path: {equals: /loggly/503}}], respond: [{status: 503, body: "service temporarily unavailable\n"}]}
      - name: sink
        kind: udp
        network_expect:
          - payload: {matches: '^<11>1 [^ ]+ 127\.0\.0\.1 apisix [0-9]+ - \[tok@41058 tag="apisix"\] \{"route_id":"1"\}$'}
        network_respond: [{payload: ''}]
    steps:
      - {name: err-prival, input: {path: /loggly/503}, output: {status: 503, body: {equals: "service temporarily unavailable\n"}}, wait: 1s}

