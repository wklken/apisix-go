              include_resp_body: true
              include_resp_body_expr: [[arg_bar, '==', bar]]
          upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
    fixtures:
      - {name: primary, kind: http, expect: [{path: {equals: '/opentracing?foo=bar'}}], respond: [{status: 200, body: "opentracing\n"}]}
      - name: sink
        kind: udp
        network_expect:
          - payload: {matches: '(?s)^<14>1 [^ ]+ 127\.0\.0\.1 apisix [0-9]+ - \[tok@41058 tag="apisix"\] \{.*"querystring":\{"foo":"bar"\}.*"response":\{.*"status":200.*\}.*\}$'}
            forbidden_matches: ['"body":"opentracing']
        network_respond: [{payload: ''}]
    steps:
      - {name: nonmatching-query-omits-response-body, input: {path: '/opentracing?foo=bar'}, output: {status: 200, body: {equals: "opentracing\n"}}, wait: 1s}

  - name: request-body-is-included-and-preserved-upstream
    source: {file: t/plugin/loggly.t, tests: [11]}
    config:
      plugin_metadata:
        - {id: loggly, host: '{{FIXTURE.sink.HOST}}', port: '{{FIXTURE.sink.PORT}}'}
      routes:
        - id: loggly-request-body
          uri: /opentracing
          plugins: {loggly: {customer_token: tok, batch_max_size: 1, include_req_body: true}}
          upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
    fixtures:
      - {name: primary, kind: http, expect: [{method: POST, path: {equals: /opentracing}, body: {equals: body-data}}], respond: [{status: 200, body: opentracing}]}
      - name: sink
        kind: udp
        network_expect:
          - payload: {matches: '(?s)^<14>1 .* \[tok@41058 tag="apisix"\] \{.*"request":\{"body":"body-data".*"method":"POST".*\}.*\}$'}
        network_respond: [{payload: ''}]
    steps:
      - {name: request-body-reaches-both-upstream-and-log, input: {method: POST, path: /opentracing, body: body-data}, output: {status: 200, body: {equals: opentracing}}, wait: 1s}

