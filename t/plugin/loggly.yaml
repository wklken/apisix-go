          uri: /metadata
          plugins: {loggly: {customer_token: metadata-token, batch_max_size: 1, log_format: {case: metadata-transport}}}
          upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
    fixtures:
      - {name: primary, kind: http, expect: [{path: {equals: /metadata}}], respond: [{status: 200, body: passed}]}
      - name: sink
        kind: udp
        network_expect:
          - payload: {matches: '^<14>1 [^ ]+ [^ ]+ apisix [0-9]+ - \[metadata-token@41058 tag="apisix"\] \{"case":"metadata-transport","route_id":"loggly-metadata-transport"\}$'}
        network_respond: [{payload: ''}]
    steps:
      - {name: metadata-transport-is-used, input: {path: /metadata}, output: {status: 200, body: {equals: passed}}, wait: 1s}

  - name: two-requests-emit-two-complete-rfc5424-datagrams
    source: {file: t/plugin/loggly.t, tests: [4]}
    config:
      plugin_metadata:
        - {id: loggly, host: '{{FIXTURE.sink.HOST}}', port: '{{FIXTURE.sink.PORT}}'}
      routes:
        - id: '1'
          uri: /opentracing
          plugins: {loggly: {customer_token: test-token, batch_max_size: 1, log_format: {path: '$uri'}}}
          upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
    fixtures:
      - name: primary
        kind: http
        expect: [{path: {equals: /opentracing}}, {path: {equals: /opentracing}}]
        respond: [{status: 200, body: opentracing}, {status: 200, body: opentracing}]
      - name: sink
        kind: udp
        network_expect:
          - payload: &two_exact_messages {matches: '^<14>1 [0-9T:.+-]+Z 127\.0\.0\.1 apisix [0-9]+ - \[test-token@41058 tag="apisix"\] \{"path":"/opentracing","route_id":"1"\}$'}
          - payload: *two_exact_messages
        network_respond: [{payload: ''}, {payload: ''}]
    steps:
      - {name: first-request, input: {path: /opentracing}, output: {status: 200, body: {equals: opentracing}}}
      - {name: second-request, input: {path: /opentracing}, output: {status: 200, body: {equals: opentracing}}, wait: 1s}

  - name: tags-are-encoded-in-rfc5424-structured-data
    source: {file: t/plugin/loggly.t, tests: [5]}
    config:
      plugin_metadata:
        - {id: loggly, host: '{{FIXTURE.sink.HOST}}', port: '{{FIXTURE.sink.PORT}}'}
      routes:
        - id: loggly-tags
          uri: /opentracing
          plugins: {loggly: {customer_token: token-1, batch_max_size: 1, tags: [abc, def], log_format: {case: tags}}}
          upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
    fixtures:
      - {name: primary, kind: http, expect: [{path: {equals: /opentracing}}], respond: [{status: 200, body: opentracing}]}
      - name: sink
        kind: udp
        network_expect:
          - payload: {matches: '^<14>1 [^ ]+ 127\.0\.0\.1 apisix [0-9]+ - \[token-1@41058 tag="abc" tag="def"\] \{"case":"tags","route_id":"loggly-tags"\}$'}
        network_respond: [{payload: ''}]
    steps:
      - {name: exact-tags, input: {path: /opentracing}, output: {status: 200, body: {equals: opentracing}}, wait: 1s}

  - name: crit-severity-produces-prival-ten
    source: {file: t/plugin/loggly.t, tests: [6]}
    config:
      plugin_metadata:
        - {id: loggly, host: '{{FIXTURE.sink.HOST}}', port: '{{FIXTURE.sink.PORT}}'}
      routes:
        - id: loggly-crit
          uri: /opentracing
          plugins: {loggly: {customer_token: token-1, severity: CRIT, batch_max_size: 1, log_format: {case: severity}}}
          upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
    fixtures:
      - {name: primary, kind: http, expect: [{path: {equals: /opentracing}}], respond: [{status: 200, body: opentracing}]}
      - name: sink
        kind: udp
        network_expect:
          - payload: {matches: '^<10>1 [^ ]+ 127\.0\.0\.1 apisix [0-9]+ - \[token-1@41058 tag="apisix"\] \{"case":"severity","route_id":"loggly-crit"\}$'}
        network_respond: [{payload: ''}]
    steps:
      - {name: exact-prival, input: {path: /opentracing}, output: {status: 200, body: {equals: opentracing}}, wait: 1s}

  - name: default-full-access-log-payload
    source: {file: t/plugin/loggly.t, tests: [7]}
    config:
      plugin_metadata:
        - {id: loggly, host: '{{FIXTURE.sink.HOST}}', port: '{{FIXTURE.sink.PORT}}'}
      routes:
        - id: '1'
          uri: /opentracing
          plugins: {loggly: {customer_token: token-1, severity: CRIT, batch_max_size: 1}}
          upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
    fixtures:
      - {name: primary, kind: http, expect: [{path: {equals: /opentracing}}], respond: [{status: 200, body: opentracing, headers: {X-Upstream: loggly}}]}
      - name: sink
        kind: udp
        network_expect:
          - payload:
              matches: '(?s)^<10>1 [^ ]+ 127\.0\.0\.1 apisix [0-9]+ - \[token-1@41058 tag="apisix"\] \{"apisix_latency":[0-9.]+,"client_ip":"127\.0\.0\.1","latency":[0-9.]+,"request":\{.*"method":"GET".*"uri":"/opentracing".*\},"response":\{.*"status":200.*\},"route_id":"1","server":\{.*"version":"apisix-go".*\},"service_id":"","start_time":[0-9.]+,"upstream":"127\.0\.0\.1:[0-9]+","upstream_latency":[0-9.]+\}$'
            forbidden_matches: ['"body":']
        network_respond: [{payload: ''}]
    steps:
      - {name: full-default-log, input: {path: /opentracing, headers: {Host: 127.0.0.1}}, output: {status: 200, body: {equals: opentracing}}, wait: 1s}

  - name: response-body-is-included
    source: {file: t/plugin/loggly.t, tests: [8]}
    config:
      plugin_metadata:
        - {id: loggly, host: '{{FIXTURE.sink.HOST}}', port: '{{FIXTURE.sink.PORT}}'}
      routes:
        - id: loggly-response-body
          uri: /opentracing
          plugins: {loggly: {customer_token: tok, batch_max_size: 1, include_resp_body: true}}
          upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
    fixtures:
      - {name: primary, kind: http, expect: [{path: {equals: /opentracing}}], respond: [{status: 200, body: "opentracing\n"}]}
      - name: sink
        kind: udp
        network_expect:
          - payload: {matches: '(?s)^<14>1 [^ ]+ 127\.0\.0\.1 apisix [0-9]+ - \[tok@41058 tag="apisix"\] \{.*"response":\{"body":"opentracing\\n".*"status":200.*\}.*"route_id":"loggly-response-body".*\}$'}
        network_respond: [{payload: ''}]
    steps:
      - {name: response-and-log-preserve-body, input: {path: /opentracing}, output: {status: 200, body: {equals: "opentracing\n"}}, wait: 1s}

  - name: response-body-expression-hit
    source: {file: t/plugin/loggly.t, tests: [9]}
    config:
      plugin_metadata:
        - {id: loggly, host: '{{FIXTURE.sink.HOST}}', port: '{{FIXTURE.sink.PORT}}'}
      routes:
        - id: loggly-response-expression-hit
          uri: /opentracing
          plugins:
            loggly:
              customer_token: tok
              batch_max_size: 1
              include_resp_body: true
              include_resp_body_expr: [[arg_bar, '==', bar]]
          upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
    fixtures:
      - {name: primary, kind: http, expect: [{path: {equals: '/opentracing?bar=bar'}}], respond: [{status: 200, body: "opentracing\n"}]}
      - name: sink
        kind: udp
        network_expect:
          - payload: {matches: '(?s)^<14>1 [^ ]+ 127\.0\.0\.1 apisix [0-9]+ - \[tok@41058 tag="apisix"\] \{.*"request":\{.*"querystring":\{"bar":"bar"\}.*\},"response":\{"body":"opentracing\\n".*"status":200.*\}.*\}$'}
        network_respond: [{payload: ''}]
    steps:
      - {name: matching-query-includes-response-body, input: {path: '/opentracing?bar=bar'}, output: {status: 200, body: {equals: "opentracing\n"}}, wait: 1s}

