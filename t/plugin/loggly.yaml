source:
  repository: https://github.com/apache/apisix
  commit: c3d7d5ec69774121f53d2e20d29d09c816795dd7
  file: t/plugin/loggly.t
  tests: 22

cases:
  - name: schema-full-minimal-required-enum-and-lowercase
    source: {file: t/plugin/loggly.t, tests: [1]}
    variants:
      - name: full-config-delivers-over-https
        config:
          routes:
            - id: loggly-schema-full
              uri: /schema-full
              plugins:
                loggly:
                  customer_token: TEST-Token-Must-Be-Passed
                  severity: INFO
                  tags: [special-route, highpriority-route]
                  host: '{{FIXTURE.sink.URL}}'
                  protocol: https
                  ssl_verify: false
                  timeout: 3000
                  max_retry_count: 0
                  retry_delay: 1
                  buffer_duration: 60
                  inactive_timeout: 2
                  batch_max_size: 1
                  log_format: {case: schema-full}
              upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
        fixtures:
          - {name: primary, kind: http, expect: [{path: {equals: /schema-full}}], respond: [{status: 200, body: passed}]}
          - name: sink
            kind: https
            expect:
              - method: POST
                path: {equals: /bulk/TEST-Token-Must-Be-Passed/tag/bulk}
                headers: {X-LOGGLY-TAG: {equals: 'special-route,highpriority-route'}}
                body: {json_equals: '{"case":"schema-full","route_id":"loggly-schema-full"}'}
            respond: [{status: 200, body: ok}]
        steps:
          - {name: full-schema-is-live, input: {path: /schema-full}, output: {status: 200, body: {equals: passed}}, wait: 1s}
      - name: minimized-config-uses-metadata-transport
        config:
          plugin_metadata:
            - {id: loggly, host: '{{FIXTURE.sink.HOST}}', port: '{{FIXTURE.sink.PORT}}'}
          routes:
            - id: loggly-schema-minimal
              uri: /schema-minimal
              plugins: {loggly: {customer_token: minimized-config, batch_max_size: 1}}
              upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
        fixtures:
          - {name: primary, kind: http, expect: [{path: {equals: /schema-minimal}}], respond: [{status: 200, body: passed}]}
          - name: sink
            kind: udp
            network_expect:
              - payload: {matches: '(?s)^<14>1 [^ ]+ [^ ]+ apisix [0-9]+ - \[minimized-config@41058 tag="apisix"\] \{.*"route_id":"loggly-schema-minimal".*\}$'}
            network_respond: [{payload: ''}]
        steps:
          - {name: minimal-schema-is-live, input: {path: /schema-minimal}, output: {status: 200, body: {equals: passed}}, wait: 1s}
      - name: missing-customer-token-is-rejected
        config:
          routes:
            - id: loggly-schema-missing-token
              uri: /schema-missing-token
              plugins: {loggly: {severity: DEBUG}}
        input: {path: /schema-missing-token}
        output:
          status: 404
          logs: {matches: 'validate plugin loggly config:.*missing properties:.*customer_token'}
      - name: unknown-severity-is-rejected
        config:
          routes:
            - id: loggly-schema-unknown-severity
              uri: /schema-unknown-severity
              plugins: {loggly: {customer_token: test, severity: UNKNOWN}}
        input: {path: /schema-unknown-severity}
        output:
          status: 404
          logs: {matches: 'validate plugin loggly config:.*severity.*value must be one of'}
      - name: lowercase-severity-is-accepted
        config:
          plugin_metadata:
            - {id: loggly, host: '{{FIXTURE.sink.HOST}}', port: '{{FIXTURE.sink.PORT}}'}
          routes:
            - id: loggly-schema-lowercase
              uri: /schema-lowercase
              plugins: {loggly: {customer_token: test, severity: crit, batch_max_size: 1}}
              upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
        fixtures:
          - {name: primary, kind: http, expect: [{path: {equals: /schema-lowercase}}], respond: [{status: 200, body: passed}]}
          - name: sink
            kind: udp
            network_expect:
              - payload: {matches: '(?s)^<10>1 [^ ]+ [^ ]+ apisix [0-9]+ - \[test@41058 tag="apisix"\] \{.*"route_id":"loggly-schema-lowercase".*\}$'}
            network_respond: [{payload: ''}]
        steps:
          - {name: lowercase-enum-is-normalized, input: {path: /schema-lowercase}, output: {status: 200, body: {equals: passed}}, wait: 1s}

  - name: route-resource-enables-loggly
    source: {file: t/plugin/loggly.t, tests: [2]}
    config:
      plugin_metadata:
        - {id: loggly, host: '{{FIXTURE.sink.HOST}}', port: '{{FIXTURE.sink.PORT}}'}
      routes:
        - id: '1'
          name: loggly-enabled-route
          uri: /opentracing
          plugins: {loggly: {customer_token: test-token, batch_max_size: 1}}
          upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
    fixtures:
      - {name: primary, kind: http, expect: [{path: {equals: /opentracing}}], respond: [{status: 200, body: opentracing}]}
      - name: sink
        kind: udp
        network_expect:
          - payload: {matches: '(?s)^<14>1 [^ ]+ [^ ]+ apisix [0-9]+ - \[test-token@41058 tag="apisix"\] \{.*"route_id":"1".*\}$'}
        network_respond: [{payload: ''}]
    steps:
      - {name: standalone-route-proxies-and-logs, input: {path: /opentracing}, output: {status: 200, body: {equals: opentracing}}, wait: 1s}

