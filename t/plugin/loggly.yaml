  - name: http-bulk-endpoint-body-and-tags
    source: {file: t/plugin/loggly.t, tests: [15]}
    config:
      plugin_metadata:
        - {id: loggly, host: '{{FIXTURE.sink.URL}}/loggly', protocol: http, log_format: {route_id: '$route_id'}}
      routes:
        - id: '1'
          uri: /opentracing
          plugins: {loggly: {customer_token: tok, batch_max_size: 1}}
