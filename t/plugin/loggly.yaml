          uri: /loggly/setup
          plugins:
            loggly:
              customer_token: tok
              batch_max_size: 1
              severity_map: {'503': ERR, '410': ALERT}
          upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
    fixtures:
      - {name: primary, kind: http, expect: [{path: {equals: /loggly/setup}}], respond: [{status: 200, body: setup}]}
      - name: sink
        kind: udp
        network_expect:
          - payload: {matches: '^<14>1 [^ ]+ [^ ]+ apisix [0-9]+ - \[tok@41058 tag="apisix"\] \{"route_id":"1"\}$'}
        network_respond: [{payload: ''}]
    steps:
      - {name: setup-resource-proxies-and-logs, input: {path: /loggly/setup}, output: {status: 200, body: {equals: setup}}, wait: 1s}

  - name: status-410-maps-to-alert-prival-nine
    source: {file: t/plugin/loggly.t, tests: [17]}
    config:
      plugin_metadata:
        - {id: loggly, host: '{{FIXTURE.sink.HOST}}', port: '{{FIXTURE.sink.PORT}}', log_format: {route_id: '$route_id'}}
      routes:
        - id: '1'
          uri: /loggly/410
          plugins: {loggly: {customer_token: tok, batch_max_size: 1, severity_map: {'503': ERR, '410': ALERT}}}
          upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
    fixtures:
      - {name: primary, kind: http, expect: [{path: {equals: /loggly/410}}], respond: [{status: 410, body: "expired link\n"}]}
      - name: sink
        kind: udp
        network_expect:
          - payload: {matches: '^<9>1 [^ ]+ 127\.0\.0\.1 apisix [0-9]+ - \[tok@41058 tag="apisix"\] \{"route_id":"1"\}$'}
        network_respond: [{payload: ''}]
    steps:
      - {name: alert-prival, input: {path: /loggly/410}, output: {status: 410, body: {equals: "expired link\n"}}, wait: 1s}

  - name: status-503-maps-to-err-prival-eleven
    source: {file: t/plugin/loggly.t, tests: [18]}
    config:
