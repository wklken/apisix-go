  - name: severity-map-and-metadata-setup-is-live
    source: {file: t/plugin/loggly.t, tests: [16]}
    config:
      plugin_metadata:
        - {id: loggly, host: '{{FIXTURE.sink.HOST}}', port: '{{FIXTURE.sink.PORT}}', log_format: {route_id: '$route_id'}}
      routes:
