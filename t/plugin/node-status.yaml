cases:
  - name: default-node-status
    runtime:
      plugins: [node-status]
    config:
      routes: []
    steps:
      - name: status
        input:
          path: /apisix/status
        output:
          status: 200
          body:
            matches: '"id":"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}".*"accepted":"[0-9]+"'
      - name: unsupported-method
        input:
          method: PATCH
          path: /apisix/status
        output:
          status: 404

  - name: configured-node-id
    runtime:
      apisix:
        id: user-set-apisix-instance-id-A
      plugins: [node-status]
    config:
      routes: []
    input:
      path: /apisix/status
    output:
      status: 200
      body:
        matches: '"id":"user-set-apisix-instance-id-A"'
