{
  "cases": [
    {
      "name": "openid-connect-identity-headers-set-up-route-with-unauth-action-pass-so-unauthenticated-requests-pass-th-test-1",
      "source": {
        "file": "t/plugin/openid-connect-identity-headers.t",
        "tests": [
          1
        ]
      },
      "config": {
        "routes": [
          {
            "id": "openid-connect-identity-headers-1",
            "uri": "/oidc/openid-connect-identity-headers/1",
            "plugins": {
              "openid-connect": {
                "client_id": "integration-client",
                "client_secret": "integration-secret",
                "discovery": "http://127.0.0.1:1/.well-known/openid-configuration",
                "session": {
                  "secret": "0123456789abcdef"
                },
                "ssl_verify": false,
                "unauth_action": "pass"
              }
            },
            "upstream": {
              "type": "roundrobin",
              "nodes": {
                "{{FIXTURE.primary.ADDR}}": 1
              }
            }
          }
        ]
      },
      "fixtures": [
        {
          "name": "primary",
          "kind": "http",
          "respond": [
            {
              "status": 200,
              "body": "openid upstream"
            }
          ],
          "expect": [
            {
              "method": "GET",
              "path": {
                "equals": "/oidc/openid-connect-identity-headers/1"
              },
              "headers": {
                "X-Access-Token": {
                  "absent": true
                },
                "X-Userinfo": {
                  "absent": true
                },
                "X-ID-Token": {
                  "absent": true
                },
                "X-Refresh-Token": {
                  "absent": true
                }
              }
            }
          ]
        }
      ],
      "steps": [
        {
          "name": "exercise-set-up-route-with-unauth-action-pass-so-unauthenticated-requests-pass-th",
          "input": {
            "path": "/oidc/openid-connect-identity-headers/1",
            "headers": {
              "X-Access-Token": "forged",
              "X-Userinfo": "forged",
              "X-ID-Token": "forged",
              "X-Refresh-Token": "forged"
            }
          },
          "output": {
            "status": 200,
            "body": {
              "equals": "openid upstream"
            }
          }
        }
      ]
    },
