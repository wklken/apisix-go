    {
      "name": "redis-session-login-refreshes-across-routes",
      "config": {
        "routes": [
          {
            "id": "openid-connect-redis-3",
            "uri": "/*",
            "plugins": {
              "openid-connect": {
                "client_id": "integration-client",
                "client_secret": "integration-secret",
                "discovery": "{{FIXTURE.idp.URL}}/.well-known/openid-configuration",
                "session": {
                  "secret": "0123456789abcdef",
                  "storage": "redis",
                  "redis": {
                    "host": "{{FIXTURE.redis.HOST}}",
                    "port": "{{FIXTURE.redis.PORT}}",
                    "prefix": "oidc-integration"
                  }
                },
                "ssl_verify": false,
                "set_refresh_token_header": true,
                "access_token_expires_leeway": 60
              }
            },
            "upstream": {
              "type": "roundrobin",
              "nodes": {
                "{{FIXTURE.primary.ADDR}}": 1
              }
            }
          }
        ]
      },
      "fixtures": [
        {
          "name": "primary",
          "kind": "http",
          "respond": [
            {
              "status": 200,
              "body": "openid upstream"
            }
          ],
          "expect": [
            {
              "method": "GET",
              "path": {
                "equals": "/oidc/openid-connect-redis/3"
              },
              "headers": {
                "X-Access-Token": {
                  "equals": "refreshed-access"
                },
                "X-ID-Token": {
                  "absent": true
                },
                "X-Refresh-Token": {
                  "equals": "refreshed-refresh"
                },
                "X-Userinfo": {
                  "matches": ".+"
                }
              }
            }
          ]
        },
        {
          "name": "redis",
          "kind": "redis",
          "redis": {
            "ignore_negotiation": true,
            "allow_unasserted_commands": true
          }
        },
        {
          "name": "idp",
          "kind": "http",
          "expect": [
            {
              "method": "GET",
              "path": {
                "equals": "/.well-known/openid-configuration"
              }
            },
            {
              "method": "POST",
              "path": {
                "equals": "/token"
              },
              "body": {
                "matches": "code=good"
              }
            },
            {
              "method": "GET",
              "path": {
                "equals": "/userinfo"
              },
              "headers": {
                "Authorization": {
                  "equals": "Bearer session-access"
                }
              }
            },
            {
              "method": "POST",
              "path": {
                "equals": "/token"
              },
              "body": {
                "matches": "grant_type=refresh_token&refresh_token=session-refresh"
              }
            }
          ],
          "respond": [
            {
              "status": 200,
              "body": "{\"issuer\":\"https://issuer.example.test\",\"authorization_endpoint\":\"https://provider.example.test/authorize\",\"token_endpoint\":\"{{SELF.URL}}/token\",\"userinfo_endpoint\":\"{{SELF.URL}}/userinfo\",\"jwks_uri\":\"{{SELF.URL}}/jwks\",\"introspection_endpoint\":\"{{SELF.URL}}/introspect\",\"revocation_endpoint\":\"{{SELF.URL}}/revoke\",\"end_session_endpoint\":\"https://provider.example.test/logout\"}"
            },
            {
              "status": 200,
              "body": "{\"access_token\":\"session-access\",\"refresh_token\":\"session-refresh\",\"expires_in\":1}"
            },
            {
              "status": 200,
              "body": "{\"sub\":\"alice\",\"role\":\"teacher\"}"
            },
            {
              "status": 200,
              "body": "{\"access_token\":\"refreshed-access\",\"refresh_token\":\"refreshed-refresh\",\"expires_in\":3600}"
            }
          ]
        }
      ],
      "steps": [
        {
          "name": "start-verify-session-sharing-across-routes-with-redis-simulate-refresh-scenari",
          "input": {
            "path": "/oidc/openid-connect-redis/3"
          },
          "output": {
            "status": 302,
            "headers": {
              "Location": {
                "matches": "^https://provider\\.example\\.test/authorize\\?.*state="
              }
            },
            "captures": {
              "state": {
                "header": "Location",
                "matches": ".*[?&]state=([^&]+)"
              }
            }
          }
        },
        {
          "name": "complete-verify-session-sharing-across-routes-with-redis-simulate-refresh-scenari",
          "input": {
            "path": "/oidc/openid-connect-redis/3/.apisix/redirect?code=good&state={{CAPTURE.state}}"
          },
          "output": {
            "status": 302,
            "headers": {
              "Location": {
                "equals": "/oidc/openid-connect-redis/3"
              }
            }
          }
        },
        {
          "name": "use-session-verify-session-sharing-across-routes-with-redis-simulate-refresh-scenari",
          "input": {
            "path": "/oidc/openid-connect-redis/3"
          },
          "output": {
            "status": 200,
            "body": {
              "equals": "openid upstream"
            }
          }
        }
      ]
    },
