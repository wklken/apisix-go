            "status": 302,
            "headers": {
              "Location": {
                "equals": "/oidc/openid-connect/10"
              }
            }
          }
        },
        {
          "name": "use-session-access-route-without-bearer-token-and-go-through-the-full-oidc-relying-p",
          "input": {
            "path": "/oidc/openid-connect/10"
          },
          "output": {
            "status": 200,
            "body": {
              "equals": "openid upstream"
            }
          }
        }
      ]
