      "name": "openid-connect2-set-up-route-with-plugin-matching-uri-and-point-plugin-to-local-keycloak-test-11",
      "source": {
        "file": "t/plugin/openid-connect2.t",
        "tests": [
          11
        ]
      },
      "config": {
        "routes": [
          {
            "id": "openid-connect2-11",
            "uri": "/*",
            "plugins": {
              "openid-connect": {
                "client_id": "integration-client",
                "client_secret": "integration-secret",
                "discovery": "{{FIXTURE.idp.URL}}/.well-known/openid-configuration",
                "session": {
                  "secret": "0123456789abcdef"
                },
                "ssl_verify": false,
                "set_refresh_token_header": true,
                "claim_schema": {
                  "type": "object",
                  "properties": {
                    "access_token": {
                      "type": "string"
                    },
                    "id_token": {
                      "type": "object"
                    },
                    "user": {
                      "type": "object"
                    }
                  },
                  "required": [
                    "access_token",
                    "id_token",
                    "user"
                  ]
                }
              }
            },
            "upstream": {
              "type": "roundrobin",
              "nodes": {
                "{{FIXTURE.primary.ADDR}}": 1
              }
            }
          }
        ]
      },
      "fixtures": [
        {
          "name": "primary",
          "kind": "http",
          "respond": [
            {
              "status": 200,
              "body": "openid upstream"
            }
          ],
          "expect_requests": 0
        },
        {
          "name": "idp",
          "kind": "http",
          "expect": [
            {
              "method": "GET",
              "path": {
                "equals": "/.well-known/openid-configuration"
              }
            },
            {
              "method": "POST",
              "path": {
                "equals": "/token"
              },
              "body": {
                "matches": "code=good"
              }
            }
          ],
          "respond": [
            {
              "status": 200,
              "body": "{\"issuer\":\"https://issuer.example.test\",\"authorization_endpoint\":\"https://provider.example.test/authorize\",\"token_endpoint\":\"{{SELF.URL}}/token\",\"userinfo_endpoint\":\"{{SELF.URL}}/userinfo\",\"jwks_uri\":\"{{SELF.URL}}/jwks\",\"introspection_endpoint\":\"{{SELF.URL}}/introspect\",\"revocation_endpoint\":\"{{SELF.URL}}/revoke\",\"end_session_endpoint\":\"https://provider.example.test/logout\"}"
            },
            {
              "status": 200,
              "body": "{\"access_token\":\"session-access\",\"id_token\":\"eyJhbGciOiJub25lIn0.eyJzdWIiOiJhbGljZSIsInJvbGUiOiJ0ZWFjaGVyIn0.\",\"refresh_token\":\"session-refresh\",\"expires_in\":3600}"
            }
          ]
        }
      ],
      "steps": [
        {
          "name": "start-set-up-route-with-plugin-matching-uri-and-point-plugin-to-local-keycloak",
          "input": {
            "path": "/oidc/openid-connect2/11"
          },
          "output": {
            "status": 302,
            "headers": {
              "Location": {
                "matches": "^https://provider\\.example\\.test/authorize\\?.*state="
              }
            },
            "captures": {
              "state": {
                "header": "Location",
                "matches": ".*[?&]state=([^&]+)"
              }
            }
          }
        },
        {
          "name": "complete-set-up-route-with-plugin-matching-uri-and-point-plugin-to-local-keycloak",
          "input": {
            "path": "/oidc/openid-connect2/11/.apisix/redirect?code=good&state={{CAPTURE.state}}"
          },
          "output": {
            "status": 401,
            "headers": {
              "WWW-Authenticate": {
                "matches": "Bearer"
              }
            }
          }
        }
      ]
    },
