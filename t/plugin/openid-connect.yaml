              },
              "headers": {
                "X-Access-Token": {
                  "equals": "session-access"
                },
                "X-ID-Token": {
                  "absent": true
                },
                "X-Refresh-Token": {
                  "equals": "session-refresh"
                },
                "X-Userinfo": {
                  "matches": ".+"
                }
              }
            }
