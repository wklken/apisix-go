                opentelemetry:
                    sampler:
                        name: always_on
              upstream:
                nodes:
                    '{{FIXTURE.primary.ADDR}}': 1
                type: roundrobin
              uri: /metadata-configures-collector-headers-and-request-id-source
      fixtures:
        - expect:
            - method: GET
              path:
                equals: /metadata-configures-collector-headers-and-request-id-source
          expect_requests: 1
          kind: http
          name: primary
          respond:
            - body: metadata-configures-collector-headers-and-request-id-source-ok
              status: 200
        - expect:
            - headers:
                Content-Type:
                    matches: ^application/x-protobuf
                foo:
                    equals: bar
              method: POST
              otlp_traces:
                span_count: 1
                spans:
                    - attributes:
                        apisix.route_id:
                            equals: otel-metadata-configures-collector-headers-and-request-id-source
                            type: string
                        apisix.route_name:
                            equals: metadata-configures-collector-headers-and-request-id-source
                            type: string
                        http.method:
                            equals: GET
                            type: string
                        http.route:
                            equals: /metadata-configures-collector-headers-and-request-id-source
                            type: string
                        http.status_code:
                            equals: "200"
                            type: int
                      kind: server
                      name:
                        equals: GET /metadata-configures-collector-headers-and-request-id-source
                      resource_attributes:
                        hostname:
                            matches: .+
                            type: string
                        service.name:
                            equals: APISIX
                            type: string
                      scope:
                        matches: opentelemetry
                      span_id:
                        matches: ^[0-9a-f]{16}$
                      trace_id:
                        equals: "01010101010101010101010101010101"
                unique_trace_ids: false
              path:
                equals: /v1/traces
          expect_requests: 1
          kind: http
          name: collector
          respond:
            - headers:
                Content-Type: application/x-protobuf
              status: 200
      name: metadata-configures-collector-headers-and-request-id-source
      runtime:
        plugin_attr:
            opentelemetry:
                batch_span_processor:
                    max_export_batch_size: 1
                collector:
                    address: '{{FIXTURE.collector.URL}}/v1/traces'
                    request_headers:
                        foo: bar
                    request_timeout: 3
                resource:
                    service.name: APISIX
                trace_id_source: x-request-id
        plugins:
            - opentelemetry
      source:
        file: t/plugin/opentelemetry.t
        tests:
            - 1
      steps:
        - input:
            headers:
                X-Request-Id: "01010101010101010101010101010101"
            method: GET
            path: /metadata-configures-collector-headers-and-request-id-source
          name: exercise-metadata-configures-collector-headers-and-request-id-source
          output:
            body:
                equals: metadata-configures-collector-headers-and-request-id-source-ok
            status: 200
          wait: 100ms
