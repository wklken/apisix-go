cases:
  - name: encrypted-test-params
    runtime:
      apisix:
        data_encryption:
          enable_encrypt_fields: true
          keyring: [qeddd145sfvddff3]
    config:
      routes:
        - id: openwhisk-test-params
          uri: /hello
          plugins:
            openwhisk:
              api_host: "{{FIXTURE.openwhisk.URL}}"
              service_token: "23bc46b1-71f6-4ed5-8c54-816aa4f8c502:123zO3xZCLrMN6v2BKK1dXYFpXlPkccOFqm12CdAsMgRU4VrNZ9lyGVCGuMDGIwP"
              namespace: guest
              action: test-params
    fixtures:
      - name: openwhisk
        kind: http
        expect:
          - &test_params_expect
            method: POST
            path:
              equals: /api/v1/namespaces/guest/actions/test-params?blocking=true&result=true&timeout=3000
            headers:
              Authorization:
                equals: Basic MjNiYzQ2YjEtNzFmNi00ZWQ1LThjNTQtODE2YWE0ZjhjNTAyOjEyM3pPM3haQ0xyTU42djJCS0sxZFhZRnBYbFBrY2NPRnFtMTJDZEFzTWdSVTRWck5aOWx5R1ZDR3VNREdJd1A=
          - <<: *test_params_expect
            body:
              equals: test=test
          - <<: *test_params_expect
            body:
              equals: '{"name": "world"}'
        respond:
          - status: 200
            body: '{"hello":"test"}'
          - status: 400
            body: '{"error":"The request content was malformed"}'
          - status: 200
            body: '{"hello":"world"}'
    steps:
      - name: get
        input:
          path: /hello
        output:
          status: 200
          body:
            equals: '{"hello":"test"}'
      - name: malformed-form
        input:
          method: POST
          path: /hello
          headers:
            Content-Type: application/x-www-form-urlencoded
          body: test=test
        output:
          status: 400
          body:
            matches: '"error":"The request content was malformed'
      - name: json-body
        input:
          method: POST
          path: /hello
          headers:
            Content-Type: application/json
          body: '{"name": "world"}'
        output:
          status: 200
          body:
            equals: '{"hello":"world"}'
  - name: non-existent-action
    config:
      routes:
        - id: openwhisk-not-found
          uri: /hello
          plugins:
            openwhisk:
              api_host: "http://{{UPSTREAM_ADDR}}"
              service_token: test:test
              namespace: guest
              action: non-existent
    input:
      method: POST
      path: /hello
      headers:
        Content-Type: application/json
      body: '{"name": "world"}'
    upstream:
      expect:
        method: POST
        path:
          equals: /api/v1/namespaces/guest/actions/non-existent?blocking=true&result=true&timeout=3000
      respond:
        status: 404
        body: '{"error":"The requested resource does not exist."}'
    output:
      status: 404
      body:
        matches: '"error":"The requested resource does not exist\."'

  - name: unavailable-api-host
    config:
      routes:
        - id: openwhisk-unavailable
          uri: /hello
          plugins:
            openwhisk:
              api_host: http://127.0.0.1:1
              service_token: test:test
              namespace: guest
              action: non-existent
    input:
      method: POST
      path: /hello
      headers:
        Content-Type: application/json
      body: '{"name": "world"}'
    output:
      status: 503
      body:
        equals: "failed to process openwhisk action\n"
      logs:
        matches: 'failed to process openwhisk action, err:'

  - name: packaged-action
    config:
      routes:
        - id: openwhisk-packaged
          uri: /hello
          plugins:
            openwhisk:
              api_host: "http://{{UPSTREAM_ADDR}}"
              service_token: test:test
              namespace: guest
              package: pkg
              action: testpkg
    input:
      path: /hello
    upstream:
      expect:
        method: POST
        path:
          equals: /api/v1/namespaces/guest/actions/pkg/testpkg?blocking=true&result=true&timeout=3000
      respond:
        status: 200
        body: '{"hello":"world"}'
    output:
      status: 200
      body:
        equals: '{"hello":"world"}'

  - name: action-status-code
    config:
      routes:
        - id: openwhisk-status
          uri: /hello
          plugins:
            openwhisk:
              api_host: "http://{{UPSTREAM_ADDR}}"
              service_token: test:test
              namespace: guest
              action: test-statuscode
    input:
      path: /hello
    upstream:
      expect:
        path:
          equals: /api/v1/namespaces/guest/actions/test-statuscode?blocking=true&result=true&timeout=3000
      respond:
        status: 200
        body: '{"statusCode":407}'
    output:
      status: 407

  - name: action-headers
    config:
      routes:
        - id: openwhisk-headers
          uri: /hello
          plugins:
            openwhisk:
              api_host: "http://{{UPSTREAM_ADDR}}"
              service_token: test:test
              namespace: guest
              action: test-headers
    input:
      path: /hello
    upstream:
      expect:
        path:
          equals: /api/v1/namespaces/guest/actions/test-headers?blocking=true&result=true&timeout=3000
      respond:
        status: 200
        body: '{"headers":{"test":"header"}}'
    output:
      status: 200
      headers:
        Test:
          equals: header

  - name: action-body
    config:
      routes:
        - id: openwhisk-body
          uri: /hello
          plugins:
            openwhisk:
              api_host: "http://{{UPSTREAM_ADDR}}"
              service_token: test:test
              namespace: guest
              action: test-body
    input:
      path: /hello
    upstream:
      expect:
        path:
          equals: /api/v1/namespaces/guest/actions/test-body?blocking=true&result=true&timeout=3000
      respond:
        status: 200
        body: '{"body":{"test":"body"}}'
    output:
      status: 200
      body:
        equals: '{"test":"body"}'
