cases:
  - name: disk-missing-zone-uses-default-disk-cache-one-test-1
    runtime: {apisix: {proxy_cache: {zones: [{name: disk_cache_one, disk_path: '{{WORK_DIR}}/cache/disk_cache_one', disk_size: 10m}]}}}
    config:
      routes:
        - id: disk-default-zone
          uri: /disk-default
          plugins:
            proxy-cache: {cache_strategy: disk, cache_key: [disk-default], cache_method: [GET], cache_http_status: [200], cache_ttl: 60}
          upstream: {type: roundrobin, nodes: {'{{FIXTURE.origin.ADDR}}': 1}}
    fixtures:
      - {name: origin, kind: http, expect_requests: 1, expect: [{path: {matches: '.*'}}], respond: [{status: 200, body: disk-default-origin}]}
    steps:
      - name: cache-with-default-disk-zone
        input: {method: GET, path: /disk-default}
        output: {status: 200, body: {equals: disk-default-origin}, headers: {Apisix-Cache-Status: {equals: MISS}}}
        file_assertions:
          - {path: {equals: '{{WORK_DIR}}/cache/disk_cache_one/a00b2b48881878372504bb8d35ba3cc6664ced1446eb16e28c8459351baec6db.entry'}, body: {matches: '"status":200'}}

