cases:
  - name: request-buffering-disabled
    config:
      routes:
        - id: proxy-control-disabled
          uri: /hello
          plugins:
            proxy-control:
              request_buffering: false
          upstream: &fixture_route
            type: roundrobin
            nodes:
              "{{UPSTREAM_ADDR}}": 1
    input:
      method: POST
      path: /hello
      generation_timeout: 5s
      body_repeat:
        value: "12345"
        count: 10240
    upstream:
      expect:
        method: POST
        body:
          matches: '^(12345){1000}(12345){1000}(12345){1000}(12345){1000}(12345){1000}(12345){1000}(12345){1000}(12345){1000}(12345){1000}(12345){1000}(12345){240}$'
      respond: &fixture_response
        status: 200
        body: hello world
    output: &success
      status: 200
      body:
        equals: hello world

  - name: request-buffering-enabled
    config:
      routes:
        - id: proxy-control-enabled
          uri: /hello
          plugins:
            proxy-control:
              request_buffering: true
          upstream: *fixture_route
    input:
      method: POST
      path: /hello
      body_repeat:
        value: "12345"
        count: 10240
    upstream:
      expect:
        method: POST
        body:
          matches: '^(12345){1000}(12345){1000}(12345){1000}(12345){1000}(12345){1000}(12345){1000}(12345){1000}(12345){1000}(12345){1000}(12345){1000}(12345){240}$'
      respond: *fixture_response
    output: *success
