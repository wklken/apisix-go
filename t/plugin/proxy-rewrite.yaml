cases:
  - name: schema-sanity
    config:
      routes:
        - id: proxy-rewrite-schema-sanity
          uri: /hello
          plugins:
            proxy-rewrite:
              uri: /apisix/home
              host: apisix.iresty.com
          upstream: &fixture_route
            type: roundrobin
            nodes:
              "{{UPSTREAM_ADDR}}": 1
    input:
      path: /hello
    upstream:
      expect:
        path:
          equals: /apisix/home
        host:
          equals: apisix.iresty.com
      respond: &hello_response
        status: 200
        body: hello world
    output: &hello_output
      status: 200
      body:
        equals: hello world

  - name: add-plugin
    config:
      routes:
        - id: proxy-rewrite-add-plugin
          uri: /hello
          plugins:
            proxy-rewrite:
              uri: /test/add
              host: apisix.iresty.com
          upstream: *fixture_route
    input:
      path: /hello
    upstream:
      expect:
        path:
          equals: /test/add
        host:
          equals: apisix.iresty.com
      respond: *hello_response
    output: *hello_output
  - name: update-plugin
    config:
      routes:
        - id: proxy-rewrite-update-plugin
          uri: /hello
          plugins:
            proxy-rewrite:
              uri: /test/update
              host: apisix.iresty.com
          upstream: *fixture_route
    input:
      path: /hello
    upstream:
      expect:
        path:
          equals: /test/update
        host:
          equals: apisix.iresty.com
      respond: *hello_response
    output: *hello_output

  - name: disable-plugin
    config:
      routes:
        - id: proxy-rewrite-disable-plugin
          uri: /hello
          plugins:
            proxy-rewrite:
              uri: /disabled
              _meta:
                disable: true
          upstream: *fixture_route
    input:
      path: /hello
    upstream:
      expect:
        path:
          equals: /hello
      respond: *hello_response
    output: *hello_output

  - name: rewrite-host
    config:
      routes:
        - id: proxy-rewrite-host
          uri: /hello
          methods: [GET]
          plugins:
            proxy-rewrite:
              uri: /plugin_proxy_rewrite
              host: apisix.iresty.com
          upstream: *fixture_route
    input:
      path: /hello
      generation_timeout: 5s
    upstream:
      expect:
        path:
          equals: /plugin_proxy_rewrite
        host:
          equals: apisix.iresty.com
      respond: *hello_response
    output: *hello_output

  - name: rewrite-scheme-https
    config:
      routes:
        - id: proxy-rewrite-scheme-https
          uri: /hello
          methods: [GET]
          plugins:
            proxy-rewrite:
              uri: /plugin_proxy_rewrite
              host: test.com
          upstream:
            type: roundrobin
            scheme: https
            nodes:
              "{{UPSTREAM_ADDR}}": 1
    input:
      path: /hello
    upstream:
      tls: true
      expect:
        path:
          equals: /plugin_proxy_rewrite
        host:
          equals: test.com
      respond: *hello_response
    output: *hello_output

  - name: rewrite-headers
    config:
      routes:
        - id: proxy-rewrite-headers
          uri: /hello
          plugins:
            proxy-rewrite:
              uri: /uri/plugin_proxy_rewrite
              headers:
                X-Api-Version: v2
          upstream: *fixture_route
    input:
      path: /hello
      headers:
        X-Api-Version: v1
    upstream:
      expect:
        path:
          equals: /uri/plugin_proxy_rewrite
        headers:
          X-Api-Version:
            equals: v2
      respond: *hello_response
    output: *hello_output

  - name: add-headers
    config:
      routes:
        - id: proxy-rewrite-add-headers
          uri: /hello
          plugins:
            proxy-rewrite:
              uri: /uri/plugin_proxy_rewrite
              headers:
                X-Api-Engine: apisix
          upstream: *fixture_route
    input:
      path: /hello
    upstream:
      expect:
        path:
          equals: /uri/plugin_proxy_rewrite
        headers:
          X-Api-Engine:
            equals: apisix
      respond: *hello_response
    output: *hello_output

  - name: rewrite-empty-headers
    config:
      routes:
        - id: proxy-rewrite-empty-headers
          uri: /hello
          plugins:
            proxy-rewrite:
              uri: /uri/plugin_proxy_rewrite
              headers:
                X-Api-Test: hello
          upstream: *fixture_route
    input:
      path: /hello
      headers:
        X-Api-Test: ""
    upstream:
      expect:
        headers:
          X-Api-Test:
            equals: hello
      respond: *hello_response
    output: *hello_output

  - name: rewrite-uri-query
    config:
      routes:
        - id: proxy-rewrite-uri-query
          uri: /hello
          plugins:
            proxy-rewrite:
              uri: /plugin_proxy_rewrite_args
          upstream: *fixture_route
    input:
      path: /hello?q=apisix&a=iresty
    upstream:
      expect:
        path:
          equals: /plugin_proxy_rewrite_args?q=apisix&a=iresty
      respond: *hello_response
    output: *hello_output

  - name: rewrite-uri-empty-query
    config:
      routes:
        - id: proxy-rewrite-uri-empty-query
          uri: /hello
          plugins:
            proxy-rewrite:
              uri: /plugin_proxy_rewrite_args
          upstream: *fixture_route
    input:
      path: /hello
    upstream:
      expect:
        path:
          equals: /plugin_proxy_rewrite_args
      respond: *hello_response
    output: *hello_output

  - name: remove-empty-header
    config:
      routes:
        - id: proxy-rewrite-remove-empty-header
          uri: /hello
          plugins:
            proxy-rewrite:
              uri: /uri/plugin_proxy_rewrite
              headers:
                X-Api-Engine: APISIX
                X-Api-Test: ""
          upstream: *fixture_route
    input:
      path: /hello
      headers:
        X-Api-Test: foo
        X-Api-Engine: bar
    upstream:
      expect:
        headers:
          X-Api-Engine:
            equals: APISIX
          X-Api-Test:
            absent: true
      respond: *hello_response
    output: *hello_output

  - name: regex-uri
    config:
      routes:
        - id: proxy-rewrite-regex-uri
          uri: /test/*
          plugins:
            proxy-rewrite:
              regex_uri: ['^/test/(.*)/(.*)/(.*)', '/$1_$2_$3']
          upstream: *fixture_route
    input:
      path: /test/plugin/proxy/rewrite
    upstream:
      expect:
        path:
          equals: /plugin_proxy_rewrite
      respond: *hello_response
    output: *hello_output

  - name: regex-uri-no-route-match
    config:
      routes:
        - id: proxy-rewrite-regex-uri-no-match
          uri: /test/*
          plugins:
            proxy-rewrite:
              regex_uri: ['^/test/(.*)/(.*)/(.*)', '/$1_$2_$3']
          upstream: *fixture_route
    input:
      path: /test/not/found
    upstream:
      expect:
        path:
          equals: /test/not/found
      respond:
        status: 404
    output:
      status: 404

  - name: uri-precedes-regex-uri
    config:
      routes:
        - id: proxy-rewrite-uri-precedes-regex
          uri: /test/*
          plugins:
            proxy-rewrite:
              uri: /hello
              regex_uri: ['^/test/(.*)', '/${1}1']
          upstream: *fixture_route
    input:
      path: /test/hello
    upstream:
      expect:
        path:
          equals: /hello
      respond: *hello_response
    output: *hello_output

  - name: reject-odd-regex-uri
    config:
      routes:
        - id: proxy-rewrite-reject-odd-regex-uri
          uri: /test/*
          plugins:
            proxy-rewrite:
              regex_uri: ['^/test/(.*)', '/$1', 'extra']
          upstream: *fixture_route
    upstream: &unused_fixture
      respond: *hello_response
    input: {path: /test/value}
    output: {status: 404}

  - name: reject-invalid-regex-pattern
    config:
      routes:
        - id: proxy-rewrite-reject-invalid-regex-pattern
          uri: /test/*
          plugins:
            proxy-rewrite:
              regex_uri: ['[^/test/(.*)', '/$1']
          upstream: *fixture_route
    upstream: *unused_fixture
    input: {path: /test/value}
    output: {status: 404}

  - name: reject-invalid-regex-replacement
    config:
      routes:
        - id: proxy-rewrite-reject-invalid-regex-replacement
          uri: /test/*
          plugins:
            proxy-rewrite:
              regex_uri: ['^/test/(.*)', '/$`1']
          upstream: *fixture_route
    upstream: *unused_fixture
    input: {path: /test/value}
    output: {status: 404}

  - name: reject-invalid-uri
    config:
      routes:
        - id: proxy-rewrite-reject-invalid-uri
          uri: /hello
          plugins:
            proxy-rewrite:
              uri: hello
          upstream: *fixture_route
    upstream: *unused_fixture
    input: {path: /hello}
    output: {status: 404}

  - name: schema-rejects-relative-uri
    config:
      routes:
        - id: proxy-rewrite-reject-non-string-uri
          uri: /hello
          plugins:
            proxy-rewrite:
              uri: home
          upstream: *fixture_route
    upstream: *unused_fixture
    input: {path: /hello}
    output: {status: 404}

  - name: reject-invalid-header-field
    config:
      routes:
        - id: proxy-rewrite-reject-invalid-header-field
          uri: /hello
          plugins:
            proxy-rewrite:
              uri: /uri/plugin_proxy_rewrite
              headers:
                'X-Api:Version': v2
          upstream: *fixture_route
    upstream: *unused_fixture
    input: {path: /hello}
    output: {status: 404}

  - name: reject-invalid-header-value
    config:
      routes:
        - id: proxy-rewrite-reject-invalid-header-value
          uri: /hello
          plugins:
            proxy-rewrite:
              uri: /uri/plugin_proxy_rewrite
              headers:
                X-Api-Version: "v2\r\n"
          upstream: *fixture_route
    upstream: *unused_fixture
    input: {path: /hello}
    output: {status: 404}

  - name: rewrite-uri-with-arguments
    config:
      routes:
        - id: proxy-rewrite-uri-with-arguments
          uri: /hello
          plugins:
            proxy-rewrite:
              uri: /plugin_proxy_rewrite_args?q=apisix
          upstream: *fixture_route
    input:
      path: /hello?a=iresty
    upstream:
      expect:
        path:
          equals: /plugin_proxy_rewrite_args?q=apisix&a=iresty
      respond: *hello_response
    output: *hello_output

  - name: admin-etcd-clean-serialization
    config:
      routes:
        - id: proxy-rewrite-clean-standalone-config
          uri: /hello
          plugins:
            proxy-rewrite:
              uri: /uri/plugin_proxy_rewrite
              headers:
                X-Api: v2
          upstream: *fixture_route
    input:
      path: /hello
    upstream:
      expect:
        path:
          equals: /uri/plugin_proxy_rewrite
        headers:
          X-Api:
            equals: v2
      respond: *hello_response
    output: *hello_output
  - name: header-request-variables
    config:
      routes:
        - id: proxy-rewrite-header-request-variables
          uri: /hello
          plugins:
            proxy-rewrite:
              uri: /uri
              headers:
                x-api: $remote_addr
                name: $arg_name
                x-key: $http_key
          upstream: *fixture_route
    input:
      path: /hello?name=Bill
      headers:
        key: X-APISIX
    upstream:
      expect:
        path:
          equals: /uri?name=Bill
        headers:
          x-api:
            equals: 127.0.0.1
          name:
            equals: Bill
          x-key:
            equals: X-APISIX
      respond: *hello_response
    output: *hello_output

  - name: missing-request-variable
    config:
      routes:
        - id: proxy-rewrite-missing-request-variable
          uri: /hello
          plugins:
            proxy-rewrite:
              uri: /uri
              headers:
                x-api: $helle
                name: $arg_world
                x-key: $http_key
                Version: nginx_var_does_not_exist
          upstream: *fixture_route
    input:
      path: /hello
    upstream:
      expect:
        headers:
          x-api:
            absent: true
          name:
            absent: true
          x-key:
            absent: true
          Version:
            equals: nginx_var_does_not_exist
      respond: *hello_response
    output: *hello_output

  - name: context-uri-variable
    config:
      routes:
        - id: proxy-rewrite-context-uri-variable
          uri: /test
          plugins:
            proxy-rewrite:
              uri: /$arg_new_uri
          upstream: *fixture_route
    input:
      path: /test?new_uri=hello
    upstream:
      expect:
        path:
          equals: /hello?new_uri=hello
      respond: *hello_response
    output: *hello_output

  - name: host-with-port-schema
    config:
      routes:
        - id: proxy-rewrite-host-with-port-schema
          uri: /hello
          plugins:
            proxy-rewrite:
              host: apisix.iresty.com:6443
          upstream: *fixture_route
    input:
      path: /hello
    upstream:
      expect:
        host:
          equals: apisix.iresty.com:6443
      respond: *hello_response
    output: *hello_output

  - name: host-with-port-and-rewritten-uri
    config:
      routes:
        - id: proxy-rewrite-host-with-port-and-uri
          uri: /hello
          methods: [GET]
          plugins:
            proxy-rewrite:
              uri: /uri
              host: test.com:6443
          upstream: *fixture_route
    input:
      path: /hello
    upstream:
      expect:
        path:
          equals: /uri
        host:
          equals: test.com:6443
      respond: *hello_response
    output: *hello_output

  - name: forwarded-proto-default
    runtime:
      apisix:
        trusted_addresses: [127.0.0.1]
    config:
      routes:
        - id: proxy-rewrite-forwarded-proto-default
          uri: /echo

          plugins:
            proxy-rewrite: {}
          upstream: *fixture_route
    input:
      path: /echo
    upstream:
      expect:
        headers:
          X-Forwarded-Proto:
            equals: http
      respond: *hello_response
    output: *hello_output

  - name: forwarded-proto-pass
    runtime:
      apisix:
        trusted_addresses: [127.0.0.1]
    config:
      routes:
        - id: proxy-rewrite-forwarded-proto-pass
          uri: /echo

          plugins:
            proxy-rewrite: {}
          upstream: *fixture_route
    input:
      path: /echo
      headers:
        X-Forwarded-Proto: https
    upstream:
      expect:
        headers:
          X-Forwarded-Proto:
            equals: https
      respond: *hello_response
    output: *hello_output

  - name: forwarded-proto-customize
    runtime:
      apisix:
        trusted_addresses: [127.0.0.1]
    config:
      routes:
        - id: proxy-rewrite-forwarded-proto-custom
          uri: /echo
          plugins:
            proxy-rewrite:
              headers:
                X-Forwarded-Proto: https
          upstream: *fixture_route
    input:
      path: /echo
      headers:
        X-Forwarded-Proto: grpc
    upstream:
      expect:
        headers:
          X-Forwarded-Proto:
            equals: https
      respond: *hello_response
    output: *hello_output

  - name: forwarded-proto-duplicate
    runtime:
      apisix:
        trusted_addresses: [127.0.0.1]
    config:
      routes:
        - id: proxy-rewrite-forwarded-proto-duplicate
          uri: /echo

          plugins:
            proxy-rewrite: {}
          upstream: *fixture_route
    input:
      path: /echo
      header_values:
        X-Forwarded-Proto: [http, grpc]
    upstream:
      expect:
        headers:
          X-Forwarded-Proto:
            values: [http, grpc]
      respond: *hello_response
    output: *hello_output

  - name: forwarded-port-customize
    runtime:
      apisix:
        trusted_addresses: [127.0.0.1]
    config:
      routes:
        - id: proxy-rewrite-forwarded-port-custom
          uri: /echo
          plugins:
            proxy-rewrite:
              headers:
                X-Forwarded-Port: "10080"
          upstream: *fixture_route
    input:
      path: /echo
      headers:
        X-Forwarded-Port: "8080"
    upstream:
      expect:
        headers:
          X-Forwarded-Port:
            equals: "10080"
      respond: *hello_response
    output: *hello_output

  - name: forwarded-proto-untrusted-keeps-first
    runtime:
      apisix:
        trusted_addresses: []
    config:
      routes:
        - id: proxy-rewrite-forwarded-proto-untrusted
          uri: /echo

          plugins:
            proxy-rewrite: {}
          upstream: *fixture_route
    input:
      path: /echo
      header_values:
        X-Forwarded-Proto: [http, grpc]
    upstream:
      expect:
        headers:
          X-Forwarded-Proto:
            values: [http]
      respond: *hello_response
    output: *hello_output

  - name: method-rewrite
    config:
      routes:
        - id: proxy-rewrite-method
          uri: /hello
          plugins:
            proxy-rewrite:
              uri: /plugin_proxy_rewrite
              method: POST
              host: apisix.iresty.com
          upstream: *fixture_route
    input:
      path: /hello
    upstream:
      expect:
        method: POST
        path:
          equals: /plugin_proxy_rewrite
        host:
          equals: apisix.iresty.com
      respond: *hello_response
    output: *hello_output

  - name: method-update
    config:
      routes:
        - id: proxy-rewrite-method-update
          uri: /hello
          plugins:
            proxy-rewrite:
              uri: /plugin_proxy_rewrite
              method: GET
              host: apisix.iresty.com
          upstream: *fixture_route
    input:
      path: /hello
    upstream:
      expect:
        method: GET
        path:
          equals: /plugin_proxy_rewrite
      respond: *hello_response
    output: *hello_output

  - name: schema-rejects-method
    config:
      routes:
        - id: proxy-rewrite-bad-method
          uri: /hello
          plugins:
            proxy-rewrite:
              uri: /apisix/home
              method: GET1
              host: apisix.iresty.com
          upstream: *fixture_route
    upstream:
      respond: *hello_response
    input: {path: /hello}
    output: {status: 404}

  - name: method-with-headers
    config:
      routes:
        - id: proxy-rewrite-method-headers
          uri: /hello
          plugins:
            proxy-rewrite:
              uri: /plugin_proxy_rewrite
              method: POST
              host: apisix.iresty.com
              headers:
                x-api-version: v1
          upstream: *fixture_route
    input:
      path: /hello
    upstream:
      expect:
        method: POST
        headers:
          X-Api-Version:
            equals: v1
      respond: *hello_response
    output: *hello_output

  - name: unsafe-uri-preserved
    config:
      routes:
        - id: proxy-rewrite-unsafe-uri
          uri: /print_uri_detailed
          plugins:
            proxy-rewrite:
              use_real_request_uri_unsafe: true
          upstream: *fixture_route
    input:
      path: /print%5Furi%5Fdetailed
    upstream:
      expect:
        path:
          equals: /print%5Furi%5Fdetailed
      respond: *hello_response
    output: *hello_output

  - name: safe-uri-preserved
    config:
      routes:
        - id: proxy-rewrite-safe-uri
          uri: /print_uri_detailed
          plugins:
            proxy-rewrite:
              use_real_request_uri_unsafe: true
          upstream: *fixture_route
    input:
      path: /print_uri_detailed
    upstream:
      expect:
        path:
          equals: /print_uri_detailed
      respond: *hello_response
    output: *hello_output

  - name: forwarded-host-rewrite
    config:
      routes:
        - id: proxy-rewrite-forwarded-host
          uri: /echo
          plugins:
            proxy-rewrite:
              headers:
                X-Forwarded-Host: test.com
          upstream: *fixture_route
    input:
      path: /echo
      headers:
        X-Forwarded-Host: apisix.ai
    upstream:
      expect:
        headers:
          X-Forwarded-Host:
            equals: test.com
      respond: *hello_response
    output: *hello_output

  - name: add-set-remove-headers
    config:
      routes:
        - id: proxy-rewrite-header-ops
          uri: /echo
          plugins:
            proxy-rewrite:
              headers:
                add: {test: "123"}
                set: {test2: "2233"}
                remove: [hello]
          upstream: *fixture_route
    input:
      path: /echo
      header_values:
        test: [sssss, bbb]
        hello: [word]
    upstream:
      expect:
        headers:
          test:
            values: [sssss, bbb, 123]
          test2:
            equals: "2233"
          hello:
            absent: true
      respond: *hello_response
    output: *hello_output

  - name: header-priority
    config:
      routes:
        - id: proxy-rewrite-header-priority
          uri: /echo
          plugins:
            proxy-rewrite:
              headers:
                add: {test: test_in_add}
                set: {test: test_in_set}
          upstream: *fixture_route
    input:
      path: /echo
    upstream:
      expect:
        headers:
          test:
            equals: test_in_set
      respond: *hello_response
    output: *hello_output

  - name: host-rewrite-crlf
    config:
      routes:
        - id: proxy-rewrite-host-crlf
          uri: /hello*
          plugins:
            proxy-rewrite:
              host: test.xxxx.com
          upstream: *fixture_route
    input:
      path: /hello%3f0z=700%26a=c%20HTTP/1.1%0D%0AHost:google.com%0d%0a%0d%0a
    upstream:
      expect:
        host:
          equals: test.xxxx.com
        path:
          equals: '/hello%3F0z=700&a=c%20HTTP/1.1%0D%0AHost:google.com%0D%0A%0D%0A'
      respond: *hello_response
    output: *hello_output

  - name: regex-uri-args
    config:
      routes:
        - id: proxy-rewrite-regex-args
          uri: /test/*
          plugins:
            proxy-rewrite:
              regex_uri: ["^/test/(.*)/(.*)/(.*)", "/$1_$2_$3?a=c"]
          upstream: *fixture_route
    input:
      path: /test/plugin/proxy/rewrite
    upstream:
      expect:
        path:
          equals: /plugin_proxy_rewrite?a=c
      respond: *hello_response
    output: *hello_output

  - name: capture-header-vars
    config:
      routes:
        - id: proxy-rewrite-capture-vars
          uri: /test/*
          plugins:
            proxy-rewrite:
              regex_uri: ["^/test/(.*)/(.*)/(.*)", "/echo"]
              headers:
                add:
                  X-Request-ID: $1/$2/$3
          upstream: *fixture_route
    input:
      path: /test/plugin/proxy/rewrite
    upstream:
      expect:
        headers:
          X-Request-ID:
            equals: plugin/proxy/rewrite
      respond: *hello_response
    output: *hello_output

  - name: unmatched-capture
    config:
      routes:
        - id: proxy-rewrite-unmatched-capture
          uri: /echo*
          plugins:
            proxy-rewrite:
              regex_uri: ["^/test/(.*)/(.*)/(.*)", "/echo"]
              headers:
                add:
                  X-Request-ID: $1/$2/$3
          upstream: *fixture_route
    input:
      path: /echo
      headers:
        X-Foo: Foo
    upstream:
      expect:
        headers:
          X-Foo:
            equals: Foo
