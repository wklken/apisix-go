cases:
  - name: validates-headers-and-normalizes-body-before-proxy
    config:
      routes:
        - id: request-validation
          uri: /request-validation
          plugins:
            request-validation:
              header_schema:
                type: object
                required: [X-Role]
                properties:
                  X-Role: {type: string, enum: [admin]}
              body_schema:
                type: object
                required: [payload]
                properties:
                  payload: {type: string, pattern: '^good$'}
              rejected_code: 422
              rejected_msg: custom rejection
          upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
    fixtures:
      - name: primary
        kind: http
        expect:
          - headers:
              X-Role: {equals: admin}
            body: {equals: '{"payload":"good"}'}
        respond:
          - {status: 200, body: ok}
    steps:
      - name: missing-header-is-rejected
        input:
          method: POST
          path: /request-validation
          headers: {Content-Type: application/json}
          body: '{"payload":"good"}'
        output: {status: 422, body: {equals: custom rejection}}
      - name: invalid-body-is-rejected
        input:
          method: POST
          path: /request-validation
          headers: {Content-Type: application/json, X-Role: admin}
          body: '{"payload":"bad"}'
        output: {status: 422, body: {equals: custom rejection}}
      - name: duplicate-body-key-is-normalized-before-proxy
        input:
          method: POST
          path: /request-validation
          headers: {Content-Type: application/json, X-Role: admin}
          body: '{"payload":"bad","payload":"good"}'
        output: {status: 200, body: {equals: ok}}
  - name: missing-and-invalid-bodies-keep-distinct-responses
    config:
      routes:
        - id: request-validation-body-decode
          uri: /request-validation-body-decode
          plugins:
            request-validation:
              body_schema:
                type: object
                required: [payload]
                properties:
                  payload: {type: string}
              rejected_code: 422
          upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
    fixtures:
      - name: primary
        kind: http
        expect_requests: 0
        respond:
          - {status: 200, body: unexpected}
    steps:
      - name: missing-body-is-rejected-with-empty-body
        input:
          method: POST
          path: /request-validation-body-decode
          headers: {Content-Type: application/json}
        output: {status: 422, body: {equals: ""}}
      - name: whitespace-body-returns-json-decode-error
        input:
          method: POST
          path: /request-validation-body-decode
          headers: {Content-Type: application/json}
          body: "   "
        output:
          status: 422
          body: {equals: Expected value but found T_END at character 4}
      - name: malformed-json-returns-json-decode-error
        input:
          method: POST
          path: /request-validation-body-decode
          headers: {Content-Type: application/json}
          body: x
        output:
          status: 422
          body: {equals: Expected value but found invalid token at character 1}
  - name: explicit-dialect-keeps-format-assertions
    config:
      routes:
        - id: request-validation-explicit-dialect
          uri: /request-validation-explicit-dialect
          plugins:
            request-validation:
              header_schema:
                $schema: https://json-schema.org/draft/2019-09/schema
                type: object
                required: [X-Email]
                properties:
                  X-Email: {type: string, format: email}
              body_schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                required: [email]
                properties:
                  email: {type: string, format: email}
              rejected_code: 422
              rejected_msg: invalid email
          upstream: {type: roundrobin, nodes: {'{{FIXTURE.primary.ADDR}}': 1}}
    fixtures:
      - name: primary
        kind: http
        expect_requests: 1
        expect:
          - headers:
              X-Email: {equals: a@example.com}
            body: {equals: '{"email":"a@example.com"}'}
        respond:
          - {status: 200, body: validated}
    steps:
      - name: rejects-invalid-header-format
        input:
          method: POST
          path: /request-validation-explicit-dialect
          headers: {Content-Type: application/json, X-Email: bad}
          body: '{"email":"a@example.com"}'
        output: {status: 422, body: {equals: invalid email}}
      - name: rejects-invalid-body-format
        input:
          method: POST
          path: /request-validation-explicit-dialect
          headers: {Content-Type: application/json, X-Email: a@example.com}
          body: '{"email":"bad"}'
        output: {status: 422, body: {equals: invalid email}}
      - name: forwards-valid-formats
        input:
          method: POST
          path: /request-validation-explicit-dialect
          headers: {Content-Type: application/json, X-Email: a@example.com}
          body: '{"email":"a@example.com"}'
        output: {status: 200, body: {equals: validated}}
