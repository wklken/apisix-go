sources:
  - repository: https://github.com/apache/apisix
    commit: 9ef2ecab67f652d38365049613610ef649bb4ad0
    file: t/plugin/response-rewrite.t
    tests: 27
  - repository: https://github.com/apache/apisix
    commit: 9ef2ecab67f652d38365049613610ef649bb4ad0
    file: t/plugin/response-rewrite2.t
    tests: 25
  - repository: https://github.com/apache/apisix
    commit: 9ef2ecab67f652d38365049613610ef649bb4ad0
    file: t/plugin/response-rewrite3.t
    tests: 22

cases:
  - name: schema-sanity
    source:
      file: t/plugin/response-rewrite.t
      tests: [1]
    config:
      routes:
        - id: response-rewrite-schema-sanity
          uri: /hello
          plugins:
            response-rewrite:
              body: Hello world
              headers:
                X-Server-id: 3
          upstream: &fixture_route
            type: roundrobin
            nodes:
              "{{UPSTREAM_ADDR}}": 1
    input:
      path: /hello
    upstream: &hello_fixture
      respond:
        status: 200
        body: upstream
    output:
      status: 200
      headers:
        X-Server-id:
          equals: "3"
      body:
        equals: Hello world

  - name: reject-invalid-status
    source:
      file: t/plugin/response-rewrite.t
      tests: [2]
    config:
      routes:
        - id: response-rewrite-reject-invalid-status
          uri: /hello
          plugins:
            response-rewrite:
              status_code: 599
          upstream: *fixture_route
    upstream: *hello_fixture
    output:
      logs:
        matches: 'build route response-rewrite-reject-invalid-status fail:.*status_code.*598'

  - name: reject-invalid-config
    source:
      file: t/plugin/response-rewrite.t
      tests: [3]
    config:
      routes:
        - id: response-rewrite-reject-invalid-config
          uri: /hello
          plugins:
            response-rewrite:
              body: 2
              headers:
                X-Server-id: "3"
          upstream: *fixture_route
    upstream: *hello_fixture
    output:
      logs:
        matches: 'build route response-rewrite-reject-invalid-config fail:.*body.*expected string'

  - name: rewrite-headers-and-body
    source:
      file: t/plugin/response-rewrite.t
      tests: [4, 5]
    config:
      routes:
        - id: response-rewrite-headers-and-body
          uri: /with_header
          plugins:
            response-rewrite:
              headers:
                X-Server-id: 3
                X-Server-status: "on"
                Content-Type: ""
              body: "new body\n"
          upstream: *fixture_route
    input:
      path: /with_header
    upstream:
      respond:
        status: 200
        headers:
          Content-Type: application/json
        body: upstream
    output:
      status: 200
      headers:
        X-Server-id:
          equals: "3"
        X-Server-status:
          equals: "on"
        Content-Type:
          absent: true
      body:
        equals: "new body\n"

  - name: rewrite-body-preserve-headers
    source:
      file: t/plugin/response-rewrite.t
      tests: [6, 7]
    config:
      routes:
        - id: response-rewrite-body-preserve-headers
          uri: /with_header
          plugins:
            response-rewrite:
              body: "new body2\n"
          upstream: *fixture_route
    input:
      path: /with_header
    upstream:
      respond:
        status: 200
        headers:
          X-Server-id: "100"
          Content-Type: application/xml
          Content-Encoding: gzip
          Content-Length: "4"
          Last-Modified: Wed, 21 Oct 2015 07:28:00 GMT
          ETag: '"33a64df551425fcc55e4d42a148795d9f25f89d4"'
        body: "old\n"
    output:
      status: 200
      headers:
        X-Server-id:
          equals: "100"
        Content-Type:
          equals: application/xml
        Content-Length:
          absent: true
        Content-Encoding:
          absent: true
        Last-Modified:
          absent: true
        ETag:
          absent: true
      body:
        equals: "new body2\n"

  - name: rewrite-location-and-status
    source:
      file: t/plugin/response-rewrite.t
      tests: [8, 9]
    config:
      routes:
        - id: response-rewrite-location-and-status
          uri: /hello
          plugins:
            response-rewrite:
              headers:
                Location: https://www.iresty.com
              status_code: 302
          upstream: *fixture_route
    input:
      path: /hello
    upstream: *hello_fixture
    output:
      status: 302
      headers:
        Location:
          equals: https://www.iresty.com

  - name: empty-header-value
    source:
      file: t/plugin/response-rewrite.t
      tests: [10]
    config:
      routes:
        - id: response-rewrite-reject-empty-header-field
          uri: /hello
          plugins:
            response-rewrite:
              status_code: 200
              headers:
                "": 2
          upstream: *fixture_route
    upstream: *hello_fixture
    output:
      logs:
        matches: 'build route response-rewrite-reject-empty-header-field fail:.*headers.*(pattern|additional)'

  - name: reject-array-header-value
    source:
      file: t/plugin/response-rewrite.t
      tests: [11]
    config:
      routes:
        - id: response-rewrite-reject-array-header-value
          uri: /hello
          plugins:
            response-rewrite:
              status_code: 200
              headers:
                X-Name: []
          upstream: *fixture_route
    upstream: *hello_fixture
    output:
      logs:
        matches: 'build route response-rewrite-reject-array-header-value fail:.*X-Name.*(string|number)'

  - name: base64-body
    source:
      file: t/plugin/response-rewrite.t
      tests: [12, 13]
    config:
      routes:
        - id: response-rewrite-base64-body
          uri: /hello
          plugins:
            response-rewrite:
              body: SGVsbG8K
              body_base64: true
          upstream: *fixture_route
    input:
      path: /hello
    upstream: *hello_fixture
    output:
      status: 200
      body:
        equals: "Hello\n"

  - name: reject-invalid-base64
    source:
      file: t/plugin/response-rewrite.t
      tests: [14]
    config:
      routes:
        - id: response-rewrite-reject-invalid-base64
          uri: /hello
          plugins:
            response-rewrite:
              body: "1"
              body_base64: true
          upstream: *fixture_route
    upstream: *hello_fixture
    output:
      logs:
        matches: 'build route response-rewrite-reject-invalid-base64 fail:.*body is not valid base64'

  - name: admin-etcd-clean-serialization
    source:
      file: t/plugin/response-rewrite.t
      tests: [15]
    config:
      routes:
        - id: response-rewrite-clean-standalone-config
          uri: /with_header
          plugins:
            response-rewrite:
              headers:
                X-Server-id: 3
                X-Server-status: "on"
                Content-Type: ""
              body: "new body\n"
          upstream: *fixture_route
    input:
      path: /with_header
    upstream: *hello_fixture
    output:
      status: 200
      headers:
        X-Server-id:
          equals: "3"
        X-Server-status:
          equals: "on"
        Content-Type:
          equals: ""
      body:
        equals: "new body\n"
  - name: valid-status-expression
    source:
      file: t/plugin/response-rewrite.t
      tests: [16]
    config:
      routes:
        - id: response-rewrite-valid-status-expression
          uri: /hello
          plugins:
            response-rewrite:
              body: matched
              vars:
                - [status, "==", 200]
          upstream: *fixture_route
    input:
      path: /hello
    upstream: *hello_fixture
    output:
      status: 200
      body:
        equals: matched

  - name: reject-invalid-expression
    source:
      file: t/plugin/response-rewrite.t
      tests: [17]
    config:
      routes:
        - id: response-rewrite-reject-invalid-expression
          uri: /hello
          plugins:
            response-rewrite:
              vars:
                - []
          upstream: *fixture_route
    upstream: *hello_fixture
    output:
      logs:
        matches: 'build route response-rewrite-reject-invalid-expression fail:.*vars validation failed'

  - name: matching-status-expression
    source:
      file: t/plugin/response-rewrite.t
      tests: [18, 19]
    config:
      routes:
        - id: response-rewrite-matching-status-expression
          uri: /server_error
          plugins:
            response-rewrite:
              body: "new body3\n"
              status_code: 403
              vars:
                - [status, "==", 500]
          upstream: *fixture_route
    input:
      path: /server_error
    upstream:
      respond:
        status: 500
        body: server error
    output:
      status: 403
      body:
        equals: "new body3\n"

  - name: nonmatching-status-expression
    source:
      file: t/plugin/response-rewrite.t
      tests: [20]
    config:
      routes:
        - id: response-rewrite-nonmatching-status-expression
          uri: /hello
          plugins:
            response-rewrite:
              body: "new body3\n"
              status_code: 403
              vars:
                - [status, "==", 500]
          upstream: *fixture_route
    input:
      path: /hello
    upstream:
      respond:
        status: 200
        body: hello world
    output:
      status: 200
      body:
        equals: hello world

  - name: empty-base64-body
    source:
      file: t/plugin/response-rewrite.t
      tests: [21]
    config:
      routes:
        - id: response-rewrite-reject-empty-base64-body
          uri: /hello
          plugins:
            response-rewrite:
              body: ""
              body_base64: true
          upstream: *fixture_route
    upstream: *hello_fixture
    output:
      logs:
        matches: 'build route response-rewrite-reject-empty-base64-body fail:.*body_base64 requires a non-empty body'

  - name: nil-base64-body
    source:
      file: t/plugin/response-rewrite.t
      tests: [22]
    config:
      routes:
        - id: response-rewrite-reject-nil-base64-body
          uri: /hello
          plugins:
            response-rewrite:
              body_base64: true
          upstream: *fixture_route
    upstream: *hello_fixture
    output:
      logs:
        matches: 'build route response-rewrite-reject-nil-base64-body fail:.*body_base64 requires a non-empty body'

  - name: response-header-variables
    source:
      file: t/plugin/response-rewrite.t
      tests: [23, 24]
    config:
      routes:
        - id: response-rewrite-header-variables
          uri: /with_header
          plugins:
            response-rewrite:
              headers:
                X-A: $remote_addr
                X-B: from $remote_addr to $balancer_ip:$balancer_port
          upstream: *fixture_route
    input:
      path: /with_header
    upstream: *hello_fixture
    output:
      status: 200
      headers:
        X-A:
          equals: 127.0.0.1
        X-B:
          matches: '^from 127\.0\.0\.1 to 127\.0\.0\.1:[0-9]+$'
      body:
        equals: upstream

  - name: empty-body
    source:
      file: t/plugin/response-rewrite.t
      tests: [25, 26]
    config:
      routes:
        - id: response-rewrite-empty-body
          uri: /hello
          plugins:
            response-rewrite:
              body: ""
          upstream: *fixture_route
    input:
      path: /hello
    upstream: *hello_fixture
    output:
      status: 200
      body:
        equals: ""

  - name: add-header-without-colon
    source:
      file: t/plugin/response-rewrite.t
      tests: [27]
    config:
      routes:
        - id: response-rewrite-add-header
          uri: /hello
          plugins:
            response-rewrite:
              headers:
                add:
                  - X-Server-test:a
          upstream: *fixture_route
    input:
      path: /hello
    upstream: *hello_fixture
    output:
      status: 200
      headers:
        X-Server-test:
          equals: a
      body:
        equals: upstream

  - name: filter-schema-sanity
    source:
      file: t/plugin/response-rewrite2.t
      tests: [1, 2]
    variants:
      - name: valid-filters
        config:
          routes:
            - id: response-rewrite-filter-sanity
              uri: /hello
              plugins:
                response-rewrite:
                  filters:
                    - regex: l
                      replace: m
                    - regex: Hello
                      scope: global
                      replace: World
                      options: jo
              upstream: *fixture_route
        upstream:
          respond:
            status: 200
            body: hello world
        input:
          path: /hello
        output:
          status: 200
          body:
            equals: hemlo world
      - name: rejects-body-and-filters-together
        config:
          routes:
            - id: response-rewrite-body-and-filters
              uri: /hello
              plugins:
                response-rewrite:
                  body: test
                  filters:
                    - regex: l
                      replace: m
              upstream: *fixture_route
        upstream:
          respond:
            status: 200
            body: hello world
        output:
          logs:
            matches: 'build route response-rewrite-body-and-filters fail:.*dependencies/(body|filters)/not'
      - name: rejects-empty-filters-array
        config:
          routes:
            - id: response-rewrite-empty-filters
              uri: /hello
              plugins:
                response-rewrite:
                  filters: []
              upstream: *fixture_route
        upstream:
          respond:
            status: 200
            body: hello world
        output:
          logs:
            matches: 'build route response-rewrite-empty-filters fail:.*properties/filters/minItems: minimum 1 items required'

  - name: filter-rejects-missing-replace
    source:
      file: t/plugin/response-rewrite2.t
      tests: [3]
    config:
      routes:
        - id: response-rewrite-missing-replace
          uri: /hello
          plugins:
            response-rewrite:
              filters:
                - regex: Hello
          upstream: *fixture_route
    upstream:
      respond:
        status: 200
        body: hello world
    output:
      logs:
        matches: 'build route response-rewrite-missing-replace.*missing properties: .replace.'

  - name: filter-rejects-invalid-scope
    source:
      file: t/plugin/response-rewrite2.t
      tests: [4]
    config:
      routes:
        - id: response-rewrite-invalid-scope
          uri: /hello
          plugins:
            response-rewrite:
              filters:
                - regex: Hello
                  scope: two
                  replace: World
                  options: jo
          upstream: *fixture_route
    upstream:
      respond:
        status: 200
        body: hello world
    output:
      logs:
        matches: 'build route response-rewrite-invalid-scope.*scope.*enum'

  - name: filter-rejects-empty-regex
    source:
      file: t/plugin/response-rewrite2.t
      tests: [5]
    config:
      routes:
        - id: response-rewrite-empty-regex
          uri: /hello
          plugins:
            response-rewrite:
              filters:
                - regex: ""
                  replace: world
          upstream: *fixture_route
    upstream:
      respond:
        status: 200
        body: hello world
    output:
      logs:
        matches: 'build route response-rewrite-empty-regex.*response-rewrite'

  - name: filter-rejects-invalid-options
    source:
      file: t/plugin/response-rewrite2.t
      tests: [6]
    config:
      routes:
        - id: response-rewrite-invalid-options
          uri: /hello
          plugins:
            response-rewrite:
              filters:
                - regex: hello
                  replace: HELLO
                  options: h
          upstream: *fixture_route
    upstream:
      respond:
        status: 200
        body: hello world
    output:
      logs:
        matches: 'build route response-rewrite-invalid-options.*response-rewrite'

  - name: filters-vars-match
    source:
      file: t/plugin/response-rewrite2.t
      tests: [7, 8]
    config:
      routes:
        - id: response-rewrite-filters-vars
          uri: /hello
          plugins:
            response-rewrite:
              vars:
                - [status, '==', 200]
              filters:
                - regex: hello
                  replace: test
          upstream: *fixture_route
    upstream:
      respond:
        status: 200
        body: hello world
    input:
      path: /hello
    output:
      status: 200
      body:
        equals: test world

  - name: filter-global-substitute
    source:
      file: t/plugin/response-rewrite2.t
      tests: [9, 10]
    config:
      routes:
        - id: response-rewrite-global
          uri: /hello
          plugins:
            response-rewrite:
              vars:
                - [status, '==', 200]
              filters:
                - regex: l
                  replace: t
                  scope: global
          upstream: *fixture_route
    upstream:
      respond:
        status: 200
        body: hello world
    input:
      path: /hello
    output:
      status: 200
      body:
        equals: hetto wortd

  - name: filter-replace-empty
    source:
      file: t/plugin/response-rewrite2.t
      tests: [11, 12]
    config:
      routes:
        - id: response-rewrite-replace-empty
          uri: /hello
          plugins:
            response-rewrite:
              vars:
                - [status, '==', 200]
              filters:
                - regex: hello
                  replace: ""
          upstream: *fixture_route
    upstream:
      respond:
        status: 200
        body: hello world
    input:
      path: /hello
    output:
      status: 200
      body:
        equals: ' world'

  - name: filter-replace-words
    source:
      file: t/plugin/response-rewrite2.t
      tests: [13, 14]
    config:
      routes:
        - id: response-rewrite-replace-words
          uri: /hello
          plugins:
            response-rewrite:
              vars:
                - [status, '==', 200]
              filters:
                - regex: '\w\S+$'
                  replace: "*"
          upstream: *fixture_route
    upstream:
      respond:
        status: 200
        body: hello world
    input:
      path: /hello
    output:
      status: 200
      body:
        equals: hello *

  - name: multiple-filters
    source:
      file: t/plugin/response-rewrite2.t
      tests: [15, 16]
    config:
      routes:
        - id: response-rewrite-multiple-filters
          uri: /hello
          plugins:
            response-rewrite:
              vars:
                - [status, '==', 200]
              filters:
                - regex: hello
                  replace: HELLO
                - regex: L
                  replace: T
          upstream: *fixture_route
    upstream:
      respond:
        status: 200
        body: hello world
    input:
      path: /hello
    output:
      status: 200
      body:
        equals: HETLO world

  - name: filter-no-match
    source:
      file: t/plugin/response-rewrite2.t
      tests: [17, 18]
    config:
      routes:
        - id: response-rewrite-no-match
          uri: /hello
          plugins:
            response-rewrite:
              vars:
                - [status, '==', 200]
              filters:
                - regex: test
                  replace: TEST
          upstream: *fixture_route
    upstream:
      respond:
        status: 200
        body: hello world
    input:
      path: /hello
    output:
      status: 200
      body:
        equals: hello world

  - name: headers-add
    source:
      file: t/plugin/response-rewrite2.t
      tests: [20, 21]
    config:
      routes:
        - id: response-rewrite-headers-add
          uri: /hello
          plugins:
            response-rewrite:
              headers:
                add:
                  - "Cache-Control: no-cache"
                  - "Cache-Control : max-age=0, must-revalidate"
          upstream: *fixture_route
    upstream:
      respond:
        status: 200
        body: hello world
    input:
      path: /hello
    output:
      status: 200
      headers:
        Cache-Control:
          values: ['no-cache', 'max-age=0, must-revalidate']
      body:
        equals: hello world

  - name: headers-set
    source:
      file: t/plugin/response-rewrite2.t
      tests: [22, 23]
    config:
      routes:
        - id: response-rewrite-headers-set
          uri: /hello
          plugins:
            response-rewrite:
              headers:
                add:
                  - "Cache-Control: no-cache"
                set:
                  Cache-Control: max-age=0, must-revalidate
          upstream: *fixture_route
    upstream:
      respond:
        status: 200
        body: hello world
    input:
      path: /hello
    output:
      status: 200
      headers:
        Cache-Control:
          equals: max-age=0, must-revalidate
      body:
        equals: hello world

  - name: headers-remove
    source:
      file: t/plugin/response-rewrite2.t
      tests: [24, 25]
    config:
      routes:
        - id: response-rewrite-headers-remove
          uri: /hello
          plugins:
            response-rewrite:
              headers:
                add:
                  - "Set-Cookie: <cookie-name>=<cookie-value>; Max-Age=<number>"
                set:
                  Cache-Control: max-age=0, must-revalidate
                remove:
                  - Set-Cookie
                  - Cache-Control
          upstream: *fixture_route
    upstream:
      respond:
        status: 200
        body: hello world
    input:
      path: /hello
    output:
      status: 200
      headers:
        Cache-Control:
          absent: true
        Set-Cookie:
          absent: true
      body:
        equals: hello world

  - name: headers-schema-rejection
    source:
      file: t/plugin/response-rewrite2.t
      tests: [19]
    config:
      routes:
        - id: response-rewrite-headers-schema
          uri: /hello
          plugins:
            response-rewrite:
              headers:
                add:
                  - "headers:"
          upstream: *fixture_route
    upstream:
      respond:
        status: 200
        body: hello world
    output:
      logs:
        matches: 'build route response-rewrite-headers-schema.*headers.*add.*pattern'

  - name: gzip-upstream-preserved
    source:
      file: t/plugin/response-rewrite3.t
      tests: [1, 2]
    config:
      routes:
        - id: response-rewrite-gzip-pass
          uri: /gzip_hello

          plugins:
            response-rewrite: {}
          upstream:
            type: roundrobin
            nodes:
              "{{UPSTREAM_ADDR}}": 1
    input:
      path: /gzip_hello
      headers:
        Accept-Encoding: gzip
    upstream:
      respond:
        status: 200
        headers:
          Content-Encoding: gzip
        body: !!binary |
          H4sIAAAAAAAC/8tIzcnJVyjPL8pJ4QIALTsIrwwAAAA=
    output:
      status: 200
      headers:
        Content-Encoding:
          equals: gzip
      gzip_body:
        equals: "hello world\n"

  - name: gzip-body-rewrite
    source:
      file: t/plugin/response-rewrite3.t
      tests: [3, 4]
    config:
      routes:
        - id: response-rewrite-gzip-body
          uri: /gzip_hello
          plugins:
            response-rewrite:
              vars:
                - [status, '==', 200]
              body: "new body\n"
          upstream:
            type: roundrobin
            nodes:
              "{{UPSTREAM_ADDR}}": 1
    input:
      path: /gzip_hello
      headers:
        Accept-Encoding: gzip
    upstream:
      respond:
        status: 200
        headers:
          Content-Encoding: gzip
        body: !!binary |
          H4sIAAAAAAAC/8tIzcnJVyjPL8pJ4QIALTsIrwwAAAA=
    output:
      status: 200
      headers:
        Content-Encoding:
          absent: true
      body:
        equals: "new body\n"

  - name: gzip-filter-decode
    source:
      file: t/plugin/response-rewrite3.t
      tests: [5, 6]
    config:
      routes:
        - id: response-rewrite-gzip-filter
          uri: /gzip_hello
          plugins:
            response-rewrite:
              vars:
                - [status, '==', 200]
              filters:
                - regex: hello
                  replace: test
          upstream:
            type: roundrobin
            nodes:
              "{{UPSTREAM_ADDR}}": 1
    input:
