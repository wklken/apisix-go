cases:
    - name: metadata-log-format-is-accepted
      config:
        plugin_metadata:
            - id: rocketmq-logger
              log_format:
                '@timestamp': $time_iso8601
                client_ip: $remote_addr
                host: $host
        routes:
            - id: rocketmq-001
              plugins:
                rocketmq-logger:
                    batch_max_size: 1
                    buffer_duration: 1
                    inactive_timeout: 1
                    key: key1
                    max_retry_count: 0
                    nameserver_list:
                        - '{{FIXTURE.sink.ADDR}}'
                    tag: tag1
                    timeout: 1
                    topic: test2
              upstream:
                nodes:
                    '{{FIXTURE.primary.ADDR}}': 1
                type: roundrobin
              uri: /rocketmq-001
      fixtures:
        - name: primary
          kind: http
          expect_requests: 1
          expect:
            - path:
                matches: ^/rocketmq-[0-9]+
          respond:
            - body: |
                hello world
              headers:
                Content-Type: text/plain
              status: 200
        - name: sink
          kind: rocketmq
          rocketmq:
            expect_messages: 1
            messages:
                - body:
                    matches: '"host":"[^"]+"'
                  key:
                    equals: key1
                  tag:
                    equals: tag1
                  topic:
                    equals: test2
            partitions: 1
      steps:
        - name: metadata-log-format-is-accepted-request
          input:
            method: GET
            path: /rocketmq-001
          output:
            body:
                equals: |
                    hello world
            status: 200
          wait: 200ms
