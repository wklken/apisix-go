                        secret: integration-secret
      steps:
          - name: configured wrong callback is encoded in the Redirect AuthnRequest
            input: {method: GET, path: /uri}
            output:
                status: 302
                captures:
                    wrong_redirect_setup: {header: Location, matches: '^(.*)$'}
            actions:
                - saml_response:
                    redirect_capture: wrong_redirect_setup
                    response_capture: wrong_redirect_setup_response
                    relay_state_capture: wrong_redirect_setup_state
                    idp_certificate: *saml_cert
                    idp_private_key: *saml_key
                    idp_entity_id: https://idp.example.test/realms/integration
                    sp_certificate: *saml_cert
                    expected_sp_issuer: sp
                    name_id: setup@example.com

    - name: saml-auth-redirect-two-sp-single-logout
      source:
          file: t/plugin/saml-auth.t
          tests: [13]
      config:
          routes:
              - id: saml-auth-redirect-sp1
                uri: /*
                hosts: [sp1.local]
                plugins:
                    saml-auth:
                        sp_issuer: sp
                        idp_uri: https://idp.example.test/sso
                        idp_entity_id: https://idp.example.test/realms/integration
                        idp_cert: *saml_cert
                        login_callback_uri: /login/callback
                        logout_uri: /logout
                        logout_callback_uri: /logout/callback
                        logout_redirect_uri: /logout_ok
                        sp_cert: *saml_cert
                        sp_private_key: *saml_key
                        secret: integration-secret
                upstream:
                    type: roundrobin
                    nodes:
                        '{{FIXTURE.primary.ADDR}}': 1
              - id: saml-auth-redirect-sp2
                uri: /*
                hosts: [sp2.local]
                plugins:
                    saml-auth:
                        sp_issuer: sp2
                        idp_uri: https://idp.example.test/sso
                        idp_entity_id: https://idp.example.test/realms/integration
                        idp_cert: *saml_cert
                        login_callback_uri: /login/callback
                        logout_uri: /logout
                        logout_callback_uri: /logout/callback
                        logout_redirect_uri: /logout_ok
                        sp_cert: *saml_cert
                        sp_private_key: *saml_key
                        secret: integration-secret
                upstream:
                    type: roundrobin
                    nodes:
                        '{{FIXTURE.primary.ADDR}}': 1
      fixtures:
          - name: primary
            kind: http
            expect:
                - &sp_expect
                  method: GET
                  path: {equals: /uri}
                  headers:
                      X-Userinfo: {equals: eyJuYW1lX2lkIjoic3B1c2VyQGV4YW1wbGUuY29tIiwiYXR0cmlidXRlcyI6eyJ1aWQiOlsic3B1c2VyIl19fQ==}
                - method: GET
                  path: {equals: /uri}
                  headers:
                      X-Userinfo: {equals: eyJuYW1lX2lkIjoic3B1c2VyQGV4YW1wbGUuY29tIiwiYXR0cmlidXRlcyI6eyJ1aWQiOlsic3B1c2VyIl19fQ==}
                - *sp_expect
                - method: GET
                  path: {equals: /uri}
                  headers:
                      X-Userinfo: {equals: eyJuYW1lX2lkIjoic3B1c2VyQGV4YW1wbGUuY29tIiwiYXR0cmlidXRlcyI6eyJ1aWQiOlsic3B1c2VyIl19fQ==}
            respond:
                - &sp_response
                  status: 200
                  headers: {}
                  body: multi-sp upstream
                - *sp_response
                - *sp_response
                - *sp_response
      steps:
          - name: redirect sp1 starts authentication
            input: {method: GET, path: /uri, headers: {Host: sp1.local}}
            output:
                status: 302
                captures:
                    redirect_sp1_login: {header: Location, matches: '^(.*)$'}
            actions:
                - saml_response:
                    redirect_capture: redirect_sp1_login
                    response_capture: redirect_sp1_response
                    relay_state_capture: redirect_sp1_state
                    idp_certificate: *saml_cert
                    idp_private_key: *saml_key
                    idp_entity_id: https://idp.example.test/realms/integration
                    sp_certificate: *saml_cert
                    expected_sp_issuer: sp
                    name_id: spuser@example.com
                    user_name: spuser
          - name: redirect sp1 accepts its own callback
            input:
                method: POST
                path: /login/callback
                headers: {Host: sp1.local, Content-Type: application/x-www-form-urlencoded}
                body: 'SAMLResponse={{CAPTURE.redirect_sp1_response}}&RelayState={{CAPTURE.redirect_sp1_state}}'
            output: {status: 302, headers: {Location: {equals: /uri}}}
          - name: redirect sp1 session reaches upstream
            input: {method: GET, path: /uri, headers: {Host: sp1.local}}
            output: {status: 200, body: {equals: multi-sp upstream}}
          - name: redirect sp2 starts an independent authentication
            input: {method: GET, path: /uri, headers: {Host: sp2.local}}
            output:
                status: 302
                captures:
                    redirect_sp2_login: {header: Location, matches: '^(.*)$'}
            actions:
                - saml_response:
                    redirect_capture: redirect_sp2_login
                    response_capture: redirect_sp2_response
                    relay_state_capture: redirect_sp2_state
                    idp_certificate: *saml_cert
                    idp_private_key: *saml_key
                    idp_entity_id: https://idp.example.test/realms/integration
                    sp_certificate: *saml_cert
                    expected_sp_issuer: sp2
                    name_id: spuser@example.com
                    user_name: spuser
          - name: redirect sp2 accepts its own callback
            input:
                method: POST
                path: /login/callback
                headers: {Host: sp2.local, Content-Type: application/x-www-form-urlencoded}
                body: 'SAMLResponse={{CAPTURE.redirect_sp2_response}}&RelayState={{CAPTURE.redirect_sp2_state}}'
            output: {status: 302, headers: {Location: {equals: /uri}}}
          - name: redirect sp2 session reaches upstream
            input: {method: GET, path: /uri, headers: {Host: sp2.local}}
            output: {status: 200, body: {equals: multi-sp upstream}}
          - name: redirect sp2 login does not replace the sp1 session
            input: {method: GET, path: /uri, headers: {Host: sp1.local}}
            output: {status: 200, body: {equals: multi-sp upstream}}
          - name: redirect sp1 initiates single logout
            input: {method: GET, path: /logout, headers: {Host: sp1.local}}
            output:
                status: 302
                headers:
                    Location: {matches: '^https://idp\.example\.test/sso\?.*SAMLRequest=.*'}
                captures:
                    redirect_sp1_logout_request: {header: Location, matches: '^(.*)$'}
            actions:
                - saml_logout:
                    kind: request
                    redirect_capture: redirect_sp1_logout_request
                    output_capture: redirect_idp_to_sp2_request
                    input_request_id_capture: redirect_sp1_logout_request_id
                    output_request_id_capture: redirect_idp_to_sp2_request_id
                    destination: http://sp2.local/logout/callback
                    idp_uri: https://idp.example.test/sso
                    idp_entity_id: https://idp.example.test/realms/integration
                    idp_certificate: *saml_cert
                    idp_private_key: *saml_key
                    sp_certificate: *saml_cert
                    expected_sp_issuer: sp
                    name_id: spuser@example.com
          - name: IdP sends a signed logout request to sp2
            input:
                method: GET
                path: '/{{CAPTURE.redirect_idp_to_sp2_request}}'
                headers: {Host: sp2.local}
            output:
                status: 302
                headers:
                    Location: {matches: '^https://idp\.example\.test/sso\?.*SAMLResponse=.*'}
                captures:
                    redirect_sp2_logout_response: {header: Location, matches: '^(.*)$'}
            actions:
                - saml_logout:
                    kind: response
                    redirect_capture: redirect_sp2_logout_response
                    output_capture: redirect_idp_to_sp1_response
                    expected_request_id_capture: redirect_idp_to_sp2_request_id
                    response_to_request_id_capture: redirect_sp1_logout_request_id
                    destination: http://sp1.local/logout/callback
                    idp_uri: https://idp.example.test/sso
                    idp_entity_id: https://idp.example.test/realms/integration
                    idp_certificate: *saml_cert
                    idp_private_key: *saml_key
                    sp_certificate: *saml_cert
                    expected_sp_issuer: sp2
          - name: IdP sends the correlated logout response to sp1
            input:
                method: GET
                path: '/{{CAPTURE.redirect_idp_to_sp1_response}}'
                headers: {Host: sp1.local}
            output: {status: 302, headers: {Location: {equals: /logout_ok}}}
          - name: redirect sp1 is unauthenticated after single logout
            input: {method: GET, path: /uri, headers: {Host: sp1.local}}
            output:
                status: 302
                headers:
                    Location: {matches: '^https://idp\.example\.test/sso\?.*SAMLRequest=.*'}
          - name: redirect sp2 is unauthenticated after single logout
            input: {method: GET, path: /uri, headers: {Host: sp2.local}}
            output:
                status: 302
                headers:
                    Location: {matches: '^https://idp\.example\.test/sso\?.*SAMLRequest=.*'}
          - name: redirect sp2 performs a normal login after single logout
            input: {method: GET, path: /uri, headers: {Host: sp2.local}}
            output:
                status: 302
                captures:
                    redirect_sp2_relogin: {header: Location, matches: '^(.*)$'}
            actions:
                - saml_response:
                    redirect_capture: redirect_sp2_relogin
                    response_capture: redirect_sp2_relogin_response
                    relay_state_capture: redirect_sp2_relogin_state
                    idp_certificate: *saml_cert
                    idp_private_key: *saml_key
                    idp_entity_id: https://idp.example.test/realms/integration
                    sp_certificate: *saml_cert
                    expected_sp_issuer: sp2
                    name_id: spuser@example.com
                    user_name: spuser
          - name: redirect sp2 normal re-login callback succeeds
            input:
                method: POST
                path: /login/callback
                headers: {Host: sp2.local, Content-Type: application/x-www-form-urlencoded}
                body: 'SAMLResponse={{CAPTURE.redirect_sp2_relogin_response}}&RelayState={{CAPTURE.redirect_sp2_relogin_state}}'
            output: {status: 302, headers: {Location: {equals: /uri}}}
          - name: redirect sp2 re-login reaches upstream
            input: {method: GET, path: /uri, headers: {Host: sp2.local}}
            output: {status: 200, body: {equals: multi-sp upstream}}
          - name: redirect sp2 can log out independently
            input: {method: GET, path: /logout, headers: {Host: sp2.local}}
            output:
                status: 302
                headers:
                    Location: {matches: '^https://idp\.example\.test/sso\?.*SAMLRequest=.*'}
                captures:
                    redirect_sp2_independent_logout_request: {header: Location, matches: '^(.*)$'}
            actions:
                - saml_logout:
                    kind: finish
                    redirect_capture: redirect_sp2_independent_logout_request
                    output_capture: redirect_sp2_independent_logout_response
                    destination: http://sp2.local/logout/callback
                    idp_uri: https://idp.example.test/sso
                    idp_entity_id: https://idp.example.test/realms/integration
                    idp_certificate: *saml_cert
                    idp_private_key: *saml_key
                    sp_certificate: *saml_cert
                    expected_sp_issuer: sp2
          - name: redirect sp2 logout callback completes
            input:
                method: GET
                path: '/{{CAPTURE.redirect_sp2_independent_logout_response}}'
                headers: {Host: sp2.local}
            output: {status: 302, headers: {Location: {equals: /logout_ok}}}
          - name: redirect sp2 session is absent after independent logout
            input: {method: GET, path: /uri, headers: {Host: sp2.local}}
            output:
                status: 302
                headers:
                    Location: {matches: '^https://idp\.example\.test/sso\?.*SAMLRequest=.*'}

    - name: saml-auth-redirect-add-sp2-route
      source:
          file: t/plugin/saml-auth.t
          tests: [12]
      config:
          routes:
              - id: saml-auth-redirect-setup-sp1
