                      secret: integration-secret
              upstream:
                  type: roundrobin
                  nodes:
                      '{{FIXTURE.primary.ADDR}}': 1
      fixtures:
          - name: primary
            kind: http
            expect:
                - method: GET
                  path: {equals: /probe}
                  headers:
                      X-Userinfo: {equals: eyJuYW1lX2lkIjoicG9zdHVzZXJAZXhhbXBsZS5jb20iLCJhdHRyaWJ1dGVzIjp7InVpZCI6WyJwb3N0dXNlciJdfX0=}
            respond:
                - status: 200
                  headers: {}
                  body: saml upstream
      frontend_tls: {sni: localhost}
      steps:
          - name: HTTP-POST binding emits an auto-submit SAML form
            input:
                method: GET
                scheme: https
                path: /probe
            output:
                status: 200
                headers:
                    Content-Type:
                        matches: text/html; charset=utf-8
                body:
                    matches: 'SAMLRequest'
                body_captures:
                    saml_request: {matches: 'name="SAMLRequest" value="([^"]+)"'}
                    input_relay_state: {matches: 'name="RelayState" value="([^"]+)"'}
            actions:
                - saml_response:
                    idp_uri: https://idp.example.test/sso
                    idp_entity_id: https://idp.example.test/realms/integration
                    saml_request_capture: saml_request
                    relay_state_input_capture: input_relay_state
                    response_capture: saml_response
                    relay_state_capture: relay_state
                    idp_certificate: *saml_cert
                    idp_private_key: *saml_key
                    sp_certificate: *saml_cert
                    expected_sp_issuer: integration-sp
                    name_id: postuser@example.com
                    user_name: postuser
          - name: signed HTTP-POST callback establishes a secure session
            input:
                method: POST
                scheme: https
                path: /login/callback
                headers: {Content-Type: application/x-www-form-urlencoded}
                body: 'SAMLResponse={{CAPTURE.saml_response}}&RelayState={{CAPTURE.relay_state}}'
            output: {status: 302, headers: {Location: {equals: /probe}}}
          - name: HTTP-POST session reaches upstream
            input: {method: GET, scheme: https, path: /probe}
            output: {status: 200, body: {equals: saml upstream}}
          - name: authenticated HTTP-POST session emits a signed logout request
            input: {method: GET, scheme: https, path: /logout}
            output:
                status: 302
                headers:
                    Location: {matches: '^https://idp\.example\.test/sso\?.*SAMLRequest=.*'}
                captures:
                    post_logout_request: {header: Location, matches: '^(.*)$'}
            actions:
                - saml_logout:
                    kind: finish
                    redirect_capture: post_logout_request
                    output_capture: post_logout_response
                    destination: https://127.0.0.1/logout/callback
                    idp_uri: https://idp.example.test/sso
                    idp_entity_id: https://idp.example.test/realms/integration
                    idp_certificate: *saml_cert
                    idp_private_key: *saml_key
                    sp_certificate: *saml_cert
                    expected_sp_issuer: integration-sp
          - name: logout callback clears the HTTP-POST session
            input: {method: GET, scheme: https, path: '/{{CAPTURE.post_logout_response}}'}
            output: {status: 302, headers: {Location: {equals: /logged-out}}}
          - name: cleared HTTP-POST session must authenticate again
            input: {method: GET, scheme: https, path: /probe}
            output:
                status: 200
                body: {matches: 'name="SAMLRequest"'}

    - name: saml-auth-post-add-sp1-route
      source:
          file: t/plugin/saml-auth-post.t
          tests: [1]
      config:
          routes:
              - id: saml-auth-post-setup-sp1
                uri: /*
                plugins:
                    saml-auth:
                        sp_issuer: sp
                        idp_uri: https://idp.example.test/sso
                        idp_entity_id: https://idp.example.test/realms/integration
                        idp_cert: *saml_cert
                        login_callback_uri: /login/callback
                        logout_uri: /logout
                        logout_callback_uri: /logout/callback
                        logout_redirect_uri: /logout_ok
                        sp_cert: *saml_cert
                        sp_private_key: *saml_key
                        auth_protocol_binding_method: HTTP-POST
                        secret: integration-secret
      frontend_tls: {sni: localhost}
      steps:
          - name: configured HTTP-POST sp1 starts with its own issuer
            input: {method: GET, scheme: https, path: /uri}
            output:
                status: 200
                body_captures:
                    post_setup_request: {matches: 'name="SAMLRequest" value="([^"]+)"'}
                    post_setup_relay: {matches: 'name="RelayState" value="([^"]+)"'}
            actions:
                - saml_response:
                    idp_uri: https://idp.example.test/sso
                    idp_entity_id: https://idp.example.test/realms/integration
                    saml_request_capture: post_setup_request
                    relay_state_input_capture: post_setup_relay
                    response_capture: post_setup_response
                    relay_state_capture: post_setup_state
                    idp_certificate: *saml_cert
                    idp_private_key: *saml_key
                    sp_certificate: *saml_cert
                    expected_sp_issuer: sp
                    name_id: setup@example.com

    - name: saml-auth-post-two-sp-single-logout
      source:
          file: t/plugin/saml-auth-post.t
          tests: [4]
      config:
          routes:
              - id: saml-auth-post-sp1
                uri: /*
                hosts: [sp1.local]
                plugins:
                    saml-auth:
                        sp_issuer: sp
                        idp_uri: https://idp.example.test/sso
                        idp_entity_id: https://idp.example.test/realms/integration
                        idp_cert: *saml_cert
                        login_callback_uri: /login/callback
                        logout_uri: /logout
                        logout_callback_uri: /logout/callback
                        logout_redirect_uri: /logout_ok
                        sp_cert: *saml_cert
                        sp_private_key: *saml_key
                        auth_protocol_binding_method: HTTP-POST
                        secret: integration-secret
                upstream:
                    type: roundrobin
                    nodes:
                        '{{FIXTURE.primary.ADDR}}': 1
              - id: saml-auth-post-sp2
                uri: /*
                hosts: [sp2.local]
                plugins:
                    saml-auth:
                        sp_issuer: sp2
                        idp_uri: https://idp.example.test/sso
                        idp_entity_id: https://idp.example.test/realms/integration
                        idp_cert: *saml_cert
                        login_callback_uri: /login/callback
                        logout_uri: /logout
                        logout_callback_uri: /logout/callback
                        logout_redirect_uri: /logout_ok
                        sp_cert: *saml_cert
                        sp_private_key: *saml_key
                        auth_protocol_binding_method: HTTP-POST
                        secret: integration-secret
                upstream:
                    type: roundrobin
                    nodes:
                        '{{FIXTURE.primary.ADDR}}': 1
      fixtures:
          - name: primary
            kind: http
            expect:
                - &post_sp_expect
                  method: GET
                  path: {equals: /uri}
                  headers:
                      X-Userinfo: {equals: eyJuYW1lX2lkIjoic3B1c2VyQGV4YW1wbGUuY29tIiwiYXR0cmlidXRlcyI6eyJ1aWQiOlsic3B1c2VyIl19fQ==}
                - method: GET
                  path: {equals: /uri}
                  headers:
                      X-Userinfo: {equals: eyJuYW1lX2lkIjoic3B1c2VyQGV4YW1wbGUuY29tIiwiYXR0cmlidXRlcyI6eyJ1aWQiOlsic3B1c2VyIl19fQ==}
                - *post_sp_expect
                - method: GET
                  path: {equals: /uri}
                  headers:
                      X-Userinfo: {equals: eyJuYW1lX2lkIjoic3B1c2VyQGV4YW1wbGUuY29tIiwiYXR0cmlidXRlcyI6eyJ1aWQiOlsic3B1c2VyIl19fQ==}
            respond:
                - &post_sp_response
                  status: 200
                  headers: {}
                  body: post multi-sp upstream
                - *post_sp_response
                - *post_sp_response
                - *post_sp_response
      frontend_tls: {sni: localhost}
      steps:
          - name: POST sp1 starts authentication
            input: {method: GET, scheme: https, path: /uri, headers: {Host: sp1.local}}
            output:
                status: 200
                body_captures:
                    post_sp1_request: {matches: 'name="SAMLRequest" value="([^"]+)"'}
                    post_sp1_relay: {matches: 'name="RelayState" value="([^"]+)"'}
            actions:
                - saml_response:
                    idp_uri: https://idp.example.test/sso
                    idp_entity_id: https://idp.example.test/realms/integration
                    saml_request_capture: post_sp1_request
                    relay_state_input_capture: post_sp1_relay
                    response_capture: post_sp1_response
                    relay_state_capture: post_sp1_state
                    idp_certificate: *saml_cert
                    idp_private_key: *saml_key
                    sp_certificate: *saml_cert
                    expected_sp_issuer: sp
                    name_id: spuser@example.com
                    user_name: spuser
          - name: POST sp1 accepts its own callback
            input:
                method: POST
                scheme: https
                path: /login/callback
                headers: {Host: sp1.local, Content-Type: application/x-www-form-urlencoded}
                body: 'SAMLResponse={{CAPTURE.post_sp1_response}}&RelayState={{CAPTURE.post_sp1_state}}'
            output: {status: 302, headers: {Location: {equals: /uri}}}
          - name: POST sp1 session reaches upstream
            input: {method: GET, scheme: https, path: /uri, headers: {Host: sp1.local}}
            output: {status: 200, body: {equals: post multi-sp upstream}}
          - name: POST sp2 starts an independent authentication
            input: {method: GET, scheme: https, path: /uri, headers: {Host: sp2.local}}
            output:
                status: 200
                body_captures:
                    post_sp2_request: {matches: 'name="SAMLRequest" value="([^"]+)"'}
                    post_sp2_relay: {matches: 'name="RelayState" value="([^"]+)"'}
            actions:
                - saml_response:
                    idp_uri: https://idp.example.test/sso
                    idp_entity_id: https://idp.example.test/realms/integration
                    saml_request_capture: post_sp2_request
                    relay_state_input_capture: post_sp2_relay
                    response_capture: post_sp2_response
                    relay_state_capture: post_sp2_state
                    idp_certificate: *saml_cert
                    idp_private_key: *saml_key
                    sp_certificate: *saml_cert
                    expected_sp_issuer: sp2
                    name_id: spuser@example.com
                    user_name: spuser
          - name: POST sp2 accepts its own callback
            input:
                method: POST
                scheme: https
                path: /login/callback
                headers: {Host: sp2.local, Content-Type: application/x-www-form-urlencoded}
                body: 'SAMLResponse={{CAPTURE.post_sp2_response}}&RelayState={{CAPTURE.post_sp2_state}}'
            output: {status: 302, headers: {Location: {equals: /uri}}}
          - name: POST sp2 session reaches upstream
            input: {method: GET, scheme: https, path: /uri, headers: {Host: sp2.local}}
            output: {status: 200, body: {equals: post multi-sp upstream}}
          - name: POST sp2 login does not replace the sp1 session
            input: {method: GET, scheme: https, path: /uri, headers: {Host: sp1.local}}
            output: {status: 200, body: {equals: post multi-sp upstream}}
          - name: POST sp1 initiates single logout
            input: {method: GET, scheme: https, path: /logout, headers: {Host: sp1.local}}
            output:
                status: 302
                headers:
                    Location: {matches: '^https://idp\.example\.test/sso\?.*SAMLRequest=.*'}
                captures:
                    post_sp1_logout_request: {header: Location, matches: '^(.*)$'}
            actions:
                - saml_logout:
                    kind: request
                    input_binding: redirect
                    redirect_capture: post_sp1_logout_request
                    output_capture: post_idp_to_sp2_request
                    output_binding: post
                    relay_state_capture: post_idp_to_sp2_relay
                    input_request_id_capture: post_sp1_logout_request_id
                    output_request_id_capture: post_idp_to_sp2_request_id
                    destination: https://sp2.local/logout/callback
                    idp_uri: https://idp.example.test/sso
                    idp_entity_id: https://idp.example.test/realms/integration
                    idp_certificate: *saml_cert
                    idp_private_key: *saml_key
                    sp_certificate: *saml_cert
                    expected_sp_issuer: sp
                    name_id: spuser@example.com
          - name: POST IdP sends a signed logout request to sp2
            input:
                method: POST
                scheme: https
                path: /logout/callback
                headers:
                    Host: sp2.local
                    Content-Type: application/x-www-form-urlencoded
                body: 'SAMLRequest={{CAPTURE.post_idp_to_sp2_request}}&RelayState={{CAPTURE.post_idp_to_sp2_relay}}'
            output:
                status: 200
                body: {matches: 'name="SAMLResponse"'}
                body_captures:
                    post_sp2_logout_response: {matches: 'name="SAMLResponse" value="([^"]+)"'}
                    post_sp2_logout_relay: {matches: 'name="RelayState" value="([^"]+)"'}
            actions:
                - saml_logout:
                    kind: response
                    input_binding: post
                    saml_message_capture: post_sp2_logout_response
                    relay_state_input_capture: post_sp2_logout_relay
                    output_capture: post_idp_to_sp1_response
                    output_binding: post
                    relay_state_capture: post_idp_to_sp1_relay
                    expected_request_id_capture: post_idp_to_sp2_request_id
                    response_to_request_id_capture: post_sp1_logout_request_id
                    destination: https://sp1.local/logout/callback
                    idp_uri: https://idp.example.test/sso
                    idp_entity_id: https://idp.example.test/realms/integration
                    idp_certificate: *saml_cert
                    idp_private_key: *saml_key
                    sp_certificate: *saml_cert
                    expected_sp_issuer: sp2
          - name: POST IdP sends the correlated logout response to sp1
            input:
                method: POST
                scheme: https
                path: /logout/callback
                headers:
                    Host: sp1.local
                    Content-Type: application/x-www-form-urlencoded
                body: 'SAMLResponse={{CAPTURE.post_idp_to_sp1_response}}&RelayState={{CAPTURE.post_idp_to_sp1_relay}}'
            output: {status: 302, headers: {Location: {equals: /logout_ok}}}
          - name: POST sp1 is unauthenticated after single logout
            input: {method: GET, scheme: https, path: /uri, headers: {Host: sp1.local}}
            output:
                status: 200
                body: {matches: 'name="SAMLRequest"'}
          - name: POST sp2 is unauthenticated after single logout
            input: {method: GET, scheme: https, path: /uri, headers: {Host: sp2.local}}
            output:
                status: 200
                body: {matches: 'name="SAMLRequest"'}
          - name: POST sp2 performs a normal login after single logout
            input: {method: GET, scheme: https, path: /uri, headers: {Host: sp2.local}}
            output:
                status: 200
                body_captures:
                    post_sp2_relogin_request: {matches: 'name="SAMLRequest" value="([^"]+)"'}
                    post_sp2_relogin_relay: {matches: 'name="RelayState" value="([^"]+)"'}
            actions:
                - saml_response:
                    idp_uri: https://idp.example.test/sso
                    idp_entity_id: https://idp.example.test/realms/integration
                    saml_request_capture: post_sp2_relogin_request
                    relay_state_input_capture: post_sp2_relogin_relay
                    response_capture: post_sp2_relogin_response
                    relay_state_capture: post_sp2_relogin_state
                    idp_certificate: *saml_cert
                    idp_private_key: *saml_key
                    sp_certificate: *saml_cert
                    expected_sp_issuer: sp2
                    name_id: spuser@example.com
                    user_name: spuser
          - name: POST sp2 normal re-login callback succeeds
            input:
                method: POST
                scheme: https
                path: /login/callback
                headers: {Host: sp2.local, Content-Type: application/x-www-form-urlencoded}
                body: 'SAMLResponse={{CAPTURE.post_sp2_relogin_response}}&RelayState={{CAPTURE.post_sp2_relogin_state}}'
            output: {status: 302, headers: {Location: {equals: /uri}}}
          - name: POST sp2 re-login reaches upstream
            input: {method: GET, scheme: https, path: /uri, headers: {Host: sp2.local}}
            output: {status: 200, body: {equals: post multi-sp upstream}}
          - name: POST sp2 can log out independently
            input: {method: GET, scheme: https, path: /logout, headers: {Host: sp2.local}}
            output:
                status: 302
                headers:
                    Location: {matches: '^https://idp\.example\.test/sso\?.*SAMLRequest=.*'}
                captures:
                    post_sp2_independent_logout_request: {header: Location, matches: '^(.*)$'}
            actions:
                - saml_logout:
                    kind: finish
                    redirect_capture: post_sp2_independent_logout_request
                    output_capture: post_sp2_independent_logout_response
                    destination: https://sp2.local/logout/callback
                    idp_uri: https://idp.example.test/sso
                    idp_entity_id: https://idp.example.test/realms/integration
                    idp_certificate: *saml_cert
                    idp_private_key: *saml_key
                    sp_certificate: *saml_cert
                    expected_sp_issuer: sp2
          - name: POST sp2 logout callback completes
            input:
                method: GET
                scheme: https
                path: '/{{CAPTURE.post_sp2_independent_logout_response}}'
                headers: {Host: sp2.local}
            output: {status: 302, headers: {Location: {equals: /logout_ok}}}
          - name: POST sp2 session is absent after independent logout
            input: {method: GET, scheme: https, path: /uri, headers: {Host: sp2.local}}
            output:
                status: 200
                body: {matches: 'name="SAMLRequest"'}

