                    idp_entity_id: https://idp.example.test/realms/integration
                    sp_certificate: *saml_cert
                    expected_sp_issuer: sp
                    name_id: setup@example.com
          - name: configured Redirect sp2 uses its distinct issuer
            input: {method: GET, path: /uri, headers: {Host: sp2.local}}
            output:
                status: 302
                captures:
                    redirect_setup_host_sp2: {header: Location, matches: '^(.*)$'}
            actions:
                - saml_response:
                    redirect_capture: redirect_setup_host_sp2
                    response_capture: redirect_setup_host_sp2_response
                    relay_state_capture: redirect_setup_host_sp2_state
                    idp_certificate: *saml_cert
                    idp_private_key: *saml_key
                    idp_entity_id: https://idp.example.test/realms/integration
                    sp_certificate: *saml_cert
                    expected_sp_issuer: sp2
                    name_id: setup@example.com

    - name: saml-auth-schema-rejects-missing-sp-issuer
