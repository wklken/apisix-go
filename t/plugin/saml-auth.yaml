                status: 302
                headers: {Location: {equals: /probe}}
          - name: session reaches upstream with authenticated user info
            input: {method: GET, path: /probe}
            output:
                status: 200
                body: {equals: saml upstream}

    - name: saml-auth-rejects-invalid-state-correlation-and-signature
      source:
          file: t/plugin/saml-auth.t
          tests: [9]
      config:
          routes:
              - id: saml-auth-logout-and-callback
                uri: /*
                plugins:
                    saml-auth:
                        sp_issuer: integration-sp
                        idp_uri: https://idp.example.test/sso
                        idp_entity_id: https://idp.example.test/realms/integration
                        idp_cert: *saml_cert
                        login_callback_uri: /login/callback
                        logout_uri: /logout
                        logout_callback_uri: /logout/callback
                        logout_redirect_uri: /logged-out
                        sp_cert: *saml_cert
                        sp_private_key: *saml_key
                        secret: integration-secret
                upstream:
                    type: roundrobin
                    nodes:
                        '{{FIXTURE.primary.ADDR}}': 1
      fixtures:
          - name: primary
            kind: http
            respond:
                - status: 200
                  headers: {}
                  body: must not reach upstream
      steps:
          - name: capture one real authentication request for failure variants
            input: {method: GET, path: /probe}
            output:
                status: 302
                headers:
                    Location: {matches: '^https://idp\.example\.test/sso\?.*SAMLRequest=.*RelayState=.*'}
                captures:
                    failure_redirect: {header: Location, matches: '^(.*)$'}
            actions:
                - saml_response:
                    redirect_capture: failure_redirect
                    response_capture: valid_failure_response
                    relay_state_capture: valid_failure_state
                    idp_certificate: *saml_cert
                    idp_private_key: *saml_key
                    idp_entity_id: https://idp.example.test/realms/integration
                    sp_certificate: *saml_cert
                    expected_sp_issuer: integration-sp
                    name_id: testuser@example.com
                    user_name: testuser
                - saml_response:
                    redirect_capture: failure_redirect
                    response_capture: wrong_correlation_response
                    relay_state_capture: wrong_correlation_state
                    idp_certificate: *saml_cert
                    idp_private_key: *saml_key
                    idp_entity_id: https://idp.example.test/realms/integration
                    sp_certificate: *saml_cert
                    expected_sp_issuer: integration-sp
                    name_id: testuser@example.com
                    user_name: testuser
                    request_id_override: _mismatched-request-id
                - saml_response:
                    redirect_capture: failure_redirect
                    response_capture: invalid_signature_response
                    relay_state_capture: invalid_signature_state
                    idp_certificate: *saml_cert
                    idp_private_key: *saml_key
                    idp_entity_id: https://idp.example.test/realms/integration
                    sp_certificate: *saml_cert
                    expected_sp_issuer: integration-sp
                    name_id: testuser@example.com
                    user_name: testuser
                    tamper_signature: true
          - name: callback with an unknown RelayState is denied before parsing
            input:
                method: POST
                path: /login/callback
                headers: {Content-Type: application/x-www-form-urlencoded}
                body: 'SAMLResponse={{CAPTURE.valid_failure_response}}&RelayState=unknown-state'
            output:
                status: 401
                body: {matches: invalid callback state}
          - name: signed response with the wrong request correlation fails authentication
            input:
                method: POST
                path: /login/callback
                headers: {Content-Type: application/x-www-form-urlencoded}
                body: 'SAMLResponse={{CAPTURE.wrong_correlation_response}}&RelayState={{CAPTURE.wrong_correlation_state}}'
            output:
                status: 500
                body: {matches: saml authentication failed}
                logs: {matches: 'saml authenticate failed: .*'}
          - name: response with a tampered signature fails authentication
            input:
                method: POST
                path: /login/callback
                headers: {Content-Type: application/x-www-form-urlencoded}
                body: 'SAMLResponse={{CAPTURE.invalid_signature_response}}&RelayState={{CAPTURE.invalid_signature_state}}'
            output:
                status: 500
                body: {matches: saml authentication failed}
          - name: malformed response with valid state maps the parser error to 500
            input:
                method: POST
                path: /login/callback
                headers: {Content-Type: application/x-www-form-urlencoded}
                body: 'SAMLResponse=bad&RelayState={{CAPTURE.valid_failure_state}}'
            output:
                status: 500
                body: {matches: saml authentication failed}

    - name: saml-auth-redirect-sp1-login-and-logout
      source:
          file: t/plugin/saml-auth.t
          tests: [11]
      config:
          routes:
              - id: saml-auth-redirect-sp1-login-and-logout
                uri: /*
                plugins:
                    saml-auth:
                        sp_issuer: sp
                        idp_uri: https://idp.example.test/sso
                        idp_entity_id: https://idp.example.test/realms/integration
                        idp_cert: *saml_cert
                        login_callback_uri: /login/callback
                        logout_uri: /logout
                        logout_callback_uri: http://127.0.0.1/logout/callback
                        logout_redirect_uri: /logout_ok
                        sp_cert: *saml_cert
                        sp_private_key: *saml_key
                        secret: integration-secret
                upstream:
                    type: roundrobin
                    nodes:
                        '{{FIXTURE.primary.ADDR}}': 1
      fixtures:
          - name: primary
            kind: http
            expect:
                - method: GET
                  path: {equals: /uri}
                  headers:
                      X-Userinfo: {equals: eyJuYW1lX2lkIjoic3B1c2VyQGV4YW1wbGUuY29tIiwiYXR0cmlidXRlcyI6eyJ1aWQiOlsic3B1c2VyIl19fQ==}
            respond:
                - status: 200
                  headers: {}
                  body: sp1 upstream
      steps:
          - name: sp1 route emits a signed Redirect-binding request
            input: {method: GET, path: /uri}
            output:
                status: 302
                captures:
                    sp1_redirect: {header: Location, matches: '^(.*)$'}
            actions:
                - saml_response:
                    redirect_capture: sp1_redirect
                    response_capture: sp1_response
                    relay_state_capture: sp1_state
                    idp_certificate: *saml_cert
                    idp_private_key: *saml_key
                    idp_entity_id: https://idp.example.test/realms/integration
                    sp_certificate: *saml_cert
                    expected_sp_issuer: sp
                    name_id: spuser@example.com
                    user_name: spuser
          - name: sp1 accepts the signed callback and restores the original path
            input:
                method: POST
                path: /login/callback
                headers: {Content-Type: application/x-www-form-urlencoded}
                body: 'SAMLResponse={{CAPTURE.sp1_response}}&RelayState={{CAPTURE.sp1_state}}'
            output: {status: 302, headers: {Location: {equals: /uri}}}
          - name: sp1 authenticated session reaches upstream
            input: {method: GET, path: /uri}
            output: {status: 200, body: {equals: sp1 upstream}}
          - name: sp1 logout emits a signed IdP request
            input: {method: GET, path: /logout}
            output:
                status: 302
                headers:
                    Location: {matches: '^https://idp\.example\.test/sso\?.*SAMLRequest=.*'}
                captures:
                    redirect_sp1_logout_only_request: {header: Location, matches: '^(.*)$'}
            actions:
                - saml_logout:
                    kind: finish
                    redirect_capture: redirect_sp1_logout_only_request
                    output_capture: redirect_sp1_logout_only_response
                    destination: http://127.0.0.1/logout/callback
                    idp_uri: https://idp.example.test/sso
                    idp_entity_id: https://idp.example.test/realms/integration
                    idp_certificate: *saml_cert
                    idp_private_key: *saml_key
                    sp_certificate: *saml_cert
                    expected_sp_issuer: sp
          - name: sp1 logout callback redirects to the configured completion URI
            input: {method: GET, path: '/{{CAPTURE.redirect_sp1_logout_only_response}}'}
            output: {status: 302, headers: {Location: {equals: /logout_ok}}}
          - name: sp1 session is absent after logout
            input: {method: GET, path: /uri}
            output:
                status: 302
                headers:
                    Location: {matches: '^https://idp\.example\.test/sso\?.*SAMLRequest=.*'}

    - name: saml-auth-redirect-add-sp1-route
      source:
          file: t/plugin/saml-auth.t
          tests: [10]
      config:
          routes:
              - id: saml-auth-redirect-setup-sp1
                uri: /*
                plugins:
                    saml-auth:
                        sp_issuer: sp
                        idp_uri: https://idp.example.test/sso
                        idp_entity_id: https://idp.example.test/realms/integration
                        idp_cert: *saml_cert
                        login_callback_uri: /login/callback
                        logout_uri: /logout
                        logout_callback_uri: /logout/callback
                        logout_redirect_uri: /logout_ok
                        sp_cert: *saml_cert
                        sp_private_key: *saml_key
                        secret: integration-secret
      steps:
          - name: configured Redirect sp1 starts with its own issuer
            input: {method: GET, path: /uri}
            output:
                status: 302
                captures:
                    redirect_setup_sp1: {header: Location, matches: '^(.*)$'}
            actions:
                - saml_response:
                    redirect_capture: redirect_setup_sp1
                    response_capture: redirect_setup_sp1_response
                    relay_state_capture: redirect_setup_sp1_state
                    idp_certificate: *saml_cert
                    idp_private_key: *saml_key
                    idp_entity_id: https://idp.example.test/realms/integration
                    sp_certificate: *saml_cert
                    expected_sp_issuer: sp
                    name_id: setup@example.com

    - name: saml-auth-redirect-login-fails-for-wrong-callback
      source:
          file: t/plugin/saml-auth.t
          tests: [15]
      config:
          routes:
              - id: saml-auth-redirect-wrong-callback-uri
                uri: /*
                plugins:
                    saml-auth:
                        sp_issuer: sp
                        idp_uri: https://idp.example.test/sso
                        idp_entity_id: https://idp.example.test/realms/integration
                        idp_cert: *saml_cert
                        login_callback_uri: /wrong_url
                        logout_uri: /logout
                        logout_callback_uri: /logout/callback
                        logout_redirect_uri: /logout_ok
                        sp_cert: *saml_cert
                        sp_private_key: *saml_key
                        secret: integration-secret
                upstream:
                    type: roundrobin
                    nodes:
                        '{{FIXTURE.primary.ADDR}}': 1
      fixtures:
          - name: primary
            kind: http
            expect_requests: 0
            respond:
                - status: 500
                  body: unexpected upstream call
      steps:
          - name: wrong-callback route advertises its configured ACS
            input: {method: GET, path: /uri}
            output:
                status: 302
                captures:
                    wrong_redirect: {header: Location, matches: '^(.*)$'}
            actions:
                - saml_response:
                    redirect_capture: wrong_redirect
                    response_capture: wrong_response
                    relay_state_capture: wrong_state
                    idp_certificate: *saml_cert
                    idp_private_key: *saml_key
                    idp_entity_id: https://idp.example.test/realms/integration
                    sp_certificate: *saml_cert
                    expected_sp_issuer: sp
                    name_id: spuser@example.com
                    user_name: spuser
          - name: default callback cannot consume the response for the wrong configured ACS
            input:
                method: POST
                path: /login/callback
                headers: {Content-Type: application/x-www-form-urlencoded}
                body: 'SAMLResponse={{CAPTURE.wrong_response}}&RelayState={{CAPTURE.wrong_state}}'
            output:
                status: 302
                headers:
                    Location: {matches: '^https://idp\.example\.test/sso\?.*SAMLRequest=.*'}
          - name: failed callback establishes no session and never reaches upstream
            input: {method: GET, path: /uri}
            output:
                status: 302
                headers:
                    Location: {matches: '^https://idp\.example\.test/sso\?.*SAMLRequest=.*'}

    - name: saml-auth-redirect-add-wrong-callback-route
      source:
