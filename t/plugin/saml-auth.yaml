    - name: saml-auth-post-login-and-logout
      source:
        file: t/plugin/saml-auth-post.t
        tests: [2]
      config:
        routes:
            - id: saml-auth-post-schema-and-login
              uri: /*
              plugins:
                  saml-auth:
                      sp_issuer: integration-sp
                      idp_uri: https://idp.example.test/sso
                      idp_entity_id: https://idp.example.test/realms/integration
                      idp_cert: &saml_cert |
                          -----BEGIN CERTIFICATE-----
                          MIICIDCCAYmgAwIBAgIUYCXLeJPz69bdMDcfhEklovNXoHQwDQYJKoZIhvcNAQEL
