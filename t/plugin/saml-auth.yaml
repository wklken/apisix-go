                          MDM1MzU4WhcNMzYwNzEyMDM1MzU4WjAiMSAwHgYDVQQDDBdpbnRlZ3JhdGlvbi5l
                          eGFtcGxlLmNvbTCBnzANBgkqhkiG9w0BAQEFAAOBjQAwgYkCgYEAp6XDmwyYoSKr
                          y19mRcVywDB9gBK202bWQMNEF/YuUzoX4Cqi+AJu2AMIbYJHp3plJzZUjYrAapWb
                          PTjFMPkbzKc+nSdqe28bzAEhs80UnFXGpMB009w8c3uJ1DZjzCJ+Pp4OWOk/IgOF
                          3eRuUAG9ztmo/0T0K/89bJ9U9bkixlMCAwEAAaNTMFEwHQYDVR0OBBYEFGdllZXf
                          2uPPyvGM4lfumvybA6NSMB8GA1UdIwQYMBaAFGdllZXf2uPPyvGM4lfumvybA6NS
                          MA8GA1UdEwEB/wQFMAMBAf8wDQYJKoZIhvcNAQELBQADgYEAcxEi38GG2eqfl2Ps
                          2D+k56X08tgMdXLFKNI9AI+SIPogsDFjVRbNKEA5a2iWEI78Q5qz1brqQ3KWKjHE
                          gWuujK4lQkYhGY2342j6jiqVjv8YVBMImBKoo0sGJj5ACY4a0jho8t47PBIwzc7U
                          D+khHyKxVHAgTMNrLOgK7+FyEGQ=
                          -----END CERTIFICATE-----
                      login_callback_uri: /login/callback
                      logout_uri: /logout
                      logout_callback_uri: /logout/callback
                      logout_redirect_uri: /logged-out
                      sp_cert: *saml_cert
                      sp_private_key: &saml_key |
                          -----BEGIN PRIVATE KEY-----
                          MIICdQIBADANBgkqhkiG9w0BAQEFAASCAl8wggJbAgEAAoGBAKelw5sMmKEiq8tf
                          ZkXFcsAwfYASttNm1kDDRBf2LlM6F+AqovgCbtgDCG2CR6d6ZSc2VI2KwGqVmz04
                          xTD5G8ynPp0nantvG8wBIbPNFJxVxqTAdNPcPHN7idQ2Y8wifj6eDljpPyIDhd3k
                          blABvc7ZqP9E9Cv/PWyfVPW5IsZTAgMBAAECgYAu2SnCSFDWpqOvX2drE/QvNN29
                          Tn18sf4pdueucoMbit5lLEUCXVuwTZirUX7IlHFz9cDHFQEUR95ry1N/jf1wTXF0
                          q9dMK1sOxeIxD5u87IT/YUFOGR37PpfzBqr4lXBqSFHOr3pnMyboyYzl/hsR5QkC
                          ytxBICCR17uQAU1z0QJBANSScivNYrzQA+jLrnUUMerY3VJUy7OelC7aOvM+w0Wg
                          g2y7wLWcG0vQpJEeLh6xXPxu/98Q57gDkUjEu4G8c30CQQDJ5cHY63WIHr3SX+6s
                          cqO5tklJKB7TYBxZXJKLRewW6xkzcjMXlLsZzn9oFtr5e6ggcyvvViQmjH9UBxNC
                          s6oPAkApUp6nLTH4imd4JcAwOlDJ2oaLrrg6nqUnxnyXNKg5LM7foFAB/erAfjq/
                          iyJkDQ6Kc/mBn4OsHeVsQ/I/cibxAkBfHMf3guU5nRHbu6nav5717DQWLLpo5cw1
                          JPE8f1I7ccHLhK8hGsYR4EARL0M1aNXJg7hc5f3d0y5gzXx7XdxtAkATXODoxB8h
                          KbxxbtNMlYkGCrYKfZgiZWstfYYAOliciGSqmHE2eqED/424yuTO9m4PIyKXKWwS
                          JKuSmg0k5oxG
                          -----END PRIVATE KEY-----
                      auth_protocol_binding_method: HTTP-POST
                      secret: integration-secret
              upstream:
                  type: roundrobin
                  nodes:
                      '{{FIXTURE.primary.ADDR}}': 1
      fixtures:
          - name: primary
            kind: http
            respond:
                - status: 200
                  headers: {}
                  body: saml upstream
      frontend_tls: {sni: localhost}
      steps:
          - name: HTTP-POST binding emits an auto-submit SAML form
            input:
                method: GET
                scheme: https
                path: /probe
            output:
                status: 200
                headers:
                    Content-Type:
                        matches: text/html; charset=utf-8
                body:
                    matches: 'SAMLRequest'
                body_captures:
                    saml_request: {matches: 'name="SAMLRequest" value="([^"]+)"'}
                    input_relay_state: {matches: 'name="RelayState" value="([^"]+)"'}
            actions:
                - saml_response:
                    idp_uri: https://idp.example.test/sso
                    saml_request_capture: saml_request
                    relay_state_input_capture: input_relay_state
                    response_capture: saml_response
                    relay_state_capture: relay_state
                    idp_certificate: *saml_cert
                    idp_private_key: *saml_key
                    name_id: postuser@example.com
                    user_name: postuser
          - name: signed HTTP-POST callback establishes a secure session
            input:
                method: POST
                scheme: https
                path: /login/callback
                headers: {Content-Type: application/x-www-form-urlencoded}
                body: 'SAMLResponse={{CAPTURE.saml_response}}&RelayState={{CAPTURE.relay_state}}'
            output: {status: 302, headers: {Location: {equals: /probe}}}
          - name: HTTP-POST session reaches upstream
            input: {method: GET, scheme: https, path: /probe}
            output: {status: 200, body: {equals: saml upstream}}

    - name: saml-auth-post-invalid-callback
      source:
          file: t/plugin/saml-auth-post.t
          tests: [3, 4, 5, 6]
      config:
          routes:
              - id: saml-auth-post-invalid-callback
                uri: /*
                plugins:
                    saml-auth:
                        sp_issuer: integration-sp
                        idp_uri: https://idp.example.test/sso
                        idp_cert: *saml_cert
                        login_callback_uri: /login/callback
                        logout_uri: /logout
                        logout_callback_uri: /logout/callback
                        logout_redirect_uri: /logged-out
                        sp_cert: *saml_cert
                        sp_private_key: *saml_key
                        auth_protocol_binding_method: HTTP-POST
                        secret: integration-secret
                upstream:
                    type: roundrobin
                    nodes:
                        '{{FIXTURE.primary.ADDR}}': 1
      fixtures:
          - name: primary
            kind: http
            respond:
                - status: 200
                  headers: {}
                  body: saml upstream
      steps:
          - name: invalid callback state is rejected
            input:
                method: POST
                path: /login/callback
                headers:
                    Content-Type: application/x-www-form-urlencoded
                body: SAMLResponse=bad
            output:
                status: 401
                body:
                    matches: invalid callback state

    - name: saml-auth-redirect-login
      source:
          file: t/plugin/saml-auth.t
          tests: [1, 7, 8, 11]
      config:
          routes:
              - id: saml-auth-redirect-login
                uri: /*
                plugins:
                    saml-auth:
                        sp_issuer: integration-sp
                        idp_uri: https://idp.example.test/sso
                        idp_cert: *saml_cert
                        login_callback_uri: /login/callback
                        logout_uri: /logout
                        logout_callback_uri: /logout/callback
                        logout_redirect_uri: /logged-out
                        sp_cert: *saml_cert
                        sp_private_key: *saml_key
                        secret: integration-secret
                upstream:
                    type: roundrobin
                    nodes:
                        '{{FIXTURE.primary.ADDR}}': 1
      fixtures:
          - name: primary
            kind: http
            expect:
                - method: GET
                  path: {equals: /probe}
                  headers:
                      X-Userinfo: {equals: eyJuYW1lX2lkIjoidGVzdHVzZXJAZXhhbXBsZS5jb20iLCJhdHRyaWJ1dGVzIjp7InVpZCI6WyJ0ZXN0dXNlciJdfX0=}
            respond:
                - status: 200
                  headers: {}
                  body: saml upstream
      steps:
          - name: redirect binding starts IdP login
            input:
                method: GET
                path: /probe
            output:
                status: 302
                headers:
                    Location:
                        matches: '^https://idp\.example\.test/sso\?.*SAMLRequest=.*RelayState=.*'
                body:
                    matches: 'Found'
                captures:
                    redirect: {header: Location, matches: '^(.*)$'}
            actions:
                - saml_response:
                    redirect_capture: redirect
                    response_capture: saml_response
                    relay_state_capture: relay_state
                    idp_certificate: *saml_cert
                    idp_private_key: *saml_key
                    name_id: testuser@example.com
                    user_name: testuser
          - name: signed callback creates a session and returns original URI
            input:
                method: POST
                path: /login/callback
                headers: {Content-Type: application/x-www-form-urlencoded}
                body: 'SAMLResponse={{CAPTURE.saml_response}}&RelayState={{CAPTURE.relay_state}}'
            output:
                status: 302
                headers: {Location: {equals: /probe}}
          - name: session reaches upstream with authenticated user info
            input: {method: GET, path: /probe}
            output:
                status: 200
                body: {equals: saml upstream}

    - name: saml-auth-logout-and-callback
      source:
          file: t/plugin/saml-auth.t
          tests: [9, 10, 12, 13, 14, 15]
      config:
          routes:
              - id: saml-auth-logout-and-callback
                uri: /*
                plugins:
                    saml-auth:
                        sp_issuer: integration-sp
                        idp_uri: https://idp.example.test/sso
                        idp_cert: *saml_cert
                        login_callback_uri: /login/callback
                        logout_uri: /logout
                        logout_callback_uri: /logout/callback
                        logout_redirect_uri: /logged-out
                        sp_cert: *saml_cert
                        sp_private_key: *saml_key
                        secret: integration-secret
                upstream:
                    type: roundrobin
                    nodes:
                        '{{FIXTURE.primary.ADDR}}': 1
      fixtures:
          - name: primary
            kind: http
            respond:
                - status: 200
                  headers: {}
                  body: saml upstream
      steps:
          - name: logout without session redirects to configured target
            input:
                method: GET
                path: /logout
            output:
                status: 302
                headers:
                    Location:
                        equals: /logged-out
          - name: callback without signed state is rejected
            input:
                method: POST
                path: /login/callback
                headers:
                    Content-Type: application/x-www-form-urlencoded
                body: SAMLResponse=bad
            output:
                status: 401
                body:
                    matches: invalid callback state

    - name: saml-auth-schema-rejects-invalid-route-config
      source:
          file: t/plugin/saml-auth.t
          tests: [2, 3, 4, 5, 6]
      variants:
          - name: missing-sp-issuer
            config:
                routes:
                    - id: saml-auth-missing-sp-issuer
                      uri: /probe
                      plugins:
                          saml-auth:
                              idp_uri: https://idp.example.test/sso
                              idp_cert: *saml_cert
                              login_callback_uri: /login/callback
                              logout_uri: /logout
                              logout_callback_uri: /logout/callback
                              logout_redirect_uri: /logged-out
                              sp_cert: *saml_cert
                              sp_private_key: *saml_key
                              secret: integration-secret
            input: {path: /probe}
            output:
                status: 404
                logs: {matches: 'saml-auth-missing-sp-issuer.*saml-auth.*sp_issuer'}
          - name: missing-idp-uri
            config:
                routes:
                    - id: saml-auth-missing-idp-uri
                      uri: /probe
                      plugins:
                          saml-auth:
                              sp_issuer: integration-sp
                              idp_cert: *saml_cert
                              login_callback_uri: /login/callback
                              logout_uri: /logout
                              logout_callback_uri: /logout/callback
                              logout_redirect_uri: /logged-out
                              sp_cert: *saml_cert
                              sp_private_key: *saml_key
                              secret: integration-secret
            input: {path: /probe}
            output:
                status: 404
                logs: {matches: 'saml-auth-missing-idp-uri.*saml-auth.*idp_uri'}
          - name: invalid-binding
            config:
                routes:
                    - id: saml-auth-invalid-binding
                      uri: /probe
                      plugins:
                          saml-auth:
                              sp_issuer: integration-sp
                              idp_uri: https://idp.example.test/sso
                              idp_cert: *saml_cert
                              login_callback_uri: /login/callback
                              logout_uri: /logout
                              logout_callback_uri: /logout/callback
                              logout_redirect_uri: /logged-out
                              sp_cert: *saml_cert
                              sp_private_key: *saml_key
                              auth_protocol_binding_method: HTTP-INVALID
                              secret: integration-secret
            input: {path: /probe}
            output:
                status: 404
                logs: {matches: 'saml-auth-invalid-binding.*saml-auth.*auth_protocol_binding_method'}
          - name: missing-secret
            config:
                routes:
                    - id: saml-auth-missing-secret
                      uri: /probe
                      plugins:
                          saml-auth:
                              sp_issuer: integration-sp
                              idp_uri: https://idp.example.test/sso
                              idp_cert: *saml_cert
                              login_callback_uri: /login/callback
                              logout_uri: /logout
                              logout_callback_uri: /logout/callback
                              logout_redirect_uri: /logged-out
                              sp_cert: *saml_cert
                              sp_private_key: *saml_key
            input: {path: /probe}
            output:
                status: 404
                logs: {matches: 'saml-auth-missing-secret.*saml-auth.*secret'}
          - name: too-short-secret
            config:
                routes:
                    - id: saml-auth-too-short-secret
                      uri: /probe
                      plugins:
                          saml-auth:
                              sp_issuer: integration-sp
                              idp_uri: https://idp.example.test/sso
                              idp_cert: *saml_cert
                              login_callback_uri: /login/callback
                              logout_uri: /logout
                              logout_callback_uri: /logout/callback
                              logout_redirect_uri: /logged-out
                              sp_cert: *saml_cert
                              sp_private_key: *saml_key
                              secret: short
            input: {path: /probe}
            output:
                status: 404
                logs: {matches: 'saml-auth-too-short-secret.*saml-auth.*secret'}

