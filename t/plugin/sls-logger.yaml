  - name: request-body-is-collected
    config:
      routes:
        - id: sls-request-body
          uri: /hello
          plugins:
            sls-logger:
              host: '{{FIXTURE.sink.HOST}}'
              port: '{{FIXTURE.sink.PORT}}'
              project: integration
              logstore: integration
              access_key_id: integration
              access_key_secret: integration
              include_req_body: true
              batch_max_size: 1
              log_format: {case: request-body}
          upstream:
            type: roundrobin
            nodes: {'{{FIXTURE.primary.ADDR}}': 1}
    fixtures:
      - name: primary
        kind: http
        expect:
          - method: POST
            path: {equals: /hello}
            body: {equals: '{"sample_payload":"hello"}'}
        respond: [{status: 200, body: "hello world\n"}]
      - name: sink
        kind: tls-tcp
        network_expect:
          - payload: {matches: '"case":"request-body".*"body":"\{\\"sample_payload\\":\\"hello\\"\}".*"route_id":"sls-request-body"'}
        network_respond: [{payload: ''}]
    steps:
      - name: request-body-reaches-upstream-and-log
        input: {method: POST, path: /hello, body: '{"sample_payload":"hello"}'}
        output: {status: 200, body: {equals: "hello world\n"}}
        wait: 1s

