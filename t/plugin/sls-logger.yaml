        expect: [{method: GET, path: {equals: /hello}}]
        respond: [{status: 200, body: hello world}]
      - name: sink
        kind: tls-tcp
        network_expect:
          - payload: {matches: '\{"route_id":"sls-route-format-setup","vip":"127\.0\.0\.1"\}\n$'}
        network_respond: [{payload: ''}]
    steps:
      - name: route-format-is-installed
        input: {method: GET, path: /hello}
        output: {status: 200, body: {equals: hello world}}
        wait: 1s

  - name: route-log-format-is-used-on-access
