      - name: sink
        kind: tls-tcp
        network_expect:
          - payload: {matches: '"case":"response-body".*"body":"hello world\\n".*"route_id":"sls-response-body"'}
        network_respond: [{payload: ''}]
    steps:
      - name: response-body-reaches-client-and-log
        input: {method: POST, path: /hello, body: '{"sample_payload":"hello"}'}
        output: {status: 200, body: {equals: "hello world\n"}}
        wait: 1s

  - name: invalid-plugin-metadata-is-rejected
    config:
      plugin_metadata:
        - id: sls-logger
          log_format: bad plugin metadata
      routes:
        - id: sls-invalid-metadata
          uri: /hello
          plugins:
            sls-logger:
              host: 127.0.0.1
              port: 10009
              project: integration
              logstore: integration
              access_key_id: integration
              access_key_secret: integration
              batch_max_size: 1
          upstream:
            type: roundrobin
            nodes: {'{{FIXTURE.primary.ADDR}}': 1}
    fixtures:
      - name: primary
        kind: http
        expect: [{method: GET, path: {equals: /hello}}]
        respond: [{status: 200, body: unexpected}]
    steps:
      - name: invalid-metadata-is-excluded-while-route-remains-live
        input: {method: GET, path: /hello}
        output:
          status: 200
          body: {equals: unexpected}
          logs: {matches: 'validate plugin sls-logger metadata:.*log_format.*expected object'}

  - name: correct-plugin-metadata-is-accepted
    config:
      plugin_metadata:
        - id: sls-logger
          log_format: {host: '$host', client_ip: '$remote_addr'}
      routes:
        - id: sls-correct-metadata
          uri: /metadata
          plugins:
            sls-logger:
              host: '{{FIXTURE.sink.HOST}}'
              port: '{{FIXTURE.sink.PORT}}'
              project: integration
              logstore: integration
              access_key_id: integration
              access_key_secret: integration
              batch_max_size: 1
          upstream:
            type: roundrobin
            nodes: {'{{FIXTURE.primary.ADDR}}': 1}
    fixtures:
      - name: primary
        kind: http
        expect: [{method: GET, path: {equals: /metadata}}]
        respond: [{status: 200, body: done}]
      - name: sink
        kind: tls-tcp
        network_expect:
          - payload: {matches: '\{"client_ip":"127\.0\.0\.1","host":"localhost","route_id":"sls-correct-metadata"\}\n$'}
        network_respond: [{payload: ''}]
    steps:
      - name: valid-metadata-produces-log-without-validation-error
        input: {method: GET, path: /metadata, headers: {Host: localhost}}
        output:
          status: 200
          body: {equals: done}
          logs: {not_matches: 'validate plugin sls-logger metadata|failed to check'}
        wait: 1s
