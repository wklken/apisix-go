cases:
  - name: official-schema-is-accepted-and-delivers
    config:
      routes:
        - id: sls-schema-valid
          uri: /schema-valid
          plugins:
            sls-logger:
              host: '{{FIXTURE.sink.HOST}}'
              port: '{{FIXTURE.sink.PORT}}'
              project: your-project
              logstore: your-logstore
              access_key_id: your_access_key
              access_key_secret: your_access_secret
              ssl_verify: false
              batch_max_size: 1
              log_format: {case: schema-valid}
          upstream:
            type: roundrobin
            nodes: {'{{FIXTURE.primary.ADDR}}': 1}
    fixtures:
      - name: primary
        kind: http
        expect: [{method: GET, path: {equals: /schema-valid}}]
        respond: [{status: 200, body: done}]
      - name: sink
        kind: tls-tcp
        network_expect:
          - payload: {matches: '^\<46\>1 .* \[logservice project="your-project" logstore="your-logstore" access-key-id="your_access_key" access-key-secret="your_access_secret"\] \{"case":"schema-valid","route_id":"sls-schema-valid"\}\n$'}
        network_respond: [{payload: ''}]
    steps:
      - name: accepted-schema-emits-rfc5424
        input: {method: GET, path: /schema-valid}
        output:
          status: 200
          body: {equals: done}
          logs: {not_matches: 'your_access_secret'}
        wait: 1s

  - name: missing-access-key-secret-is-rejected
    wait_for_generation: true
    config:
      routes:
        - id: sls-missing-secret
          uri: /missing-secret
          plugins:
            sls-logger:
              host: 127.0.0.1
              port: 10009
              project: your-project
              logstore: your-logstore
              access_key_id: your_access_key
          upstream:
            type: roundrobin
            nodes: {'{{FIXTURE.primary.ADDR}}': 1}
    fixtures:
      - name: primary
        kind: http
        expect_requests: 0
        respond: [{status: 200, body: unexpected}]
    steps:
      - name: invalid-route-is-not-installed
        input: {method: GET, path: /missing-secret}
        output:
          status: 404
          body: {equals: "404 page not found\n"}
          logs: {matches: "validate plugin sls-logger config:.*missing properties: 'access_key_secret'"}

  - name: string-timeout-is-rejected
    wait_for_generation: true
    config:
      routes:
        - id: sls-string-timeout
          uri: /string-timeout
          plugins:
            sls-logger:
              host: 127.0.0.1
              port: 10009
              project: your-project
              logstore: your-logstore
              access_key_id: your_access_key
              access_key_secret: your_access_secret
              timeout: '10'
          upstream:
            type: roundrobin
            nodes: {'{{FIXTURE.primary.ADDR}}': 1}
    fixtures:
      - name: primary
        kind: http
        expect_requests: 0
        respond: [{status: 200, body: unexpected}]
    steps:
      - name: invalid-route-is-not-installed
        input: {method: GET, path: /string-timeout}
        output:
          status: 404
          body: {equals: "404 page not found\n"}
          logs: {matches: 'validate plugin sls-logger config:.*timeout.*expected integer.*got string'}

  - name: route-plugin-configuration-is-live
    config:
      routes:
        - id: sls-route-setup
          uri: /hello
          plugins:
            sls-logger:
              host: '{{FIXTURE.sink.HOST}}'
              port: '{{FIXTURE.sink.PORT}}'
              project: your_project
              logstore: your_logstore
              access_key_id: your_access_key_id
              access_key_secret: your_access_key_secret
              timeout: 30000
              batch_max_size: 1
              log_format: {case: route-setup}
          upstream:
            type: roundrobin
            nodes: {'{{FIXTURE.primary.ADDR}}': 1}
    fixtures:
      - name: primary
        kind: http
        expect: [{method: GET, path: {equals: /hello}}]
        respond: [{status: 200, body: hello world}]
      - name: sink
        kind: tls-tcp
        network_expect:
          - payload: {matches: '\{"case":"route-setup","route_id":"sls-route-setup"\}\n$'}
        network_respond: [{payload: ''}]
    steps:
      - name: configured-route-proxies-and-logs
        input: {method: GET, path: /hello}
        output: {status: 200, body: {equals: hello world}}
        wait: 1s

  - name: access-request-produces-default-log
    config:
      routes:
        - id: sls-access
          uri: /hello
          plugins:
            sls-logger:
              host: '{{FIXTURE.sink.HOST}}'
              port: '{{FIXTURE.sink.PORT}}'
              project: your_project
              logstore: your_logstore
              access_key_id: your_access_key_id
              access_key_secret: your_access_key_secret
              batch_max_size: 1
          upstream:
            type: roundrobin
            nodes: {'{{FIXTURE.primary.ADDR}}': 1}
    fixtures:
      - name: primary
        kind: http
        expect: [{method: GET, path: {equals: /hello}}]
        respond: [{status: 200, headers: {X-Upstream: sls}, body: hello world}]
      - name: sink
        kind: tls-tcp
        network_expect:
          - payload: {matches: '"client_ip":"127\.0\.0\.1".*"method":"GET".*"uri":"/hello".*"x-upstream":"sls".*"status":200.*"route_id":"sls-access"'}
        network_respond: [{payload: ''}]
    steps:
      - name: access-is-proxied-and-recorded
        input: {method: GET, path: /hello}
        output: {status: 200, body: {equals: hello world}}
        wait: 1s

  - name: batch-combines-rfc5424-frames-in-order
    config:
      routes:
        - id: sls-combine
          uri: /combine/*
          plugins:
            sls-logger:
              host: '{{FIXTURE.sink.HOST}}'
              port: '{{FIXTURE.sink.PORT}}'
              project: integration
              logstore: integration
              access_key_id: integration
              access_key_secret: integration
              batch_max_size: 3
              log_format: {sequence: '$uri'}
          upstream:
            type: roundrobin
            nodes: {'{{FIXTURE.primary.ADDR}}': 1}
    fixtures:
      - name: primary
        kind: http
        expect:
          - {method: GET, path: {equals: /combine/1}}
          - {method: GET, path: {equals: /combine/2}}
          - {method: GET, path: {equals: /combine/3}}
        respond:
          - {status: 200, body: '1'}
          - {status: 200, body: '2'}
          - {status: 200, body: '3'}
      - name: sink
        kind: tls-tcp
        network_expect:
          - payload: {matches: '(?s)^<46>1 .*"sequence":"/combine/1".*\n<46>1 .*"sequence":"/combine/2".*\n<46>1 .*"sequence":"/combine/3".*\n$'}
        network_respond: [{payload: ''}]
    steps:
      - name: buffer-first-frame
        input: {method: GET, path: /combine/1}
        output: {status: 200, body: {equals: '1'}}
      - name: buffer-second-frame
        input: {method: GET, path: /combine/2}
        output: {status: 200, body: {equals: '2'}}
      - name: third-frame-flushes-combined-payload
        input: {method: GET, path: /combine/3}
        output: {status: 200, body: {equals: '3'}}
        wait: 1s

  - name: rfc5424-log-carries-subsecond-timestamp
    config:
      routes:
        - id: sls-millisecond
          uri: /millisecond
          plugins:
            sls-logger:
              host: '{{FIXTURE.sink.HOST}}'
              port: '{{FIXTURE.sink.PORT}}'
              project: integration
              logstore: integration
              access_key_id: integration
              access_key_secret: integration
              batch_max_size: 1
              log_format: {case: millisecond}
          upstream:
            type: roundrobin
            nodes: {'{{FIXTURE.primary.ADDR}}': 1}
    fixtures:
      - name: primary
        kind: http
        expect: [{method: GET, path: {equals: /millisecond}}]
        respond: [{status: 200, body: passed}]
      - name: sink
        kind: tls-tcp
        network_expect:
          - payload: {matches: '^<46>1 [0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3,9}Z .* \{"case":"millisecond","route_id":"sls-millisecond"\}\n$'}
        network_respond: [{payload: ''}]
    steps:
      - name: real-log-has-subsecond-rfc3339-time
        input: {method: GET, path: /millisecond}
        output: {status: 200, body: {equals: passed}}
        wait: 1s

  - name: metadata-log-format-setup-is-effective
    config:
      plugin_metadata:
        - id: sls-logger
          log_format: {host: '$host', client_ip: '$remote_addr'}
      routes:
        - id: sls-metadata-setup
          uri: /hello
          plugins:
            sls-logger:
              host: '{{FIXTURE.sink.HOST}}'
              port: '{{FIXTURE.sink.PORT}}'
              project: integration
              logstore: integration
              access_key_id: integration
              access_key_secret: integration
              batch_max_size: 1
          upstream:
            type: roundrobin
            nodes: {'{{FIXTURE.primary.ADDR}}': 1}
    fixtures:
      - name: primary
        kind: http
        expect: [{method: GET, path: {equals: /hello}}]
        respond: [{status: 200, body: hello world}]
      - name: sink
        kind: tls-tcp
        network_expect:
          - payload: {matches: '\{"client_ip":"127\.0\.0\.1","host":"localhost","route_id":"sls-metadata-setup"\}\n$'}
        network_respond: [{payload: ''}]
    steps:
      - name: metadata-format-is-installed
        input: {method: GET, path: /hello, headers: {Host: localhost}}
        output: {status: 200, body: {equals: hello world}}
        wait: 1s

  - name: metadata-log-format-is-used-on-access
    config:
      plugin_metadata:
        - id: sls-logger
          log_format: {host: '$host', client_ip: '$remote_addr'}
      routes:
        - id: sls-metadata-access
          uri: /hello
          plugins:
            sls-logger:
              host: '{{FIXTURE.sink.HOST}}'
              port: '{{FIXTURE.sink.PORT}}'
              project: integration
              logstore: integration
              access_key_id: integration
              access_key_secret: integration
              batch_max_size: 1
          upstream:
            type: roundrobin
            nodes: {'{{FIXTURE.primary.ADDR}}': 1}
    fixtures:
      - name: primary
        kind: http
        expect: [{method: GET, path: {equals: /hello}}]
        respond: [{status: 200, body: hello world}]
      - name: sink
        kind: tls-tcp
        network_expect:
          - payload: {matches: '\{"client_ip":"127\.0\.0\.1","host":"localhost","route_id":"sls-metadata-access"\}\n$'}
            forbidden_matches: ['"request":', '"response":']
        network_respond: [{payload: ''}]
    steps:
      - name: access-uses-metadata-format
        input: {method: GET, path: /hello, headers: {Host: localhost}}
        output: {status: 200, body: {equals: hello world}}
        wait: 1s

  - name: deleting-route-removes-live-plugin-chain
    config:
      routes:
        - id: sls-route-delete
          uri: /hello
          plugins:
            sls-logger:
              host: '{{FIXTURE.sink.HOST}}'
              port: '{{FIXTURE.sink.PORT}}'
              project: integration
              logstore: integration
              access_key_id: integration
              access_key_secret: integration
              batch_max_size: 1
              log_format: {case: before-delete}
          upstream:
            type: roundrobin
            nodes: {'{{FIXTURE.primary.ADDR}}': 1}
    fixtures:
      - name: primary
        kind: http
        expect:
          - {method: GET, path: {equals: /hello}}
          - {method: GET, path: {equals: /replacement}}
        respond:
          - {status: 200, body: before-delete}
          - {status: 200, body: replacement}
      - name: sink
        kind: tls-tcp
        network_expect:
          - payload: {matches: '\{"case":"before-delete","route_id":"sls-route-delete"\}\n$'}
          - payload: {matches: '\{"case":"replacement-route","route_id":"sls-replacement"\}\n$'}
        network_respond:
          - {close: true}
          - {close: true}
    steps:
      - name: route-is-live-before-removal
        input: {method: GET, path: /hello}
        output: {status: 200, body: {equals: before-delete}}
        wait: 1s
      - name: standalone-reload-removes-old-route
        config:
          routes:
            - id: sls-replacement
              uri: /replacement
              plugins:
                sls-logger:
                  host: '{{FIXTURE.sink.HOST}}'
                  port: '{{FIXTURE.sink.PORT}}'
                  project: integration
                  logstore: integration
                  access_key_id: integration
                  access_key_secret: integration
                  batch_max_size: 1
                  log_format: {case: replacement-route}
              upstream:
                type: roundrobin
                nodes: {'{{FIXTURE.primary.ADDR}}': 1}
        config_probe:
          input: {method: GET, path: /replacement}
          output: {status: 200, body: {equals: replacement}}
        config_timeout: 2s
        input: {method: GET, path: /hello}
        output: {status: 404, body: {equals: "404 page not found\n"}}
        wait: 1s

  - name: access-key-secret-is-encrypted-at-rest
    runtime:
      apisix:
        data_encryption:
          enable_encrypt_fields: true
          keyring: [edd1c9f0985e76a2]
    config:
      routes:
        - id: '1'
          uri: /encrypted
          plugins:
            sls-logger:
              host: '{{FIXTURE.sink.HOST}}'
              port: '{{FIXTURE.sink.PORT}}'
              project: your_project
              logstore: your_logstore
              access_key_id: your_access_key_id
              access_key_secret: your_access_key_secret
              ssl_verify: false
              batch_max_size: 1
              log_format: {case: encrypted-secret}
          upstream:
            type: roundrobin
            nodes: {'{{FIXTURE.primary.ADDR}}': 1}
    fixtures:
      - name: primary
        kind: http
        expect: [{method: GET, path: {equals: /encrypted}}]
        respond: [{status: 200, body: encrypted}]
      - name: sink
        kind: tls-tcp
        network_expect:
          - payload: {matches: '\[logservice project="your_project" logstore="your_logstore" access-key-id="your_access_key_id" access-key-secret="your_access_key_secret"\] \{"case":"encrypted-secret","route_id":"1"\}\n$'}
        network_respond: [{payload: ''}]
    steps:
      - name: runtime-materializes-encrypted-secret-only-for-sls-authentication
        input: {method: GET, path: /encrypted}
        output:
          status: 200
          body: {equals: encrypted}
          logs: {not_matches: 'your_access_key_secret'}
        wait: 1s
  - name: route-log-format-configuration-is-effective
    config:
      routes:
        - id: sls-route-format-setup
          uri: /hello
          plugins:
            sls-logger:
              host: '{{FIXTURE.sink.HOST}}'
