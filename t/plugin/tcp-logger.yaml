cases:
  - name: valid-route-emits-source-compatible-tcp-log
    source:
      file: t/plugin/tcp-logger.t
      tests: [1, 4, 5]
    config:
      routes:
        - id: tcp-logger-valid-route
          plugins:
            tcp-logger:
              batch_max_size: 1
              host: '{{FIXTURE.sink.HOST}}'
              port: '{{FIXTURE.sink.PORT}}'
          upstream:
            nodes:
              '{{FIXTURE.primary.ADDR}}': 1
            type: roundrobin
          uri: /hello
    fixtures:
      - kind: http
        name: primary
        respond:
          - body: hello world
            headers:
              X-Upstream: default
            status: 200
      - kind: tcp
        name: sink
        network_expect:
          - json_fields:
              - {path: /request/url, value: {matches: '^http://localhost:[0-9]+/hello\?Upper=One$'}}
              - {path: /request/method, value: {equals: GET}}
              - {path: /request/uri, value: {equals: '/hello?Upper=One'}}
              - {path: /request/headers/host, value: {equals: localhost}}
              - {path: /request/headers/x-log-case, value: {equals: default}}
              - {path: /request/querystring/Upper, value: {equals: One}}
              - {path: /request/size, value: {matches: '^[0-9]+$'}}
              - {path: /response/status, value: {equals: '200'}}
              - {path: /response/headers/x-upstream, value: {equals: default}}
              - {path: /response/size, value: {matches: '^[0-9]+$'}}
              - {path: /server/hostname, value: {matches: '^.+$'}}
              - {path: /server/version, value: {equals: apisix-go}}
              - {path: /service_id, value: {equals: ''}}
              - {path: /route_id, value: {equals: tcp-logger-valid-route}}
              - {path: /client_ip, value: {equals: 127.0.0.1}}
              - {path: /start_time, value: {matches: '^[0-9]+(\.[0-9]+)?$'}}
              - {path: /latency, value: {matches: '^[0-9]+(\.[0-9]+)?$'}}
              - {path: /upstream_latency, value: {matches: '^[0-9]+$'}}
              - {path: /apisix_latency, value: {matches: '^[0-9]+(\.[0-9]+)?$'}}
              - {path: /upstream, value: {matches: '^127\.0\.0\.1:[0-9]+$'}}
        network_respond:
          - payload: ''
    steps:
      - name: request-reaches-upstream-and-plain-tcp-sink
        input:
          headers:
            Host: localhost
            X-Log-Case: default
          method: GET
          path: '/hello?Upper=One'
        output:
          body: {equals: hello world}
          status: 200
        wait: 1s

  - name: missing-host-is-rejected
    source:
      file: t/plugin/tcp-logger.t
      tests: [2]
    config:
      routes:
        - id: tcp-logger-missing-host
          plugins:
            tcp-logger:
              port: 3000
          uri: /missing-host
    input:
      method: GET
      path: /missing-host
    output:
      logs:
        matches: 'validate plugin tcp-logger config:.*host.*required'
      status: 404

  - name: string-timeout-is-rejected
    source:
      file: t/plugin/tcp-logger.t
      tests: [3]
    config:
      routes:
        - id: tcp-logger-string-timeout
          plugins:
            tcp-logger:
              host: 127.0.0.1
              port: 2000
              timeout: '10'
              tls: false
              tls_options: tls options
          uri: /string-timeout
    input:
      method: GET
      path: /string-timeout
    output:
      logs:
        matches: 'validate plugin tcp-logger config:.*timeout.*expected integer.*got string'
      status: 404

  - name: deterministic-connect-failure-retries-and-keeps-response
    source:
      file: t/plugin/tcp-logger.t
      tests: [6]
    config:
      routes:
        - id: tcp-logger-unreachable-sink
          plugins:
            tcp-logger:
              batch_max_size: 1
              host: '{{FIXTURE.sink.HOST}}'
              max_retry_count: 2
              port: '{{FIXTURE.sink.PORT}}'
              retry_delay: 0
              timeout: 100
              tls: true
          upstream:
            nodes:
              '{{FIXTURE.primary.ADDR}}': 1
            type: roundrobin
          uri: /hello
    fixtures:
      - kind: http
        name: primary
        respond:
          - body: hello world
            status: 200
      - kind: tcp
        name: sink
        network_expect:
          - payload_base64: {matches: '^FgM'}
          - payload_base64: {matches: '^FgM'}
          - payload_base64: {matches: '^FgM'}
        network_respond:
          - {close: true}
          - {close: true}
          - {close: true}
    steps:
      - name: proxy-response-survives-three-delivery-attempts
        input:
          method: GET
          path: /hello
        output:
          body: {equals: hello world}
          logs:
            matches: 'logger batch processor \[tcp logger\] exceeded max_retry_count \[2\], dropping 1 entries: failed to connect to TCP server: host\[127\.0\.0\.1\] port\[[0-9]+\]'
          status: 200

  - name: live-update-switches-tcp-destination
    source:
      file: t/plugin/tcp-logger.t
      tests: [7]
    config:
      routes:
        - id: tcp-logger-live-update
          plugins:
            tcp-logger:
              batch_max_size: 1
              host: '{{FIXTURE.first.HOST}}'
              port: '{{FIXTURE.first.PORT}}'
          upstream:
            nodes:
              '{{FIXTURE.primary.ADDR}}': 1
            type: roundrobin
          uri: /opentracing
    fixtures:
      - kind: http
        name: primary
        respond:
          - body: opentracing
            headers:
              X-Upstream: reload
            status: 200
          - body: opentracing
            headers:
              X-Upstream: reload
            status: 200
      - kind: tcp
        name: first
        network_expect:
          - json_fields:
              - {path: /request/method, value: {equals: GET}}
              - {path: /response/status, value: {equals: '200'}}
              - {path: /response/headers/x-upstream, value: {equals: reload}}
              - {path: /route_id, value: {equals: tcp-logger-live-update}}
        network_respond:
          - payload: ''
      - kind: tcp
        name: second
        network_expect:
          - json_fields:
              - {path: /request/method, value: {equals: GET}}
              - {path: /response/status, value: {equals: '200'}}
              - {path: /response/headers/x-upstream, value: {equals: reload}}
              - {path: /route_id, value: {equals: tcp-logger-live-update}}
        network_respond:
          - payload: ''
    steps:
      - name: request-reaches-first-tcp-sink
        input:
          headers:
            Host: localhost
          method: GET
          path: /opentracing
        output:
          body: {equals: opentracing}
          status: 200
        wait: 1s
      - name: reload-routes-and-send-to-second-tcp-sink
        config:
          routes:
            - id: tcp-logger-live-update
              plugins:
                tcp-logger:
                  batch_max_size: 1
                  host: '{{FIXTURE.second.HOST}}'
                  port: '{{FIXTURE.second.PORT}}'
              upstream:
                nodes:
                  '{{FIXTURE.primary.ADDR}}': 1
                type: roundrobin
              uri: /opentracing
            - id: tcp-logger-live-update-probe
              plugins:
                mocking:
                  _meta:
                    priority: -1000
                  response_example: ready
                  response_status: 204
              uri: /reload-probe
        config_probe:
          input:
            path: /reload-probe
          output:
            status: 204
        config_timeout: 2s
        input:
          headers:
            Host: localhost
          method: GET
          path: /opentracing
        output:
          body: {equals: opentracing}
          status: 200
        wait: 1s

  - name: metadata-string-log-format-is-rejected
    source:
      file: t/plugin/tcp-logger.t
      tests: [8]
    config:
      plugin_metadata:
        - id: tcp-logger
          log_format: "'$host' '$time_iso8601'"
      routes:
        - id: tcp-logger-invalid-metadata
          plugins:
            tcp-logger:
              host: 127.0.0.1
              port: 3000
          uri: /invalid-metadata
    input:
      method: GET
      path: /invalid-metadata
    output:
      logs:
        matches: 'validate plugin tcp-logger metadata:.*log_format.*expected object.*got string'
      status: 404

  - name: metadata-add-and-clear-rebuilds-existing-route
    source:
      file: t/plugin/tcp-logger.t
      tests: [9, 10, 11]
    config:
      services:
        - id: tcp-logger-service
          upstream:
            nodes:
              '{{FIXTURE.primary.ADDR}}': 1
            type: roundrobin
      routes:
        - id: tcp-logger-metadata-lifecycle
          plugins:
            tcp-logger:
              batch_max_size: 1
              host: '{{FIXTURE.sink.HOST}}'
              port: '{{FIXTURE.sink.PORT}}'
          service_id: tcp-logger-service
          uri: /hello
    fixtures:
      - kind: http
        name: primary
        respond:
          - body: hello world
            status: 200
          - body: hello world
            status: 200
          - body: hello world
            status: 200
      - kind: tcp
        name: sink
        network_expect:
          - json_fields:
              - {path: /request/method, value: {equals: GET}}
              - {path: /response/status, value: {equals: '200'}}
              - {path: /route_id, value: {equals: tcp-logger-metadata-lifecycle}}
              - {path: /service_id, value: {equals: tcp-logger-service}}
          - json_fields:
              - {path: /case name, value: {equals: plugin_metadata}}
              - {path: /request snapshot/host, value: {equals: localhost}}
              - {path: /request snapshot/client/ip, value: {equals: 127.0.0.1}}
              - {path: /response snapshot/status, value: {equals: '200'}}
              - {path: /@timestamp, rfc3339: true}
              - {path: /route_id, value: {equals: tcp-logger-metadata-lifecycle}}
              - {path: /service_id, value: {equals: tcp-logger-service}}
          - json_fields:
              - {path: /request/method, value: {equals: GET}}
              - {path: /response/status, value: {equals: '200'}}
              - {path: /route_id, value: {equals: tcp-logger-metadata-lifecycle}}
              - {path: /service_id, value: {equals: tcp-logger-service}}
        network_respond:
          - {close: true}
          - {close: true}
          - {close: true}
    steps:
      - name: existing-route-starts-with-default-format
        input:
          headers:
            Host: localhost
          method: GET
          path: /hello
        output:
          body: {equals: hello world}
          status: 200
        wait: 1s
      - name: metadata-adds-nested-format-to-existing-route
        config:
          plugin_metadata:
            - id: tcp-logger
              log_format:
                '@timestamp': '$time_iso8601'
                case name: plugin_metadata
                request snapshot:
                  client:
                    ip: '$remote_addr'
                  host: '$host'
                response snapshot:
                  status: '$status'
          services:
            - id: tcp-logger-service
              upstream:
                nodes:
                  '{{FIXTURE.primary.ADDR}}': 1
                type: roundrobin
          routes:
            - id: tcp-logger-metadata-lifecycle
              plugins:
                tcp-logger:
                  batch_max_size: 1
                  host: '{{FIXTURE.sink.HOST}}'
                  port: '{{FIXTURE.sink.PORT}}'
              service_id: tcp-logger-service
              uri: /hello
            - id: tcp-logger-metadata-probe
              plugins:
                mocking:
                  response_example: ready
                  response_status: 205
              uri: /reload-probe
        config_probe:
          input:
            path: /reload-probe
          output:
            status: 205
        config_timeout: 2s
        input:
          headers:
            Host: localhost
          method: GET
          path: /hello
        output:
          body: {equals: hello world}
          status: 200
        wait: 1s
      - name: metadata-clear-restores-default-on-existing-route
        config:
          plugin_metadata:
            - id: tcp-logger
              log_format: {}
          services:
            - id: tcp-logger-service
              upstream:
                nodes:
                  '{{FIXTURE.primary.ADDR}}': 1
                type: roundrobin
          routes:
            - id: tcp-logger-metadata-lifecycle
              plugins:
                tcp-logger:
                  batch_max_size: 1
                  host: '{{FIXTURE.sink.HOST}}'
                  port: '{{FIXTURE.sink.PORT}}'
              service_id: tcp-logger-service
              uri: /hello
            - id: tcp-logger-metadata-probe
              plugins:
                mocking:
                  response_example: ready
                  response_status: 204
              uri: /reload-probe
        config_probe:
          input:
            path: /reload-probe
          output:
            status: 204
        config_timeout: 2s
        input:
          headers:
            Host: localhost
          method: GET
          path: /hello
        output:
          body: {equals: hello world}
          status: 200
        wait: 1s

  - name: route-log-format-overrides-metadata
    source:
      file: t/plugin/tcp-logger.t
      tests: [12, 13]
    config:
      plugin_metadata:
        - id: tcp-logger
          log_format:
            case name: metadata should lose
      routes:
        - id: tcp-logger-route-format
          plugins:
            tcp-logger:
              batch_max_size: 1
              host: '{{FIXTURE.sink.HOST}}'
              log_format:
                case name: logger format in plugin
                status: '$status'
                vip: '$remote_addr'
              port: '{{FIXTURE.sink.PORT}}'
          upstream:
            nodes:
              '{{FIXTURE.primary.ADDR}}': 1
            type: roundrobin
          uri: /hello
    fixtures:
      - kind: http
        name: primary
        respond:
          - body: hello world
            status: 200
      - kind: tcp
        name: sink
        network_expect:
          - json_fields:
              - {path: /case name, value: {equals: logger format in plugin}}
              - {path: /vip, value: {equals: 127.0.0.1}}
              - {path: /status, value: {equals: '200'}}
              - {path: /route_id, value: {equals: tcp-logger-route-format}}
            forbidden_matches:
              - 'metadata should lose'
              - '"service_id"'
        network_respond:
          - payload: ''
    steps:
      - name: plugin-local-format-wins-after-upstream
        input:
          method: GET
          path: /hello
        output:
          body: {equals: hello world}
          status: 200
        wait: 1s

  - name: true-tls-tcp-delivery
    source:
      file: t/plugin/tcp-logger.t
      tests: [14, 15]
    config:
      routes:
        - id: tcp-logger-tls
          plugins:
            tcp-logger:
              batch_max_size: 1
              host: '{{FIXTURE.sink.HOST}}'
              port: '{{FIXTURE.sink.PORT}}'
              tls: true
          upstream:
            nodes:
              '{{FIXTURE.primary.ADDR}}': 1
            type: roundrobin
          uri: /opentracing
    fixtures:
      - kind: http
        name: primary
        respond:
          - body: opentracing
            headers:
              X-Upstream: tls
            status: 200
      - kind: tls-tcp
        name: sink
        network_expect:
          - json_fields:
              - {path: /request/method, value: {equals: GET}}
              - {path: /request/uri, value: {equals: /opentracing}}
              - {path: /response/status, value: {equals: '200'}}
              - {path: /response/headers/x-upstream, value: {equals: tls}}
              - {path: /route_id, value: {equals: tcp-logger-tls}}
              - {path: /upstream, value: {matches: '^127\.0\.0\.1:[0-9]+$'}}
        network_respond:
          - payload: ''
    steps:
      - name: request-emits-log-over-real-tls
        input:
          method: GET
          path: /opentracing
        output:
          body: {equals: opentracing}
          status: 200
        wait: 1s

  - name: request-body-inclusion-expression-and-truncation
    source:
      file: t/plugin/tcp-logger.t
      tests: [16]
    variants:
      - name: source-request-body-is-logged-and-forwarded-over-tls
        config:
          routes:
            - id: tcp-logger-request-body
              plugins:
                tcp-logger:
                  batch_max_size: 1
                  host: '{{FIXTURE.sink.HOST}}'
                  include_req_body: true
                  port: '{{FIXTURE.sink.PORT}}'
                  tls: true
              upstream:
                nodes:
                  '{{FIXTURE.primary.ADDR}}': 1
                type: roundrobin
              uri: /opentracing
        fixtures:
          - kind: http
            name: primary
            expect:
              - body: {equals: '{"sample_payload":"hello"}'}
                method: POST
                path: {equals: /opentracing}
            respond:
              - body: "opentracing\n"
                headers:
                  X-Upstream: request-body
                status: 200
          - kind: tls-tcp
            name: sink
            network_expect:
              - json_fields:
                  - {path: /request/body, value: {equals: '{"sample_payload":"hello"}'}}
                  - {path: /request/method, value: {equals: POST}}
                  - {path: /response/status, value: {equals: '200'}}
                  - {path: /response/headers/x-upstream, value: {equals: request-body}}
                  - {path: /route_id, value: {equals: tcp-logger-request-body}}
            network_respond:
              - payload: ''
        steps:
          - name: full-request-body-reaches-upstream-and-tls-log
            input:
              body: '{"sample_payload":"hello"}'
              method: POST
              path: /opentracing
            output:
              body: {equals: "opentracing\n"}
              status: 200
            wait: 1s
      - name: matching-request-expression-logs-bounded-prefix
        config:
          routes:
            - id: tcp-logger-request-body-bounded
              plugins:
                tcp-logger:
                  batch_max_size: 1
                  host: '{{FIXTURE.sink.HOST}}'
                  include_req_body: true
                  include_req_body_expr:
                    - [http_x_log_body, '==', 'yes']
                  max_req_body_bytes: 5
                  port: '{{FIXTURE.sink.PORT}}'
                  tls: true
              upstream:
                nodes:
                  '{{FIXTURE.primary.ADDR}}': 1
                type: roundrobin
              uri: /opentracing
        fixtures:
          - kind: http
            name: primary
            expect:
              - body: {equals: '123456789'}
                method: POST
                path: {equals: /opentracing}
            respond:
              - body: request-ok
                status: 200
          - kind: tls-tcp
            name: sink
            network_expect:
              - json_fields:
                  - {path: /request/body, value: {equals: '12345'}}
                  - {path: /request/method, value: {equals: POST}}
                  - {path: /route_id, value: {equals: tcp-logger-request-body-bounded}}
            network_respond:
              - payload: ''
        steps:
          - name: full-body-is-forwarded-while-log-is-truncated
            input:
              body: '123456789'
              headers:
                X-Log-Body: 'yes'
              method: POST
              path: /opentracing
            output:
              body: {equals: request-ok}
              status: 200
            wait: 1s

  - name: response-body-inclusion-expression-and-truncation
    source:
      file: t/plugin/tcp-logger.t
      tests: [17]
    variants:
      - name: source-response-body-is-logged-and-preserved-over-tls
        config:
          routes:
            - id: tcp-logger-response-body
              plugins:
                tcp-logger:
                  batch_max_size: 1
                  host: '{{FIXTURE.sink.HOST}}'
                  include_resp_body: true
                  port: '{{FIXTURE.sink.PORT}}'
                  tls: true
              upstream:
                nodes:
                  '{{FIXTURE.primary.ADDR}}': 1
                type: roundrobin
              uri: /opentracing
        fixtures:
          - kind: http
            name: primary
            expect:
              - body: {equals: '{"sample_payload":"hello"}'}
                method: POST
                path: {equals: /opentracing}
            respond:
              - body: "opentracing\n"
                headers:
                  X-Upstream: response-body
                status: 200
          - kind: tls-tcp
            name: sink
            network_expect:
              - json_fields:
                  - {path: /response/body, value: {equals: "opentracing\n"}}
                  - {path: /response/status, value: {equals: '200'}}
                  - {path: /response/headers/x-upstream, value: {equals: response-body}}
                  - {path: /route_id, value: {equals: tcp-logger-response-body}}
                  - {path: /upstream, value: {matches: '^127\.0\.0\.1:[0-9]+$'}}
            network_respond:
              - payload: ''
        steps:
          - name: response-body-reaches-client-and-tls-log
            input:
              body: '{"sample_payload":"hello"}'
              method: POST
              path: /opentracing
            output:
              body: {equals: "opentracing\n"}
              status: 200
            wait: 1s
      - name: matching-response-expression-logs-bounded-prefix
        config:
          routes:
            - id: tcp-logger-response-body-bounded
              plugins:
                tcp-logger:
                  batch_max_size: 1
                  host: '{{FIXTURE.sink.HOST}}'
                  include_resp_body: true
                  include_resp_body_expr:
                    - [status, '==', '201']
                  max_resp_body_bytes: 5
                  port: '{{FIXTURE.sink.PORT}}'
                  tls: true
              upstream:
                nodes:
                  '{{FIXTURE.primary.ADDR}}': 1
                type: roundrobin
              uri: /opentracing
        fixtures:
          - kind: http
            name: primary
            respond:
              - body: '123456789'
                headers:
                  X-Upstream: bounded-response
                status: 201
          - kind: tls-tcp
            name: sink
            network_expect:
              - json_fields:
                  - {path: /response/body, value: {equals: '12345'}}
                  - {path: /response/status, value: {equals: '201'}}
                  - {path: /response/headers/x-upstream, value: {equals: bounded-response}}
                  - {path: /route_id, value: {equals: tcp-logger-response-body-bounded}}
            network_respond:
              - payload: ''
        steps:
          - name: full-response-reaches-client-while-log-is-truncated
            input:
              method: GET
              path: /opentracing
            output:
              body: {equals: '123456789'}
              status: 201
            wait: 1s

sources:
  - repository: https://github.com/apache/apisix
