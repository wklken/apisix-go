cases:
  - name: reject-unsupported-action
    runtime:
      plugins: [traffic-label, proxy-rewrite]
    config:
      routes:
        - id: traffic-label-invalid-action
          uri: /echo
          plugins:
            traffic-label:
              rules:
                - match: [[uri, "==", /echo]]
                  actions:
                    - add_headers:
                        X-server-id: 100
          upstream:
            type: roundrobin
            nodes:
              127.0.0.1:1980: 1
    input:
      method: GET
      path: /echo
    output:
      status: 404
      logs:
        matches: add_headers

  - name: reject-multiple-operators
    runtime:
      plugins: [traffic-label, proxy-rewrite]
    config:
      routes:
        - id: traffic-label-invalid-operators
          uri: /echo
          plugins:
            traffic-label:
              rules:
                - match: [AND, OR, [uri, "==", /echo], [arg_foo, "==", bar]]
                  actions:
                    - set_headers:
                        X-server-id: 100
          upstream:
            type: roundrobin
            nodes:
              127.0.0.1:1980: 1
    input:
      method: GET
      path: /echo
    output:
      status: 404
      logs:
        matches: mixed logical operators

  - name: override-request-header
    runtime:
      plugins: [traffic-label, proxy-rewrite]
    config:
      routes:
        - id: traffic-label-override
          uri: /echo
          plugins:
            traffic-label:
              rules:
                - match: [[arg_foo, "==", bar]]
                  actions:
                    - set_headers:
                        X-server-id: 100
          upstream:
            type: roundrobin
            nodes:
              "{{FIXTURE.primary.ADDR}}": 1
    fixtures:
      - name: primary
        kind: http
        expect:
          - headers:
              X-server-id:
                equals: "200"
          - headers:
              X-server-id:
                equals: "100"
        respond:
          - status: 200
            headers:
              X-Server-id: "200"
            body: hello world
          - status: 200
            headers:
              X-Server-id: "100"
            body: hello world
    steps:
      - name: mismatch
        input:
          method: GET
          path: /echo
          headers:
            X-server-id: "200"
        output:
          status: 200
          body:
            equals: hello world
          headers:
            X-Server-id:
              equals: "200"
      - name: match
        input:
          method: GET
          path: /echo?foo=bar
          headers:
            X-server-id: "200"
        output:
          status: 200
          body:
            equals: hello world
          headers:
            X-Server-id:
              equals: "100"

  - name: add-request-headers
    runtime:
      plugins: [traffic-label, proxy-rewrite]
    config:
      routes:
        - id: traffic-label-add-headers
          uri: /echo
          plugins:
            traffic-label:
              rules:
                - match: [[uri, "==", /echo]]
                  actions:
                    - set_headers:
                        X-server-id: 100
                        resp-X-content-type: json
          upstream:
            type: roundrobin
            nodes:
              "{{FIXTURE.primary.ADDR}}": 1
    fixtures:
      - name: primary
        kind: http
        expect:
          - headers:
              X-server-id:
                equals: "100"
              resp-X-content-type:
                equals: json
        respond:
          - status: 200
            headers:
              X-Server-id: "100"
              X-content-type: json
            body: hello world
    steps:
      - name: request
        input:
          method: GET
          path: /echo
          headers:
            X-server-id: "200"
        output:
          status: 200
          body:
            equals: hello world
          headers:
            X-Server-id:
              equals: "100"
            X-content-type:
              equals: json

  - name: and-match
    runtime:
      plugins: [traffic-label, proxy-rewrite]
    config:
      routes:
        - id: traffic-label-and
          uri: /echo
          plugins:
            traffic-label:
              rules:
                - match: [[uri, "==", /echo], [arg_foo, "==", bar]]
                  actions:
                    - set_headers:
                        X-server-id: 100
          upstream:
            type: roundrobin
            nodes:
              "{{FIXTURE.primary.ADDR}}": 1
    fixtures:
      - name: primary
        kind: http
        expect:
          - headers:
              X-server-id:
                equals: "200"
