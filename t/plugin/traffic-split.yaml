cases:
  - config:
      routes:
        - id: traffic-split
          plugins:
            traffic-split:
              rules:
                - match:
                    - vars:
                        - - arg_id
                          - ==
                          - "1"
                  weighted_upstreams:
                    - upstream:
                        nodes:
                          - host: '{{FIXTURE.first.ADDR}}'
                            weight: 1
                        type: roundrobin
                      weight: 1
                - match:
                    - vars:
                        - - arg_id
                          - ==
                          - "2"
                  weighted_upstreams:
                    - upstream:
                        nodes:
                          - host: '{{FIXTURE.second.ADDR}}'
                            weight: 1
                        type: roundrobin
                      weight: 1
          upstream:
            nodes:
              '{{FIXTURE.route.ADDR}}': 1
            type: roundrobin
          uri: /split
    fixtures:
      - expect:
          - {path: {equals: '/split?id=1'}}
          - {path: {equals: '/split?id=1'}}
          - {path: {equals: '/split?id=1'}}
        expect_requests: 3
        kind: http
        name: first
        respond:
          - body: first
            status: 200
      - expect:
          - {path: {equals: '/split?id=2'}}
          - {path: {equals: '/split?id=2'}}
          - {path: {equals: '/split?id=2'}}
        expect_requests: 3
        kind: http
        name: second
        respond:
          - body: second
            status: 200
      - expect:
          - {path: {equals: /split}}
          - {path: {equals: /split}}
          - {path: {equals: /split}}
        expect_requests: 3
        kind: http
        name: route
        respond:
          - body: route
            status: 200
    name: inline-upstreams-and-route-fallback
    steps:
      - input: {path: /split}
        name: unmatched-request-uses-route-upstream
        output: {status: 200, body: {equals: route}}
        repeat: 3
      - input: {path: '/split?id=1'}
        name: first-match-selects-first-weighted-upstream
        output: {status: 200, body: {equals: first}}
        repeat: 3
      - input: {path: '/split?id=2'}
        name: second-match-selects-second-weighted-upstream
        output: {status: 200, body: {equals: second}}
        repeat: 3
  - config:
      routes:
        - id: traffic-split
          plugins:
            traffic-split:
              rules:
                - match:
                    - vars:
                        - - arg_id
                          - ==
                          - "1"
                  weighted_upstreams:
                    - upstream_id: one
                      weight: 1
                - match:
                    - vars:
                        - - arg_id
                          - ==
                          - "2"
                  weighted_upstreams:
                    - upstream_id: two
                      weight: 1
          upstream:
            nodes:
              '{{FIXTURE.route.ADDR}}': 1
            type: roundrobin
          uri: /split
      upstreams:
        - id: one
          nodes:
            '{{FIXTURE.first.ADDR}}': 1
          type: roundrobin
        - id: two
          nodes:
            '{{FIXTURE.second.ADDR}}': 1
          type: roundrobin
    fixtures:
      - expect:
          - {path: {equals: '/split?id=1'}}
          - {path: {equals: '/split?id=1'}}
          - {path: {equals: '/split?id=1'}}
        expect_requests: 3
        kind: http
        name: first
        respond:
          - body: first
            status: 200
      - expect:
          - {path: {equals: '/split?id=2'}}
          - {path: {equals: '/split?id=2'}}
          - {path: {equals: '/split?id=2'}}
        expect_requests: 3
        kind: http
        name: second
        respond:
          - body: second
            status: 200
      - expect:
          - {path: {equals: /split}}
          - {path: {equals: /split}}
          - {path: {equals: /split}}
        expect_requests: 3
        kind: http
        name: route
        respond:
          - body: route
            status: 200
    name: referenced-upstreams-and-route-fallback
    steps:
      - input: {path: /split}
        name: unmatched-request-uses-route-upstream
        output: {status: 200, body: {equals: route}}
        repeat: 3
      - input: {path: '/split?id=1'}
        name: first-match-selects-first-referenced-upstream
        output: {status: 200, body: {equals: first}}
        repeat: 3
      - input: {path: '/split?id=2'}
        name: second-match-selects-second-referenced-upstream
        output: {status: 200, body: {equals: second}}
        repeat: 3
  - config:
      routes:
        - id: traffic-split
          plugins:
            traffic-split:
              rules:
                - weighted_upstreams:
                    - upstream_id: checked
                      weight: 1
          upstream:
            nodes:
              '{{FIXTURE.route.ADDR}}': 1
            type: roundrobin
          uri: /split
      upstreams:
        - checks:
            passive:
              unhealthy:
                http_failures: 1
                http_statuses:
                  - 500
          id: checked
          nodes:
            - host: '{{FIXTURE.unhealthy.ADDR}}'
              weight: 1
            - host: '{{FIXTURE.healthy.ADDR}}'
              weight: 1
          type: roundrobin
    fixtures:
      - expect:
          - path:
              matches: ^/split(?:\?.*)?$
        kind: http
        name: unhealthy
        respond:
          - body: unhealthy
            status: 500
      - expect:
          - path:
              matches: ^/split(?:\?.*)?$
        kind: http
        name: healthy
        respond:
          - body: healthy
            status: 200
      - expect_requests: 0
        kind: http
        name: route
        respond:
          - body: route
            status: 200
    name: passive-health-is-bound-to-selected-upstream
    steps:
      - input:
          method: GET
          path: /split
        name: first-failure-marks-selected-node-unhealthy
        output:
          body:
            equals: unhealthy
          status: 500
      - input:
          method: GET
          path: /split
        name: next-request-skips-passively-unhealthy-node
        output:
          body:
            equals: healthy
          status: 200
  - config:
      routes:
        - id: traffic-split
          plugins:
            traffic-split:
              rules:
                - weighted_upstreams:
                    - upstream:
                        nodes:
                          - host: '{{FIXTURE.slow.ADDR}}'
                            weight: 1
                        timeout:
                          connect: 1
                          read: 1
                          send: 1
                        type: roundrobin
                      weight: 1
          upstream:
            nodes:
              '{{FIXTURE.route.ADDR}}': 1
            type: roundrobin
          uri: /split
    fixtures:
      - expect:
          - path:
              equals: /split
        kind: http
        name: slow
        respond:
          - body: too-late
            delay: 2s
            status: 200
      - expect_requests: 0
        kind: http
        name: route
        respond:
          - body: route
            status: 200
    name: inline-upstream-default-timeout
    steps:
      - input:
          path: /split
        name: selected-upstream-read-timeout-bounds-request
        output:
          elapsed_at_least: 900ms
          elapsed_less_than: 1800ms
          status: 504
  - config:
      routes:
        - id: traffic-split
          plugins:
            traffic-split:
              rules:
                - weighted_upstreams:
                    - upstream_id: split-upstream
                      weight: 1
                    - weight: 1
          upstream_id: route-upstream
          uri: /split
      upstreams:
        - id: route-upstream
          nodes:
            '{{FIXTURE.target.ADDR}}': 1
          type: roundrobin
        - id: split-upstream
          nodes:
            '{{FIXTURE.target.ADDR}}': 1
          type: roundrobin
    fixtures:
      - expect:
          - path:
              matches: ^/split(?:\?.*)?$
          - path:
              matches: ^/split(?:\?.*)?$
          - path:
              matches: ^/split(?:\?.*)?$
        kind: http
        name: target
        respond:
          - body: target
            status: 200
    name: referenced-upstream-survives-reload
    steps:
      - input:
          method: GET
          path: /split
        name: referenced-split-upstream-works-before-reload
        output:
          body:
            equals: target
          status: 200
      - config:
          routes:
            - id: traffic-split
              plugins:
                traffic-split:
                  rules:
                    - weighted_upstreams:
                        - upstream_id: split-upstream
                          weight: 1
                        - weight: 1
              upstream_id: route-upstream
              uri: /split
          upstreams:
            - id: route-upstream
              nodes:
                '{{FIXTURE.target.ADDR}}': 1
              type: roundrobin
            - id: split-upstream
              nodes:
                '{{FIXTURE.target.ADDR}}': 1
              type: roundrobin
        config_probe:
          input:
            path: /split
          output:
            body:
              equals: target
            status: 200
        config_timeout: 2s
        input:
          path: /split
        name: plugin-reload-keeps-referenced-upstreams-resolvable
        output:
          body:
            equals: target
          status: 200
