                          - jack
                        - - arg_age
                          - '!'
                          - <
                          - "16"
                  weighted_upstreams:
                    - upstream:
                        nodes:
                          - host: '{{FIXTURE.split.ADDR}}'
                            weight: 1
                        type: roundrobin
                      weight: 2
                    - upstream:
                        nodes:
                          - host: '{{FIXTURE.second.ADDR}}'
                            weight: 1
                        type: roundrobin
                      weight: 2
                    - weight: 1
          upstream:
            nodes:
              '{{FIXTURE.route.ADDR}}': 1
            type: roundrobin
          uri: /split
