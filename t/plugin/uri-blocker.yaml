cases:
  - name: reject-invalid-regular-expression
    config:
      routes:
        - id: uri-blocker-invalid-regex
          uri: /hello
          plugins:
            uri-blocker:
              block_rules: ['.+(']
    input:
      path: /hello
    output:
      status: 404
      logs:
        matches: 'build route uri-blocker-invalid-regex fail:.*compile block_rules:.*missing closing.*[.][+][(]'

  - name: accept-multiple-valid-rules
    config:
      routes:
        - id: uri-blocker-valid-rules
          uri: /hello
          plugins:
            uri-blocker:
              block_rules: ['^a', '^b']
          upstream: &fixture_route
            type: roundrobin
            nodes:
              '{{UPSTREAM_ADDR}}': 1
    input:
      path: /hello
    upstream: &hello_fixture
      respond:
        status: 200
        body: hello world
    output: &hello_output
      status: 200
      body:
        equals: hello world

  - name: reject-one-invalid-rule
    config:
      routes:
        - id: uri-blocker-one-invalid-rule
          uri: /hello
          plugins:
            uri-blocker:
              block_rules: ['^a', '^b(']
    input:
      path: /hello
    output:
      status: 404
      logs:
        matches: 'build route uri-blocker-one-invalid-rule fail:.*compile block_rules:.*missing closing.*[\^]a[|][\^]b[(]'

  - name: one-rule-blocks-query
    config:
      routes:
        - id: uri-blocker-one-rule-block
          uri: /hello
          plugins: &one_rule_plugin
            uri-blocker:
              block_rules: [aa]
          upstream: *fixture_route
    input:
      path: /hello?aa=1
      generation_timeout: 5s
    upstream: *hello_fixture
    output:
      status: 403
      logs:
        matches: 'concat block_rules: aa'

  - name: one-rule-allows-other-query
    config:
      routes:
        - id: uri-blocker-one-rule-allow
          uri: /hello
          plugins: *one_rule_plugin
          upstream: *fixture_route
    input:
      path: /hello?bb=2
    upstream: *hello_fixture
    output:
      <<: *hello_output
      logs:
        matches: 'concat block_rules: aa'

  - name: multiple-rules-block-bb-value
    config:
      routes:
        - id: uri-blocker-multiple-rules-bb-value
          uri: /hello
          plugins: &multiple_rules_plugin
            uri-blocker:
              block_rules: [aa, bb, 'c\d+']
          upstream: *fixture_route
    input:
      path: /hello?x=bb
    upstream: *hello_fixture
    output:
      status: 403
      logs: &multiple_rules_log
        matches: 'concat block_rules: aa[|]bb[|]c.*,'

  - name: multiple-rules-block-bb-key
    config:
      routes:
        - id: uri-blocker-multiple-rules-bb-key
          uri: /hello
          plugins: *multiple_rules_plugin
          upstream: *fixture_route
    input:
      path: /hello?bb=2
    upstream: *hello_fixture
    output:
      status: 403
      logs: *multiple_rules_log

  - name: multiple-rules-block-numeric-pattern
    config:
      routes:
        - id: uri-blocker-multiple-rules-numeric
          uri: /hello
          plugins: *multiple_rules_plugin
          upstream: *fixture_route
    input:
      path: /hello?c1=2
    upstream: *hello_fixture
    output:
      status: 403

  - name: multiple-rules-allow-nonmatch
    config:
      routes:
        - id: uri-blocker-multiple-rules-allow
          uri: /hello
          plugins: *multiple_rules_plugin
          upstream: *fixture_route
    input:
      path: /hello?cc=2
    upstream: *hello_fixture
    output: *hello_output

  - name: sql-select-blocked
    config:
      routes:
        - id: uri-blocker-sql-select
          uri: /hello
          plugins: &sql_rules_plugin
            uri-blocker:
              block_rules: ['select.+(from|limit)', '(?:(union(.*?)select))']
          upstream: *fixture_route
    input:
      path: /hello?name=;select%20from%20sys
    upstream: *hello_fixture
    output:
      status: 403
      logs:
        matches: 'concat block_rules: select\.\+\(from\|limit\)\|\(\?:\(union\(\.\*\?\)select\)\),'

  - name: sql-union-select-blocked
    config:
      routes:
        - id: uri-blocker-sql-union
          uri: /hello
          plugins: *sql_rules_plugin
          upstream: *fixture_route
    input:
      path: /hello?name=;union%20select%20
    upstream: *hello_fixture
    output:
      status: 403

  - name: sql-rules-allow-nonmatch
    config:
      routes:
        - id: uri-blocker-sql-allow
          uri: /hello
          plugins: *sql_rules_plugin
          upstream: *fixture_route
    input:
      path: /hello?cc=2
    upstream: *hello_fixture
    output: *hello_output

  - name: reject-invalid-message
    variants:
      - name: empty
        config:
          routes:
            - id: uri-blocker-empty-message
              uri: /hello
              plugins:
                uri-blocker:
                  block_rules: ['^a']
                  rejected_msg: ''
        input:
          path: /hello
        output:
          status: 404
          logs:
            matches: 'build route uri-blocker-empty-message fail:.*rejected_msg.*(length|minLength).*1'
      - name: boolean
        config:
          routes:
            - id: uri-blocker-boolean-message
              uri: /hello
              plugins:
                uri-blocker:
                  block_rules: ['^a']
                  rejected_msg: true
        input:
          path: /hello
        output:
          status: 404
          logs:
            matches: 'build route uri-blocker-boolean-message fail:.*rejected_msg.*expected string'

  - name: custom-rejected-message
    config:
      routes:
        - id: uri-blocker-custom-message
          uri: /hello
          plugins:
            uri-blocker:
              block_rules: [aa]
              rejected_msg: access is not allowed
          upstream: *fixture_route
    input:
      path: /hello?aa=1
    upstream: *hello_fixture
    output:
      status: 403
      body:
        equals: '{"error_msg":"access is not allowed"}'

  - name: case-insensitive
    config:
      routes:
        - id: uri-blocker-case-insensitive
          uri: /hello
          plugins:
            uri-blocker:
              block_rules: [AA]
              rejected_msg: access is not allowed
              case_insensitive: true
          upstream: *fixture_route
    input:
      path: /hello?aa=1
    upstream: *hello_fixture
    output:
      status: 403
      body:
        equals: '{"error_msg":"access is not allowed"}'

  - name: normalized-path-cannot-bypass-anchor
    runtime:
      apisix:
        normalize_uri_like_servlet: true
    config:
      routes:
        - id: uri-blocker-normalized-path
          uri: /internal/*
          plugins:
            uri-blocker:
              block_rules: ['^/internal/']
    input:
      path: /./internal/x?aa=1
    output:
      status: 403
