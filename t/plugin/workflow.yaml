sources:
  - repository: https://github.com/apache/apisix
    commit: c3d7d5ec69774121f53d2e20d29d09c816795dd7
    file: t/plugin/workflow-without-case.t
    tests: 7
  - repository: https://github.com/apache/apisix
    commit: c3d7d5ec69774121f53d2e20d29d09c816795dd7
    file: t/plugin/workflow.t
    tests: 20
  - repository: https://github.com/apache/apisix
    commit: c3d7d5ec69774121f53d2e20d29d09c816795dd7
    file: t/plugin/workflow2.t
    tests: 8
  - repository: https://github.com/apache/apisix
    commit: c3d7d5ec69774121f53d2e20d29d09c816795dd7
    file: t/plugin/workflow3.t
    tests: 7

cases:
  - name: unconditional-rule-route-created
    source: {file: t/plugin/workflow-without-case.t, tests: [1]}
    config:
      routes:
        - id: without-case-created
          uri: /hello
          plugins:
            workflow: {rules: [{actions: [[return, {code: 403}]]}]}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - {name: primary, kind: http, expect_requests: 0, respond: [{status: 200, body: unexpected}]}
    steps:
      - name: unconditional-rule-is-active
        input: {path: /hello}
        output: {status: 403, body: {equals: '{"error_msg":"rejected by workflow"}'}}

  - name: unconditional-rule-rejects-request
    source: {file: t/plugin/workflow-without-case.t, tests: [2]}
    config:
      routes:
        - id: without-case-request
          uri: /hello
          plugins:
            workflow: {rules: [{actions: [[return, {code: 403}]]}]}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - {name: primary, kind: http, expect_requests: 0, respond: [{status: 200, body: unexpected}]}
    steps:
      - name: request-is-rejected-before-upstream
        input: {path: /hello}
        output: {status: 403, body: {equals: '{"error_msg":"rejected by workflow"}'}}

  - name: route-limit-count-chain-created
    source: {file: t/plugin/workflow-without-case.t, tests: [3]}
    config:
      routes:
        - id: without-case-route-chain
          uri: /hello
          plugins:
            key-auth: {}
            limit-count: {count: 3, time_window: 60, rejected_code: 503, key: remote_addr}
            workflow: {rules: [{case: [[arg_block, '==', yes]], actions: [[return, {code: 403}]]}]}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
      consumers:
        - username: rose
          plugins: {key-auth: {key: rose}}
    fixtures:
      - name: primary
        kind: http
        expect: [{path: {equals: /hello}, headers: {X-Consumer-Username: {equals: rose}}}]
        respond: [{status: 200, body: route-ready}]
    steps:
      - name: route-chain-authenticates-and-allows
        input: {path: /hello, headers: {apikey: rose}}
        output: {status: 200, body: {equals: route-ready}}

  - name: rose-consumer-created
    source: {file: t/plugin/workflow-without-case.t, tests: [4]}
    config:
      consumers:
        - username: rose
          plugins: {key-auth: {key: rose}}
      routes:
        - id: without-case-rose
          uri: /hello
          plugins:
            key-auth: {}
            workflow: {rules: [{case: [[arg_block, '==', yes]], actions: [[return, {code: 403}]]}]}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - name: primary
        kind: http
        expect: [{path: {equals: /hello}, headers: {X-Consumer-Username: {equals: rose}}}]
        respond: [{status: 200, body: rose-ready}]
    steps:
      - name: rose-key-resolves-created-consumer
        input: {path: /hello, headers: {apikey: rose}}
        output: {status: 200, body: {equals: rose-ready}}

  - name: jack-consumer-workflow-created
    source: {file: t/plugin/workflow-without-case.t, tests: [5]}
    config:
      consumers:
        - username: jack
          plugins:
            key-auth: {key: jack}
            workflow:
              rules:
                - case: [[route_id, '==', without-case-jack]]
                  actions: [[limit-count, {count: 5, time_window: 60, rejected_code: 429, key: remote_addr}]]
      routes:
        - id: without-case-jack
          uri: /hello
          plugins: {key-auth: {}}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - name: primary
        kind: http
        expect: [{path: {equals: /hello}, headers: {X-Consumer-Username: {equals: jack}}}]
        respond: [{status: 200, body: jack-ready}]
    steps:
      - name: jack-consumer-workflow-allows-first-request
        input: {path: /hello, headers: {apikey: jack}}
        output: {status: 200, body: {equals: jack-ready}}

  - name: rose-uses-route-limit
    source: {file: t/plugin/workflow-without-case.t, tests: [6]}
    config:
      consumers:
        - username: rose
          plugins: {key-auth: {key: rose}}
        - username: jack
          plugins:
            key-auth: {key: jack}
            workflow:
              rules:
                - case: [[route_id, '==', without-case-rose-limit]]
                  actions: [[limit-count, {count: 5, time_window: 60, rejected_code: 429, key: remote_addr}]]
      routes:
        - id: without-case-rose-limit
          uri: /hello
          plugins:
            key-auth: {}
            limit-count: {count: 3, time_window: 60, rejected_code: 503, key: remote_addr}
            workflow: {rules: [{case: [[arg_never, '==', yes]], actions: [[return, {code: 403}]]}]}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - name: primary
        kind: http
        expect:
          - {path: {equals: /hello}, headers: {X-Consumer-Username: {equals: rose}}}
          - {path: {equals: /hello}, headers: {X-Consumer-Username: {equals: rose}}}
          - {path: {equals: /hello}, headers: {X-Consumer-Username: {equals: rose}}}
        respond: [{status: 200, body: rose-upstream}]
    steps:
      - {name: rose-first-request, input: {path: /hello, headers: {apikey: rose}}, output: {status: 200, body: {equals: rose-upstream}}}
      - {name: rose-second-request, input: {path: /hello, headers: {apikey: rose}}, output: {status: 200, body: {equals: rose-upstream}}}
      - {name: rose-third-request, input: {path: /hello, headers: {apikey: rose}}, output: {status: 200, body: {equals: rose-upstream}}}
      - {name: rose-fourth-request-is-route-rejected, input: {path: /hello, headers: {apikey: rose}}, output: {status: 503}}

  - name: jack-consumer-workflow-overrides-route-limit
    source: {file: t/plugin/workflow-without-case.t, tests: [7]}
    config:
      consumers:
        - username: rose
          plugins: {key-auth: {key: rose}}
        - username: jack
          plugins:
            key-auth: {key: jack}
            workflow:
              rules:
                - case: [[route_id, '==', without-case-jack-limit]]
                  actions: [[limit-count, {count: 5, time_window: 60, rejected_code: 429, key: remote_addr}]]
      routes:
        - id: without-case-jack-limit
          uri: /hello
          plugins:
            key-auth: {}
            limit-count: {count: 3, time_window: 60, rejected_code: 503, key: remote_addr}
            workflow: {rules: [{case: [[arg_never, '==', yes]], actions: [[return, {code: 403}]]}]}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - name: primary
        kind: http
        expect:
          - {path: {equals: /hello}, headers: {X-Consumer-Username: {equals: jack}}}
          - {path: {equals: /hello}, headers: {X-Consumer-Username: {equals: jack}}}
          - {path: {equals: /hello}, headers: {X-Consumer-Username: {equals: jack}}}
          - {path: {equals: /hello}, headers: {X-Consumer-Username: {equals: jack}}}
          - {path: {equals: /hello}, headers: {X-Consumer-Username: {equals: jack}}}
        respond: [{status: 200, body: jack-upstream}]
    steps:
      - {name: jack-first-request, input: {path: /hello, headers: {apikey: jack}}, output: {status: 200, body: {equals: jack-upstream}}}
      - {name: jack-second-request, input: {path: /hello, headers: {apikey: jack}}, output: {status: 200, body: {equals: jack-upstream}}}
      - {name: jack-third-request, input: {path: /hello, headers: {apikey: jack}}, output: {status: 200, body: {equals: jack-upstream}}}
      - {name: jack-fourth-request, input: {path: /hello, headers: {apikey: jack}}, output: {status: 200, body: {equals: jack-upstream}}}
      - {name: jack-fifth-request, input: {path: /hello, headers: {apikey: jack}}, output: {status: 200, body: {equals: jack-upstream}}}
      - {name: jack-sixth-request-is-consumer-rejected, input: {path: /hello, headers: {apikey: jack}}, output: {status: 429}}

  - name: workflow-schema-diagnostics
    source: {file: t/plugin/workflow.t, tests: [1]}
    config:
      routes:
        - id: workflow-schema
          uri: /schema
          plugins:
            workflow: {rules: [{actions: [[return, {code: 201}]]}]}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - {name: primary, kind: http, expect_requests: 0, respond: [{status: 200, body: unexpected}]}
    steps:
      - name: valid-return-schema-is-active
        input: {path: /schema}
        output: {status: 201, body: {equals: '{"error_msg":"rejected by workflow"}'}}
      - name: missing-actions-is-rejected
        wait: 100ms
        config:
          routes:
            - id: workflow-schema
              uri: /schema
              plugins: {workflow: {rules: [{}]}}
              upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
            - id: workflow-probe-missing-actions
              uri: /probe-missing-actions
              plugins: {workflow: {rules: [{actions: [[return, {code: 202}]]}]}}
              upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
        config_probe: {input: {path: /probe-missing-actions}, output: {status: 202}}
        input: {path: /schema}
        output: {status: 404, logs: {matches: "missing properties: 'actions'"}}
      - name: empty-action-is-rejected
        wait: 100ms
        config:
          routes:
            - id: workflow-schema
              uri: /schema
              plugins: {workflow: {rules: [{actions: [[]]}]}}
              upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
            - id: workflow-probe-empty-action
              uri: /probe-empty-action
              plugins: {workflow: {rules: [{actions: [[return, {code: 202}]]}]}}
              upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
        config_probe: {input: {path: /probe-empty-action}, output: {status: 202}}
        input: {path: /schema}
        output: {status: 404, logs: {matches: 'workflow action must contain a name|minimum 1'}}
      - name: return-status-key-is-rejected
        wait: 100ms
        config:
          routes:
            - id: workflow-schema
              uri: /schema
              plugins: {workflow: {rules: [{actions: [[return, {status: 403}]]}]}}
              upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
            - id: workflow-probe-return-status
              uri: /probe-return-status
              plugins: {workflow: {rules: [{actions: [[return, {code: 202}]]}]}}
              upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
        config_probe: {input: {path: /probe-return-status}, output: {status: 202}}
        input: {path: /schema}
        output: {status: 404, logs: {matches: 'workflow return action code must be between 200 and 599'}}
      - name: noninteger-return-code-is-rejected
        wait: 100ms
        config:
          routes:
            - id: workflow-schema
              uri: /schema
              plugins: {workflow: {rules: [{actions: [[return, {code: bad}]]}]}}
              upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
            - id: workflow-probe-noninteger-code
              uri: /probe-noninteger-code
              plugins: {workflow: {rules: [{actions: [[return, {code: 202}]]}]}}
              upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
        config_probe: {input: {path: /probe-noninteger-code}, output: {status: 202}}
        input: {path: /schema}
        output: {status: 404, logs: {matches: 'cannot unmarshal|string.*Go value of type int'}}
      - name: empty-case-is-rejected
        wait: 100ms
        config:
          routes:
            - id: workflow-schema
              uri: /schema
              plugins: {workflow: {rules: [{case: [], actions: [[return, {code: 403}]]}]}}
              upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
            - id: workflow-probe-empty-case
              uri: /probe-empty-case
              plugins: {workflow: {rules: [{actions: [[return, {code: 202}]]}]}}
              upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
        config_probe: {input: {path: /probe-empty-case}, output: {status: 202}}
        input: {path: /schema}
        output: {status: 404, logs: {matches: 'minimum 1'}}
      - name: unsupported-action-is-rejected
        wait: 100ms
        config:
          routes:
            - id: workflow-schema
              uri: /schema
              plugins: {workflow: {rules: [{actions: [[fake, {}]]}]}}
              upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
            - id: workflow-probe-unsupported-action
              uri: /probe-unsupported-action
              plugins: {workflow: {rules: [{actions: [[return, {code: 202}]]}]}}
              upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
        config_probe: {input: {path: /probe-unsupported-action}, output: {status: 202}}
        input: {path: /schema}
        output: {status: 404, logs: {matches: 'unsupported workflow action \\"fake\\"'}}

  - name: return-route-created
    source: {file: t/plugin/workflow.t, tests: [2]}
    config:
      routes:
        - id: workflow-return-created
          uri: /hello
          plugins:
            workflow: {rules: [{actions: [[return, {code: 403}]]}]}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - {name: primary, kind: http, expect_requests: 0, respond: [{status: 200, body: unexpected}]}
    steps:
      - name: created-return-route-rejects
        input: {path: /hello}
        output: {status: 403, body: {equals: '{"error_msg":"rejected by workflow"}'}}

  - name: return-route-request
    source: {file: t/plugin/workflow.t, tests: [3]}
    config:
      routes:
        - id: workflow-return-request
          uri: /hello
          plugins:
            workflow: {rules: [{actions: [[return, {code: 403}]]}]}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - {name: primary, kind: http, expect_requests: 0, respond: [{status: 200, body: unexpected}]}
    steps:
      - name: return-body-and-status-match
        input: {path: /hello}
        output: {status: 403, body: {equals: '{"error_msg":"rejected by workflow"}'}}

  - name: and-condition-route-created
    source: {file: t/plugin/workflow.t, tests: [4]}
    config:
      routes:
        - id: workflow-and-created
          uri: /hello
          plugins:
            workflow:
              rules:
                - case: [[uri, '==', /hello], [arg_foo, '==', bar]]
                  actions: [[return, {code: 403}]]
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - {name: primary, kind: http, expect_requests: 0, respond: [{status: 200, body: unexpected}]}
    steps:
      - name: both-created-conditions-match
        input: {path: '/hello?foo=bar'}
        output: {status: 403, body: {equals: '{"error_msg":"rejected by workflow"}'}}

  - name: and-condition-falls-through
    source: {file: t/plugin/workflow.t, tests: [5]}
    config:
      routes:
        - id: workflow-and-fallthrough
          uri: /hello
          plugins:
            workflow:
              rules:
                - case: [[uri, '==', /hello], [arg_foo, '==', bar]]
                  actions: [[return, {code: 403}]]
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - name: primary
        kind: http
        expect: [{path: {equals: '/hello?foo=bad'}}]
        respond: [{status: 200, body: hello-world}]
    steps:
      - name: mismatched-argument-reaches-upstream
        input: {path: '/hello?foo=bad'}
        output: {status: 200, body: {equals: hello-world}}

  - name: and-condition-matches
    source: {file: t/plugin/workflow.t, tests: [6]}
    config:
      routes:
        - id: workflow-and-match
          uri: /hello
          plugins:
            workflow:
              rules:
                - case: [[uri, '==', /hello], [arg_foo, '==', bar]]
                  actions: [[return, {code: 403}]]
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - {name: primary, kind: http, expect_requests: 0, respond: [{status: 200, body: unexpected}]}
    steps:
      - name: matching-argument-is-rejected
        input: {path: '/hello?foo=bar'}
        output: {status: 403, body: {equals: '{"error_msg":"rejected by workflow"}'}}

  - name: two-uri-rules-created
    source: {file: t/plugin/workflow.t, tests: [7]}
    config:
      routes:
        - id: workflow-two-uri-created
          uri: /*
          plugins:
            workflow:
              rules:
                - {case: [[uri, '==', /hello]], actions: [[return, {code: 403}]]}
                - {case: [[uri, '==', /hello2]], actions: [[return, {code: 401}]]}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - {name: primary, kind: http, expect_requests: 0, respond: [{status: 200, body: unexpected}]}
    steps:
      - name: both-created-rules-have-distinct-actions
        input: {path: /hello2}
        output: {status: 401, body: {equals: '{"error_msg":"rejected by workflow"}'}}

  - name: first-uri-rule-matches
    source: {file: t/plugin/workflow.t, tests: [8]}
    config:
      routes:
        - id: workflow-first-uri
          uri: /*
          plugins:
            workflow:
              rules:
                - {case: [[uri, '==', /hello]], actions: [[return, {code: 403}]]}
                - {case: [[uri, '==', /hello2]], actions: [[return, {code: 401}]]}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - {name: primary, kind: http, expect_requests: 0, respond: [{status: 200, body: unexpected}]}
    steps:
      - name: first-uri-rule-returns-403
        input: {path: /hello}
        output: {status: 403, body: {equals: '{"error_msg":"rejected by workflow"}'}}

  - name: second-uri-rule-matches
    source: {file: t/plugin/workflow.t, tests: [9]}
    config:
      routes:
        - id: workflow-second-uri
          uri: /*
          plugins:
            workflow:
              rules:
                - {case: [[uri, '==', /hello]], actions: [[return, {code: 403}]]}
                - {case: [[uri, '==', /hello2]], actions: [[return, {code: 401}]]}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - {name: primary, kind: http, expect_requests: 0, respond: [{status: 200, body: unexpected}]}
    steps:
      - name: second-uri-rule-returns-401
        input: {path: /hello2}
        output: {status: 401, body: {equals: '{"error_msg":"rejected by workflow"}'}}

  - name: ordered-rules-created
    source: {file: t/plugin/workflow.t, tests: [10]}
    config:
      routes:
        - id: workflow-order-created
          uri: /*
          plugins:
            workflow:
              rules:
                - {case: [[arg_foo, '==', bar]], actions: [[return, {code: 403}]]}
                - {case: [[uri, '==', /hello]], actions: [[return, {code: 401}]]}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - {name: primary, kind: http, expect_requests: 0, respond: [{status: 200, body: unexpected}]}
    steps:
      - name: created-order-prefers-first-match
        input: {path: '/hello?foo=bar'}
        output: {status: 403, body: {equals: '{"error_msg":"rejected by workflow"}'}}

  - name: first-matching-rule-wins
    source: {file: t/plugin/workflow.t, tests: [11]}
    config:
      routes:
        - id: workflow-order-first
          uri: /*
          plugins:
            workflow:
              rules:
                - {case: [[arg_foo, '==', bar]], actions: [[return, {code: 403}]]}
                - {case: [[uri, '==', /hello]], actions: [[return, {code: 401}]]}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - {name: primary, kind: http, expect_requests: 0, respond: [{status: 200, body: unexpected}]}
    steps:
      - name: first-rule-short-circuits-second
        input: {path: '/hello?foo=bar'}
        output: {status: 403, body: {equals: '{"error_msg":"rejected by workflow"}'}}

  - name: second-rule-after-first-miss
    source: {file: t/plugin/workflow.t, tests: [12]}
    config:
      routes:
        - id: workflow-order-second
          uri: /*
          plugins:
            workflow:
              rules:
                - {case: [[arg_foo, '==', bar]], actions: [[return, {code: 403}]]}
                - {case: [[uri, '==', /hello]], actions: [[return, {code: 401}]]}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - {name: primary, kind: http, expect_requests: 0, respond: [{status: 200, body: unexpected}]}
    steps:
      - name: second-rule-runs-after-first-miss
        input: {path: '/hello?foo=bad'}
        output: {status: 401, body: {equals: '{"error_msg":"rejected by workflow"}'}}

  - name: all-rules-miss
    source: {file: t/plugin/workflow.t, tests: [13]}
    config:
      routes:
        - id: workflow-order-miss
          uri: /*
          plugins:
            workflow:
              rules:
                - {case: [[arg_foo, '==', bar]], actions: [[return, {code: 403}]]}
                - {case: [[uri, '==', /hello]], actions: [[return, {code: 401}]]}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - name: primary
        kind: http
        expect: [{path: {equals: '/hello1?foo=bad'}}]
        respond: [{status: 200, body: hello-world}]
    steps:
      - name: unmatched-request-reaches-upstream
        input: {path: '/hello1?foo=bad'}
        output: {status: 200, body: {equals: hello-world}}

  - name: limit-count-action-schema
    source: {file: t/plugin/workflow.t, tests: [14]}
    config:
      routes:
        - id: workflow-limit-schema
          uri: /limit-schema
          plugins:
            workflow:
              rules:
                - actions: [[limit-count, {count: 2, time_window: 60, rejected_code: 503, key: remote_addr}]]
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - name: primary
        kind: http
        expect:
          - {path: {equals: /limit-schema}}
          - {path: {equals: /limit-schema}}
        respond: [{status: 200, body: valid-limit-count}]
    steps:
      - name: valid-limit-count-allows-first-request
        input: {path: /limit-schema}
        output: {status: 200, body: {equals: valid-limit-count}}
      - name: valid-limit-count-allows-second-request
        input: {path: /limit-schema}
        output: {status: 200, body: {equals: valid-limit-count}}
      - name: valid-limit-count-rejects-third-request
        input: {path: /limit-schema}
        output: {status: 503}
      - name: missing-time-window-is-rejected
        wait: 100ms
        config:
          routes:
            - id: workflow-limit-schema
              uri: /limit-schema
