cases:
  - name: return-route-created
    config:
      routes:
        - id: workflow-return-created
          uri: /hello
          plugins:
            workflow: {rules: [{actions: [[return, {code: 403}]]}]}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - {name: primary, kind: http, expect_requests: 0, respond: [{status: 200, body: unexpected}]}
    steps:
      - name: created-return-route-rejects
        input: {path: /hello}
        output: {status: 403, body: {equals: '{"error_msg":"rejected by workflow"}'}}

  - name: return-route-request
    config:
      routes:
        - id: workflow-return-request
          uri: /hello
          plugins:
            workflow: {rules: [{actions: [[return, {code: 403}]]}]}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - {name: primary, kind: http, expect_requests: 0, respond: [{status: 200, body: unexpected}]}
    steps:
      - name: return-body-and-status-match
        input: {path: /hello}
        output: {status: 403, body: {equals: '{"error_msg":"rejected by workflow"}'}}

  - name: and-condition-route-created
    config:
      routes:
        - id: workflow-and-created
          uri: /hello
          plugins:
            workflow:
              rules:
                - case: [[uri, '==', /hello], [arg_foo, '==', bar]]
                  actions: [[return, {code: 403}]]
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - {name: primary, kind: http, expect_requests: 0, respond: [{status: 200, body: unexpected}]}
    steps:
      - name: both-created-conditions-match
        input: {path: '/hello?foo=bar'}
        output: {status: 403, body: {equals: '{"error_msg":"rejected by workflow"}'}}

  - name: and-condition-falls-through
    config:
      routes:
        - id: workflow-and-fallthrough
          uri: /hello
          plugins:
            workflow:
              rules:
                - case: [[uri, '==', /hello], [arg_foo, '==', bar]]
                  actions: [[return, {code: 403}]]
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - name: primary
        kind: http
        expect: [{path: {equals: '/hello?foo=bad'}}]
        respond: [{status: 200, body: hello-world}]
    steps:
      - name: mismatched-argument-reaches-upstream
        input: {path: '/hello?foo=bad'}
        output: {status: 200, body: {equals: hello-world}}

  - name: and-condition-matches
    config:
      routes:
        - id: workflow-and-match
          uri: /hello
          plugins:
            workflow:
              rules:
                - case: [[uri, '==', /hello], [arg_foo, '==', bar]]
                  actions: [[return, {code: 403}]]
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - {name: primary, kind: http, expect_requests: 0, respond: [{status: 200, body: unexpected}]}
    steps:
      - name: matching-argument-is-rejected
        input: {path: '/hello?foo=bar'}
        output: {status: 403, body: {equals: '{"error_msg":"rejected by workflow"}'}}

  - name: two-uri-rules-created
    config:
      routes:
        - id: workflow-two-uri-created
          uri: /*
          plugins:
            workflow:
              rules:
                - {case: [[uri, '==', /hello]], actions: [[return, {code: 403}]]}
                - {case: [[uri, '==', /hello2]], actions: [[return, {code: 401}]]}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - {name: primary, kind: http, expect_requests: 0, respond: [{status: 200, body: unexpected}]}
    steps:
      - name: both-created-rules-have-distinct-actions
        input: {path: /hello2}
        output: {status: 401, body: {equals: '{"error_msg":"rejected by workflow"}'}}

  - name: first-uri-rule-matches
    config:
      routes:
        - id: workflow-first-uri
          uri: /*
          plugins:
            workflow:
              rules:
                - {case: [[uri, '==', /hello]], actions: [[return, {code: 403}]]}
                - {case: [[uri, '==', /hello2]], actions: [[return, {code: 401}]]}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - {name: primary, kind: http, expect_requests: 0, respond: [{status: 200, body: unexpected}]}
    steps:
      - name: first-uri-rule-returns-403
        input: {path: /hello}
        output: {status: 403, body: {equals: '{"error_msg":"rejected by workflow"}'}}

  - name: second-uri-rule-matches
    config:
      routes:
        - id: workflow-second-uri
          uri: /*
          plugins:
            workflow:
              rules:
                - {case: [[uri, '==', /hello]], actions: [[return, {code: 403}]]}
                - {case: [[uri, '==', /hello2]], actions: [[return, {code: 401}]]}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - {name: primary, kind: http, expect_requests: 0, respond: [{status: 200, body: unexpected}]}
    steps:
      - name: second-uri-rule-returns-401
        input: {path: /hello2}
        output: {status: 401, body: {equals: '{"error_msg":"rejected by workflow"}'}}

  - name: ordered-rules-created
    config:
      routes:
        - id: workflow-order-created
          uri: /*
          plugins:
            workflow:
              rules:
                - {case: [[arg_foo, '==', bar]], actions: [[return, {code: 403}]]}
                - {case: [[uri, '==', /hello]], actions: [[return, {code: 401}]]}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - {name: primary, kind: http, expect_requests: 0, respond: [{status: 200, body: unexpected}]}
    steps:
      - name: created-order-prefers-first-match
        input: {path: '/hello?foo=bar'}
        output: {status: 403, body: {equals: '{"error_msg":"rejected by workflow"}'}}

  - name: first-matching-rule-wins
    config:
      routes:
        - id: workflow-order-first
          uri: /*
          plugins:
            workflow:
              rules:
                - {case: [[arg_foo, '==', bar]], actions: [[return, {code: 403}]]}
                - {case: [[uri, '==', /hello]], actions: [[return, {code: 401}]]}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - {name: primary, kind: http, expect_requests: 0, respond: [{status: 200, body: unexpected}]}
    steps:
      - name: first-rule-short-circuits-second
        input: {path: '/hello?foo=bar'}
        output: {status: 403, body: {equals: '{"error_msg":"rejected by workflow"}'}}

  - name: second-rule-after-first-miss
    config:
      routes:
        - id: workflow-order-second
          uri: /*
          plugins:
            workflow:
              rules:
                - {case: [[arg_foo, '==', bar]], actions: [[return, {code: 403}]]}
                - {case: [[uri, '==', /hello]], actions: [[return, {code: 401}]]}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - {name: primary, kind: http, expect_requests: 0, respond: [{status: 200, body: unexpected}]}
    steps:
      - name: second-rule-runs-after-first-miss
        input: {path: '/hello?foo=bad'}
        output: {status: 401, body: {equals: '{"error_msg":"rejected by workflow"}'}}

  - name: all-rules-miss
    config:
      routes:
        - id: workflow-order-miss
          uri: /*
          plugins:
            workflow:
              rules:
                - {case: [[arg_foo, '==', bar]], actions: [[return, {code: 403}]]}
                - {case: [[uri, '==', /hello]], actions: [[return, {code: 401}]]}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - name: primary
        kind: http
        expect: [{path: {equals: '/hello1?foo=bad'}}]
        respond: [{status: 200, body: hello-world}]
    steps:
      - name: unmatched-request-reaches-upstream
        input: {path: '/hello1?foo=bad'}
        output: {status: 200, body: {equals: hello-world}}

  - name: single-limit-count-route-created
    config:
      routes:
        - id: workflow-limit-created
          uri: /hello
          plugins:
            workflow:
              rules:
                - actions: [[limit-count, {count: 3, time_window: 60, rejected_code: 503, key: remote_addr}]]
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - name: primary
        kind: http
        expect: [{path: {equals: /hello}}]
        respond: [{status: 200, body: limit-ready}]
    steps:
      - name: created-limit-allows-request
        input: {path: /hello}
        output: {status: 200, body: {equals: limit-ready}}

  - name: single-limit-count-threshold
    config:
      routes:
        - id: workflow-limit-threshold
          uri: /hello
          plugins:
            workflow:
              rules:
                - actions: [[limit-count, {count: 3, time_window: 60, rejected_code: 503, key: remote_addr}]]
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - name: primary
        kind: http
        expect:
          - {path: {equals: /hello}}
          - {path: {equals: /hello}}
          - {path: {equals: /hello}}
        respond: [{status: 200, body: limited}]
    steps:
      - {name: first-counted-request, input: {path: /hello}, output: {status: 200, body: {equals: limited}}}
      - {name: second-counted-request, input: {path: /hello}, output: {status: 200, body: {equals: limited}}}
      - {name: third-counted-request, input: {path: /hello}, output: {status: 200, body: {equals: limited}}}
      - {name: fourth-request-is-rejected, input: {path: /hello}, output: {status: 503}}

  - name: two-independent-limit-count-rules-created
    config:
      routes:
        - id: workflow-two-limits-created
          uri: /*
          plugins:
            workflow:
              rules:
                - {case: [[uri, '==', /hello]], actions: [[limit-count, {count: 3, time_window: 60, rejected_code: 503, key: remote_addr}]]}
                - {case: [[uri, '==', /hello1]], actions: [[limit-count, {count: 3, time_window: 60, rejected_code: 503, key: remote_addr}]]}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - name: primary
        kind: http
        expect:
          - {path: {equals: /hello}}
          - {path: {equals: /hello1}}
        respond: [{status: 200, body: independent}]
    steps:
      - {name: first-rule-allows, input: {path: /hello}, output: {status: 200, body: {equals: independent}}}
      - {name: second-rule-allows, input: {path: /hello1}, output: {status: 200, body: {equals: independent}}}

  - name: two-independent-limit-count-thresholds
    config:
      routes:
        - id: workflow-two-limit-thresholds
          uri: /*
          plugins:
            workflow:
              rules:
                - {case: [[uri, '==', /hello]], actions: [[limit-count, {count: 3, time_window: 60, rejected_code: 503, key: remote_addr}]]}
                - {case: [[uri, '==', /hello1]], actions: [[limit-count, {count: 3, time_window: 60, rejected_code: 503, key: remote_addr}]]}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - name: primary
        kind: http
        expect:
          - {path: {matches: '^/hello1?$'}}
          - {path: {matches: '^/hello1?$'}}
          - {path: {matches: '^/hello1?$'}}
          - {path: {matches: '^/hello1?$'}}
          - {path: {matches: '^/hello1?$'}}
          - {path: {matches: '^/hello1?$'}}
        respond: [{status: 200, body: independent}]
    steps:
      - {name: hello-first, input: {path: /hello}, output: {status: 200}}
      - {name: hello1-first, input: {path: /hello1}, output: {status: 200}}
      - {name: hello-second, input: {path: /hello}, output: {status: 200}}
      - {name: hello1-second, input: {path: /hello1}, output: {status: 200}}
      - {name: hello-third, input: {path: /hello}, output: {status: 200}}
      - {name: hello1-third, input: {path: /hello1}, output: {status: 200}}
      - {name: hello-fourth-rejected, input: {path: /hello}, output: {status: 503}}
      - {name: hello1-fourth-rejected, input: {path: /hello1}, output: {status: 503}}

  - name: or-condition-route-created
    config:
      routes:
        - id: workflow-or-created
          uri: /*
          plugins:
            workflow:
              rules:
                - case: [[arg_foo, '==', bar], or, [uri, '==', /hello]]
                  actions: [[return, {code: 403}]]
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - {name: primary, kind: http, expect_requests: 0, respond: [{status: 200, body: unexpected}]}
    steps:
      - name: uri-side-of-or-matches
        input: {path: /hello}
        output: {status: 403, body: {equals: '{"error_msg":"rejected by workflow"}'}}

  - name: or-condition-request
    config:
      routes:
        - id: workflow-or-request
          uri: /*
          plugins:
            workflow:
              rules:
                - case: [[arg_foo, '==', bar], or, [uri, '==', /hello]]
                  actions: [[return, {code: 403}]]
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - {name: primary, kind: http, expect_requests: 0, respond: [{status: 200, body: unexpected}]}
    steps:
      - name: uri-match-returns-exact-response
        input: {path: /hello}
        output: {status: 403, body: {equals: '{"error_msg":"rejected by workflow"}'}}

  - name: mixed-return-and-count-rules-created
    config:
      routes:
        - id: workflow2-mixed-created
          uri: /*
          plugins:
            workflow:
              rules:
                - {case: [[uri, '==', /hello]], actions: [[return, {code: 403}]]}
                - {case: [[uri, '==', /hello1]], actions: [[limit-count, {count: 1, time_window: 60, rejected_code: 503, key: remote_addr}]]}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - name: primary
        kind: http
        expect: [{path: {equals: /hello1}}]
        respond: [{status: 200, body: mixed-ready}]
    steps:
      - {name: return-rule-is-created, input: {path: /hello}, output: {status: 403}}
      - {name: count-rule-is-created, input: {path: /hello1}, output: {status: 200, body: {equals: mixed-ready}}}

  - name: mixed-return-and-count-behavior
    config:
      routes:
        - id: workflow2-mixed-behavior
          uri: /*
          plugins:
            workflow:
              rules:
                - {case: [[uri, '==', /hello]], actions: [[return, {code: 403}]]}
                - {case: [[uri, '==', /hello1]], actions: [[limit-count, {count: 1, time_window: 60, rejected_code: 503, key: remote_addr}]]}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - name: primary
        kind: http
        expect: [{path: {equals: /hello1}}]
        respond: [{status: 200, body: mixed}]
    steps:
      - {name: return-rule-rejects, input: {path: /hello}, output: {status: 403, body: {equals: '{"error_msg":"rejected by workflow"}'}}}
      - {name: count-rule-first-allows, input: {path: /hello1}, output: {status: 200, body: {equals: mixed}}}
      - {name: count-rule-second-rejects, input: {path: /hello1}, output: {status: 503}}

  - name: two-count-rules-created
    config:
      routes:
        - id: workflow2-two-count-created
          uri: /*
          plugins:
            workflow:
              rules:
                - {case: [[uri, '==', /hello]], actions: [[limit-count, {count: 3, time_window: 60, rejected_code: 503, key: remote_addr}]]}
                - {case: [[uri, '==', /hello1]], actions: [[limit-count, {count: 3, time_window: 60, rejected_code: 503, key: remote_addr}]]}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - name: primary
        kind: http
        expect:
          - {path: {equals: /hello}}
          - {path: {equals: /hello1}}
        respond: [{status: 200, body: created}]
    steps:
      - {name: first-created-rule-allows, input: {path: /hello}, output: {status: 200}}
      - {name: second-created-rule-allows, input: {path: /hello1}, output: {status: 200}}

  - name: two-count-rules-first-two-each
    config:
      routes:
        - id: workflow2-two-count-first
          uri: /*
          plugins:
            workflow:
              rules:
                - {case: [[uri, '==', /hello]], actions: [[limit-count, {count: 3, time_window: 60, rejected_code: 503, key: remote_addr}]]}
                - {case: [[uri, '==', /hello1]], actions: [[limit-count, {count: 3, time_window: 60, rejected_code: 503, key: remote_addr}]]}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - name: primary
        kind: http
        expect:
          - {path: {equals: /hello}}
          - {path: {equals: /hello1}}
          - {path: {equals: /hello}}
          - {path: {equals: /hello1}}
        respond: [{status: 200, body: allowed}]
    steps:
      - {name: hello-first-allowed, input: {path: /hello}, output: {status: 200}}
      - {name: hello1-first-allowed, input: {path: /hello1}, output: {status: 200}}
      - {name: hello-second-allowed, input: {path: /hello}, output: {status: 200}}
      - {name: hello1-second-allowed, input: {path: /hello1}, output: {status: 200}}
  - name: two-count-rules-reach-independent-thresholds
    config:
      routes:
        - id: workflow2-two-count-next
          uri: /*
          plugins:
            workflow:
              rules:
                - {case: [[uri, '==', /hello]], actions: [[limit-count, {count: 3, time_window: 60, rejected_code: 503, key: remote_addr}]]}
                - {case: [[uri, '==', /hello1]], actions: [[limit-count, {count: 3, time_window: 60, rejected_code: 503, key: remote_addr}]]}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - name: primary
        kind: http
        expect:
          - {path: {matches: '^/hello1?$'}}
          - {path: {matches: '^/hello1?$'}}
          - {path: {matches: '^/hello1?$'}}
          - {path: {matches: '^/hello1?$'}}
          - {path: {matches: '^/hello1?$'}}
          - {path: {matches: '^/hello1?$'}}
        respond: [{status: 200, body: allowed}]
    steps:
      - {name: hello-first, input: {path: /hello}, output: {status: 200}}
      - {name: hello1-first, input: {path: /hello1}, output: {status: 200}}
      - {name: hello-second, input: {path: /hello}, output: {status: 200}}
      - {name: hello1-second, input: {path: /hello1}, output: {status: 200}}
      - {name: hello-third, input: {path: /hello}, output: {status: 200}}
      - {name: hello1-third, input: {path: /hello1}, output: {status: 200}}
      - {name: hello-fourth-is-rejected, input: {path: /hello}, output: {status: 503}}
      - {name: hello1-fourth-is-rejected, input: {path: /hello1}, output: {status: 503}}

  - name: unequal-count-rules-created
    config:
      routes:
        - id: workflow2-unequal-created
          uri: /*
          plugins:
            workflow:
              rules:
                - {case: [[uri, '==', /hello]], actions: [[limit-count, {count: 1, time_window: 60, rejected_code: 503, key: remote_addr}]]}
                - {case: [[uri, '==', /hello1]], actions: [[limit-count, {count: 2, time_window: 60, rejected_code: 503, key: remote_addr}]]}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - name: primary
        kind: http
        expect:
          - {path: {equals: /hello}}
          - {path: {equals: /hello1}}
        respond: [{status: 200, body: unequal}]
    steps:
      - {name: count-one-rule-allows-first, input: {path: /hello}, output: {status: 200}}
      - {name: count-two-rule-allows-first, input: {path: /hello1}, output: {status: 200}}

  - name: unequal-count-rule-thresholds
    config:
      routes:
        - id: workflow2-unequal-thresholds
          uri: /*
          plugins:
            workflow:
              rules:
                - {case: [[uri, '==', /hello]], actions: [[limit-count, {count: 1, time_window: 60, rejected_code: 503, key: remote_addr}]]}
                - {case: [[uri, '==', /hello1]], actions: [[limit-count, {count: 2, time_window: 60, rejected_code: 503, key: remote_addr}]]}
          upstream: {type: roundrobin, nodes: {"{{FIXTURE.primary.ADDR}}": 1}}
    fixtures:
      - name: primary
        kind: http
        expect:
          - {path: {equals: /hello}}
          - {path: {equals: /hello1}}
          - {path: {equals: /hello1}}
        respond: [{status: 200, body: unequal}]
    steps:
      - {name: hello-first-allowed, input: {path: /hello}, output: {status: 200}}
      - {name: hello1-first-allowed, input: {path: /hello1}, output: {status: 200}}
      - {name: hello-second-rejected, input: {path: /hello}, output: {status: 503}}
      - {name: hello1-second-allowed, input: {path: /hello1}, output: {status: 200}}
