    - case: file-logger-route-format-jsonl-write
      plugin: file-logger
      obligation: write-one-route-format-jsonl-entry-to-side-local-file
      route_id: differential-file-logger-route-format
      comparison_policy: file-logger-jsonl-write
      config:
        routes:
            - id: differential-file-logger-route-format
              plugins:
                file-logger:
                    log_format:
                        client_ip: $remote_addr
                        host: $host
                    path: '{{SIDE.FILE}}'
              upstream:
                nodes:
                    '{{FIXTURE.ADDR}}': 1
                pass_host: rewrite
                type: roundrobin
                upstream_host: differential.example.test
              uri: /hello
      request:
        method: GET
        path: /hello
        host: 127.0.0.1
      fixture:
        name: primary
        response:
            status: 200
            body: |
                hello world
        expected_calls: 1
      file:
        name: access.log
        max_bytes: 16384
        wait_timeout_millis: 2000
        expected_lines: 1
      security_decision: not_applicable
    - case: server-info-control-api-shape
      plugin: server-info
      obligation: serve-five-field-control-api-response
      route_id: differential-server-info-control
      plugin_binding: control-api
      comparison_policy: server-info-control-api
      config:
        routes: []
      request:
        method: GET
        path: /v1/server_info
        host: gateway.example.test
        target: control
      fixture:
        name: unused
        response:
            status: 200
            body: unexpected
        expected_calls: 0
      security_decision: not_applicable
    - case: skywalking-full-sampling-injects-valid-sw8
      plugin: skywalking
      obligation: inject-valid-sw8-on-full-sampling-origin-call
      route_id: differential-skywalking-full-sampling
      comparison_policy: skywalking-sw8-full-sampling
      config:
        routes:
            - id: differential-skywalking-full-sampling
              plugins:
                skywalking:
                    sample_ratio: 1
              upstream:
                nodes:
                    '{{FIXTURE.ADDR}}': 1
                pass_host: rewrite
                type: roundrobin
                upstream_host: differential.example.test
              uri: /opentracing
      steps:
        - request:
            method: GET
            path: /opentracing
            host: gateway.example.test
          security_decision: not_applicable
      fixture:
        name: primary
        response:
            status: 200
            body: opentracing
        expected_calls: 1
        capture_all_calls: true
        collect_timeout_millis: 5000
        request_window_quiet_millis: 500
        semantic_headers:
            - sw8
      security_decision: ""
    - case: kafka-logger-publishes-origin-request-body
      plugin: kafka-logger
      obligation: publish-one-origin-format-request-body-record-to-kafka
      route_id: differential-kafka-logger-origin
      comparison_policy: kafka-logger-produce
      config:
        routes:
            - id: differential-kafka-logger-origin
              plugins:
                kafka-logger:
                    batch_max_size: 1
                    broker_list:
                        '{{FIXTURE.HOST}}': '{{FIXTURE.PORT}}'
                    include_req_body: true
                    kafka_topic: test2
                    key: key1
                    meta_format: origin
                    producer_type: sync
                    timeout: 1
              upstream:
                nodes:
                    '{{FIXTURE.ADDR}}': 1
                pass_host: rewrite
                type: roundrobin
                upstream_host: differential.example.test
              uri: /hello
      request:
        method: GET
        path: /hello?ab=cd
        host: localhost
        body: abcdef
      fixture:
        name: origin-and-kafka-record
        wire_protocol: http-kafka
        response:
            status: 200
            body: |
                hello world
        expected_calls: 2
        capture_all_calls: true
        collect_timeout_millis: 6000
      security_decision: not_applicable
    - case: kafka-proxy-lists-offset-and-fetches-record
      plugin: kafka-proxy
      obligation: list-last-offset-and-fetch-real-record-over-websocket
      route_id: differential-kafka-proxy-pubsub
      comparison_policy: kafka-proxy-pubsub-record
      config:
        routes:
            - enable_websocket: true
              id: differential-kafka-proxy-pubsub
              plugins:
                kafka-proxy: {}
              upstream:
                nodes:
                    '{{FIXTURE.ADDR}}': 1
                scheme: kafka
                type: none
              uri: /kafka
      request:
        method: KAFKA_PUBSUB
        path: /kafka
        host: gateway.example.test
      fixture:
        name: kafka-pubsub-record
        wire_protocol: http-kafka
        response:
            status: 200
            body: unused
        expected_calls: 4
        capture_all_calls: true
        collect_timeout_millis: 3000
      security_decision: not_applicable
