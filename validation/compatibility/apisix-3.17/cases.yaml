schema_version: 3
suite: apisix-3.17-plugin-differential-v1
cases:
    - case: acl-basic-auth-nonmatching-label-denied
      plugin: acl
      obligation: deny-basic-auth-consumer-with-nonmatching-label
      route_id: diff-acl-basic-auth-label-deny
      expect:
          status: 403
          body: "{\"message\":\"The consumer is forbidden.\"}\n"
          response_headers:
              Content-Type: "text/plain; charset=utf-8"
          upstream_received: false
      config:
        consumers:
            - labels:
                project: '["tomcat","web-server","http,server"]'
              plugins:
                basic-auth:
                    password: "123456"
                    username: rose
              username: rose
        routes:
            - id: diff-acl-basic-auth-label-deny
              plugins:
                acl:
                    allow_labels:
                        project:
                            - apisix
                    rejected_code: 403
                    rejected_msg: The consumer is forbidden.
                basic-auth: {}
              upstream:
                nodes:
                    '{{FIXTURE.ADDR}}': 1
                pass_host: rewrite
                type: roundrobin
                upstream_host: differential.example.test
              uri: /acl
      request:
        method: GET
        path: /acl
        host: gateway.example.test
        headers:
            Authorization: Basic cm9zZToxMjM0NTY=
      fixture:
        name: primary
        response:
            status: 200
            body: unused
        expected_calls: 0
      security_decision: deny
    - case: ai-prompt-decorator-append-responses-input
      plugin: ai-prompt-decorator
      obligation: append-responses-string-input
      route_id: diff-ai-prompt-decorator-append
      expect:
          status: 200
          body: "decorated"
          response_headers:
              Content-Type: "text/plain; charset=utf-8"
          upstream_received: true
          upstream_method: "POST"
          upstream_path: "/v1/responses"
          upstream_body: "{\"input\":\"What is 1+1?\\nPlease be concise\"}"
      config:
        routes:
            - id: diff-ai-prompt-decorator-append
              plugins:
                ai-prompt-decorator:
                    append:
                        - content: Please be concise
                          role: user
              upstream:
                nodes:
                    '{{FIXTURE.ADDR}}': 1
                pass_host: rewrite
                type: roundrobin
                upstream_host: differential.example.test
              uri: /v1/responses
      request:
        method: POST
        path: /v1/responses
        host: gateway.example.test
        headers:
            Content-Type: application/json
        body: '{"input":"What is 1+1?"}'
      fixture:
        name: primary
        response:
            status: 200
            body: decorated
        expected_calls: 1
      security_decision: not_applicable
    - case: ai-prompt-guard-anchored-deny
      plugin: ai-prompt-guard
      obligation: reject-anchored-deny-pattern
      route_id: diff-ai-prompt-guard-deny
      expect:
          status: 400
          body: "{\"message\":\"Request contains prohibited content\"}\n"
          response_headers:
              Content-Type: "text/plain; charset=utf-8"
          upstream_received: false
      config:
        routes:
            - id: diff-ai-prompt-guard-deny
              plugins:
                ai-prompt-guard:
                    deny_patterns:
                        - ^badword$
                    match_all_roles: true
              upstream:
                nodes:
                    '{{FIXTURE.ADDR}}': 1
                pass_host: rewrite
                type: roundrobin
                upstream_host: differential.example.test
              uri: /v1/chat/completions
      request:
        method: POST
        path: /v1/chat/completions
        host: gateway.example.test
        headers:
            Content-Type: application/json
        body: '{"messages":[{"role":"system","content":"badword"}]}'
      fixture:
        name: primary
        response:
            status: 200
            body: unused
        expected_calls: 0
      security_decision: deny
    - case: ai-prompt-template-named-model-rewrite
      plugin: ai-prompt-template
      obligation: rewrite-request-from-selected-named-template
      route_id: diff-ai-prompt-template-named
      expect:
          status: 200
          body: "templated"
          response_headers:
              Content-Type: "text/plain; charset=utf-8"
          upstream_received: true
          upstream_method: "POST"
          upstream_path: "/template"
          upstream_body: "{\"model\":\"some model\"}"
      config:
        routes:
            - id: diff-ai-prompt-template-named
              plugins:
                ai-prompt-template:
                    templates:
                        - name: programming question
                          template:
                            model: some model
              upstream:
                nodes:
                    '{{FIXTURE.ADDR}}': 1
                pass_host: rewrite
                type: roundrobin
                upstream_host: differential.example.test
              uri: /template
      request:
        method: POST
        path: /template
        host: gateway.example.test
        headers:
            Content-Type: application/json
        body: '{"template_name":"programming question"}'
      fixture:
        name: primary
        response:
            status: 200
            body: templated
        expected_calls: 1
      security_decision: not_applicable
    - case: attach-consumer-label-authenticated-consumer-labels
      plugin: attach-consumer-label
      obligation: project-present-labels-and-remove-absent-spoofed-label
      route_id: differential-attach-consumer-label-authenticated
      expect:
          status: 200
          body: "done"
          response_headers:
              Content-Type: "text/plain; charset=utf-8"
          upstream_received: true
          upstream_method: "GET"
          upstream_path: "/echo"
          upstream_headers:
              X-Consumer-Company: "api7"
              X-Consumer-Department: "devops"
              X-Consumer-Username: "jack"
      config:
        consumers:
            - labels:
                company: api7
                department: devops
              plugins:
                key-auth:
                    key: key-a
              username: jack
        routes:
            - id: differential-attach-consumer-label-authenticated
              plugins:
                attach-consumer-label:
                    headers:
                        X-Consumer-Company: $company
                        X-Consumer-Department: $department
                        X-Consumer-Role: $role
                key-auth: {}
              upstream:
                nodes:
                    '{{FIXTURE.ADDR}}': 1
                pass_host: rewrite
                type: roundrobin
                upstream_host: differential.example.test
              uri: /echo
      request:
        method: GET
        path: /echo
        host: gateway.example.test
        headers:
            X-Consumer-Role: admin
            apikey: key-a
      fixture:
        name: primary
        response:
            status: 200
            body: done
        expected_calls: 1
      security_decision: allow
